// VER FUNCTIONS
// =====================
function mostrarFunctions() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const blocos = [];
  linhas.forEach((linha, i) => {
    const limpada = linha.trim();
    const mFunc = limpada.match(/^(?:async\s+)?function\s+(\w+)\s*\(/);
    if (mFunc) blocos.push({ tipo: 'function', nome: mFunc[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mArrow = limpada.match(/^(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?\(/);
    if (mArrow) blocos.push({ tipo: 'arrow', nome: mArrow[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;localStorage&quot;)) blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;fetch(&quot;) || limpada.includes(&quot;apiKey&quot;)) blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
  });

  document.getElementById(&quot;tituloBlocos&quot;).textContent = `📋 ${blocos.length} Blocos Encontrados`;
  document.getElementById(&quot;cardBlocos&quot;).style.display = &quot;block&quot;;
  if (!blocos.length) { document.getElementById(&quot;listaBlocos&quot;).innerHTML = '<div class=&quot;aviso&quot;>Nenhuma function encontrada. O código pode estar minificado.</div>'; return; }
  document.getElementById(&quot;listaBlocos&quot;).innerHTML = blocos.map((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    return `<div class=&quot;item-funcao ${cor}&quot; onclick=&quot;extrairFuncaoEspecifica(${idx})&quot;>
      <div class=&quot;nome-funcao&quot;>${b.nome}</div>
      <div class=&quot;desc-funcao&quot;>${b.preview}</div>
      <div class=&quot;linha-funcao&quot;>Linha ${b.linha} · ${b.tipo}</div>
    </div>`;
  }).join(&quot;&quot;);
  window._blocos = blocos;
  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES`, blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n'));
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;
  const linhas = codigoOriginal.split('\n');
  let codigo = &quot;&quot;, abertas = 0, comecou = false;
  for (let i = bloco.linha - 1; i < Math.min(bloco.linha + 200, linhas.length); i++) {
    const linha = linhas[i]; codigo += linha + '\n';
    for (const c of linha) { if (c==='{'){abertas++;comecou=true;} if(c==='}')abertas--; }
    if (comecou &amp;&amp; abertas <= 0) break;
  }
  mostrarNaVisualizacao(`📋 BLOCO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

// =====================
// EXTRAIR localStorage
// =====================
function extrairLocalStorage() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const encontrados = [];
  linhas.forEach((linha, i) => {
    if (linha.includes(&quot;localStorage&quot;)) {
      const inicio = Math.max(0, i-2), fim = Math.min(linhas.length, i+3);
      encontrados.push(`[Linha ${i+1}]:\n${linhas.slice(inicio, fim).join('\n')}`);
    }
  });
  if (!encontrados.length) { mostrarNaVisualizacao(&quot;🧠 localStorage&quot;, &quot;❌ localStorage não encontrado.&quot;); return; }
  mostrarNaVisualizacao(`🧠 ${encontrados.length} usos de localStorage`, encontrados.join('\n\n' + '─'.repeat(60) + '\n\n'));
}

// =====================
// EXTRAIR JSON
// =====================
function extrairJSON() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const matches = codigoOriginal.match(/\{(?:[^{}]|\{[^{}]*\})*\}/g) || [];
  const jsonsValidos = [];
  matches.forEach((m, i) => {
    if (m.length < 20) return;
    try { jsonsValidos.push({ index: i, parsed: JSON.stringify(JSON.parse(m), null, 2) }); }
    catch(e) { if (m.length > 50) jsonsValidos.push({ index: i, parsed: m }); }
  });
  if (!jsonsValidos.length) { mostrarNaVisualizacao(&quot;📦 JSONs&quot;, &quot;Nenhum JSON válido encontrado.&quot;); return; }
  mostrarNaVisualizacao(`📦 ${jsonsValidos.length} BLOCOS JSON`, jsonsValidos.slice(0, 20).map((j, i) => `═══ JSON #${i+1} ═══\n${j.parsed}`).join('\n\n'));
}

// =====================
// EXTRAIR API
// =====================
function extrairAPI() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const encontrados = [];
  const palavras = ['fetch(','apiKey','api_key','Authorization','Bearer','gemini','openai','gpt-','claude','anthropic','generativelanguage','googleapis','groq','openrouter','perplexity','xai'];
  linhas.forEach((linha, i) => {
    const lb = linha.toLowerCase();
    if (palavras.some(p => lb.includes(p.toLowerCase()))) {
      const inicio = Math.max(0, i-1), fim = Math.min(linhas.length, i+4);
      encontrados.push(`[Linha ${i+1}]:\n${linhas.slice(inicio, fim).join('\n')}`);
    }
  });
  if (!encontrados.length) { mostrarNaVisualizacao(&quot;🌐 API/IA&quot;, &quot;Nenhuma chamada de API encontrada.&quot;); return; }
  mostrarNaVisualizacao(`🌐 ${encontrados.length} CHAMADAS DE API/IA`, encontrados.join('\n\n' + '─'.repeat(60) + '\n\n'));
}

// =====================
// ORGANIZAR / BEAUTIFY
// =====================
function organizarCodigo() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  let organizado = codigoOriginal.replace(/;(?!\n)/g,';\n').replace(/\{(?!\n)/g,'{\n').replace(/\}(?!\n)/g,'}\n').replace(/,(?!\n)(?!\s)/g,',\n').replace(/\n{3,}/g,'\n\n');
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';
    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel-1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;
    return resultado;
  });
  mostrarNaVisualizacao(&quot;✨ CÓDIGO ORGANIZADO&quot;, indentado.join('\n'));
}

function gerarManual() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  let manual = &quot;📖 MANUAL DO SEU CÓDIGO\n&quot; + &quot;═&quot;.repeat(60) + &quot;\n\n&quot;;
  const tem = s => new RegExp(s, 'i').test(codigoOriginal);
  manual += &quot;🔍 O QUE ESTE CÓDIGO FAZ:\n&quot; + &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  if (tem(&quot;localStorage&quot;))  manual += &quot;✅ Salva dados no navegador (localStorage)\n&quot;;
  if (tem(&quot;fetch\\(&quot;))      manual += &quot;✅ Faz chamadas para a internet (fetch/API)\n&quot;;
  if (tem(&quot;gemini&quot;))        manual += &quot;✅ Usa a IA do Google Gemini\n&quot;;
  if (tem(&quot;openai|gpt-&quot;))   manual += &quot;✅ Usa OpenAI / ChatGPT\n&quot;;
  if (tem(&quot;groq&quot;))          manual += &quot;✅ Usa Groq (IA rápida)\n&quot;;
  if (tem(&quot;capacitor&quot;))     manual += &quot;📱 Pode virar APK (Capacitor)\n&quot;;
  if (tem(&quot;electron&quot;))      manual += &quot;🖥️ Pode virar app de computador (Electron)\n&quot;;
  if (tem(&quot;processo|advogad|juridic&quot;)) manual += &quot;⚖️ Tem funcionalidades jurídicas\n&quot;;
  if (tem(&quot;replit\\.com|REPL_ID&quot;))  manual += &quot;\n⚠️  ATENÇÃO: TEM VÍNCULOS COM A REPLIT!\n   Partes param quando você para de pagar.\n   Use 'Detectar Vínculos Replit' para ver o que trocar.\n&quot;;

  const secoes = [];
  linhas.forEach((linha, i) => {
    const trim = linha.trim();
    if (trim.match(/^\/\/\s*.{3,}/)) secoes.push(`Linha ${i+1}: COMENTÁRIO → ${trim}`);
    if (trim.match(/^function\s+\w+/)) secoes.push(`Linha ${i+1}: FUNÇÃO → ${trim.substring(0, 60)}`);
    if (trim.match(/^class\s+\w+/)) secoes.push(`Linha ${i+1}: CLASSE → ${trim.substring(0, 60)}`);
  });

  manual += &quot;\n📋 ESTRUTURA:\n&quot; + &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  if (secoes.length > 0) { secoes.slice(0, 50).forEach(s => { manual += s + &quot;\n&quot;; }); }
  else { manual += &quot;⚠️ Código muito minificado — use 'Organizar Código' primeiro.\n&quot;; }

  manual += &quot;\n💡 RECOMENDAÇÃO:\n&quot; + &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  manual += &quot;1. 🐛 Detecte bugs → encontrar erros de sintaxe\n&quot;;
  manual += &quot;2. 🚨 Detecte Replit → saber o que precisa trocar\n&quot;;
  manual += &quot;3. 🧠 Extraia localStorage → parte mais valiosa\n&quot;;
  manual += &quot;4. 🌐 Extraia chamadas API → qual IA o código usava\n&quot;;
  manual += &quot;5. 🤖 Consulte IA → análise e correção automática\n&quot;;

  mostrarNaVisualizacao(&quot;📖 MANUAL DO CÓDIGO&quot;, manual);
}

// =====================
// IA INTEGRADA
// =====================
async function consultarIA(perguntaOverride) {
  const chave = document.getElementById(&quot;iaApiKey&quot;).value.trim();
  if (!chave) { alert(&quot;Cole sua chave de API no painel da IA.&quot;); return; }
  const pergunta = perguntaOverride || document.getElementById(&quot;iaPergunta&quot;).value.trim();
  if (!pergunta) { alert(&quot;Digite uma pergunta para a IA.&quot;); return; }
  const provedor = detectarProvedor(chave);
  if (!provedor) { alert(&quot;Chave não reconhecida. Use: gsk_ (Groq), AIza (Gemini), sk- (OpenAI), sk-or- (OpenRouter), xai- (xAI), sk-ant (Anthropic)&quot;); return; }

  const contexto = codigoOriginal
    ? `\n\nCÓDIGO ATUAL (${nomArquivo || &quot;sem nome&quot;}, ${(codigoOriginal.length/1024).toFixed(1)}KB):\n\`\`\`\n${codigoOriginal.substring(0, 8000)}${codigoOriginal.length > 8000 ? &quot;\n... [truncado]&quot; : &quot;&quot;}\n\`\`\``
    : &quot;&quot;;

  const btn = document.getElementById(&quot;btnConsultarIA&quot;);
  btn.disabled = true; btn.innerHTML = '<span class=&quot;spinner&quot;></span>Consultando...';
  const respostaEl = document.getElementById(&quot;iaResposta&quot;);
  respostaEl.style.display = &quot;block&quot;; respostaEl.textContent = &quot;⏳ Aguardando resposta...&quot;;

  try {
    const resp = await fetch(`${provedor.url}/chat/completions`, {
      method: &quot;POST&quot;,
      headers: { &quot;Content-Type&quot;: &quot;application/json&quot;, &quot;Authorization&quot;: `Bearer ${chave}` },
      body: JSON.stringify({
        model: provedor.model,
        messages: [
          { role: &quot;system&quot;, content: &quot;Você é especialista em análise e limpeza de código. Responda sempre em português brasileiro. Seja direto e prático para usuário leigo. Quando sugerir código, forneça completo e pronto para usar.&quot; },
          { role: &quot;user&quot;, content: pergunta + contexto }
        ],
        max_tokens: 2000, temperature: 0.3
      })
    });

    if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err?.error?.message || `Erro ${resp.status}`); }
    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content || &quot;Sem resposta.&quot;;
    respostaEl.textContent = resposta;
    mostrarNaVisualizacao(`🤖 RESPOSTA DA IA (${provedor.nome})`, resposta);
    salvarNoHistorico(pergunta, resposta, provedor.nome); // ← SALVA NO HISTÓRICO
  } catch(e) {
    const msg = `❌ Erro: ${e.message}\n\nVerifique se a chave está correta e tem créditos disponíveis.`;
    respostaEl.textContent = msg;
  } finally {
    btn.disabled = false; btn.innerHTML = '🤖 Consultar IA';
  }
}

                    <div style=&quot;color: #64748b; font-size: 12px;&quot;>ZIP, HTML, JS, JSON ou pasta completa</div>
                </div>
                <input type=&quot;file&quot; id=&quot;file2&quot; accept=&quot;.zip,.html,.js,.json,.txt&quot; onchange=&quot;carregarProjeto(2, event)&quot;>

    <script>
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projetos = {
            1: null,
            2: null
        };

        let comparacao = null;

        // =====================
        // DRAG &amp; DROP
        // =====================
        ['upload1', 'upload2'].forEach((id, idx) => {
            const el = document.getElementById(id);
            
            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                el.classList.add('dragover');
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('dragover');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) {
                    document.getElementById(`file${idx + 1}`).files = e.dataTransfer.files;
                    carregarProjeto(idx + 1, { target: { files: [file] } });
                }
            });
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(num, event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            let projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            projetos[num] = projeto;
            mostrarInfo(num, projeto);
            verificarBotaoComparar();
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        function mostrarInfo(num, projeto) {
            const el = document.getElementById(`info${num}`);
            const totalArquivos = Object.keys(projeto.arquivos).length;
            const tamanhoTotal = Object.values(projeto.arquivos).reduce((sum, arq) => sum + arq.tamanho, 0);

            el.style.display = 'block';
            el.innerHTML = `
                <div><span class=&quot;label&quot;>Nome:</span> <span class=&quot;valor&quot;>${projeto.nome}</span></div>
                <div><span class=&quot;label&quot;>Arquivos:</span> <span class=&quot;valor&quot;>${totalArquivos}</span></div>
                <div><span class=&quot;label&quot;>Tamanho:</span> <span class=&quot;valor&quot;>${(tamanhoTotal / 1024).toFixed(1)} KB</span></div>
                <div><span class=&quot;label&quot;>Status:</span> <span class=&quot;valor&quot;>✅ Carregado</span></div>
            `;
        }

        function verificarBotaoComparar() {
            const btn = document.getElementById('btnComparar');
            btn.disabled = !(projetos[1] &amp;&amp; projetos[2]);
        }

        // =====================
        // COMPARAR PROJETOS
        // =====================
        function compararProjetos() {
            if (!projetos[1] || !projetos[2]) {
                alert('Carregue os 2 projetos primeiro!');
                return;
            }

            document.getElementById('resultado').style.display = 'block';
            document.getElementById('tab-resumo').innerHTML = '<div class=&quot;loading&quot;><div class=&quot;spinner&quot;></div><div style=&quot;margin-top:16px;&quot;>Comparando projetos...</div></div>';

            setTimeout(() => {
                comparacao = realizarComparacao();
                mostrarResultado();
                document.getElementById('btnRelatorio').disabled = false;
            }, 500);
        }

        function realizarComparacao() {
            const arq1 = projetos[1].arquivos;
            const arq2 = projetos[2].arquivos;

            const nomes1 = new Set(Object.keys(arq1));
            const nomes2 = new Set(Object.keys(arq2));

            const novos = [];
            const deletados = [];
            const modificados = [];
            const iguais = [];

            // Arquivos novos (só no projeto 2)
            for (const nome of nomes2) {
                if (!nomes1.has(nome)) {
                    novos.push({
                        nome,
                        arquivo: arq2[nome]
                    });
                }
            }

            // Arquivos deletados (só no projeto 1)
            for (const nome of nomes1) {
                if (!nomes2.has(nome)) {
                    deletados.push({
                        nome,
                        arquivo: arq1[nome]
                    });
                }
            }

            // Arquivos em ambos (comparar conteúdo)
            for (const nome of nomes1) {
                if (nomes2.has(nome)) {
                    const diff = compararArquivos(arq1[nome], arq2[nome]);
                    if (diff.modificado) {
                        modificados.push({
                            nome,
                            arquivo1: arq1[nome],
                            arquivo2: arq2[nome],
                            diff
                        });
                    } else {
                        iguais.push({
                            nome,
                            arquivo: arq1[nome]
                        });
                    }
                }
            }

            return {
                novos,
                deletados,
                modificados,
                iguais,
                total: nomes1.size + nomes2.size - iguais.length
            };
        }

        function compararArquivos(arq1, arq2) {
            const linhas1 = arq1.conteudo.split('\n');
            const linhas2 = arq2.conteudo.split('\n');

            if (arq1.conteudo === arq2.conteudo) {
                return { modificado: false };
            }

            const diff = [];
            const maxLen = Math.max(linhas1.length, linhas2.length);

            for (let i = 0; i < maxLen; i++) {
                const l1 = linhas1[i];
                const l2 = linhas2[i];

                if (l1 === undefined) {
                    diff.push({ tipo: 'add', linha: i + 1, conteudo: l2 });
                } else if (l2 === undefined) {
                    diff.push({ tipo: 'remove', linha: i + 1, conteudo: l1 });
                } else if (l1 !== l2) {
                    diff.push({ tipo: 'modify', linha: i + 1, antes: l1, depois: l2 });
                } else {
                    diff.push({ tipo: 'igual', linha: i + 1, conteudo: l1 });
                }
            }

            return {
                modificado: true,
                diff,
                linhasAdicionadas: diff.filter(d => d.tipo === 'add').length,
                linhasRemovidas: diff.filter(d => d.tipo === 'remove').length,
                linhasModificadas: diff.filter(d => d.tipo === 'modify').length
            };
        }

        // =====================
        // MOSTRAR RESULTADO
        // =====================
        function mostrarResultado() {
            // STATS
            document.getElementById('stats').innerHTML = `
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #4ade80;&quot;>${comparacao.novos.length}</div>
                    <div class=&quot;stat-label&quot;>Novos</div>
                </div>
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #fbbf24;&quot;>${comparacao.modificados.length}</div>
                    <div class=&quot;stat-label&quot;>Modificados</div>
                </div>
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #f87171;&quot;>${comparacao.deletados.length}</div>
                    <div class=&quot;stat-label&quot;>Deletados</div>
                </div>

        function mostrarArquivos() {
            let html = '';

            // Novos
            if (comparacao.novos.length > 0) {
                html += `<div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;>✅ ARQUIVOS NOVOS:</div>`;
                comparacao.novos.forEach((item, idx) => {
                    html += `
                        <div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('novo', ${idx})&quot;>

            // Modificados
            if (comparacao.modificados.length > 0) {

            // Deletados
            if (comparacao.deletados.length > 0) {

        function verArquivo(tipo, idx) {

                diff = `<div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;>✅ ARQUIVO NOVO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) => {
                    diff += `<div class=&quot;diff-linha diff-add&quot;>${i + 1} | ${linha}</div>`;
                });
                diff += '</div>';
            } else if (tipo === 'modificado') {
                item = comparacao.modificados[idx];
                diff = `<div style=&quot;color: #fbbf24; font-weight: bold; margin-bottom: 12px;&quot;>⚠️ ARQUIVO MODIFICADO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';
                item.diff.diff.slice(0, 200).forEach(d => {
                    if (d.tipo === 'add') {
                        diff += `<div class=&quot;diff-linha diff-add&quot;>${d.linha} | + ${d.conteudo}</div>`;
                    } else if (d.tipo === 'remove') {
                        diff += `<div class=&quot;diff-linha diff-remove&quot;>${d.linha} | - ${d.conteudo}</div>`;
                    } else if (d.tipo === 'modify') {
                        diff += `<div class=&quot;diff-linha diff-remove&quot;>${d.linha} | - ${d.antes}</div>`;
                        diff += `<div class=&quot;diff-linha diff-add&quot;>${d.linha} | + ${d.depois}</div>`;
                    } else if (Math.random() > 0.7) { // Mostrar só algumas linhas iguais
                        diff += `<div class=&quot;diff-linha diff-igual&quot;>${d.linha} | ${d.conteudo}</div>`;
                    }
                });
                diff += '</div>';
            } else {
                item = comparacao.deletados[idx];
                diff = `<div style=&quot;color: #f87171; font-weight: bold; margin-bottom: 12px;&quot;>❌ ARQUIVO DELETADO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';

                    diff += `<div class=&quot;diff-linha diff-remove&quot;>${i + 1} | ${linha}</div>`;
                });
                diff += '</div>';

                            <ul style=&quot;margin-top: 8px;&quot;>

                            </ul>
                        </div>
                    </div>

            }

            // Sugestão 2: Arquivos modificados
            if (comparacao.modificados.length > 0) {

                        </div>

                `;
            }

            // Sugestão 3: Dependências (se tiver package.json)
            const pkg1 = projetos[1].arquivos['package.json'];
            const pkg2 = projetos[2].arquivos['package.json'];

                try {
                    const deps1 = JSON.parse(pkg1.conteudo).dependencies || {};

                                </div>
                            </div>
                        `;
                    }
                } catch(e) {}
            }

            // Sugestão 4: Arquivos deletados
            if (comparacao.deletados.length > 0) {
                html += `
                    <div class=&quot;sugestao&quot;>
                        <div class=&quot;sugestao-titulo&quot;>❌ ${comparacao.deletados.length} arquivo(s) removido(s)</div>

        }

        function mudarTab(nome) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('ativo'));
            
            event.target.classList.add('ativo');
            document.getElementById(`tab-${nome}`).classList.add('ativo');

            projetos = { 1: null, 2: null };

            const blob = new Blob([conteudo], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nome;
            a.click();
            URL.revokeObjectURL(url);

<script>
'use strict';

/*══════════════════════════════════════════════════════════════════
  AUTO-DETECÇÃO AMPLIADA DE PROVEDORES
══════════════════════════════════════════════════════════════════*/
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile', name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',      name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest', name:'Anthropic Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',               name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',        name:'Google Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',           name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',           name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  // Mistral (32 chars hex), DeepSeek (sk-...), Cohere — detectados por regex abaixo
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',             name:'OpenAI' },
];

const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];

function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

/*══════════════════════════════════════════════════════════════════
  INDEXEDDB — Auto-save robusto
══════════════════════════════════════════════════════════════════*/
const DB_NAME = 'ChatIAProDB';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ev => {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath:'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror   = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

/*══════════════════════════════════════════════════════════════════
  ESTADO
══════════════════════════════════════════════════════════════════*/
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history    = [];
let currentConvId = null;
let controller = null;
let isRecording= false;
let recog      = null;
let silTimer   = null;
let saveTimer  = null;

/*══════════════════════════════════════════════════════════════════
  BOOT
══════════════════════════════════════════════════════════════════*/
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  const ki = document.getElementById('keyInput');
  ki.value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    if (d) {
      document.getElementById('urlInput').value = d.url;
      document.getElementById('modelInput').value = d.model;
    } else {
      document.getElementById('urlInput').value = apiUrl;
      document.getElementById('modelInput').value = apiModel;
    }
  }
  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  renderSavedKeys();
  await renderConvList();

  // Restaura conversa atual se houver
  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;&amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv &amp;&amp; conv.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  // Restaura rascunho do input
  const draft = localStorage.getItem('cia_draft');
  if (draft) {
    document.getElementById('msgInput').value = draft;
    adjustHeight(document.getElementById('msgInput'));
  }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'bot', m.content, false, true));
  addCopyListeners();
}

/*══════════════════════════════════════════════════════════════════
  AUTO-SAVE
══════════════════════════════════════════════════════════════════*/
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_' + Date.now();

  const firstUserMsg = history.find(m => m.role === 'user')?.content || 'Conversa';
  const title = firstUserMsg.slice(0, 60).replace(/\n/g,' ');

  const obj = {
    id: currentConvId,
    title,
    messages: history,
    updatedAt: Date.now(),
    provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
  };
  try {
    await dbPut('conversations', obj);
    localStorage.setItem('cia_current_conv', currentConvId);
  } catch(e) { console.warn('Auto-save falhou:', e); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 400);
}

function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  if (v) localStorage.setItem('cia_draft', v);
  else   localStorage.removeItem('cia_draft');
}

/*══════════════════════════════════════════════════════════════════
  PAINÉIS GENÉRICOS
══════════════════════════════════════════════════════════════════*/
function togglePanel(panelId, btnId) {
  const allPanels = ['cfgPanel','keysPanel','convPanel','ioPanel'];
  const allBtns   = ['cfgBtn','keysBtn','convBtn','ioBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  allPanels.forEach(id => document.getElementById(id).classList.remove('show'));
  allBtns.forEach(id => document.getElementById(id)?.classList.remove('active'));
  if (show) {
    target.classList.add('show');
    document.getElementById(btnId)?.classList.add('active');
  }
}

/*══════════════════════════════════════════════════════════════════
  CHAVES
══════════════════════════════════════════════════════════════════*/
function onKeyInput(val) {
  val = val.trim();
  apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value = d.model;
    apiUrl   = d.url;
    apiModel = d.model;
    localStorage.setItem('cia_url',   d.url);
    localStorage.setItem('cia_model', d.model);
    document.getElementById('cfgProvOk').textContent = '✓ ' + d.name + ' · ' + d.model;
    document.getElementById('cfgProvOk').style.display = 'block';
    document.getElementById('cfgNote').style.display = 'none';
  } else {
    document.getElementById('cfgProvOk').style.display = 'none';
    document.getElementById('cfgNote').style.display = '';
  }
  document.getElementById('saveRow').style.display = val ? 'flex' : 'none';
  updateProvBadge();
  updateCfgStatus();
}

function updateProvBadge() {
  const badge = document.getElementById('provBadge');
  if (apiKey) {
    const d = detectProvider(apiKey);
    badge.textContent = d ? d.name : 'Custom';
    badge.style.borderColor = '#5aab56';
    badge.style.color = '#7ec87a';
  } else {
    badge.textContent = 'Demo ✨';
    badge.style.borderColor = '#60a5fa';
    badge.style.color = '#93c5fd';
  }
}

function updateCfgStatus() {
  const el = document.getElementById('cfgStatus');
  if (apiKey) {
    const d = detectProvider(apiKey);
    el.textContent = '✓ ' + (d ? d.name : 'Personalizada') + ' ativa';
    el.className = 'cfg-status ok';
  } else {
    el.textContent = 'Sem chave configurada';
    el.className = 'cfg-status demo';
  }
}

function toggleShowKey() {
  showKey = !showKey;
  document.getElementById('keyInput').type = showKey ? 'text' : 'password';
}

function saveKey() {
  const key   = document.getElementById('keyInput').value.trim();
  const label = document.getElementById('labelInput').value.trim();
  const url   = document.getElementById('urlInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k => k.key === key)) { toast('Chave já salva','err'); return; }
  const d = detectProvider(key);
  const finalLabel = label || (d ? d.name : 'Chave ' + (savedKeys.length+1));

function toggleWeb() {
  webOn = !webOn;
  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');
}

async function webSearch(query) {
  // Usa DuckDuckGo Instant Answer API (CORS-friendly)
  try {
    const url = 'https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;format=json&amp;no_html=1&amp;skip_disambig=1';
    const r = await fetch(url);
    const j = await r.json();
    const parts = [];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText+(j.AbstractURL?' (Fonte: '+j.AbstractURL+')':''));
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.Definition) parts.push('DEFINIÇÃO: '+j.Definition);
    if (j.RelatedTopics?.length) {
      const topics = j.RelatedTopics.slice(0,5)
        .filter(t => t.Text)
        .map((t,i) => (i+1)+'. '+t.Text+(t.FirstURL?' ['+t.FirstURL+']':''));
      if (topics.length) parts.push('TÓPICOS:\n'+topics.join('\n'));
    }
    return parts.length ? parts.join('\n\n') : null;
  } catch(e) {
    console.warn('Web search falhou:', e);
    return null;
  }
}

  ENVIAR

function handleKey(e) {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); send(); }
}
function adjustHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}
function setPrompt(txt) {
  const el = document.getElementById('msgInput');
  el.value = txt; adjustHeight(el); el.focus();
}

async function send(textOverride) {
  const el = document.getElementById('msgInput');
  const text = (textOverride || el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('emptyState')?.remove();
  el.value = ''; el.style.height = '44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller = new AbortController();
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  const { content: contentEl } = appendMsg('bot', '', true);

  // BUSCA WEB se ativada
  let webContext = '';
  if (webOn) {
    const note = document.createElement('div');
    note.className = 'progress';
    note.textContent = '🌐 Buscando na internet...';
    contentEl.appendChild(note);
    const result = await webSearch(text);
    note.remove();
    if (result) {
      webContext = '\n\n[CONTEXTO DA WEB — use estas informações atuais]:\n'+result+'\n[FIM DO CONTEXTO]';
      const ok = document.createElement('div');
      ok.className = 'progress';
      ok.textContent = '✓ Resultados da web incorporados';
      contentEl.appendChild
      contentEl.appendChild(ok);
      setTimeout(() => ok.remove(), 2000);
    } else {
      const fail = document.createElement('div');
      fail.className = 'progress';
      fail.style.color = '#f87171';
      fail.textContent = '⚠️ Busca web falhou — continuando sem contexto extra';
      contentEl.appendChild(fail);
      setTimeout(() => fail.remove(), 2500);
    }
  }

  try {
    const key   = apiKey.trim();
    const url   = (document.getElementById('urlInput').value || apiUrl || 'https://api.groq.com/openai/v1').trim().replace(/\/$/, '');
    const model = document.getElementById('modelInput').value || apiModel || 'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML = '<span style=&quot;color:#60a5fa&quot;>⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: <a href=&quot;https://console.groq.com&quot; target=&quot;_blank&quot; style=&quot;color:#7ec87a&quot;>console.groq.com</a></span>';
      history.pop();
      scheduleSave();
      return;
    }

    // Monta mensagens (injeta contexto web se houver)
    let msgs = [...history];
    if (webContext) {
      const last = msgs[msgs.length - 1];
      msgs[msgs.length - 1] = { role:'user', content:last.content + webContext };
    }

    const endpoint = url + '/chat/completions';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Chat IA Pro',
    };
    const body = JSON.stringify({ model, messages: msgs, stream: true, max_tokens: 16384 });

    const resp = await fetch(endpoint, { method:'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = 'Erro ' + resp.status;
      try { msg = JSON.parse(errText)?.error?.message || msg; } catch {}
      contentEl.innerHTML = '<span style=&quot;color:'+getCSSVar('--err')+'&quot;>❌ ' + esc(msg) + '</span>';
      history.pop();
      scheduleSave();
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j = line.slice(6).trim();
        if (j === '[DONE]') continue;
        try {
          const p = JSON.parse(j);
          if (p.error) throw new Error(typeof p.error === 'string' ? p.error : p.error.message || 'Erro do provedor');
          const delta = p.choices?.[0]?.delta?.content || p.text || p.content || '';
          if (delta) {
            full += delta;
            cursor.remove();
            contentEl.innerHTML = renderMarkdown(full);
            contentEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML = renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      contentEl.innerHTML += '<em style=&quot;color:var(--muted);font-size:11px&quot;> [parado]</em>';
    } else {
      contentEl.innerHTML = '<span style=&quot;color:var(--err)&quot;>❌ ' + esc(err.message) + '</span>';
      history.pop();
      scheduleSave();
    }
  } finally {
    controller = null;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    scrollBottom();
    addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

/*══════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO
══════════════════════════════════════════════════════════════════*/
function appendMsg(role, text, streaming, isRestore) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (role === 'user') {
    content.textContent = text;
  } else if (streaming) {
    content.innerHTML = '';
  } else {
    content.innerHTML = renderMarkdown(text);
  }

  bubble.appendChild(content);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (role === 'bot') {
    const prov = apiKey ? (detectProvider(apiKey)?.name || 'IA') : 'IA';
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, content.textContent); };
    const lbl = document.createElement('span');
    lbl.className = 'prov-label';
    lbl.textContent = prov;
    meta.appendChild(lbl);
    meta.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, text); };
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);

  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el: wrap, content };
}

let copyBlockId = 0;
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```(\w*?)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'cb' + (++copyBlockId);
    return (
      '<div class=&quot;code-block&quot;>' +
        '<div class=&quot;code-header&quot;>' +
          '<span>' + (lang || 'código') + '</span>' +
          '<button class=&quot;copy-btn&quot; data-copy=&quot;'+escAttr(code)+'&quot; id=&quot;'+id+'&quot;>📋 Copiar</button>' +
        '</div>' +
        '<div class=&quot;code-body&quot;>' + code + '</div>' +
      '</div>'
    );
  });
  html = html.replace(/`([^`\n]+?)`/g, '<span class=&quot;inline-code&quot;>$1</span>');
  html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  html = html.replace(/(https?:\/\/[^\s<>&quot;']+)/g, '<a href=&quot;$1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>$1</a>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.onclick = function() { copyText(this, this.dataset.copy); };
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').catch(() => {});
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado!';
  setTimeout(() => { btn.innerHTML = orig; }, 1800);
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR — TXT, MD, JSON, PDF
══════════════════════════════════════════════════════════════════*/
function exportConv(format) {
  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date = new Date().toLocaleString('pt-BR');
  let content = '', mime = 'text/plain', ext = format;

  if (format === 'txt') {
    const lines = ['=== CONVERSA — Chat IA Pro ===', 'Data: '+date, ''];
    history.forEach(m => {
      lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']');
      lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
  }
  else if (format === 'md') {
    const lines = ['# Conversa Chat IA Pro', '> '+date, ''];
    history.forEach(m => {
      lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA'));
      lines.push(''); lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
    mime = 'text/markdown';
  }
  else if (format === 'json') {
    content = JSON.stringify({
      title: history.find(m=>m.role==='user')?.content?.slice(0,60) || 'Conversa',
      exportedAt: date,
      provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
      messages: history,
    }, null, 2);
    mime = 'application/json';
  }
  else if (format === 'pdf') {
    // PDF via janela de impressão
    const w = window.open('', '_blank');
    const html = ['<!DOCTYPE html><html><head><meta charset=&quot;UTF-8&quot;><title>Conversa</title>',
      '<style>',
      'body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}',
      '.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}',
      '.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      'code{background:#eee;padding:1px 4px;border-radius:3px;font-size:12px}',
      '@media print { body{margin:0} }',
      '</style></head><body>',
      '<h1>Conversa — Chat IA Pro</h1>',
      '<div class=&quot;meta&quot;>Exportado em '+date+' · '+history.length+' mensagens</div>'];
    history.forEach(m => {
      const safe = esc(m.content).replace(/\n/g,'<br>');
      html.push('<div class=&quot;msg '+(m.role==='user'?'user':'bot')+'&quot;>');
      html.push('<div class=&quot;role&quot;>'+(m.role==='user'?'🧑 Você':'🤖 IA')+'</div>');
      html.push('<div>'+safe+'</div></div>');
    });
    html.push('<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');
    w.document.write(html.join(''));
    w.document.close();
    toast('PDF: use &quot;Salvar como PDF&quot; na impressão');
    return;
  }

  const blob = new Blob([content], { type: mime+';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversa-' + Date.now() + '.' + ext;
  a.click();
  toast('Exportado: ' + ext.toUpperCase());
}

/*══════════════════════════════════════════════════════════════════
  IMPORTAR — TXT, MD, CSV, JSON, PDF
══════════════════════════════════════════════════════════════════*/
async function importFile(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  const el = document.getElementById('msgInput');

  try {
    let txt = '';

    if (name.endsWith('.pdf')) {
      toast('📕 Lendo PDF...');
      txt = await extractPDF(file);
    }
    else if (name.endsWith('.json')) {
      const raw = await file.text();
      try {
        const j = JSON.parse(raw);
        // Se for conversa exportada, oferecer importar
        if (j.messages &amp;&amp; Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar como nova conversa?')) {
            history = j.messages;
            currentConvId = null;
            restoreUI();
            scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa importada ✓');
            return;
          }
        }
        txt = JSON.stringify(j, null, 2);
      } catch { txt = raw; }
    }
    else {
      txt = await file.text();
    }

    if (txt) {
      el.value = el.value ? el.value + '\n\n' + txt : txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Arquivo importado ('+txt.length+' chars)');
    }
  } catch(err) {
    toast('Erro: '+err.message, 'err');
  }
}

async function extractPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push('--- Página '+i+' ---\n' + tc.items.map(it => it.str).join(' '));
  }
  return pages.join('\n\n');
}

/*══════════════════════════════════════════════════════════════════
  OCR — Imagem para texto
══════════════════════════════════════════════════════════════════*/
async function importImage(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  if (typeof Tesseract === 'undefined') { toast('Tesseract não carregou','err'); return; }

  const el = document.getElementById('msgInput');
  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.style.position = 'fixed';
  progress.style.top = '60px';
  progress.style.left = '50%';
  progress.style.transform = 'translateX(-50%)';
  progress.style.zIndex = '1000';
  progress.textContent = '🔍 OCR iniciando...';
  document.body.appendChild(progress);

  try {
    const { data } = await Tesseract.recognize(file, 'por+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          progress.textContent = '🔍 OCR: ' + Math.round(m.progress*100) + '%';
        } else if (m.status) {
          progress.textContent = '🔍 ' + m.status + '...';
        }
      }
    });
    const txt = (data?.text || '').trim();
    if (txt) {
      el.value = el.value ? el.value + '\n\n[OCR]\n' + txt : '[OCR]\n' + txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else {
      toast('Nenhum texto encontrado na imagem','err');
    }
  } catch(err) {
    toast('Erro OCR: '+err.message,'err');
  } finally {
    progress.remove();
  }
}

/*══════════════════════════════════════════════════════════════════
  BACKUP COMPLETO
══════════════════════════════════════════════════════════════════*/
async function backupAll() {
  const convs = db ? await dbGetAll('conversations') : [];
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    keys: savedKeys,
    conversations: convs,
    settings: {
      apiKey, apiUrl, apiModel,
      ttsOn, webOn,
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chatia-backup-' + Date.now() + '.json';
  a.click();
  toast('Backup completo gerado ✓');
}

async function restoreBackup(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm('Restaurar backup? Suas chaves e conversas atuais serão MESCLADAS.')) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing = new Set(savedKeys.map(k => k.key));
      data.keys.forEach(k => { if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
    }
    if (data.conversations?.length &amp;&amp; db) {
      for (const c of data.conversations) await dbPut('conversations', c);
    }
    renderSavedKeys();
    await renderConvList();
    toast('Backup restaurado ✓');
  } catch(err) {
    toast('Erro: backup inválido','err');
  }
}

/*══════════════════════════════════════════════════════════════════
  VOZ — STT
══════════════════════════════════════════════════════════════════*/
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }

  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = true;
  recog.interimResults = true;

  let fullText = '';
  const schedSend = () => {
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      try { recog.stop(); } catch {}
      if (fullText.trim()) { setPrompt(''); send(fullText.trim()); }
    }, 1800);
  };

  recog.onresult = ev => {
    let final = '', interim = '';
    for (let i = 0; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    fullText = final || interim;
    document.getElementById('msgInput').value = fullText;
    adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };

  recog.onerror = recog.onend = () => {
    clearTimeout(silTimer);
    isRecording = false;
    recog = null;
    document.getElementById('micBtn').classList.remove('listening');
  };

  try { recog.start(); } catch { return; }
  isRecording = true;
  document.getElementById('micBtn').classList.add('listening');
}

function stopVoice() {
  try { recog?.stop(); } catch {}
  recog = null;
  isRecording = false;
  clearTimeout(silTimer);
  document.getElementById('micBtn').classList.remove('listening');
}

/*══════════════════════════════════════════════════════════════════
  TTS
══════════════════════════════════════════════════════════════════*/
function toggleTTS() {
  ttsOn = !ttsOn;
  localStorage.setItem('cia_tts', ttsOn ? 'on' : 'off');
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
}

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '').replace(/[`*#]/g, '').substring(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function esc(s) {
  return String(s)
    .replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}
function escAttr(s) { return esc(s).replace(/'/g,'&amp;#39;'); }
function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// Salvar antes de fechar
window.addEventListener('beforeunload', () => {
  if (history.length) autoSave();
  autoSaveDraft();
});

// Inicia
boot();
</script>
