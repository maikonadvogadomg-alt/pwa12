<div class=&quot;container&quot;>
  <h1>📚 Gerador de Documentação Automática</h1>
  <p class=&quot;subtitle&quot;>Gera documentação completa do projeto em múltiplos formatos</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado e gerará documentação automática</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando projeto e gerando documentação...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectDocs = {
  projectInfo: {},
  apis: [],
  functions: [],
  components: [],
  modules: [],
  dependencies: [],
  fileStructure: {},
  examples: [],
  gettingStarted: '',
  architecture: ''
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectDocs = {
    projectInfo: {},
    apis: [],
    functions: [],
    components: [],
    modules: [],
    dependencies: [],
    fileStructure: {},
    examples: [],
    gettingStarted: '',
    architecture: ''
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    const files = {};
    
    // Extrai arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        try {
          const fileContent = await zipEntry.async('text');
          files[path] = fileContent;
        } catch (e) {}
      }
    }
    
    // Gera documentação
    generateDocumentation(files);
    
    loadingDiv.style.display = 'none';
    displayDocumentation();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

function generateDocumentation(files) {
  // Análise de package.json
  for (let [path, content] of Object.entries(files)) {
    if (path.includes('package.json')) {
      try {
        const pkg = JSON.parse(content);
        projectDocs.projectInfo = {
          name: pkg.name || 'Projeto sem nome',
          version: pkg.version || '1.0.0',
          description: pkg.description || 'Sem descrição',
          author: pkg.author || 'Desconhecido',
          license: pkg.license || 'MIT',
          homepage: pkg.homepage || '',
          repository: pkg.repository || ''
        };
        
        projectDocs.dependencies = Object.entries(pkg.dependencies || {}).map(([name, version]) => ({
          name,
          version,
          type: 'production'
        })).concat(
          Object.entries(pkg.devDependencies || {}).map(([name, version]) => ({
            name,
            version,
            type: 'development'
          }))
        );
      } catch (e) {}
    }
  }
  
  // Análise de arquivos JS/TS
  for (let [path, content] of Object.entries(files)) {
    if (/\.(js|ts|jsx|tsx)$/.test(path)) {
      analyzeJSFile(path, content);
    }
  }
  
  // Análise de estrutura de arquivos
  analyzeFileStructure(files);
  
  // Gera guia de início
  generateGettingStarted();
  
  // Gera arquitetura
  generateArchitecture();
}

function analyzeJSFile(filePath, content) {
  // Detecta funções
  const functionPattern = /(?:export\s+)?(?:async\s+)?function\s+(\w+)\s*\(([^)]*)\)\s*(?::\s*(\w+))?\s*\{/g;
  let match;
  
  while ((match = functionPattern.exec(content)) !== null) {
    const name = match[1];
    const params = match[2].split(',').map(p => p.trim()).filter(p => p);
    const returnType = match[3] || 'void';
    
    // Tenta encontrar comentário JSDoc
    const docPattern = new RegExp(`/\\*\\*[\\s\\S]*?\\*\\/\\s*(?:export\\s+)?(?:async\\s+)?function\\s+${name}`, 'g');
    const docMatch = docPattern.exec(content);
    
    projectDocs.functions.push({
      name,
      file: filePath,
      params,
      returnType,
      description: 'Função do projeto',
      example: `${name}(${params.join(', ')})`
    });
  }
  
  // Detecta APIs (endpoints)
  const apiPatterns = [
    { regex: /app\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
    { regex: /router\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' }
  ];
  
  apiPatterns.forEach(pattern => {
    let apiMatch;
    const regex = new RegExp(pattern.regex.source, 'g');
    
    while ((apiMatch = regex.exec(content)) !== null) {
      const method = apiMatch[1].toUpperCase();
      const path = apiMatch[2];
      
      projectDocs.apis.push({
        method,
        path,
        file: filePath,
        description: `${method} ${path}`,
        params: [],
        response: 'JSON'
      });
    }
  });
  
  // Detecta componentes React/Vue
  if (content.includes('export default') || content.includes('export const')) {
    const componentPattern = /(?:export\s+(?:default\s+)?)?(?:const|function)\s+(\w+)\s*(?:=|:)/g;
    let compMatch;
    
    while ((compMatch = componentPattern.exec(content)) !== null) {
      const componentName = compMatch[1];
      if (componentName.charAt(0) === componentName.charAt(0).toUpperCase()) {
        projectDocs.components.push({
          name: componentName,
          file: filePath,
          description: `Componente ${componentName}`,
          props: [],
          usage: `<${componentName} />`
        });
      }
    }
  }
}

function analyzeFileStructure(files) {
  const structure = {};
  
  Object.keys(files).forEach(path => {
    const parts = path.split('/');
    let current = structure;
    
    parts.forEach((part, idx) => {
      if (!current[part]) {
        current[part] = {};
      }
      if (idx === parts.length - 1) {
        current[part]._file = true;
      }
      current = current[part];
    });
  });
  
  projectDocs.fileStructure = structure;
}

function generateGettingStarted() {
  projectDocs.gettingStarted = `
# 🚀 Guia de Início Rápido

## Instalação

\`\`\`bash
npm install
\`\`\`

## Desenvolvimento

\`\`\`bash
npm run dev
\`\`\`

## Build

\`\`\`bash
npm run build
\`\`\`

## Testes

\`\`\`bash
npm test
\`\`\`

## Estrutura do Projeto

\`\`\`
${generateFileTree()}
\`\`\`
  `;
}

function generateFileTree() {
  let tree = '';
  
  function buildTree(obj, prefix = '') {
    Object.entries(obj).forEach(([key, value], idx, arr) => {
      const isLast = idx === arr.length - 1;
      const connector = isLast ? '└── ' : '├── ';
      tree += prefix + connector + key + '\n';
      
      if (value._file !== true &amp;&amp; Object.keys(value).length > 0) {
        const nextPrefix = prefix + (isLast ? '    ' : '│   ');
        buildTree(value, nextPrefix);
      }
    });
  }
  
  buildTree(projectDocs.fileStructure);
  return tree;
}

function generateArchitecture() {
  projectDocs.architecture = `
# 🏗️ Arquitetura do Projeto

## Componentes Principais

${projectDocs.components.map(comp => `- **${comp.name}** - ${comp.description}`).join('\n')}

## APIs/Endpoints

${projectDocs.apis.map(api => `- **${api.method}** \`${api.path}\` - ${api.description}`).join('\n')}

## Dependências Principais

${projectDocs.dependencies.filter(d => d.type === 'production').slice(0, 10).map(dep => `- **${dep.name}** (${dep.version})`).join('\n')}

## Fluxo de Dados

1. Cliente faz requisição
2. API processa dados
3. Banco de dados é consultado
4. Resposta é retornada
5. Frontend renderiza resultado
  `;
}

          </div>
        </div>
      </div>
      
      <div class=&quot;results&quot;>
        <h2>📝 Descrição</h2>
        <div class=&quot;doc-section&quot;>
          <div class=&quot;doc-content&quot;>
            <strong>Nome:</strong> ${projectDocs.projectInfo.name || 'Sem nome'}<br>

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function exportDocs(format) {
  if (format === 'markdown') {
    exportMarkdown();
  } else if (format === 'html') {
    exportHTML();
  } else if (format === 'json') {

  } else if (format === 'pdf') {

  }
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

<body>

<div class=&quot;container&quot;>
  <h1>🔧 Corretor Automático Inteligente</h1>
  <p class=&quot;subtitle&quot;>Detecta problemas e sugere correções automáticas - Você escolhe o que aplicar</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado e sugerirá correções automáticas</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando e gerando sugestões de correção...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectData = {
  files: {},
  fixes: [],
  applied: new Set(),
  correctedFiles: {}
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectData = {
    files: {},
    fixes: [],
    applied: new Set(),
    correctedFiles: {}
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    // Extrai arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir &amp;&amp; /\.(js|ts|jsx|tsx|json|html|css)$/.test(path)) {
        try {
          const fileContent = await zipEntry.async('text');
          projectData.files[path] = fileContent;
        } catch (e) {}
      }
    }
    
    // Gera sugestões de correção
    generateFixes();
    
    loadingDiv.style.display = 'none';
    displayResults();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card card-error&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

function generateFixes() {
  for (let [filePath, content] of Object.entries(projectData.files)) {
    const ext = filePath.split('.').pop().toLowerCase();
    
    if (ext === 'js' || ext === 'ts' || ext === 'jsx' || ext === 'tsx') {
      generateJSFixes(filePath, content);
    } else if (ext === 'json') {
      generateJSONFixes(filePath, content);
    } else if (ext === 'html') {
      generateHTMLFixes(filePath, content);
    }
  }
}

function generateJSFixes(filePath, content) {
  const lines = content.split('\n');
  
  // 1. Adicionar try-catch em promises
  const promisePattern = /\.then\s*\(/g;
  if (promisePattern.test(content)) {
    const thenCount = (content.match(/\.then\s*\(/g) || []).length;
    const catchCount = (content.match(/\.catch\s*\(/g) || []).length;
    
    if (thenCount > catchCount) {
      projectData.fixes.push({
        id: `fix-${projectData.fixes.length}`,
        severity: 'warning',
        file: filePath,
        title: 'Adicionar .catch() em promises',
        detail: `Detectado ${thenCount} .then() mas apenas ${catchCount} .catch()`,
        before: `.then(response => {\n  // seu código\n})`,
        after: `.then(response => {\n  // seu código\n})\n.catch(error => {\n  console.error('Erro:', error);\n})`,
        type: 'promise_catch',
        autoFix: true,
        code: `
// Encontrar todas as promises sem catch
const promiseRegex = /\.then\\s*\\(([^)]+)\\)(?!\\s*\\.catch)/g;
content = content.replace(promiseRegex, '.then($1).catch(error => console.error(error))');
        `
      });
    }
  }
  
  // 2. Remover console.log em produção
  const consolePattern = /console\.(log|error|warn|info|debug)\s*\(/g;
  const consoleMatches = content.match(consolePattern) || [];
  
  if (consoleMatches.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Remover console.log em produção',
      detail: `Detectado ${consoleMatches.length} console statement(s)`,
      before: `console.log('Debug:', data);`,
      after: `// console.log('Debug:', data); // Removido em produção`,
      type: 'console_removal',
      autoFix: true,
      code: `
// Comentar console statements
content = content.replace(/console\\.(log|error|warn|info|debug)\\s*\\(/g, '// console.$1(');
      `
    });
  }
  
  // 3. Adicionar async/await em funções
  const asyncPattern = /async\s+function\s+(\w+)/g;
  const asyncFuncs = (content.match(asyncPattern) || []).length;
  const awaitCount = (content.match(/await\s+/g) || []).length;
  
  if (asyncFuncs > 0 &amp;&amp; awaitCount === 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'info',
      file: filePath,
      title: 'Função async sem await',
      detail: `${asyncFuncs} função(ões) async sem usar await`,
      before: `async function getData() {\n  return fetch('/api/data');\n}`,
      after: `async function getData() {\n  return await fetch('/api/data');\n}`,
      type: 'async_await',
      autoFix: false
    });
  }
  
  // 4. Adicionar validação de entrada
  const fetchPattern = /fetch\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g;
  const fetchMatches = content.match(fetchPattern) || [];
  
  if (fetchMatches.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Adicionar validação em fetch',
      detail: `${fetchMatches.length} chamada(s) fetch sem validação de resposta`,
      before: `const response = await fetch(url);\nconst data = await response.json();`,
      after: `const response = await fetch(url);\nif (!response.ok) throw new Error('API error');\nconst data = await response.json();`,
      type: 'fetch_validation',
      autoFix: false
    });
  }
  
  // 5. Adicionar try-catch em JSON.parse
  const jsonParsePattern = /JSON\.parse\s*\(/g;
  if (jsonParsePattern.test(content)) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Adicionar try-catch em JSON.parse',
      detail: 'JSON.parse sem tratamento de erro',
      before: `const data = JSON.parse(jsonString);`,
      after: `let data;\ntry {\n  data = JSON.parse(jsonString);\n} catch (e) {\n  console.error('JSON inválido:', e);\n}`,
      type: 'json_parse_try',
      autoFix: false
    });
  }
  
  // 6. Remover variáveis não usadas
  const varPattern = /(?:const|let|var)\s+(\w+)\s*=/g;
  const usedVars = new Set();
  const declaredVars = new Set();
  
  let match;
  while ((match = varPattern.exec(content)) !== null) {
    declaredVars.add(match[1]);
  }
  
  declaredVars.forEach(varName => {
    const regex = new RegExp(`\\b${varName}\\b`, 'g');
    const occurrences = (content.match(regex) || []).length;
    if (occurrences === 1) {
      projectData.fixes.push({
        id: `fix-${projectData.fixes.length}`,
        severity: 'info',
        file: filePath,
        title: `Variável não usada: ${varName}`,
        detail: `Variável &quot;${varName}&quot; é declarada mas nunca usada`,
        before: `const ${varName} = value;`,
        after: `// const ${varName} = value; // Não utilizada`,
        type: 'unused_var',
        autoFix: false
      });
    }
  });
  
  // 7. Adicionar null checks
  if (content.includes('.') &amp;&amp; !content.includes('?.')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'info',
      file: filePath,
      title: 'Considerar usar optional chaining (?.)',
      detail: 'Código pode se beneficiar de optional chaining',
      before: `if (user &amp;&amp; user.profile &amp;&amp; user.profile.name) { ... }`,
      after: `if (user?.profile?.name) { ... }`,
      type: 'optional_chaining',
      autoFix: false
    });
  }
}

function generateJSONFixes(filePath, content) {
  try {
    JSON.parse(content);
  } catch (e) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'error',
      file: filePath,
      title: 'JSON inválido',
      detail: `Erro de sintaxe: ${e.message}`,
      before: content.substring(0, 100),
      after: 'JSON válido',
      type: 'json_syntax',
      autoFix: false
    });
  }
  
  // Verifica package.json
  if (filePath.includes('package.json')) {
    try {
      const pkg = JSON.parse(content);
      
      if (!pkg.name) {
        projectData.fixes.push({
          id: `fix-${projectData.fixes.length}`,
          severity: 'warning',
          file: filePath,
          title: 'package.json sem nome',
          detail: 'Campo &quot;name&quot; é obrigatório',
          before: `{\n  &quot;version&quot;: &quot;1.0.0&quot;\n}`,
          after: `{\n  &quot;name&quot;: &quot;meu-projeto&quot;,\n  &quot;version&quot;: &quot;1.0.0&quot;\n}`,
          type: 'pkg_name',
          autoFix: true
        });
      }
      
      if (!pkg.scripts || !pkg.scripts.start) {
        projectData.fixes.push({
          id: `fix-${projectData.fixes.length}`,
          severity: 'warning',
          file: filePath,
          title: 'Script &quot;start&quot; não definido',
          detail: 'Adicione um script de inicialização',
          before: `&quot;scripts&quot;: {}`,
          after: `&quot;scripts&quot;: { &quot;start&quot;: &quot;node index.js&quot; }`,
          type: 'pkg_start',
          autoFix: false
        });
      }
    } catch (e) {}
  }
}

function generateHTMLFixes(filePath, content) {
  // Verifica meta tags
  if (!content.includes('charset')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Meta charset ausente',
      detail: 'Adicione charset UTF-8',
      before: `<head>\n  <title>Meu Site</title>\n</head>`,
      after: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n  <title>Meu Site</title>\n</head>`,
      type: 'html_charset',
      autoFix: true
    });
  }
  
  // Verifica viewport
  if (!content.includes('viewport')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Meta viewport ausente',
      detail: 'Adicione viewport para responsividade',
      before: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n</head>`,
      after: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>\n</head>`,
      type: 'html_viewport',
      autoFix: true
    });
  }
  
  // Verifica alt em imagens
  const imgPattern = /<img[^>]*>/g;
  const imgs = content.match(imgPattern) || [];
  const imgsWithoutAlt = imgs.filter(img => !img.includes('alt='));
  
  if (imgsWithoutAlt.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: `${imgsWithoutAlt.length} imagem(ns) sem alt`,
      detail: 'Adicione atributo alt para acessibilidade',
      before: `<img src=&quot;imagem.jpg&quot;>`,
      after: `<img src=&quot;imagem.jpg&quot; alt=&quot;Descrição da imagem&quot;>`,
      type: 'html_img_alt',
      autoFix: false
    });
  }
}

function displayResults() {
  const critical = projectData.fixes.filter(f => f.severity === 'critical').length;
  const error = projectData.fixes.filter(f => f.severity === 'error').length;
  const warning = projectData.fixes.filter(f => f.severity === 'warning').length;
  const info = projectData.fixes.filter(f => f.severity === 'info').length;
  
  let html = `
    <div class=&quot;tabs&quot;>
      <button class=&quot;tab active&quot; onclick=&quot;switchTab('overview')&quot;>📊 Visão Geral</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('fixes')&quot;>🔧 Correções</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('apply')&quot;>✅ Aplicar Fixes</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('preview')&quot;>👁️ Pré-visualização</button>
    </div>
    
    <!-- TAB: VISÃO GERAL -->
    <div id=&quot;tab-overview&quot; class=&quot;tab-content active&quot;>
      <div class=&quot;results&quot;>
        <h2>📊 Resumo de Correções</h2>
        <div class=&quot;stats-grid&quot;>
          <div class=&quot;stat-box&quot;>
            <strong>${projectData.fixes.length}</strong>
            <span>Total de Fixes</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #ef4444;&quot;>${critical}</strong>
            <span>Críticos</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #f87171;&quot;>${error}</strong>
            <span>Erros</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #fbbf24;&quot;>${warning}</strong>
            <span>Avisos</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #60a5fa;&quot;>${info}</strong>
            <span>Informações</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${projectData.fixes.filter(f => f.autoFix).length}</strong>
            <span>Auto-fix</span>
          </div>
        </div>
      </div>
      
      <div class=&quot;results&quot;>
        <h2>🎯 Prioridade de Correção</h2>
        <div class=&quot;summary-box&quot;>
          <strong>1️⃣ Críticos (${critical})</strong> - Devem ser corrigidos imediatamente
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>2️⃣ Erros (${error})</strong> - Podem quebrar o código
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>3️⃣ Avisos (${warning})</strong> - Melhoram qualidade e segurança
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>4️⃣ Informações (${info})</strong> - Sugestões de melhoria
        </div>
      </div>
    </div>
    
    <!-- TAB: CORREÇÕES -->
    <div id=&quot;tab-fixes&quot; class=&quot;tab-content&quot;>
      <div class=&quot;results&quot;>
        <h2>🔧 Todas as Correções Sugeridas</h2>
        <div id=&quot;fixesList&quot;>
          ${projectData.fixes.length > 0 ? projectData.fixes.map(fix => `
            <div class=&quot;fix-item&quot;>
              <div class=&quot;fix-header&quot;>
                <div>
                  <div class=&quot;fix-title&quot;>${fix.title}</div>
                  <div class=&quot;fix-detail&quot;>${fix.detail}</div>
                  <div class=&quot;fix-detail&quot;>📄 ${fix.file}</div>
                </div>
                <span class=&quot;fix-severity ${fix.severity}&quot;>${fix.severity.toUpperCase()}</span>
              </div>
              
              <div class=&quot;code-comparison&quot;>
                <div>
                  <div class=&quot;code-label&quot;>❌ Antes</div>

                </div>

                  <div class=&quot;code-label&quot;>✅ Depois</div>
                  <div class=&quot;code-block code-after&quot;>${escapeHtml(fix.after)}</div>
                </div>
              </div>
              
              <div class=&quot;fix-actions&quot;>
                <div class=&quot;fix-checkbox&quot;>
                  <input type=&quot;checkbox&quot; id=&quot;fix-${fix.id}&quot; onchange=&quot;toggleFix('${fix.id}')&quot;>
                  <label for=&quot;fix-${fix.id}&quot;>Selecionar para aplicar</label>
                </div>
                ${fix.autoFix ? '<span style=&quot;color: #4ade80; font-size: 11px;&quot;>🤖 Auto-fix disponível</span>' : ''}
              </div>
            </div>
          `).join('') : '<p style=&quot;color: #4ade80;&quot;>✅ Nenhuma correção necessária!</p>'}
        </div>
      </div>
    </div>
    
    <!-- TAB: APLICAR FIXES -->
    <div id=&quot;tab-apply&quot; class=&quot;tab-content&quot;>

        </div>
        
        <div style=&quot;display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;&quot;>
          <button class=&quot;btn btn-success&quot; onclick=&quot;selectAllFixes()&quot;>✅ Selecionar Tudo</button>
          <button class=&quot;btn btn-danger&quot; onclick=&quot;deselectAllFixes()&quot;>❌ Desselecionar Tudo</button>
          <button class=&quot;btn btn-warning&quot; onclick=&quot;selectAutoFixes()&quot;>🤖 Apenas Auto-fix</button>
          <button class=&quot;btn btn-secondary&quot; onclick=&quot;applySelectedFixes()&quot;>🚀 Aplicar Selecionadas</button>
        </div>

        <div class=&quot;file-list&quot; id=&quot;filePreviewList&quot;>
          ${Object.keys(projectData.files).map(file => `
            <div class=&quot;file-item&quot; onclick=&quot;previewFile('${escapeHtml(file)}')&quot;>
              <div class=&quot;file-name&quot;>${file}</div>
              <div class=&quot;file-status&quot;>Visualizar</div>
            </div>
          `).join('')}
        </div>
        
        <div id=&quot;filePreview&quot; style=&quot;margin-top: 20px;&quot;></div>
      </div>
    </div>
  `;
  
  resultsDiv.innerHTML = html;
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function toggleFix(fixId) {
  const checkbox = document.getElementById(`fix-${fixId}`);
  if (checkbox.checked) {
    projectData.applied.add(fixId);
  } else {
    projectData.applied.delete(fixId);
  }
  updateSelectedCount();
}

function updateSelectedCount() {
  document.getElementById('selectedCount').textContent = projectData.applied.size;
}

function selectAllFixes() {
  projectData.fixes.forEach(fix => {
    projectData.applied.add(fix.id);
    const checkbox = document.getElementById(`fix-${fix.id}`);
    if (checkbox) checkbox.checked = true;
  });
  updateSelectedCount();
}

function deselectAllFixes() {
  projectData.applied.clear();
  document.querySelectorAll('input[type=&quot;checkbox&quot;]').forEach(cb => cb.checked = false);
  updateSelectedCount();
}

function selectAutoFixes() {
  projectData.applied.clear();
  projectData.fixes.forEach(fix => {
    if (fix.autoFix) {
      projectData.applied.add(fix.id);
      const checkbox = document.getElementById(`fix-${fix.id}`);
      if (checkbox) checkbox.checked = true;
    }
  });
  updateSelectedCount();
}

function applySelectedFixes() {
  const selectedFixes = projectData.fixes.filter(f => projectData.applied.has(f.id));
  
  if (selectedFixes.length === 0) {
    alert('❌ Selecione pelo menos uma correção!');
    return;
  }
  
  projectData.correctedFiles = JSON.parse(JSON.stringify(projectData.files));
  
  selectedFixes.forEach(fix => {
    if (fix.file in projectData.correctedFiles) {
      let content = projectData.correctedFiles[fix.file];
      
      // Aplica a correção baseada no tipo
      switch (fix.type) {
        case 'promise_catch':
          content = content.replace(/\.then\s*\(([^)]+)\)(?!\s*\.catch)/g, '.then($1).catch(error => console.error(error))');
          break;
        case 'console_removal':
          content = content.replace(/console\.(log|error|warn|info|debug)\s*\(/g, '// console.$1(');
          break;
        case 'html_charset':
          content = content.replace(/<head>/i, '<head>\n  <meta charset=&quot;UTF-8&quot;>');
          break;
        case 'html_viewport':
          content = content.replace(/<head>/i, '<head>\n  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>');
          break;
      }
      
      projectData.correctedFiles[fix.file] = content;
    }
  });
  
  displayApplyResults(selectedFixes);
}

function displayApplyResults(applied) {
  let html = `
    <div class=&quot;card card-success&quot;>
      <div class=&quot;card-title&quot;>✅ Correções Aplicadas!</div>
      <div class=&quot;card-content&quot;>
        <strong>${applied.length} correção(ões) aplicada(s)</strong><br>
        <br>
        Arquivos afetados:
        <ul style=&quot;margin-left: 20px; margin-top: 8px;&quot;>
  `;
  
  const affectedFiles = new Set(applied.map(f => f.file));
  affectedFiles.forEach(file => {
    html += `<li>${file}</li>`;
  });
  
  html += `
        </ul>
      </div>
    </div>
    
    <div class=&quot;results&quot; style=&quot;margin-top: 20px;&quot;>
      <h3>📥 Baixar Arquivos Corrigidos</h3>
      <button class=&quot;btn btn-success&quot; onclick=&quot;downloadCorrectedFiles()&quot;>
        ⬇️ Baixar ZIP com Correções
      </button>
      <button class=&quot;btn btn-secondary&quot; onclick=&quot;downloadCorrectionReport()&quot;>
        📋 Relatório de Correções
      </button>
    </div>
  `;
  
  document.getElementById('applyResults').innerHTML = html;
}

function downloadCorrectedFiles() {
  const zip = new JSZip();
  
  Object.entries(projectData.correctedFiles).forEach(([path, content]) => {
    zip.file(path, content);
  });
  
  zip.generateAsync({ type: 'blob' }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `projeto-corrigido-${new Date().toISOString().split('T')[0]}.zip`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

function downloadCorrectionReport() {
  const applied = projectData.fixes.filter(f => projectData.applied.has(f.id));
  
  let md = `# Relatório de Correções Aplicadas\n\n`;
  md += `**Data:** ${new Date().toLocaleString('pt-BR')}\n\n`;
  md += `**Total de Correções:** ${applied.length}\n\n`;
  
  md += `## Correções Aplicadas\n\n`;
  applied.forEach((fix, idx) => {
    md += `### ${idx + 1}. ${fix.title}\n`;
    md += `- **Arquivo:** ${fix.file}\n`;
    md += `- **Severidade:** ${fix.severity}\n`;
    md += `- **Detalhe:** ${fix.detail}\n\n`;
  });
  
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio-correcoes-${new Date().toISOString().split('T')[0]}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

function previewFile(filePath) {
  const original = projectData.files[filePath];
  const corrected = projectData.correctedFiles[filePath] || original;
  
  let html = `
    <div class=&quot;results&quot;>
      <h3>📄 ${filePath}</h3>
      
      <div class=&quot;code-comparison&quot;>
        <div>
          <div class=&quot;code-label&quot;>Original</div>
          <div class=&quot;code-block code-before&quot; style=&quot;max-height: 400px;&quot;>
            ${escapeHtml(original).substring(0, 1000)}
          </div>
        </div>
        <div>
          <div class=&quot;code-label&quot;>Corrigido</div>
          <div class=&quot;code-block code-after&quot; style=&quot;max-height: 400px;&quot;>
            ${escapeHtml(corrected).substring(0, 1000)}
          </div>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('filePreview').innerHTML = html;
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado completamente e gerará relatório detalhado</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando projeto... Isso pode levar alguns segundos...</p>
  </div>

  <div id=&quot;results&quot;></div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectAnalysis = {
  files: {},
  issues: [],
  endpoints: [],
  dependencies: [],
  replitBindings: [],
  configFiles: {},
  dataFlow: [],
  warnings: []
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectAnalysis = {
    files: {},
    issues: [],
    endpoints: [],
    dependencies: [],
    replitBindings: [],
    configFiles: {},
    dataFlow: [],
    warnings: []
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    // Extrai todos os arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        try {
          const fileContent = await zipEntry.async('text');
          projectAnalysis.files[path] = {
            content: fileContent,
            size: zipEntry._data.uncompressedSize,
            ext: path.split('.').pop().toLowerCase()
          };
        } catch (e) {}
      }
    }
    
    // Executa análises
    await analyzeProject();
    
    loadingDiv.style.display = 'none';
    displayResults();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card card-error&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

async function analyzeProject() {
  // Análise de configuração
  analyzeConfig();
  
  // Análise de dependências
  analyzeDependencies();
  
  // Análise de endpoints
  analyzeEndpoints();
  
  // Análise de vínculos Replit
  analyzeReplitBindings();
  
  // Análise de erros
  analyzeErrors();
  
  // Análise de fluxo de dados
  analyzeDataFlow();
  
  // Análise de segurança
  analyzeSecurity();
}

function analyzeConfig() {
  const configFiles = ['package.json', '.replit', 'replit.nix', 'vite.config.js', 'webpack.config.js', '.env', '.env.local'];
  
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const fileName = path.split('/').pop();
    
    if (configFiles.includes(fileName)) {
      projectAnalysis.configFiles[path] = file.content;
      
      if (fileName === 'package.json') {
        try {
          const pkg = JSON.parse(file.content);
          
          // Detecta problemas no package.json
          if (!pkg.name) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'config',
              title: 'package.json sem nome',
              detail: 'O arquivo package.json não tem um campo &quot;name&quot;',
              file: path,
              fix: 'Adicione um nome ao projeto'
            });
          }
          
          if (!pkg.scripts || !pkg.scripts.start) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'config',
              title: 'Script &quot;start&quot; não definido',
              detail: 'Não há script de inicialização',
              file: path,
              fix: 'Adicione &quot;start&quot; em scripts'
            });
          }
          
          // Detecta dependências faltando
          const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
          Object.keys(allDeps).forEach(dep => {
            projectAnalysis.dependencies.push({
              name: dep,
              version: allDeps[dep],
              type: pkg.dependencies[dep] ? 'production' : 'development'
            });
          });
          
        } catch (e) {
          projectAnalysis.issues.push({
            severity: 'error',
            type: 'config',
            title: 'package.json inválido',
            detail: 'JSON malformado: ' + e.message,
            file: path,
            fix: 'Corrija a sintaxe JSON'
          });
        }
      }
      
      if (fileName === '.replit') {
        projectAnalysis.issues.push({
          severity: 'info',
          type: 'replit',
          title: 'Arquivo .replit detectado',
          detail: 'Este arquivo contém configurações específicas da Replit',
          file: path,
          note: 'Pode precisar ser ajustado em outro ambiente'
        });
      }
      
      if (fileName === 'vite.config.js') {
        projectAnalysis.issues.push({
          severity: 'info',
          type: 'build',
          title: 'Vite detectado',
          detail: 'Projeto usa Vite como bundler',
          file: path
        });
      }
    }
  }
}

function analyzeDependencies() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (path.includes('package.json')) {
      try {
        const pkg = JSON.parse(file.content);
        const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
        
        // Verifica dependências críticas
        const criticalDeps = ['express', 'react', 'vue', 'angular', 'next', 'nuxt'];
        
        criticalDeps.forEach(dep => {
          if (allDeps[dep]) {
            projectAnalysis.dependencies.push({
              name: dep,
              version: allDeps[dep],
              status: 'found'
            });
          }
        });
        
      } catch (e) {}
    }
  }
}

function analyzeEndpoints() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts') {
      const content = file.content;
      
      // Detecta endpoints
      const endpointPatterns = [
        { regex: /app\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
        { regex: /router\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
        { regex: /fetch\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'fetch' },
        { regex: /axios\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'axios' }
      ];
      
      endpointPatterns.forEach(pattern => {
        let match;
        const regex = new RegExp(pattern.regex.source, 'g');
        
        while ((match = regex.exec(content)) !== null) {
          const method = match[1] || 'GET';
          const endpoint = match[2] || match[1];
          
          projectAnalysis.endpoints.push({
            method: method.toUpperCase(),
            path: endpoint,
            file: path,
            type: pattern.type,
            line: content.substring(0, match.index).split('\n').length
          });
          
          // Detecta problemas em endpoints
          if (!endpoint.startsWith('/') &amp;&amp; !endpoint.startsWith('http')) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'endpoint',
              title: 'Endpoint sem caminho claro',
              detail: `Endpoint &quot;${endpoint}&quot; pode estar mal formatado`,
              file: path,
              line: content.substring(0, match.index).split('\n').length,
              fix: 'Verifique se o caminho está correto'
            });
          }
        }
      });
    }
  }
}

function analyzeReplitBindings() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const content = file.content.toLowerCase();
    
    // Detecta referências a Replit
    const replitPatterns = [
      { pattern: 'process.env.replit', type: 'env_var' },
      { pattern: 'replit_db', type: 'database' },
      { pattern: 'replit_audio', type: 'audio' },
      { pattern: 'replit_code', type: 'code_execution' },
      { pattern: '.replit', type: 'config' },
      { pattern: 'replit.com', type: 'url' }
    ];
    
    replitPatterns.forEach(p => {
      if (content.includes(p.pattern)) {
        projectAnalysis.replitBindings.push({
          type: p.type,
          pattern: p.pattern,
          file: path,
          severity: 'warning'
        });
        
        projectAnalysis.issues.push({
          severity: 'warning',
          type: 'replit_binding',
          title: `Vínculo Replit detectado: ${p.type}`,
          detail: `Arquivo contém referência a &quot;${p.pattern}&quot;`,
          file: path,
          note: 'Este código pode não funcionar fora da Replit',
          fix: 'Considere abstrair em variáveis de ambiente'
        });
      }
    });
  }
}

function analyzeErrors() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts' || file.ext === 'json') {
      const content = file.content;
      const lines = content.split('\n');
      
      // Detecta erros comuns
      lines.forEach((line, idx) => {
        // Chaves não fechadas
        const opens = (line.match(/[\{\[\(]/g) || []).length;
        const closes = (line.match(/[\}\]\)]/g) || []).length;
        if (opens !== closes &amp;&amp; opens > 0) {
          projectAnalysis.issues.push({
            severity: 'error',
            type: 'syntax',
            title: 'Possível erro de sintaxe',
            detail: 'Chaves/parênteses não balanceados',
            file: path,
            line: idx + 1,
            code: line.trim(),
            fix: 'Verifique se todas as chaves estão fechadas'
          });
        }
        
        // Variáveis não definidas
        if (line.includes('undefined') &amp;&amp; !line.includes('typeof')) {
          projectAnalysis.issues.push({
            severity: 'warning',
            type: 'reference',
            title: 'Possível referência indefinida',
            detail: 'Linha contém &quot;undefined&quot;',
            file: path,
            line: idx + 1,
            code: line.trim()
          });
        }
        
        // Senhas/tokens
        if (/(password|token|secret|apikey|api_key)\s*[:=]/i.test(line) &amp;&amp; !line.includes('//')) {
          projectAnalysis.issues.push({
            severity: 'critical',
            type: 'security',
            title: '🔐 CRÍTICO: Possível credencial exposta',
            detail: 'Linha contém possível senha/token',
            file: path,
            line: idx + 1,
            fix: 'Mova para variáveis de ambiente'
          });
        }
      });
    }
  }
}

function analyzeDataFlow() {
  // Rastreia fluxo de dados entre componentes
  const flows = [];
  
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts') {
      const content = file.content;
      
      // Detecta imports/exports
      const imports = content.match(/import\s+.*from\s+['&quot;`]([^'&quot;`]+)['&quot;`]/g) || [];
      const exports = content.match(/export\s+(default\s+)?(function|const|class|interface)\s+(\w+)/g) || [];
      
      imports.forEach(imp => {
        flows.push({
          type: 'import',
          from: path,
          source: imp,
          status: 'detected'
        });
      });
      
      exports.forEach(exp => {
        flows.push({
          type: 'export',
          from: path,
          source: exp,
          status: 'detected'
        });
      });
    }
  }
  
  projectAnalysis.dataFlow = flows;
}

function analyzeSecurity() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const content = file.content;
    
    // Detecta problemas de segurança
    const securityPatterns = [
      { pattern: /eval\s*\(/g, issue: 'eval() detectado - RISCO DE SEGURANÇA' },
      { pattern: /innerHTML\s*=/g, issue: 'innerHTML detectado - Risco de XSS' },
      { pattern: /dangerouslySetInnerHTML/g, issue: 'dangerouslySetInnerHTML - Risco de XSS' },
      { pattern: /localStorage\.setItem/g, issue: 'localStorage - Dados sensíveis podem ser expostos' },
      { pattern: /document\.write/g, issue: 'document.write() - Método obsoleto' }
    ];
    
    securityPatterns.forEach(p => {
      if (p.pattern.test(content)) {
        projectAnalysis.issues.push({
          severity: 'warning',
          type: 'security',
          title: p.issue,
          detail: `Detectado em ${path}`,
          file: path,
          fix: 'Revise o código para possíveis vulnerabilidades'
        });
      }
    });
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function calculateHealth() {
  const total = projectAnalysis.issues.length;
  if (total === 0) return 100;
  
  const critical = projectAnalysis.issues.filter(i => i.severity === 'critical').length * 10;
  const errors = projectAnalysis.issues.filter(i => i.severity === 'error').length * 5;
  const warnings = projectAnalysis.issues.filter(i => i.severity === 'warning').length * 2;
  
  const health = Math.max(0, 100 - (critical + errors + warnings));
  return Math.round(health);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

<body>

<div class=&quot;container&quot;>
  <h1>🧪 Validador de Código + Testador de API</h1>
  <p class=&quot;subtitle&quot;>Valida código, detecta APIs e testa chamadas em tempo real</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado para validação e detecção de APIs</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando código e detectando APIs...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<!-- MODAL DE TESTE DE API -->
<div class=&quot;modal&quot; id=&quot;apiTestModal&quot;>
  <div class=&quot;modal-content&quot;>
    <div class=&quot;modal-header&quot;>
      <h2 id=&quot;apiTestTitle&quot;>Testar API</h2>
      <button class=&quot;modal-close&quot; onclick=&quot;closeApiModal()&quot;>✕</button>
    </div>
    
    <div id=&quot;apiTestContent&quot;></div>
  </div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let allFiles = {};
let detectedAPIs = [];
let validationResults = {};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    allFiles = {};
    detectedAPIs = [];
    validationResults = {};
    
    // Extrai arquivos JavaScript/TypeScript
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir &amp;&amp; /\.(js|jsx|ts|tsx)$/.test(path)) {
        try {
          const fileContent = await zipEntry.async('text');
          allFiles[path] = fileContent;
          
          // Valida código
          validationResults[path] = validateCode(fileContent, path);
          
          // Detecta APIs
          const apis = detectAPIs(fileContent, path);
          detectedAPIs.push(...apis);
        } catch (e) {}
      }
    }
    
    loadingDiv.style.display = 'none';
    displayResults();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card card-error&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

function validateCode(code, filePath) {
  const issues = [];
  const lines = code.split('\n');
  
  // Verifica sintaxe básica
  const checks = [
    {
      name: 'Chaves não fechadas',
      regex: /(\{|\[|\()/g,
      test: (code) => {
        const opens = (code.match(/[\{\[\(]/g) || []).length;
        const closes = (code.match(/[\}\]\)]/g) || []).length;
        return opens !== closes;
      },
      severity: 'error'
    },
    {
      name: 'Variáveis não declaradas',
      regex: /(?:^|\s)([a-zA-Z_$][a-zA-Z0-9_$]*)\s*=/,
      test: (code) => {
        const vars = new Set();
        const declared = new Set();
        
        (code.match(/(?:const|let|var)\s+([a-zA-Z_$][a-zA-Z0-9_$]*)/g) || []).forEach(m => {
          declared.add(m.replace(/(?:const|let|var)\s+/, ''));
        });
        
        return false; // Simplificado
      },
      severity: 'warning'
    },
    {
      name: 'Console.log em produção',
      regex: /console\.(log|error|warn)/g,
      test: (code) => /console\.(log|error|warn)/.test(code),
      severity: 'warning'
    },
    {
      name: 'Try-catch ausente em promises',
      regex: /\.then\(/g,
      test: (code) => {
        const thens = (code.match(/\.then\(/g) || []).length;
        const catches = (code.match(/\.catch\(/g) || []).length;
        return thens > catches;
      },
      severity: 'warning'
    },
    {
      name: 'Async sem await',
      regex: /async\s+function/g,
      test: (code) => {
        const asyncFuncs = (code.match(/async\s+function/g) || []).length;
        const awaits = (code.match(/await\s+/g) || []).length;
        return asyncFuncs > 0 &amp;&amp; awaits === 0;
      },
      severity: 'warning'
    },
    {
      name: 'URLs hardcoded',
      regex: /https?:\/\/[^\s&quot;']+/g,
      test: (code) => /https?:\/\/[^\s&quot;']+/.test(code),
      severity: 'info'
    },
    {
      name: 'Senhas/tokens expostos',
      regex: /(password|token|secret|apikey)\s*[:=]/gi,
      test: (code) => /(password|token|secret|apikey)\s*[:=]/i.test(code),
      severity: 'error'
    }
  ];
  
  checks.forEach(check => {
    if (check.test(code)) {
      issues.push({
        name: check.name,
        severity: check.severity,
        count: (code.match(check.regex) || []).length
      });
    }
  });
  
  return {
    filePath,
    totalLines: lines.length,
    issues,
    hasErrors: issues.some(i => i.severity === 'error'),
    hasWarnings: issues.some(i => i.severity === 'warning')
  };
}

function detectAPIs(code, filePath) {
  const apis = [];
  
  // Padrões de detecção de APIs
  const patterns = [
    {
      name: 'fetch',
      regex: /fetch\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g,
      method: 'GET'
    },
    {
      name: 'axios',
      regex: /axios\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g,
      method: 'DYNAMIC'
    },
    {
      name: 'XMLHttpRequest',
      regex: /open\s*\(\s*['&quot;`](\w+)['&quot;`]\s*,\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g,
      method: 'DYNAMIC'
    },
    {
      name: 'jQuery.ajax',
      regex: /\$\.ajax\s*\(\s*\{[^}]*url\s*:\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g,
      method: 'GET'
    },
    {
      name: 'WebSocket',
      regex: /new\s+WebSocket\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g,
      method: 'WS'
    }
  ];
  
  patterns.forEach(pattern => {
    let match;
    const regex = new RegExp(pattern.regex.source, 'g');
    
    while ((match = regex.exec(code)) !== null) {
      const url = match[1] || match[2];
      const method = pattern.method === 'DYNAMIC' ? (match[1] || 'GET').toUpperCase() : pattern.method;
      
      apis.push({
        type: pattern.name,
        url: url,
        method: method,
        filePath: filePath,
        line: code.substring(0, match.index).split('\n').length,
        fullMatch: match[0]
      });
    }
  });
  
  return apis;
}

function displayResults() {
  const validationIssues = Object.values(validationResults);
  const totalErrors = validationIssues.reduce((sum, v) => sum + v.issues.filter(i => i.severity === 'error').length, 0);
  const totalWarnings = validationIssues.reduce((sum, v) => sum + v.issues.filter(i => i.severity === 'warning').length, 0);
  
  let html = `
    <div class=&quot;tabs&quot;>
      <button class=&quot;tab active&quot; onclick=&quot;switchTab('validation')&quot;>✅ Validação</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('apis')&quot;>🔌 APIs Detectadas</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('test')&quot;>🧪 Testar APIs</button>
    </div>
    
    <!-- TAB: VALIDAÇÃO -->
    <div id=&quot;tab-validation&quot; class=&quot;tab-content active&quot;>
      <div class=&quot;results&quot;>
        <h2>✅ Validação de Código</h2>
        <div class=&quot;stats-grid&quot;>
          <div class=&quot;stat-box&quot;>
            <strong>${validationIssues.length}</strong>
            <span>Arquivos Analisados</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${totalErrors}</strong>
            <span>Erros</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${totalWarnings}</strong>
            <span>Avisos</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${validationIssues.filter(v => !v.hasErrors &amp;&amp; !v.hasWarnings).length}</strong>
            <span>OK</span>
          </div>
        </div>
      </div>
  `;
  
  validationIssues.forEach(validation => {
    const status = validation.hasErrors ? '❌' : validation.hasWarnings ? '⚠️' : '✅';
    const cardClass = validation.hasErrors ? 'card-error' : validation.hasWarnings ? 'card-warning' : 'card-success';
    
    html += `
      <div class=&quot;card ${cardClass}&quot;>
        <div class=&quot;card-title&quot;>${status} ${validation.filePath}</div>
        <div class=&quot;card-content&quot;>
          <strong>Linhas:</strong> ${validation.totalLines}<br>
          ${validation.issues.length > 0 ? `
            <strong>Problemas encontrados:</strong>
            <ul style=&quot;margin-left: 20px; margin-top: 8px;&quot;>
              ${validation.issues.map(issue => `
                <li>${issue.name} (${issue.severity}) - ${issue.count} ocorrência(s)</li>
              `).join('')}
            </ul>
          ` : '<strong style=&quot;color: #4ade80;&quot;>Nenhum problema detectado!</strong>'}
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  // TAB: APIs DETECTADAS
  html += `
    <div id=&quot;tab-apis&quot; class=&quot;tab-content&quot;>
      <div class=&quot;results&quot;>
        <h2>🔌 APIs Detectadas</h2>
        <div class=&quot;stats-grid&quot;>
          <div class=&quot;stat-box&quot;>
            <strong>${detectedAPIs.length}</strong>
            <span>APIs Encontradas</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${new Set(detectedAPIs.map(a => a.url)).size}</strong>
            <span>URLs Únicas</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${new Set(detectedAPIs.map(a => a.type)).size}</strong>
            <span>Tipos de Chamada</span>
          </div>
        </div>
      </div>
      
      <div class=&quot;results&quot;>
        <h2>📋 Lista de APIs</h2>
        <div class=&quot;api-list&quot;>
          ${detectedAPIs.length > 0 ? detectedAPIs.map((api, idx) => `
            <div class=&quot;api-item&quot; onclick=&quot;openApiTest(${idx})&quot;>
              <div>
                <span class=&quot;api-method ${api.method.toLowerCase()}&quot;>${api.method}</span>
                <span style=&quot;color: #a3a082; font-weight: 600;&quot;>${api.type}</span>
              </div>
              <div class=&quot;api-url&quot;>${api.url}</div>
              <div style=&quot;font-size: 11px; color: #94a3b8; margin-top: 5px;&quot;>
                📄 ${api.filePath} (linha ${api.line})
              </div>
              <button class=&quot;btn btn-small btn-secondary&quot; style=&quot;margin-top: 8px;&quot; onclick=&quot;event.stopPropagation(); openApiTest(${idx})&quot;>
                🧪 Testar
              </button>
            </div>
          `).join('') : '<div style=&quot;color: #94a3b8; padding: 20px; text-align: center;&quot;>Nenhuma API detectada</div>'}
        </div>
      </div>
    </div>
  `;
  
  // TAB: TESTAR APIs
  html += `
    <div id=&quot;tab-test&quot; class=&quot;tab-content&quot;>
      <div class=&quot;results&quot;>
        <h2>🧪 Testar APIs</h2>
        <p style=&quot;color: #94a3b8; margin-bottom: 15px;&quot;>Selecione uma API acima para testar, ou configure manualmente:</p>
        
        <div class=&quot;form-group&quot;>
          <label>URL da API</label>
          <input type=&quot;text&quot; id=&quot;testUrl&quot; placeholder=&quot;https://api.exemplo.com/dados&quot; value=&quot;&quot;>
        </div>
        
        <div class=&quot;form-group&quot;>
          <label>Método HTTP</label>
          <select id=&quot;testMethod&quot;>
            <option value=&quot;GET&quot;>GET</option>
            <option value=&quot;POST&quot;>POST</option>
            <option value=&quot;PUT&quot;>PUT</option>
            <option value=&quot;DELETE&quot;>DELETE</option>
            <option value=&quot;PATCH&quot;>PATCH</option>
          </select>
        </div>
        
        <div class=&quot;form-group&quot;>
          <label>Headers (JSON)</label>
          <textarea id=&quot;testHeaders&quot; style=&quot;height: 80px;&quot; placeholder='{&quot;Authorization&quot;: &quot;Bearer token&quot;, &quot;Content-Type&quot;: &quot;application/json&quot;}'></textarea>
        </div>
        
        <div class=&quot;form-group&quot;>
          <label>Body (JSON)</label>
          <textarea id=&quot;testBody&quot; style=&quot;height: 80px;&quot; placeholder='{&quot;chave&quot;: &quot;valor&quot;}'></textarea>
        </div>
        
        <button class=&quot;btn btn-success&quot; onclick=&quot;testAPI()&quot;>🚀 Executar Teste</button>
        
        <div id=&quot;testResults&quot; style=&quot;margin-top: 20px;&quot;></div>
      </div>
    </div>
  `;
  
  resultsDiv.innerHTML = html;
}

function switchTab(tabName) {
  // Remove active de todos
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  // Adiciona active ao selecionado
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function openApiTest(index) {
  const api = detectedAPIs[index];
  
  document.getElementById('testUrl').value = api.url;
  document.getElementById('testMethod').value = api.method;
  
  // Muda para tab de teste
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  const tabs = document.querySelectorAll('.tab');
  tabs[2].classList.add('active');
  document.getElementById('tab-test').classList.add('active');
  
  // Scroll para o formulário
  document.getElementById('tab-test').scrollIntoView({ behavior: 'smooth' });
}

async function testAPI() {
  const url = document.getElementById('testUrl').value;
  const method = document.getElementById('testMethod').value;
  const headersStr = document.getElementById('testHeaders').value;
  const bodyStr = document.getElementById('testBody').value;
  
  if (!url) {
    alert('❌ Digite uma URL válida!');
    return;
  }
  
  const resultsDiv = document.getElementById('testResults');
  resultsDiv.innerHTML = '<div class=&quot;loading&quot;><div class=&quot;spinner&quot;></div><p>Testando API...</p></div>';
  
  try {
    let headers = {
      'Content-Type': 'application/json'
    };
    
    if (headersStr) {
      try {
        headers = { ...headers, ...JSON.parse(headersStr) };
      } catch (e) {
        throw new Error('Headers inválido: ' + e.message);
      }
    }
    
    let body = undefined;
    if (bodyStr &amp;&amp; ['POST', 'PUT', 'PATCH'].includes(method)) {
      try {
        body = JSON.parse(bodyStr);
      } catch (e) {
        throw new Error('Body inválido: ' + e.message);
      }
    }
    
    const startTime = performance.now();
    const response = await fetch(url, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    });
    const endTime = performance.now();
    
    const responseText = await response.text();
    let responseData;
    
    try {
      responseData = JSON.parse(responseText);
    } catch (e) {
      responseData = responseText;
    }
    
    const isSuccess = response.ok;
    const statusClass = isSuccess ? 'success-line' : 'error-line';
    
    let html = `
      <div class=&quot;card ${isSuccess ? 'card-success' : 'card-error'}&quot;>
        <div class=&quot;card-title&quot;>${isSuccess ? '✅ Sucesso!' : '❌ Erro na Chamada'}</div>
        <div class=&quot;card-content&quot;>
          <strong>Status:</strong> ${response.status} ${response.statusText}<br>
          <strong>Tempo de Resposta:</strong> ${(endTime - startTime).toFixed(2)}ms<br>
          <strong>Content-Type:</strong> ${response.headers.get('content-type') || 'não especificado'}<br>
          <strong>Tamanho:</strong> ${responseText.length} bytes
        </div>
      </div>
      
      <div class=&quot;response-box&quot;>
        <div class=&quot;response-header&quot;>📨 Resposta da API</div>
        <pre>${typeof responseData === 'object' ? JSON.stringify(responseData, null, 2) : escapeHtml(responseData)}</pre>
      </div>
      
      <div class=&quot;card card-info&quot;>
        <div class=&quot;card-title&quot;>📊 Análise da Resposta</div>
        <div class=&quot;card-content&quot;>
          ${analyzeResponse(responseData, response.status)}
        </div>
      </div>
    `;
    
    resultsDiv.innerHTML = html;
    
  } catch (err) {
    resultsDiv.innerHTML = `
      <div class=&quot;card card-error&quot;>
        <div class=&quot;card-title&quot;>❌ Erro na Requisição</div>
        <div class=&quot;card-content&quot;>
          <strong>Tipo de Erro:</strong> ${err.name}<br>
          <strong>Mensagem:</strong> ${err.message}<br>
          <br>
          <strong>Possíveis Causas:</strong>
          <ul style=&quot;margin-left: 20px; margin-top: 8px;&quot;>
            <li>URL inválida ou inacessível</li>
            <li>CORS bloqueado (Cross-Origin)</li>
            <li>Servidor fora do ar</li>
            <li>Timeout na conexão</li>
            <li>Certificado SSL inválido</li>
          </ul>
        </div>
      </div>
    `;
  }
}

function analyzeResponse(data, status) {
  let analysis = '';
  
  if (status >= 200 &amp;&amp; status < 300) {
    analysis += '<span class=&quot;success-line&quot;>✅ Status de sucesso (2xx)</span><br>';
  } else if (status >= 300 &amp;&amp; status < 400) {
    analysis += '<span class=&quot;warning-line&quot;>⚠️ Redirecionamento (3xx)</span><br>';
  } else if (status >= 400 &amp;&amp; status < 500) {
    analysis += '<span class=&quot;error-line&quot;>❌ Erro do cliente (4xx)</span><br>';
  } else if (status >= 500) {
    analysis += '<span class=&quot;error-line&quot;>❌ Erro do servidor (5xx)</span><br>';
  }
  
  if (typeof data === 'object' &amp;&amp; data !== null) {
    analysis += '<strong>Tipo:</strong> JSON<br>';
    
    if (data.error || data.erro) {
      analysis += '<span class=&quot;error-line&quot;>⚠️ Campo de erro detectado</span><br>';
    }
    
    if (data.data || data.resultado || data.result) {
      analysis += '<span class=&quot;success-line&quot;>✅ Campo de dados detectado</span><br>';
    }
    
    if (data.message || data.mensagem) {
      analysis += `<strong>Mensagem:</strong> ${data.message || data.mensagem}<br>`;
    }
    
    const keys = Object.keys(data);
    analysis += `<strong>Campos na resposta:</strong> ${keys.join(', ')}<br>`;
  } else {
    analysis += '<strong>Tipo:</strong> Texto/HTML<br>';
  }
  
  return analysis;
}

function closeApiModal() {
  document.getElementById('apiTestModal').classList.remove('open');
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}
</script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let allFiles = {};
let fileMetadata = {};
let currentFileContent = '';
let currentFileName = '';

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    allFiles = {};
    fileMetadata = {};
    
    // Extrai todos os arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        allFiles[path] = zipEntry;
        
        const ext = path.split('.').pop().toLowerCase();
        const size = zipEntry._data.uncompressedSize;
        
        fileMetadata[path] = {
          name: path.split('/').pop(),
          path: path,
          ext: ext,
          size: size,
          sizeKB: (size / 1024).toFixed(2),
          type: getFileType(ext),
          isHidden: path.includes('/.')
        };
      }
    }
    
    loadingDiv.style.display = 'none';
    displayReport();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot; style=&quot;border-left-color: #f87171;&quot;>
      <h3>❌ Erro ao processar</h3>
      <p style=&quot;color: #f87171;&quot;>${err.message}</p>
    </div>`;
  }
}

function getFileType(ext) {
  if (['js', 'jsx', 'ts', 'tsx'].includes(ext)) return 'js';
  if (['html', 'htm'].includes(ext)) return 'html';
  if (['css', 'scss', 'sass'].includes(ext)) return 'css';
  if (['json'].includes(ext)) return 'json';
  return 'other';
}

function displayReport() {
  const files = Object.values(fileMetadata);
  
  let html = `

      </div>
      
      <div class=&quot;filter-group&quot;>

          <option value=&quot;&quot;>-- Todas --</option>

          <option value=&quot;minuta&quot;>Minuta</option>
          <option value=&quot;resumo&quot;>Resumo</option>

      <div class=&quot;filter-group&quot;>
        <label>Mostrar</label>

          <label>
            <input type=&quot;checkbox&quot; id=&quot;showHidden&quot; checked onchange=&quot;filterFiles()&quot;> Ocultos

        <button class=&quot;btn btn-secondary&quot; onclick=&quot;exportReport()&quot;>📊 Exportar Relatório</button>
      </div>
    </div>
  `;
  
  // Estatísticas gerais
  html += `
    <div class=&quot;results&quot;>
      <h2>📊 Estatísticas Gerais</h2>
      <div class=&quot;stats-grid&quot;>
        <div class=&quot;stat-box&quot;>
          <strong>${files.length}</strong>
          <span>Total de Arquivos</span>
        </div>

          <strong>${files.filter(f => f.type === 'js').length}</strong>
          <span>JavaScript</span>
        </div>
