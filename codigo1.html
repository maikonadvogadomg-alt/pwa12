<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground IA — Saulo</title>
<style>
:root {
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#e2e8f0;--text2:#94a3b8;
  --accent:#a3a082;--accent2:#d4d0a8;
  --blue:#3b82f6;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;
  --border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px;}
.header-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.header-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap;}
.logo small{font-size:9px;color:var(--text2);font-weight:400;display:block;}
.title-input{background:transparent;border:1px solid transparent;color:var(--text);font-size:12px;padding:3px 7px;border-radius:6px;width:130px;}
.title-input:focus{outline:none;border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-icon{padding:5px 7px;border-radius:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;}
.btn-icon:hover{background:var(--bg3);color:var(--text);}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-mode{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;}
.btn-mode.active{background:var(--accent);color:#000;border-color:var(--accent);}
.mode-group{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:7px;border:1px solid var(--border);}

/* TABS */
.tabs-bar{display:flex;align-items:center;justify-content:space-between;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--border);}
.tabs{display:flex;gap:2px;}
.tab{padding:4px 10px;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;transition:all .15s;}
.tab.active{background:var(--bg3);color:var(--text);}
.tab-info{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700;text-transform:uppercase;}
.badge-html{background:rgba(239,68,68,.15);color:var(--red);}
.badge-react{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-python{background:rgba(251,191,36,.15);color:var(--yellow);}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}

/* EDITOR */
.editor-panel{display:flex;flex-direction:column;width:38%;border-right:1px solid var(--border);transition:width .3s;min-width:0;}
.editor-panel.hidden{display:none;}
.editor-panel.full{width:100%;}
.editor-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.editor-container{flex:1;position:relative;overflow:hidden;}
.editor-textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.6;padding:10px 10px 10px 44px;border:none;outline:none;tab-size:2;position:absolute;inset:0;}
.line-numbers{position:absolute;left:0;top:0;bottom:0;width:36px;background:rgba(30,41,59,.6);padding:10px 4px 10px 0;text-align:right;font-family:'Consolas',monospace;font-size:11px;line-height:1.6;color:var(--text2);opacity:.6;overflow:hidden;pointer-events:none;user-select:none;z-index:1;}

/* QUICK EDIT PANEL */
.quick-edit-bar{display:flex;gap:3px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;}
.quick-edit-input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:11px;flex:1;outline:none;font-family:monospace;}
.quick-edit-input:focus{border-color:var(--accent);}
.quick-edit-actions{display:flex;gap:2px;}

/* PREVIEW */
.preview-panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border);transition:all .3s;}
.preview-panel.minimized{flex:0 0 60px;}
.preview-panel.minimized .preview-frame{display:none;}
.preview-panel.minimized .preview-header{cursor:pointer;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-frame{flex:1;border:none;background:#fff;}
.preview-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;justify-content:space-between;}
.preview-header-left{display:flex;align-items:center;gap:6px;}
.preview-header-right{display:flex;gap:3px;}

/* CHAT IA */
.chat-panel{display:flex;flex-direction:column;width:300px;flex-shrink:0;}
.chat-panel.hidden{display:none;}
.chat-panel.wide{width:420px;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-header-left{display:flex;align-items:center;gap:6px;}
.chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;}
.msg{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-break:break-word;}
.msg-user{background:#1e3a8a;color:#fff;align-self:flex-end;max-width:92%;}
.msg-ai{background:#111827;border:1px solid var(--bg3);color:var(--text);align-self:flex-start;max-width:98%;white-space:pre-wrap;}
.msg-sys{background:var(--bg2);border:1px solid var(--border);color:#4b5563;font-size:10px;align-self:center;text-align:center;padding:4px 8px;border-radius:5px;}
.apply-btn{display:block;width:100%;margin-top:7px;padding:6px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;}
.apply-btn:hover{background:#16a34a;}
.chat-bottom{padding:7px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
#chatInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--text);font-size:11px;outline:none;resize:none;font-family:inherit;}
#chatInput:focus{border-color:#2563eb;}
#chatSend{background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px;}
#chatSend:hover{background:#2563eb;}
#chatSend:disabled{background:var(--bg3);cursor:not-allowed;}

/* MODAIS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:90%;max-width:460px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:12px;color:var(--accent);}
.minput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:10px;outline:none;font-family:inherit;}
.minput:focus{border-color:var(--accent);}

/* SALVOS */
.sitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;}
.sitem:hover{border-color:var(--accent);background:var(--bg3);}
.sitem-name{font-size:12px;font-weight:600;}
.sitem-meta{font-size:10px;color:var(--text2);}
.sitem-actions{display:flex;gap:2px;flex-shrink:0;}

/* FULLSCREEN EDITOR */
#fsModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;}
#fsModal.open{display:flex;}
#fsBar{background:var(--bg2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
#fsEditor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;padding:18px;font-family:'Cascadia Code','Consolas',monospace;font-size:14px;line-height:1.7;resize:none;}

/* LOADING */
.dots{display:flex;gap:4px;padding:8px 10px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:blink .8s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* STATUS */
#saveStatus{font-size:10px;color:#4ade80;}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .main{flex-direction:column;}
  .editor-panel{width:100%!important;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  .preview-panel{height:35%;}
  .chat-panel{width:100%;height:25%;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div class="logo">⚡ Playground IA<small>Saulo — Advogado</small></div>
    <div class="mode-group">
      <button class="btn-mode active" id="modeHtml" onclick="switchMode('html')">🌐 HTML</button>
      <button class="btn-mode" id="modeReact" onclick="switchMode('react')">⚛️ React</button>
      <button class="btn-mode" id="modePython" onclick="switchMode('python')">🐍 Python</button>
    </div>
    <input type="text" class="title-input" id="projectTitle" value="Sem titulo" placeholder="Nome..."/>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="importFile()" title="Abrir arquivo">📂</button>
    <button class="btn btn-primary" onclick="saveProject()">💾 Salvar</button>
    <button class="btn-icon" onclick="saveAsNew()" title="Salvar como novo">💾➕</button>
    <button class="btn-icon" onclick="openSavedModal()" title="Meus projetos">📁</button>
    <button class="btn-icon" onclick="downloadFile()" title="Baixar arquivo">⬇️</button>
    <button class="btn-icon" onclick="downloadCSV()" title="Backup em CSV">📊</button>
    <button class="btn-icon" onclick="copyCode()" title="Copiar código">📋</button>
    <button class="btn-icon" onclick="openFsEditor()" title="Ampliar editor">⛶</button>
    <button class="btn-icon" onclick="openPreviewTab()" title="Preview em nova aba">🔍</button>
    <button class="btn-icon" onclick="toggleChat()" title="Mostrar/ocultar IA" id="btnChat">🤖</button>
    <button class="btn-icon" onclick="startVoice()" title="Falar com a IA">🎙️</button>
    <button class="btn-icon" onclick="openApiModal()" title="Configurar API">🔑</button>
    <button class="btn-icon" onclick="clearCode()" title="Limpar">🗑️</button>
    <span id="saveStatus"></span>
  </div>
</header>

<!-- TABS -->
<div class="tabs-bar">
  <div class="tabs" id="tabsContainer"></div>
  <div class="tab-info">
    <span id="lineCount">1 linhas</span>
    <span class="badge badge-html" id="modeBadge">HTML</span>
    <span id="autoToggle" style="font-size:10px;color:var(--green);cursor:pointer;" onclick="toggleAuto()" title="Ligar/desligar auto-preview">⚡ AUTO: ON</span>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- EDITOR -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-wrap">
      <div class="quick-edit-bar" id="quickEditBar" style="display:none;">
        <span style="color:var(--text2);">✏️ Edição rápida:</span>
        <input type="text" class="quick-edit-input" id="quickEditInput" placeholder="Digite o que quer alterar neste trecho..."/>
        <div class="quick-edit-actions">
          <button class="btn-icon" onclick="applyQuickEdit()" title="Aplicar">✅</button>
          <button class="btn-icon" onclick="cancelQuickEdit()" title="Cancelar">✕</button>
        </div>
      </div>
      <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea class="editor-textarea" id="editor" spellcheck="false" placeholder="Cole ou importe seu código aqui..."></textarea>
      </div>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-panel" id="previewPanel">
    <div class="preview-header" onclick="togglePreviewSize()">
      <div class="preview-header-left">
        <div class="pulse"></div>
        <span style="font-size:11px;color:var(--text2);font-weight:600;">Preview ao vivo</span>
        <span style="font-size:10px;color:var(--text2);" id="previewStatus">pronto</span>
      </div>
      <div class="preview-header-right">
        <button class="btn-icon" id="previewToggleBtn" onclick="event.stopPropagation();togglePreviewSize()" title="Minimizar/Maximizar">▼</button>
      </div>
    </div>
    <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </div>

  <!-- CHAT IA -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <div class="chat-header-left">
        <span style="font-size:12px;font-weight:700;">🤖 IA do Código</span>
        <span id="modelTag" style="font-size:10px;color:#a78bfa;">Gemini</span>
      </div>
      <button class="btn-icon" onclick="toggleChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg msg-sys">IA lê o código atual. Peça qualquer alteração ou tire dúvidas.</div>
    </div>
    <div class="chat-bottom">
      <textarea id="chatInput" rows="2" placeholder="O que precisa? (Enter = enviar)" onkeydown="chatKey(event)"></textarea>
      <button id="chatSend" onclick="sendMsg()">➤</button>
    </div>
  </div>

</div>

<!-- INPUT ARQUIVO OCULTO -->
<input type="file" id="fileInput" style="display:none" accept=".html,.htm,.css,.js,.jsx,.tsx,.py,.txt,.json,.xml,.csv"/>

<!-- MODAL PROJETOS SALVOS -->
<div class="overlay" id="savedModal">
  <div class="modal">
    <h3>📁 Meus Projetos</h3>
    <input type="text" class="minput" id="searchInput" placeholder="🔍 Buscar..." oninput="renderSaved()"/>
    <div id="savedList"></div>
    <div style="text-align:right;margin-top:10px;display:flex;gap:6px;">
      <button class="btn btn-ghost" onclick="downloadAllCSV()" title="Fazer backup de todos">📊 Backup</button>
      <button class="btn btn-ghost" onclick="closeSavedModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL API KEY -->
<div class="overlay" id="apiModal">
  <div class="modal">
    <h3>🔑 Configurar IA</h3>
    <label style="font-size:11px;color:var(--text2);">Provedor</label><br>
    <select class="minput" id="apiProvider" onchange="updateModelTag()" style="margin-top:4px;">
      <option value="gemini">Google Gemini (gratuito)</option>
      <option value="openai">OpenAI GPT-4o Mini</option>
    </select>
    <label style="font-size:11px;color:var(--text2);">API Key</label><br>
    <input class="minput" type="password" id="apiKeyInput" placeholder="Cole sua chave aqui..." style="margin-top:4px;"/>
    <label style="font-size:11px;color:var(--text2);">System Prompt (comportamento da IA)</label><br>
    <textarea class="minput" id="sysPromptInput" rows="6" style="margin-top:4px;resize:vertical;"></textarea>
    <div style="display:flex;gap:6px;margin-top:4px;">
      <button class="btn btn-primary" style="flex:1" onclick="saveApiConfig()">✅ Salvar</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeApiModal()">Cancelar</button>
    </div>
    <p style="font-size:10px;color:#4b5563;margin-top:8px;">Chave salva só no seu navegador.</p>
  </div>
</div>

<!-- FULLSCREEN EDITOR -->
<div id="fsModal">
  <div id="fsBar">
    <span style="color:var(--accent);font-weight:700;font-size:13px;">⛶ Editor Ampliado</span>
    <button class="btn" style="background:#dc2626;color:#fff;" onclick="closeFsEditor()">✕ Fechar e Aplicar</button>
  </div>
  <textarea id="fsEditor" spellcheck="false"></textarea>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// CHAVES localStorage
// ═══════════════════════════════════════
const K_SNIPPETS  = 'pg_snippets_v4';
const K_AUTOSAVE  = 'pg_autosave_v4';
const K_CURRID    = 'pg_current_id_v4';
const K_APIKEY    = 'pg_apikey_v4';
const K_PROVIDER  = 'pg_provider_v4';
const K_SYSPROMPT = 'pg_sysprompt_v4';

const DEFAULT_SYSTEM = `Você é uma IA integrada a um editor de código. O usuário é Saulo, advogado de Manhumirim-MG.
REGRAS:
1. NUNCA peça desculpas ou use frases de empatia.
2. Vá direto ao ponto.
3. Ao alterar código: devolva o arquivo COMPLETO atualizado entre triple backticks.
4. Diga em uma linha o que mudou, depois o código.
5. Ao final: "Quer mais alguma alteração?"`;

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let state = {
  mode: 'html',
  activeTab: 'html',
  currentId: null,
  title: 'Sem titulo',
  html: `<div style="max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;">
  <h1 style="color:#333;">Playground IA — Saulo</h1>
  <p style="color:#666;margin:16px 0;">Importe um arquivo, cole código ou peça para a IA criar algo.</p>
  <button onclick="alert('Funcionou!')" style="padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;">Testar</button>
</div>`,
  css: '',
  js: '// JavaScript aqui\nconsole.log("Playground IA — Saulo");',
  jsx: `function App() {
  const [n, setN] = React.useState(0);
  return (
    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>
      <h1>⚛️ React Playground</h1>
      <p>Contador: <strong>{n}</strong></p>
      <button onClick={()=>setN(n+1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>+1</button>
    </div>
  );
}`,
  python: `# Python — output aparece no preview
dados = ["João Silva", "Maria Souza", "Pedro Lima"]
print("=== CLIENTES ===")
for i, nome in enumerate(dados, 1):
    print(f"{i}. {nome}")
print(f"\\nTotal: {len(dados)}")`,
};

// Carrega autosave
try {
  const sv = localStorage.getItem(K_AUTOSAVE);
  if (sv) Object.assign(state, JSON.parse(sv));
} catch(e){}

state.currentId = localStorage.getItem(K_CURRID) || null;

let apiKey    = localStorage.getItem(K_APIKEY)    || '';
let provider  = localStorage.getItem(K_PROVIDER)  || 'gemini';
let sysPrompt = localStorage.getItem(K_SYSPROMPT) || DEFAULT_SYSTEM;
let autoPreview = true;
let previewTimer = null;
let previewMinimized = false;
let quickEditMode = false;
let quickEditSelection = null;

// ═══════════════════════════════════════
// DOM
// ═══════════════════════════════════════
const editor       = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers  = document.getElementById('lineNumbers');
const titleInput   = document.getElementById('projectTitle');

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ═══════════════════════════════════════
// EVENTOS DO EDITOR
// ═══════════════════════════════════════
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  if (autoPreview) {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 500);
  }
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveCurrentTab();
  }
  // Ctrl+Q para edição rápida
  if ((e.ctrlKey||e.metaKey) && e.key === 'q') {
    e.preventDefault();
    startQuickEdit();
  }
});

editor.addEventListener('paste', () => {
  setTimeout(() => {
    const c = editor.value;
    if (state.mode === 'html') {
      if (/import\s+React|from\s+['"]react['"]|useState|<[A-Z][a-zA-Z]*[\s/>]/.test(c)) {
        switchMode('react'); state.jsx = c; loadEditorContent(); showToast('⚛️ React detectado!'); return;
      }
      if (/^(def |class |import |from |print\()/im.test(c) && !c.includes('<')) {
        switchMode('python'); state.python = c; loadEditorContent(); showToast('🐍 Python detectado!'); return;
      }
    }
    saveCurrentTab(); updatePreview();
  }, 50);
});

// Clique duplo para edição rápida
editor.addEventListener('dblclick', () => {
  startQuickEdit();
});

titleInput.addEventListener('input', () => { state.title = titleInput.value; autoSave(); });

// ═══════════════════════════════════════
// EDITOR — FUNÇÕES
// ═══════════════════════════════════════
function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  document.getElementById('lineCount').textContent = lines + ' linhas';
  lineNumbers.textContent = Array.from({length:lines},(_,i)=>i+1).join('\n');
}

function saveCurrentTab() {
  const t = state.activeTab;
  if (state.mode==='react'&&t==='jsx') state.jsx=editor.value;
  else if (state.mode==='python'&&t==='python') state.python=editor.value;
  else if (t==='html') state.html=editor.value;
  else if (t==='css')  state.css=editor.value;
  else if (t==='js')   state.js=editor.value;
}

function loadEditorContent() {
  const t = state.activeTab;
  if (state.mode==='react'&&t==='jsx') editor.value=state.jsx;
  else if (state.mode==='python'&&t==='python') editor.value=state.python;
  else if (t==='html') editor.value=state.html;
  else if (t==='css')  editor.value=state.css;
  else if (t==='js')   editor.value=state.js;
  else editor.value='';
  updateLineNumbers();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const el = document.getElementById('tab_'+tab);
  if (el) el.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const c = document.getElementById('tabsContainer');
  const b = document.getElementById('modeBadge');
  if (state.mode==='html') {
    c.innerHTML = `
      <button class="tab ${state.activeTab==='html'?'active':''}" id="tab_html" onclick="switchTab('html')">📄 HTML</button>
      <button class="tab ${state.activeTab==='css'?'active':''}" id="tab_css" onclick="switchTab('css')">🎨 CSS</button>
      <button class="tab ${state.activeTab==='js'?'active':''}" id="tab_js" onclick="switchTab('js')">⚙️ JS</button>`;
    b.className='badge badge-html'; b.textContent='HTML';
  } else if (state.mode==='react') {
    c.innerHTML = `
      <button class="tab ${state.activeTab==='jsx'?'active':''}" id="tab_jsx" onclick="switchTab('jsx')">⚛️ JSX</button>
      <button class="tab ${state.activeTab==='css'?'active':''}" id="tab_css" onclick="switchTab('css')">🎨 CSS</button>`;
    b.className='badge badge-react'; b.textContent='REACT';
  } else {
    c.innerHTML = `<button class="tab active" id="tab_python" onclick="switchTab('python')">🐍 Python</button>`;
    b.className='badge badge-python'; b.textContent='PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  document.querySelectorAll('.btn-mode').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('active');
  if (mode==='html') state.activeTab='html';
  else if (mode==='react') state.activeTab='jsx';
  else state.activeTab='python';
  updateTabs(); loadEditorContent(); updatePreview(); autoSave();
}

// ═══════════════════════════════════════
// EDIÇÃO RÁPIDA
// ═══════════════════════════════════════
function startQuickEdit() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  
  if (start === end) {
    showToast('⚠️ Selecione um trecho para editar');
    return;
  }
  
  quickEditSelection = { start, end };
  quickEditMode = true;
  document.getElementById('quickEditBar').style.display = 'flex';
  document.getElementById('quickEditInput').focus();
  showToast('✏️ Modo edição rápida ativado');
}

function applyQuickEdit() {
  if (!quickEditSelection) return;
  
  const instruction = document.getElementById('quickEditInput').value.trim();
  if (!instruction) {
    showToast('⚠️ Digite uma instrução');
    return;
  }
  
  const selectedText = editor.value.substring(quickEditSelection.start, quickEditSelection.end);
  const before = editor.value.substring(0, quickEditSelection.start);
  const after = editor.value.substring(quickEditSelection.end);
  
  // Aqui você pode chamar a IA para alterar o trecho
  // Por enquanto, vou fazer uma alteração simples como exemplo
  const modified = `/* ${instruction} */\n${selectedText}`;
  
  editor.value = before + modified + after;
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  updatePreview();
  
  cancelQuickEdit();
  showToast('✅ Trecho atualizado!');
}

function cancelQuickEdit() {
  quickEditMode = false;
  quickEditSelection = null;
  document.getElementById('quickEditBar').style.display = 'none';
  document.getElementById('quickEditInput').value = '';
  editor.focus();
}

function buildDocument() {
  if (state.mode==='react') {
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
<style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif}${state.css}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
${state.jsx}
try{ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}
catch(e){document.getElementById('root').innerHTML='<div style="color:red;padding:20px;font-family:monospace">Erro: '+e.message+'</div>'}
<\/script></body></html>`;
  }
  if (state.mode==='python') {
    const esc = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px}#out{white-space:pre-wrap;font-size:13px;line-height:1.6}.ok{color:#4ade80}.err{color:#f87171}.ld{color:#60a5fa}</style>
</head><body><div id="out"><span class="ld">⟳ Carregando Python...</span></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"><\/script>
<script>
async function run(){
  const out=document.getElementById('out');
  try{
    const py=await loadPyodide();
    py.runPython('import sys\\nfrom io import StringIO\\nsys.stdout=StringIO()');
    py.runPython(\`${esc}\`);
    const r=py.runPython('sys.stdout.getvalue()');
    out.innerHTML='<span class="ok">$ python3</span>\\n'+r;
  }catch(e){out.innerHTML='<span class="err">Erro: '+e.message+'</span>';}
}run();
<\/script></body></html>`;
  }
  const lower = state.html.trim().toLowerCase();
  if (lower.includes('<!doctype')||(lower.includes('<html')&&lower.includes('</html>'))) return state.html;
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

}

function updatePreview() {
  document.getElementById('previewStatus').textContent = 'atualizando...';
  const blob = new Blob([buildDocument()],{type:'text/html;charset=utf-8'});

  setTimeout(()=>{URL.revokeObjectURL(url); document.getElementById('previewStatus').textContent='ao vivo ✓';},3000);

function toggleAuto() {

// SALVAR / ABRIR PROJETOS
// ═══════════════════════════════════════
function getSnippets() {
  try { return JSON.parse(localStorage.getItem(K_SNIPPETS)||'[]'); } catch { return []; }
}
function setSnippets(list) {
  localStorage.setItem(K_SNIPPETS, JSON.stringify(list));
}

function saveProject() {
  saveCurrentTab();
  const snippets = getSnippets();
  const now = new Date().toISOString();
  let id = state.currentId;

  if (!id) {
    id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    state.currentId = id;
    localStorage.setItem(K_CURRID, id);
  }

  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    activeTab: state.activeTab,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    updatedAt: now
  };

  const idx = snippets.findIndex(s=>s.id===id);
  if (idx>=0) {
    item.createdAt = snippets[idx].createdAt || snippets[idx].updatedAt || now;
    snippets[idx] = item;
    showToast('💾 Projeto atualizado!');
  } else {
    item.createdAt = now;
    snippets.unshift(item);
    showToast('💾 Projeto salvo!');
  }

  setSnippets(snippets);
  autoSave();
}

function saveAsNew() {
  state.currentId = null;
  localStorage.removeItem(K_CURRID);
  saveProject();
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  document.getElementById('searchInput').value='';
  renderSaved();
}
function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSaved() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = getSnippets().filter(s=>s.title.toLowerCase().includes(q));
  const c = document.getElementById('savedList');
  if (!list.length) {
    c.innerHTML='<p style="text-align:center;color:var(--text2);font-size:12px;padding:20px;">Nenhum projeto salvo ainda.<br>Clique em 💾 Salvar para guardar o atual.</p>';
    return;
  }
  c.innerHTML = list.map(s=>`
    <div class="sitem" onclick="loadProject('${s.id}')">
      <div>
        <div class="sitem-name">${esc(s.title)}</div>
        <div class="sitem-meta">${s.mode||'html'} • ${fmtDate(s.updatedAt||s.createdAt)}</div>
      </div>
      <div class="sitem-actions">
        <button class="btn-icon" onclick="event.stopPropagation();renameProject('${s.id}')" title="Renomear">✏️</button>
        <button class="btn-icon" onclick="event.stopPropagation();deleteProject('${s.id}')" title="Excluir">🗑️</button>
      </div>
    </div>`).join('');
}

function loadProject(id) {
  const s = getSnippets().find(x=>x.id===id);
  if (!s) return;

  state.currentId = s.id;
  localStorage.setItem(K_CURRID, s.id);

  state.title   = s.title   || 'Sem titulo';
  state.mode    = s.mode    || 'html';
  state.activeTab = s.activeTab || (s.mode==='react'?'jsx':s.mode==='python'?'python':'html');
  state.html    = s.html    || '';
  state.css     = s.css     || '';
  state.js      = s.js      || '';
  state.jsx     = s.jsx     || '';
  state.python  = s.python  || '';

  titleInput.value = state.title;

  document.querySelectorAll('.btn-mode').forEach(b=>b.classList.remove('active'));
  const mb = document.getElementById('mode'+state.mode.charAt(0).toUpperCase()+state.mode.slice(1));
  if (mb) mb.classList.add('active');

  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
  closeSavedModal();
  showToast('📂 "'+state.title+'" aberto!');
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  setSnippets(getSnippets().filter(s=>s.id!==id));
  if (state.currentId===id) { state.currentId=null; localStorage.removeItem(K_CURRID); }
  renderSaved();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const list = getSnippets();
  const s = list.find(x=>x.id===id);
  if (!s) return;
  const n = prompt('Novo nome:', s.title);
  if (n&&n.trim()) {
    s.title=n.trim();
    if (state.currentId===id) { state.title=s.title; titleInput.value=s.title; }
    setSnippets(list); renderSaved(); showToast('✏️ Renomeado!');
  }
}

  if (!snippets.length) {
    showToast('⚠️ Nenhum projeto para fazer backup');
    return;
  }
  
  let csv = 'id;title;html;css;js;mode\n';
  
  snippets.forEach(s => {

    const title = esc(s.title||'Sem titulo');
    const html = esc(s.html||'');
    const css = esc(s.css||'');
    const js = esc(s.js||'');
    const mode = esc(s.mode||'html');
    
    csv += `"${id}";"${title}";"${html}";"${css}";"${js}";"${mode}"\n`;
  });
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});

  URL.revokeObjectURL(link.href);
  
  showToast('📊 Backup em CSV realizado!');
}

function importFile() { document.getElementById('fileInput').click(); }

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='csv') {
      // Importar CSV
      importCSV(content);
      return;
    }

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 "'+file.name+'" importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function importCSV(csvContent) {
  try {
    const lines = csvContent.trim().split('\n');
    if (lines.length < 2) {
      showToast('⚠️ CSV inválido');
      return;
    }
    
    const snippets = getSnippets();
    let imported = 0;
    
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      const parts = parseCSVLine(line);
      
      if (parts.length >= 6) {
        const item = {
          id: parts[0],
          title: parts[1],
          html: parts[2],
          css: parts[3],
          js: parts[4],
          mode: parts[5],
          jsx: '',
          python: '',
          activeTab: 'html',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        
        const idx = snippets.findIndex(s => s.id === item.id);
        if (idx >= 0) {
          snippets[idx] = item;
        } else {
          snippets.push(item);
        }
        imported++;
      }
    }
    
    setSnippets(snippets);
    showToast(`✅ ${imported} projeto(s) importado(s)!`);
  } catch (err) {
    showToast('❌ Erro ao importar CSV: ' + err.message);
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ';' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  
  result.push(current);
  return result;
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}
  else if (state.mode==='react'){content=state.jsx;ext='jsx';mime='text/plain';}
  else {content=buildDocument();ext='html';mime='text/html';}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=(state.title||'playground')+'.'+ext;
  a.click(); URL.revokeObjectURL(a.href);
  showToast('⬇️ Baixado!');
}

function toggleChat() {

  p.classList.toggle('hidden');
  document.getElementById('btnChat').style.color = p.classList.contains('hidden') ? 'var(--text2)' : 'var(--green)';

function chatKey(e) {
  if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addMsg(role, text, code) {
  const box = document.getElementById('chatMessages');
  const d = document.createElement('div');
  d.className = 'msg msg-'+role;
  d.textContent = text;
  if (code && role==='ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor + atualizar preview';
    btn.onclick = () => {
      if (state.mode==='react') { state.jsx=code; state.activeTab='jsx'; }
      else if (state.mode==='python') { state.python=code; state.activeTab='python'; }
      else { state.html=code; state.css=''; state.js=''; state.activeTab='html'; }
      updateTabs(); loadEditorContent(); updateLineNumbers(); autoSave(); updatePreview();
      addMsg('sys','✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showDots() {
  const box=document.getElementById('chatMessages');
  const d=document.createElement('div');
  d.id='ldots'; d.className='dots';
  d.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function hideDots() { const el=document.getElementById('ldots'); if(el)el.remove(); }

async function sendMsg() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  if (!apiKey) { openApiModal(); showToast('🔑 Configure a API Key primeiro.'); return; }

  inp.value='';
  document.getElementById('chatSend').disabled=true;
  addMsg('user', text);

  const code = buildDocument();
  const fullMsg = `${sysPrompt}

MODO: ${state.mode} | ARQUIVO: ${state.title}

CÓDIGO ATUAL NO EDITOR:
\`\`\`${state.mode==='python'?'python':state.mode==='react'?'jsx':'html'}
${code.substring(0,12000)}
\`\`\`

PEDIDO:
${text}`;

  showDots();
  try {
    const reply = provider==='gemini' ? await callGemini(fullMsg) : await callOpenAI(fullMsg);
    hideDots();
    const match = reply.match(/```(?:html|js|javascript|jsx|tsx|css|python|py)?\n?([\s\S]*?)```/);
    addMsg('ai', reply, match ? match[1].trim() : null);
  } catch(err) {
    hideDots();
    addMsg('sys','❌ '+err.message);
  }
  document.getElementById('chatSend').disabled=false;
}

async function callGemini(msg) {
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    contents:[{role:'user',parts:[{text:msg}]}],
    generationConfig:{temperature:0.2,maxOutputTokens:8192}
  })});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro Gemini');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

async function callOpenAI(msg) {
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:msg}],temperature:0.2,max_tokens:8192})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro OpenAI');}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'Sem resposta.';
}

// ═══════════════════════════════════════
// VOZ
// ═══════════════════════════════════════
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('🎙️ Navegador não suporta voz. Use Chrome.'); return; }

  const p = document.getElementById('chatPanel');
  if (p.classList.contains('hidden')) toggleChat();

  const rec = new SR();
  rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;

  showToast('🎙️ Fale agora...');

  rec.onresult = e => {
    const txt = e.results[0][0].transcript;
    document.getElementById('chatInput').value = txt;
    showToast('🎙️ Capturado: "'+txt+'"');
  };
  rec.onerror = e => showToast('Erro no microfone: '+e.error);
  rec.start();
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function esc(s) { 
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'\\r')
    .replace(/\t/g,'\\t');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; 
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Fecha modais clicando fora
['savedModal','apiModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id===id) document.getElementById(id).classList.remove('open');
  });
});

// Atalhos de teclado
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey)&&e.key==='s'){
    e.preventDefault();
    saveProject();
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    e.preventDefault();
    updatePreview();
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='q'){
    e.preventDefault();
    startQuickEdit();
  }
});
</script>
