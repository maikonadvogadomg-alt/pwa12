<script>
const LS_KEY = 'multiprojetos-v2';
const TOTAL = 5;

// ========== STORAGE ==========
function salvarProjetos() {
  const data = {};
  for (let n = 1; n <= TOTAL; n++) {
    data['p'+n] = {
      nome: document.getElementById('nome'+n).value,
      codigo: document.getElementById('codigo'+n).value
    };
  }
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  mostrarToast('💾 Salvo automaticamente!');
  renderizarSalvos();
}

function carregarProjetos() {
  try {
    const data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    for (let n = 1; n <= TOTAL; n++) {
      if (data['p'+n]) {
        document.getElementById('nome'+n).value = data['p'+n].nome || '';
        document.getElementById('codigo'+n).value = data['p'+n].codigo || '';
      }
    }
    renderizarSalvos();
  } catch(e) {}
}

function renderizarSalvos() {
  const data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  const container = document.getElementById('projetosSalvos');
  const emojis = ['🔷','🔶','🔸','🟢','🟣'];

  const projetos = [];
  for (let n = 1; n <= TOTAL; n++) {
    if (data['p'+n] &amp;&amp; data['p'+n].codigo &amp;&amp; data['p'+n].codigo.trim()) {
      projetos.push({ n, nome: data['p'+n].nome, codigo: data['p'+n].codigo, emoji: emojis[n-1] });
    }
  }

  if (projetos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;&quot;>Nenhum projeto salvo ainda.</p>';
    return;
  }

  container.innerHTML = projetos.map(p => `
    <div class=&quot;project-card&quot;>
      <h3>${p.emoji} ${escHtml(p.nome || 'Projeto ' + p.n)}</h3>
      <div style=&quot;font-size:11px;color:var(--text2);&quot;>${p.codigo.length.toLocaleString()} caracteres</div>
      <div class=&quot;actions&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;testarProjeto(${p.n})&quot;>👁️ Testar</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarCodigo(${p.n})&quot;>📋 Copiar</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;limparProjeto(${p.n})&quot;>🗑️ Limpar</button>
      </div>
    </div>
  `).join('');
}

// ========== AÇÕES ==========
function testarProjeto(n) {
  const codigo = document.getElementById('codigo'+n).value;
  if (!codigo.trim()) { mostrarToast('❌ Projeto ' + n + ' está vazio!'); return; }
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function limparProjeto(n) {
  if (!confirm('Limpar projeto ' + n + '?')) return;
  document.getElementById('nome'+n).value = '';
  document.getElementById('codigo'+n).value = '';
  salvarProjetos();
}

function copiarCodigo(n) {
  navigator.clipboard.writeText(document.getElementById('codigo'+n).value);
  mostrarToast('📋 Código copiado!');
}

function importarArquivo(n) {
  document.getElementById('fileInput'+n).click();
}

for (let n = 1; n <= TOTAL; n++) {
  (function(num) {
    document.getElementById('fileInput'+num).addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('codigo'+num).value = ev.target.result;
        if (!document.getElementById('nome'+num).value) {
          document.getElementById('nome'+num).value = file.name.replace(/\.[^.]+$/, '');
        }
        salvarProjetos();
        mostrarToast('📂 Projeto ' + num + ' importado!');
      };
      reader.readAsText(file);
      e.target.value = '';
    });
  })(n);
}

// ========== GERAR HTML FINAL (NAVEGAÇÃO MELHORADA) ==========
function gerarHtmlFinal() {
  const emojis = ['🔷','🔶','🔸','🟢','🟣'];
  const projetos = [];
  for (let n = 1; n <= TOTAL; n++) {
    const nome = document.getElementById('nome'+n).value || 'Projeto ' + n;
    const codigo = document.getElementById('codigo'+n).value;
    if (codigo.trim()) projetos.push({ nome, codigo, emoji: emojis[n-1] });
  }

  if (projetos.length === 0) {
    mostrarToast('❌ Adicione pelo menos um projeto!');
    return;
  }

  // Calcula altura da nav baseado na quantidade de projetos
  const navAltura = projetos.length > 3 ? '110px' : '65px';

  const botoesNav = projetos.map((p, i) =>
    `<button class=&quot;nav-btn ${i===0?'active':''}&quot; onclick=&quot;trocar(${i})&quot;>${p.emoji} ${p.nome}</button>`
  ).join('\n  ');

  const iframes = projetos.map((p, i) => {
    const escapado = p.codigo.replace(/&amp;/g,'&amp;amp;').replace(/&quot;/g,'&amp;quot;');
    return `<div class=&quot;projeto ${i===0?'ativo':''}&quot; id=&quot;p${i}&quot;><iframe srcdoc=&quot;${escapado}&quot; sandbox=&quot;allow-scripts allow-same-origin allow-forms allow-modals allow-popups&quot;></iframe></div>`;
  }).join('\n');

  const htmlFinal = `<!DOCTYPE html>

  document.getElementById('p'+i).classList.add('ativo');

  URL.revokeObjectURL(url);

// ========== BACKUP ==========
function exportarBackup() {
  const data = localStorage.getItem(LS_KEY);
  if (!data) { mostrarToast('❌ Nada para exportar!'); return; }
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-projetos-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('💾 Backup exportado!');
}

function importarBackup() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      localStorage.setItem(LS_KEY, ev.target.result);
      carregarProjetos();
      mostrarToast('📂 Backup importado com sucesso!');
    } catch(err) {
      mostrarToast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(function() {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

// Auto-save com debounce

  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-success { background: var(--green); color: #000; }
.btn-success:hover { opacity: 0.9; }
.btn-danger { background: rgba(248,113,113,0.2); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 10px; }

.input, .textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  margin-bottom: 12px;
}

.input:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.textarea {
  font-family: 'Consolas', 'Fira Code', monospace;
  min-height: 200px;
  resize: vertical;
  line-height: 1.6;
}

.code-display {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Consolas', monospace;
  font-size: 11px;
  line-height: 1.6;
  overflow-x: auto;
  max-height: 400px;
  overflow-y: auto;
}

.split-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 1024px) {
  .split-view { grid-template-columns: 1fr; }
}

.preview-frame {
  width: 100%;
  height: 500px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
}

.status {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-info { background: rgba(96,165,250,0.1); color: var(--blue); border: 1px solid rgba(96,165,250,0.2); }
.status-success { background: rgba(74,222,128,0.1); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
.status-warning { background: rgba(251,191,36,0.1); color: var(--yellow); border: 1px solid rgba(251,191,36,0.2); }

.file-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s;
}

.file-item:hover {
  border-color: var(--accent);
  background: var(--bg2);
}

.tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tag-html { background: rgba(239,68,68,0.2); color: var(--red); }
.tag-css { background: rgba(59,130,246,0.2); color: var(--blue); }
.tag-js { background: rgba(251,191,36,0.2); color: var(--yellow); }
.tag-func { background: rgba(74,222,128,0.2); color: var(--green); }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--bg2);
  border: 2px solid var(--accent);
  border-radius: 10px;
  padding: 14px 20px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
  z-index: 2000;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.action-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
</style>
</head>
<body>

      <button class=&quot;btn btn-ghost&quot; onclick=&quot;selecionarTodos()&quot;>✅ Selecionar Todos</button>

  </div>

      <button class=&quot;btn btn-ghost&quot; onclick=&quot;importarTudo()&quot;>📤 Importar Backup</button>

  </div>

<!-- Hidden inputs -->
<input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display:none&quot; accept=&quot;.html,.htm,.js,.css,.txt&quot; />
<input type=&quot;file&quot; id=&quot;backupInput&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; />

<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
// ========== STORAGE ==========
const LS_MODULOS = 'workstation-modulos-v1';
const LS_SELECTED = 'workstation-selected-v1';

function getModulos() {
  try { return JSON.parse(localStorage.getItem(LS_MODULOS) || '[]'); }
  catch { return []; }
}

function setModulos(list) {
  localStorage.setItem(LS_MODULOS, JSON.stringify(list));
  atualizarContador();
}

function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); }
  catch { return []; }
}

function setSelected(list) {
  localStorage.setItem(LS_SELECTED, JSON.stringify(list));
}

// ========== NAVEGAÇÃO ==========
function trocarAba(nome) {
  // Esconde todas
  document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  
  // Mostra a selecionada
  document.getElementById('ws-' + nome).classList.add('active');
  event.target.classList.add('active');
  
  // Atualiza conteúdo
  if (nome === 'montador') renderModulos();
  if (nome === 'arquivos') renderArquivos();
}

// ========== SCANNER ==========
function analisarCodigo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo),
    elementos: extrairElementos(codigo),
    scripts: extrairScripts(codigo)
  };

  renderAnalise(analise);
}

function extrairFuncoes(codigo) {
  const regex = /function\s+(\w+)\s*\([^)]*\)\s*\{/g;
  const funcoes = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    const inicio = match.index;
    const fim = encontrarFimFuncao(codigo, inicio);
    funcoes.push({
      nome: match[1],
      codigo: codigo.substring(inicio, fim)
    });
  }
  return funcoes;
}

function encontrarFimFuncao(codigo, inicio) {
  let nivel = 0;
  for (let i = inicio; i < codigo.length; i++) {
    if (codigo[i] === '{') nivel++;
    if (codigo[i] === '}') {
      nivel--;
      if (nivel === 0) return i + 1;
    }
  }
  return codigo.length;
}

function extrairEstilos(codigo) {
  const regex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  const estilos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    estilos.push(match[1].trim());
  }
  return estilos;
}

function extrairElementos(codigo) {
  const regex = /<(\w+)[^>]*id=[&quot;']([^&quot;']+)[&quot;'][^>]*>/g;
  const elementos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    elementos.push({ tag: match[1], id: match[2] });
  }
  return elementos;
}

function extrairScripts(codigo) {
  const regex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const scripts = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    scripts.push(match[1].trim());
  }
  return scripts;
}

function renderAnalise(analise) {
  const container = document.getElementById('scannerResults');
  
  let html = '';
  
  // Funções
  if (analise.funcoes.length > 0) {
    html += `
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-header&quot;>
          <div class=&quot;panel-title&quot;>🔧 Funções Encontradas (${analise.funcoes.length})</div>
        </div>
        ${analise.funcoes.map((f, i) => `
          <div class=&quot;file-item&quot;>
            <div>
              <strong style=&quot;color:var(--green);&quot;>${escHtml(f.nome)}()</strong>
              <span class=&quot;tag tag-func&quot;>função</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;verCodigo(${i}, 'funcao')&quot;>👁️</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground('${escHtml(f.codigo).replace(/'/g, &quot;\\'&quot;)}')&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('${escHtml(f.nome)}', 'funcao', \`${f.codigo.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  // Estilos
  if (analise.estilos.length > 0) {
    html += `
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-header&quot;>
          <div class=&quot;panel-title&quot;>💅 Estilos CSS (${analise.estilos.length})</div>
        </div>
        ${analise.estilos.map((css, i) => `
          <div class=&quot;file-item&quot;>
            <div>
              <strong style=&quot;color:var(--blue);&quot;>Bloco CSS ${i + 1}</strong>
              <span class=&quot;tag tag-css&quot;>css</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${css.replace(/`/g, '\\`')}\`)&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('CSS_${i + 1}', 'css', \`${css.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  container.innerHTML = html || '<div class=&quot;status status-warning&quot;>⚠️ Nenhum elemento extraível encontrado</div>';
  toast('✅ Análise concluída!');
}

function extrairTudo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo)
  };

  let contador = 0;
  
  analise.funcoes.forEach(f => {
    salvarComoModulo(f.nome, 'funcao', f.codigo);
    contador++;
  });
  
  analise.estilos.forEach((css, i) => {
    salvarComoModulo(`CSS_${i + 1}`, 'css', css);
    contador++;
  });

  toast(`✅ ${contador} módulos extraídos e salvos!`);
  renderModulos();
}

function copiarParaPlayground(codigo) {
  document.getElementById('playgroundCode').value = codigo;
  trocarAba('playground');
  document.querySelectorAll('.nav-tab')[2].classList.add('active');
  toast('✅ Código copiado para o Playground!');
}

function salvarComoModulo(nome, tipo, codigo) {
  const modulos = getModulos();
  modulos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    nome,
    tipo,
    codigo,
    data: new Date().toISOString()
  });
  setModulos(modulos);
}

// ========== MONTADOR ==========
function salvarModulo() {
  const nome = document.getElementById('modNome').value.trim();
  const tipo = document.getElementById('modTipo').value;
  const codigo = document.getElementById('modCodigo').value;

  if (!nome || !codigo.trim()) {
    toast('❌ Preencha nome e código!');
    return;
  }

  salvarComoModulo(nome, tipo, codigo);
  limparModulo();
  renderModulos();
  toast('✅ Módulo salvo!');
}

function limparModulo() {
  document.getElementById('modNome').value = '';
  document.getElementById('modCodigo').value = '';
}

function renderModulos() {
  const modulos = getModulos();
  const selected = getSelected();
  const container = document.getElementById('modulosList');
  const checklist = document.getElementById('montadorChecklist');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;text-align:center;padding:20px;&quot;>Nenhum módulo salvo</p>';
    if (checklist) checklist.innerHTML = '';
    return;
  }

  // Lista de módulos
  container.innerHTML = modulos.slice(-10).reverse().map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editarModulo('${m.id}')&quot;>✏️</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');

  // Checklist para montagem
  if (checklist) {
    checklist.innerHTML = '<div style=&quot;max-height:300px;overflow-y:auto;&quot;>' + modulos.map(m => `
      <label style=&quot;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border);&quot;>
        <input type=&quot;checkbox&quot; ${selected.includes(m.id) ? 'checked' : ''} onchange=&quot;toggleModulo('${m.id}')&quot; />
        <strong style=&quot;font-size:12px;&quot;>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </label>
    `).join('') + '</div>';
  }
}

function toggleModulo(id) {
  let selected = getSelected();
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    selected.push(id);
  }
  setSelected(selected);
}

function selecionarTodos() {
  setSelected(getModulos().map(m => m.id));
  renderModulos();
}

function desselecionarTodos() {
  setSelected([]);
  renderModulos();
}

function deletarModulo(id) {
  if (!confirm('Deletar este módulo?')) return;
  setModulos(getModulos().filter(m => m.id !== id));
  renderModulos();
  toast('🗑️ Módulo deletado!');
}

function editarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  document.getElementById('modNome').value = modulo.nome;
  document.getElementById('modTipo').value = modulo.tipo;
  document.getElementById('modCodigo').value = modulo.codigo;
  
  deletarModulo(id);
  toast('✏️ Editando módulo...');
}

function gerarProjetoFinal() {
  const modulos = getModulos();
  const selected = getSelected();
  const escolhidos = modulos.filter(m => selected.includes(m.id));

  if (escolhidos.length === 0) {
    toast('❌ Selecione pelo menos um módulo!');
    return;
  }

  const nome = document.getElementById('projetoNome').value || 'Projeto';
  
  const html = escolhidos.filter(m => m.tipo === 'html').map(m => m.codigo).join('\n\n');
  const css = escolhidos.filter(m => m.tipo === 'css').map(m => m.codigo).join('\n\n');
  const js = escolhidos.filter(m => m.tipo === 'js' || m.tipo === 'funcao').map(m => m.codigo).join('\n\n');

  const projeto = `<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>${escHtml(nome)}</title>
<style>
${css}
</style>
</head>
<body>

${html}

<script>
${js}
<\/script>
</body>
</html>`;

  baixarArquivo(projeto, nome.replace(/[^a-z0-9]/gi, '_') + '.html', 'text/html');
  toast('✅ Projeto gerado!');
}

// ========== PLAYGROUND ==========
function executarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  const iframe = document.getElementById('playgroundPreview');
  
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  iframe.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  
  toast('▶️ Executando...');
}

function salvarDePlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  if (!codigo.trim()) {
    toast('❌ Nada para salvar!');
    return;
  }
  
  const nome = prompt('Nome do módulo:');
  if (!nome) return;
  
  salvarComoModulo(nome, 'html', codigo);
  toast('✅ Salvo como módulo!');
}

function copiarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  navigator.clipboard.writeText(codigo);
  toast('📋 Código copiado!');
}

function abrirPreviewNovo() {
  const codigo = document.getElementById('playgroundCode').value;
  const blob = new Blob([codigo], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function limparPlayground() {
  document.getElementById('playgroundCode').value = '';
  document.getElementById('playgroundPreview').src = '';
}

// ========== ARQUIVOS ==========
function renderArquivos() {
  const modulos = getModulos();
  const container = document.getElementById('arquivosList');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);text-align:center;padding:40px;&quot;>Nenhum arquivo salvo</p>';
    return;
  }

  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
        <span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;>${new Date(m.data).toLocaleDateString('pt-BR')}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}'); renderArquivos();&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filtrarArquivos(busca) {
  const modulos = getModulos().filter(m => 
    m.nome.toLowerCase().includes(busca.toLowerCase())
  );
  
  const container = document.getElementById('arquivosList');
  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
      </div>
    </div>
  `).join('');
}

function baixarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  const ext = { html: '.html', css: '.css', js: '.js', funcao: '.js' }[modulo.tipo] || '.txt';
  baixarArquivo(modulo.codigo, modulo.nome + ext, 'text/plain');
}

function exportarTudo() {
  const data = {
    modulos: getModulos(),
    selected: getSelected(),
    data: new Date().toISOString()
  };
  
  baixarArquivo(JSON.stringify(data, null, 2), 'backup-workstation-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  toast('💾 Backup exportado!');
}

function importarTudo() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modulos) {
        setModulos(data.modulos);
        if (data.selected) setSelected(data.selected);
        toast('✅ Backup importado!');
        renderModulos();
        renderArquivos();
      }
    } catch (err) {
      toast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function limparTudo() {
  if (!confirm('⚠️ ATENÇÃO: Isso vai apagar TUDO! Tem certeza?')) return;
  if (!confirm('Última chance! Realmente deseja apagar tudo?')) return;
  
  localStorage.clear();
  toast('🗑️ Tudo limpo!');
  renderModulos();
  renderArquivos();
}

// ========== IMPORT ==========
function importarParaScanner() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('scannerInput').value = ev.target.result;
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function importarParaPlayground() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('playgroundCode').value = ev.target.result;
      executarPlayground();
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function limparScanner() {
  document.getElementById('scannerInput').value = '';
  document.getElementById('scannerResults').innerHTML = '';
}

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;/g, '&amp;amp;').replace(/</g, '&amp;lt;').replace(/>/g, '&amp;gt;').replace(/&quot;/g, '&amp;quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

function atualizarContador() {
  const count = getModulos().length;
  const el = document.getElementById('modCount');
  if (el) el.textContent = count;
}

// Init
atualizarContador();
renderModulos();
</script>
</body>

        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;openFullPreview()&quot;>🔳 Tela Cheia</button>
      </div>
    </div>
    <iframe class=&quot;preview-frame&quot; id=&quot;previewFrame&quot;></iframe>
  </div>

  <!-- Section: Guide -->
  <div id=&quot;section-guide&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;>
    <h2>📖 Guia — Como Montar seu PWA</h2>
    
    <div class=&quot;status status-info&quot; style=&quot;margin-top:12px;&quot;>
      🎯 <strong>Estratégia:</strong> Em vez de tentar fazer tudo de uma vez, vamos por partes. 
      Cada funcionalidade vira um &quot;módulo&quot; independente. Depois juntamos.
    </div>
    
    <div class=&quot;section-title&quot;>Passo a Passo</div>
    <ol style=&quot;font-size:12px;line-height:2;padding-left:20px;color:var(--text2);&quot;>
      <li><strong style=&quot;color:var(--text)&quot;>Separe os códigos por função</strong> — cada pedaço faz UMA coisa (importar PDF, gerar documento, salvar dados...)</li>
      <li><strong style=&quot;color:var(--text)&quot;>Cole cada pedaço como módulo</strong> — use a aba &quot;Adicionar Módulo&quot; e dê nome descritivo</li>
      <li><strong style=&quot;color:var(--text)&quot;>Teste individual</strong> — na aba Preview, veja se cada módulo funciona sozinho</li>
      <li><strong style=&quot;color:var(--text)&quot;>Monte o projeto</strong> — na aba &quot;Montar&quot;, selecione os módulos e gere o HTML final</li>
      <li><strong style=&quot;color:var(--text)&quot;>Ajuste conflitos</strong> — se algo quebrar, traga aqui que te ajudo a resolver</li>
    </ol>
    
    <div class=&quot;section-title&quot;>Tipos de Módulo</div>
    <table style=&quot;width:100%;font-size:11px;border-collapse:collapse;&quot;>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--blue);&quot;>🔧 Função/Lógica</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Código JavaScript puro (funções, cálculos, processamento de dados)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--green);&quot;>🎨 Visual/Interface</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>HTML + CSS (botões, formulários, layout, cards)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--accent);&quot;>📄 Bloco Completo</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>HTML + CSS + JS juntos (componente inteiro que funciona sozinho)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:#c084fc;&quot;>💅 Apenas CSS</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Estilos visuais (tema, cores, fontes, animações)</td>
      </tr>
      <tr>
        <td style=&quot;padding:8px;color:var(--red);&quot;>📊 Dados/Templates</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Modelos de documentos, arrays de dados, configurações</td>
      </tr>
    </table>
    
    <div class=&quot;section-title&quot;>Sobre o Banco de Dados (Neon)</div>
    <div style=&quot;font-size:12px;color:var(--text2);line-height:1.8;&quot;>
      <p>⚠️ <strong style=&quot;color:var(--text)&quot;>Importante:</strong> Um HTML puro no navegador <strong>NÃO consegue</strong> conectar direto no Neon (PostgreSQL). Precisa de um &quot;servidor&quot; no meio.</p>
      <p style=&quot;margin-top:8px;&quot;>🟢 <strong style=&quot;color:var(--green)&quot;>Alternativa que funciona sem servidor:</strong></p>
      <ul style=&quot;padding-left:16px;margin-top:4px;&quot;>
        <li><strong>localStorage</strong> — salva no navegador (o que estamos usando aqui)</li>
        <li><strong>IndexedDB</strong> — banco mais robusto no navegador (suporta mais dados)</li>
        <li><strong>Exportar/Importar JSON</strong> — backup manual dos dados</li>
      </ul>
      <p style=&quot;margin-top:8px;&quot;>🔵 <strong style=&quot;color:var(--blue)&quot;>Se quiser Neon no futuro:</strong> Precisará de um backend (Vercel Functions, Cloudflare Workers, ou Supabase que já dá tudo pronto).</p>
    </div>
  </div>

</div>

<!-- Hidden -->
<input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display:none&quot; accept=&quot;.html,.htm,.js,.css,.txt,.json&quot; />
<input type=&quot;file&quot; id=&quot;backupInput&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; />

<!-- Toast -->
<div class=&quot;toast&quot; id=&quot;toast&quot; style=&quot;position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;&quot;></div>

<script>
// ========== STATE ==========
const LS_MODULES = 'pwa-modules-v1';
const LS_SELECTED = 'pwa-selected-v1';

function getModules() {
  try { return JSON.parse(localStorage.getItem(LS_MODULES) || '[]'); } catch { return []; }
}
function setModules(list) { localStorage.setItem(LS_MODULES, JSON.stringify(list)); }
function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); } catch { return []; }
}
function setSelected(list) { localStorage.setItem(LS_SELECTED, JSON.stringify(list)); }

// ========== UI ==========
function showSection(name) {
  ['add','modules','build','preview','guide'].forEach(s => {
    document.getElementById('section-' + s).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const sections = ['add','modules','build','preview','guide'];
    btn.classList.toggle('active', sections[i] === name);
  });
  if (name === 'modules') renderModules();
  if (name === 'build') renderBuildChecklist();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => { t.style.transform = 'translateY(100px)'; t.style.opacity = '0'; }, 2500);
}

// ========== MODULES ==========
function saveModule() {
  const name = document.getElementById('modName').value.trim();
  const type = document.getElementById('modType').value;
  const desc = document.getElementById('modDesc').value.trim();
  const tags = document.getElementById('modTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const code = document.getElementById('modCode').value;
  
  if (!name) { showToast('❌ Dê um nome ao módulo!'); return; }
  if (!code.trim()) { showToast('❌ Cole algum código!'); return; }
  
  const modules = getModules();
  modules.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, type, desc, tags, code,
    date: new Date().toISOString()
  });
  setModules(modules);
  updateCount();
  clearForm();
  showToast('✅ Módulo &quot;' + name + '&quot; salvo!');
}

function clearForm() {
  document.getElementById('modName').value = '';
  document.getElementById('modDesc').value = '';
  document.getElementById('modTags').value = '';
  document.getElementById('modCode').value = '';
}

function renderModules(filter = '') {
  const modules = getModules().filter(m => 
    !filter || m.name.toLowerCase().includes(filter.toLowerCase()) || m.tags.some(t => t.toLowerCase().includes(filter.toLowerCase()))
  );
  const grid = document.getElementById('modulesGrid');
  
  if (modules.length === 0) {
    grid.innerHTML = '<div class=&quot;empty-state&quot;><div class=&quot;icon&quot;>📭</div><p>Nenhum módulo salvo ainda.<br>Use a aba &quot;Adicionar Módulo&quot; para começar!</p></div>';
    return;
  }
  
  grid.innerHTML = modules.map(m => `
    <div class=&quot;module-card&quot;>
      <div class=&quot;card-header&quot;>
        <h3>${escHtml(m.name)}</h3>
        <span class=&quot;tag ${m.type === 'visual' ? 'visual' : m.type === 'funcao' ? 'logica' : ''}&quot;>${getTypeLabel(m.type)}</span>
      </div>
      ${m.desc ? `<div class=&quot;desc&quot;>${escHtml(m.desc)}</div>` : ''}
      <div class=&quot;tags&quot;>${m.tags.map(t => `<span class=&quot;tag&quot;>${escHtml(t)}</span>`).join('')}</div>
      <pre>${escHtml(m.code.slice(0, 200))}${m.code.length > 200 ? '...' : ''}</pre>
      <div class=&quot;card-actions&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;viewModule('${m.id}')&quot;>👁️ Ver</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editModule('${m.id}')&quot;>✏️ Editar</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copyModule('${m.id}')&quot;>📋 Copiar</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deleteModule('${m.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filterModules(query) { renderModules(query); }

function deleteModule(id) {
  if (!confirm('Excluir este módulo?')) return;
  setModules(getModules().filter(m => m.id !== id));
  renderModules();
  updateCount();
  showToast('🗑️ Módulo excluído!');
}

function copyModule(id) {
  const m = getModules().find(x => x.id === id);
  if (m) { navigator.clipboard.writeText(m.code); showToast('📋 Código copiado!'); }
}

function viewModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
}

function editModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  // Remove old and let user save as new
  setModules(getModules().filter(x => x.id !== id));
  viewModule(id); // This won't find it anymore, so we set manually
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
  updateCount();
  showToast('✏️ Editando módulo — salve quando terminar!');
}

// ========== BUILD ==========
function renderBuildChecklist() {
  const modules = getModules();
  const selected = getSelected();
  const container = document.getElementById('buildChecklist');
  
  if (modules.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;&quot;>Nenhum módulo disponível. Adicione módulos primeiro.</p>';
    return;
  }
  
  container.innerHTML = '<ul class=&quot;checklist&quot;>' + modules.map((m, i) => `
    <li>
      <div class=&quot;check ${selected.includes(m.id)?'checked':''}&quot; onclick=&quot;toggleSelect('${m.id}')&quot;>
        ${selected.includes(m.id) ? '✓' : ''}
      </div>
      <div style=&quot;flex:1;&quot;>
        <strong style=&quot;font-size:12px;&quot;>${escHtml(m.name)}</strong>
        <span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;>${getTypeLabel(m.type)}</span>
        ${m.desc ? `<br><span style=&quot;font-size:10px;color:var(--text2);&quot;>${escHtml(m.desc)}</span>` : ''}
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},-1)&quot;>⬆️</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},1)&quot;>⬇️</button>
      </div>
    </li>
  `).join('') + '</ul>';
}

function toggleSelect(id) {
  let selected = getSelected();
  if (selected.includes(id)) selected = selected.filter(x => x !== id);
  else selected.push(id);
  setSelected(selected);
  renderBuildChecklist();
}

function selectAll() {
  setSelected(getModules().map(m => m.id));
  renderBuildChecklist();
}

function deselectAll() {
  setSelected([]);
  renderBuildChecklist();
}

function moveModule(index, dir) {
  const modules = getModules();
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= modules.length) return;
  [modules[index], modules[newIndex]] = [modules[newIndex], modules[index]];
  setModules(modules);
  renderBuildChecklist();
}

// ========== EXPORT ==========
function exportFinal() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  if (chosen.length === 0) {
    showToast('⚠️ Selecione pelo menos um módulo na aba &quot;Montar&quot;!');
    showSection('build');
    return;
  }
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  
  // Separate by type
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => `\n<!-- === MÓDULO: ${m.name} === -->\n${m.code}`).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => `\n// === MÓDULO: ${m.name} ===\n${m.code}`).join('\n');
  
  // Check if any module is a complete document
  const completeDoc = chosen.find(m => m.code.trim().toLowerCase().includes('<!doctype') || m.code.trim().toLowerCase().includes('<html'));
  
  let finalHtml;
  if (completeDoc &amp;&amp; chosen.length === 1) {
    finalHtml = completeDoc.code;
  } else {
    finalHtml = `<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>${escHtml(title)}</title>
<style>
/* === CSS BASE === */
${baseCss}

/* === MÓDULOS CSS === */
${styles}
</style>
</head>
<body>

${htmlParts}

<script>
${scripts}
<\/script>
</body>
</html>`;
  }
  
  // Download
  const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title.replace(/[^a-zA-Z0-9]/g, '_') || 'projeto') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📦 HTML final gerado e baixado!');
}

function refreshPreview() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => m.code).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => m.code).join('\n');
  
  const doc = `<!DOCTYPE html><html><head><meta charset=&quot;UTF-8&quot;><style>${baseCss}\n${styles}</style></head><body>${htmlParts}<script>${scripts}<\/script></body></html>`;
  
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  document.getElementById('previewFrame').src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function openFullPreview() {
  refreshPreview();
  const frame = document.getElementById('previewFrame');
  if (frame.src) window.open(frame.src, '_blank');
}

// ========== BACKUP ==========
function exportBackup() {
  const data = { modules: getModules(), selected: getSelected(), date: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pwa-modulos-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Backup exportado!');
}

function importBackup() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modules) {
        const existing = getModules();
        const merged = [...existing, ...data.modules.filter(m => !existing.find(e => e.id === m.id))];
        setModules(merged);
        if (data.selected) setSelected(data.selected);
        updateCount();
        showToast('📂 Backup importado! ' + data.modules.length + ' módulos.');
      }
    } catch(err) {
      showToast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Import code from file
function importFromFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('modCode').value = ev.target.result;
    if (!document.getElementById('modName').value) {
      document.getElementById('modName').value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('📂 Código do arquivo carregado!');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== UTILS ==========
function escHtml(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }
function getTypeLabel(type) {
  const labels = { funcao:'🔧 Função', visual:'🎨 Visual', completo:'📄 Completo', estilo:'💅 CSS', dados:'📊 Dados' };
  return labels[type] || type;
}
function updateCount() {
  document.getElementById('moduleCount').textContent = getModules().length;
}

// Init
updateCount();
</script>
</body>
</html>" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe></div>

<script>
function trocar(i) {
  document.querySelectorAll('.projeto').forEach(function(el){ el.classList.remove('ativo'); });
  document.querySelectorAll('.nav-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('p'+i).classList.add('ativo');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  localStorage.setItem('mc-ultimo', i);
}
window.onload = function() {
  var u = localStorage.getItem('mc-ultimo');
  if (u !== null) trocar(parseInt(u));
};
</script>
</body>
</html>
