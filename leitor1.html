<!-- Toast -->
<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';
const AUTOSAVE_KEY = 'playground-autosave-v3';
const SETTINGS_KEY = 'playground-ai-settings-v3';

let state = {
  mode: 'html',
  activeTab: 'html',
  html: `<div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;>
  <h1 style=&quot;color:#333;&quot;>Bem-vindo ao Playground Pro</h1>
  <p style=&quot;color:#666;margin:16px 0;&quot;>Cole seu código HTML aqui!</p>
  <button onclick=&quot;alert('Funcionou!')&quot; style=&quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&quot;>Clique</button>
</div>`,
  css: '',
  js: `console.log(&quot;Hello from Playground Pro!&quot;);`,
  jsx: `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding:40,textAlign:'center'}}>\n      <h1>⚛️ React</h1>\n      <p>Contador: {count}</p>\n      <button onClick={() => setCount(count + 1)}>+</button>\n    </div>\n  );\n}`,
  python: `print(&quot;Hello from Python!&quot;)`,
  title: 'Sem titulo',
  editorState: 'normal',
  currentLine: 1
};

let aiSettings = {
  provider: 'openai',
  apiKey: '',
  enableWebSearch: false,
  enableTTS: false
};

// Load saved data
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) Object.assign(state, JSON.parse(saved));
  
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) Object.assign(aiSettings, JSON.parse(savedSettings));
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();
updateAIButton();

// ========== EDITOR EVENTS ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  updateCursorPosition();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'g') {
    e.preventDefault();
    openGotoLine();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 's') {
    e.preventDefault();
    saveToLocal();
  }
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) => {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `<div class=&quot;line ${isCurrent ? 'current' : ''}&quot; onclick=&quot;jumpToLine(${lineNum})&quot;>${lineNum}</div>`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i < lineNum - 1 &amp;&amp; i < lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() => {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;&amp; lineNum > 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// ========== TABS &amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='html'?'active':''}&quot; id=&quot;tabHtml&quot; onclick=&quot;switchTab('html')&quot;>📄 HTML</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
      <button class=&quot;tab ${state.activeTab==='js'?'active':''}&quot; id=&quot;tabJs&quot; onclick=&quot;switchTab('js')&quot;>⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='jsx'?'active':''}&quot; id=&quot;tabJsx&quot; onclick=&quot;switchTab('jsx')&quot;>⚛️ JSX</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `<button class=&quot;tab active&quot; id=&quot;tabPython&quot; onclick=&quot;switchTab('python')&quot;>🐍 Python</button>`;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

// ========== PREVIEW ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;><\/script>
<script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;><\/script>
<script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id=&quot;root&quot;></div>
<script type=&quot;text/babel&quot;>
const { useState, useEffect, useRef } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style=&quot;color:red;padding:20px&quot;>Erro: '+e.message+'</div>';
}
<\/script></body></html>`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:monospace;padding:20px;}#output{white-space:pre-wrap;}</style>
</head><body>
<div id=&quot;output&quot;>⟳ Carregando Python...</div>
<script src=&quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&quot;><\/script>
<script>
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython('import sys; from io import StringIO; sys.stdout = StringIO()');
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.textContent = stdout || '(sem output)';
  } catch(e) {
    out.innerHTML = '<span style=&quot;color:#f87171&quot;>Erro: ' + e.message + '</span>';
  }
}
main();
<\/script></body></html>`;
  }
  
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('<!doctype') || (lower.includes('<html') &amp;&amp; lower.includes('</html>'));
  
  if (isComplete) return state.html;
  
  return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<style>${state.css}</style>
</head><body>
${state.html}
<script>${state.js}<\/script>
</body></html>`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== FILE OPERATIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() => showToast('📋 Copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      const lower = content.trim().toLowerCase();
      if (lower.includes('<!doctype') || lower.includes('<html')) {
        const htmlMatch = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        const cssMatch = content.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
        const jsMatch = content.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 Importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
  } else if (state.editorState === 'expanded') {
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
  } else {
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
  }
}

function clearCode() {
  if (!confirm('Limpar código?')) return;
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Limpo!');
}

function resetCode() {
  if (!confirm('Resetar?')) return;
  if (state.mode === 'react') {
    state.jsx = `function App() {\n  return <div>React App</div>;\n}`;
  } else if (state.mode === 'python') {
    state.python = `print(&quot;Hello Python!&quot;)`;
  } else {
    state.html = `<h1>Hello World</h1>`;
    state.css = '';
    state.js = '';
  }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Resetado!');
}

// ========== PROJECT MANAGEMENT ==========
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const projects = getProjects();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  projects.unshift(item);
  setProjects(projects);
  showToast('💾 Salvo!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const projects = getProjects().filter(s => s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (projects.length === 0) {
    container.innerHTML = '<p style=&quot;text-align:center;color:var(--text2);padding:20px;&quot;>Nenhum projeto.</p>';
    return;
  }
  
  container.innerHTML = projects.map(s => `
    <div class=&quot;snippet-item&quot; onclick=&quot;loadProject('${s.id}')&quot;>
      <div>
        <div class=&quot;name&quot;>${escapeHtml(s.title)}</div>
        <div class=&quot;meta&quot;>${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')}</div>
      </div>
      <div class=&quot;snippet-actions&quot;>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();renameProject('${s.id}')&quot;>✏️</button>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();deleteProject('${s.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function loadProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 Carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir?')) return;
  setProjects(getProjects().filter(s => s.id !== id));
  renderSavedList();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;&amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(getProjects());
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

// ========== AI SETTINGS ==========
function openSettings() {
  document.getElementById('settingsModal').classList.add('open');
  document.getElementById('aiProvider').value = aiSettings.provider;
  document.getElementById('apiKey').value = aiSettings.apiKey;
  document.getElementById('enableWebSearch').checked = aiSettings.enableWebSearch;
  document.getElementById('enableTTS').checked = aiSettings.enableTTS;
  updateSettingsStatus();
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  aiSettings.provider = document.getElementById('aiProvider').value;
  aiSettings.apiKey = document.getElementById('apiKey').value.trim();
  aiSettings.enableWebSearch = document.getElementById('enableWebSearch').checked;
  aiSettings.enableTTS = document.getElementById('enableTTS').checked;
  
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(aiSettings));
    showToast('⚙️ Configurações salvas!');
    updateSettingsStatus();
    updateAIButton();
  } catch(e) {
    showToast('❌ Erro ao salvar');
  }
}

function updateSettingsStatus() {
  const statusDiv = document.getElementById('settingsStatus');
  if (aiSettings.apiKey) {
    const masked = aiSettings.apiKey.substring(0, 8) + '...' + aiSettings.apiKey.slice(-4);
    statusDiv.innerHTML = `<div class=&quot;status-indicator success&quot;>✓ API Key configurada: ${masked}</div>`;
  } else {
    statusDiv.innerHTML = `<div class=&quot;status-indicator warning&quot;>⚠ Configure sua API Key para usar a IA</div>`;
  }
}

function updateAIButton() {
  const btn = document.getElementById('btnAI');
  if (aiSettings.apiKey) {
    btn.classList.remove('disabled');
    btn.title = 'Assistente IA (configurado)';
  } else {
    btn.classList.add('disabled');
    btn.title = 'Configure a API Key primeiro';
  }
}

async function testAI() {
  if (!aiSettings.apiKey) {
    showToast('⚠️ Configure a API Key primeiro');
    return;
  }
  
  const statusDiv = document.getElementById('settingsStatus');
  statusDiv.innerHTML = `<div class=&quot;status-indicator&quot;><div class=&quot;loading&quot;></div> Testando conexão...</div>`;
  
  try {
    const response = await callAI('Responda apenas &quot;OK&quot; se você estiver funcionando.', false);
    if (response) {
      statusDiv.innerHTML = `<div class=&quot;status-indicator success&quot;>✓ Conexão OK! IA funcionando.</div>`;
      showToast('✅ IA testada com sucesso!');
    } else {
      throw new Error('Sem resposta');
    }
  } catch(e) {
    statusDiv.innerHTML = `<div class=&quot;status-indicator error&quot;>✗ Erro: ${e.message}</div>`;
    showToast('❌ Erro ao testar IA');
  }
}

// ========== AI HELPER ==========
function openAIHelper() {
  if (!aiSettings.apiKey) {
    showToast('⚠️ Configure a API Key nas configurações primeiro!');
    openSettings();
    return;
  }
  
  document.getElementById('aiModal').classList.add('open');
  updateAIStatus();
  setTimeout(() => document.getElementById('aiPrompt').focus(), 100);
}

function closeAIHelper() {
  document.getElementById('aiModal').classList.remove('open');
}

function updateAIStatus() {
  const statusBar = document.getElementById('aiStatusBar');
  const features = [];
  if (aiSettings.enableWebSearch) features.push('🌐 Busca Web');
  if (aiSettings.enableTTS) features.push('🔊 TTS');
  
  statusBar.innerHTML = `
    <div class=&quot;status-indicator success&quot;>
      ✓ ${aiSettings.provider.toUpperCase()} conectado
      ${features.length ? ' • ' + features.join(' • ') : ''}
    </div>
  `;
}

function includeCode() {
  const currentCode = editor.value;
  const prompt = document.getElementById('aiPrompt');
  if (currentCode) {
    prompt.value = `Meu código atual:\n\`\`\`\n${currentCode}\n\`\`\`\n\n${prompt.value}`;
    showToast('📝 Código incluído na pergunta');
  }
}

function clearAIChat() {
  document.getElementById('aiPrompt').value = '';
  document.getElementById('aiResponse').innerHTML = '';
  showToast('🗑️ Chat limpo');
}

async function askAI() {
  const prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) {
    showToast('⚠️ Digite uma pergunta');
    return;
  }
  
  if (!aiSettings.apiKey) {
    showToast('⚠️ Configure a API Key primeiro');
    openSettings();
    return;
  }
  
  const responseDiv = document.getElementById('aiResponse');
  const btnAskAI = document.getElementById('btnAskAI');
  const originalText = document.getElementById('askBtnText').textContent;
  
  btnAskAI.disabled = true;
  document.getElementById('askBtnText').innerHTML = '<div class=&quot;loading&quot;></div> Pensando...';
  responseDiv.innerHTML = '<div style=&quot;color:var(--text2);&quot;><div class=&quot;loading&quot;></div> Consultando IA...</div>';
  
  try {
    const response = await callAI(prompt, aiSettings.enableWebSearch);
    
    responseDiv.innerHTML = `<div class=&quot;ai-response&quot;>🤖 <strong>Resposta:</strong>\n\n${escapeHtml(response)}</div>`;
    
    // TTS (Text-to-Speech)
    if (aiSettings.enableTTS) {
      speakText(response);
    }
    
  } catch(e) {
    responseDiv.innerHTML = `<div class=&quot;ai-response&quot; style=&quot;border-left-color:var(--red);&quot;>❌ <strong>Erro:</strong>\n\n${escapeHtml(e.message)}</div>`;
    showToast('❌ Erro na IA');
  } finally {
    btnAskAI.disabled = false;
    document.getElementById('askBtnText').textContent = originalText;
  }
}

// ========== AI API CALLS ==========
async function callAI(prompt, useWebSearch) {
  const provider = aiSettings.provider;
  
  if (provider === 'openai') {
    return await callOpenAI(prompt, useWebSearch);
  } else if (provider === 'gemini') {
    return await callGemini(prompt, useWebSearch);
  } else if (provider === 'claude') {
    return await callClaude(prompt, useWebSearch);
  }
  
  throw new Error('Provedor não suportado');
}

async function callOpenAI(prompt, useWebSearch) {
  const messages = [
    {
      role: 'system',
      content: 'Você é um assistente de programação especializado em HTML, CSS, JavaScript, React e Python. Seja direto e prático.'
    },
    {
      role: 'user',
      content: prompt
    }
  ];
  
  // Se busca web estiver ativada, adiciona contexto
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      messages[0].content += `\n\nInformações da web: ${searchResults}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${aiSettings.apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini', // Modelo mais barato e rápido
      messages: messages,
      temperature: 0.7,
      max_tokens: 1000
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API OpenAI');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

async function callGemini(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${aiSettings.apiKey}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: fullPrompt
        }]
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Gemini');
  }
  
  const data = await response.json();
  return data.candidates[0].content.parts[0].text;
}

async function callClaude(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': aiSettings.apiKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-3-haiku-20240307', // Modelo mais barato
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: fullPrompt
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Claude');
  }
  
  const data = await response.json();
  return data.content[0].text;
}

// ========== WEB SEARCH ==========
async function searchWeb(query) {
  // Usando DuckDuckGo Instant Answer API (gratuita, sem API key)
  try {
    const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&amp;format=json&amp;no_html=1&amp;skip_disambig=1`);
    const data = await response.json();
    
    let results = '';
    if (data.AbstractText) results += data.AbstractText + '\n';
    if (data.RelatedTopics &amp;&amp; data.RelatedTopics.length > 0) {
      results += data.RelatedTopics.slice(0, 3).map(t => t.Text).filter(Boolean).join('\n');
    }
    
    return results || 'Nenhum resultado encontrado';
  } catch(e) {
    console.error('Erro na busca:', e);
    return '';
  }
}
// ========== TEXT-TO-SPEECH ==========
function speakText(text) {
  if (!window.speechSynthesis) {
    console.warn('TTS não suportado neste navegador');
    return;
  }
  
  // Cancela qualquer fala anterior
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  // Tenta usar uma voz em português
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.startsWith('pt'));
  if (ptVoice) utterance.voice = ptVoice;
  
  window.speechSynthesis.speak(utterance);
  showToast('🔊 Reproduzindo áudio...');
}

// Carrega vozes disponíveis
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Enter key shortcuts
document.getElementById('gotoLineInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') gotoLine();
});

document.getElementById('aiPrompt')?.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'Enter') {
    askAI();
  }
});
