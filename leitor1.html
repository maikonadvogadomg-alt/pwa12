  <script>
    let todosElementos = [];
    let arquivoAtual = null;
    let filtroAtivo = 'todos';

    // =====================
    // INICIALIZAR
    // =====================
    window.onload = function() {
      carregarNotas();
    };

    // =====================
    // LER ARQUIVO
    // =====================
    function lerArquivo(event) {
      const arquivo = event.target.files[0];
      if (!arquivo) return;

      arquivoAtual = arquivo.name;
      const leitor = new FileReader();

      leitor.onload = function(e) {
        const conteudo = e.target.result;
        analisarCodigo(conteudo, arquivo.name);
      };

      leitor.readAsText(arquivo);
    }

    // =====================
    // ANALISAR CÓDIGO
    // =====================
    function analisarCodigo(texto, nomeArquivo) {
      const linhas = texto.split('\n');
      todosElementos = [];

      const extensao = nomeArquivo.split('.').pop().toLowerCase();

      // ANALISAR FUNÇÕES JAVASCRIPT
      if (extensao === 'js' || extensao === 'html') {
        analisarFuncoes(linhas);
      }

      // ANALISAR HTML
      if (extensao === 'html') {
        analisarHTML(texto);
      }

      // ANALISAR CSS
      if (extensao === 'css' || extensao === 'html') {
        analisarCSS(texto);
      }

      // Atualizar resumo
      const funcoes = todosElementos.filter(e => e.tipo === 'funcao').length;
      const html = todosElementos.filter(e => e.tipo === 'html').length;
      const css = todosElementos.filter(e => e.tipo === 'css').length;
      const cerebro = todosElementos.filter(e => e.cerebro).length;

      document.getElementById('total-elementos').textContent = todosElementos.length;
      document.getElementById('total-linhas').textContent = linhas.length;
      document.getElementById('total-funcoes').textContent = funcoes;
      document.getElementById('total-html').textContent = html;
      document.getElementById('total-css').textContent = css;
      document.getElementById('total-cerebro').textContent = cerebro;

      document.getElementById('resumo').style.display = 'block';
      document.getElementById('acoes-principais').style.display = 'flex';
      document.getElementById('lista-elementos').style.display = 'block';
      document.getElementById('barra-busca').style.display = 'block';
      document.getElementById('filtros').style.display = 'flex';

      renderizarElementos(todosElementos);
      mostrarToast(`✅ ${todosElementos.length} elementos encontrados!`);
    }

    // =====================
    // ANALISAR FUNÇÕES JS
    // =====================
    function analisarFuncoes(linhas) {
      for (let i = 0; i < linhas.length; i++) {
        const linha = linhas[i];
        const padroes = [
          /function\s+(\w+)\s*\(/,
          /const\s+(\w+)\s*=\s*(?:async\s*)?\(/,
          /const\s+(\w+)\s*=\s*(?:async\s*)?function/,
          /(\w+)\s*:\s*(?:async\s*)?function/,
          /(\w+)\s*=\s*(?:async\s*)?\(.*\)\s*=>/,
        ];

        for (const padrao of padroes) {
          const match = linha.match(padrao);
          if (match) {
            const nome = match[1];
            const corpo = pegarCorpo(linhas, i);
            const cerebro = isCerebro(nome, corpo);
            const importante = isImportante(nome, corpo);
            const explicacao = explicarFuncao(nome, corpo, cerebro, importante);

            todosElementos.push({
              tipo: 'funcao',
              nome,
              linha: i + 1,
              corpo,
              cerebro,
              importante,
              explicacao
            });
            break;
          }
        }
      }
    }

    // =====================
    // ANALISAR HTML
    // =====================
    function analisarHTML(texto) {
      const regex = /<(\w+)([^>]*)>/g;
      let match;
      const tagsIgnorar = ['html', 'head', 'body', 'meta', 'title'];

      while ((match = regex.exec(texto)) !== null) {
        const tag = match[1];
        const atributos = match[2];

        if (tagsIgnorar.includes(tag.toLowerCase())) continue;

        const id = atributos.match(/id=[&quot;']([^&quot;']+)[&quot;']/);
        const classe = atributos.match(/class=[&quot;']([^&quot;']+)[&quot;']/);

        const nome = id ? `#${id[1]}` : (classe ? `.${classe[1].split(' ')[0]}` : `<${tag}>`);

        todosElementos.push({
          tipo: 'html',
          nome,
          tag,
          atributos: atributos.trim(),
          corpo: match[0],
          cerebro: false,
          importante: ['button', 'form', 'input'].includes(tag.toLowerCase()),
          explicacao: explicarHTML(tag, atributos)
        });
      }
    }

    // =====================
    // ANALISAR CSS
    // =====================
    function analisarCSS(texto) {
      const regex = /([^{]+)\{([^}]+)\}/g;
      let match;

      while ((match = regex.exec(texto)) !== null) {
        const seletor = match[1].trim();
        const regras = match[2].trim();

        if (seletor.startsWith('@') || seletor.startsWith('*')) continue;

        todosElementos.push({
          tipo: 'css',
          nome: seletor,
          corpo: match[0],
          regras,
          cerebro: false,
          importante: seletor.includes('#') || seletor.includes('.btn'),
          explicacao: explicarCSS(seletor, regras)
        });
      }
    }

    // =====================
    // FUNÇÕES AUXILIARES
    // =====================
    function pegarCorpo(linhas, inicio) {
      let corpo = '';
      let abre = 0;
      let comecou = false;

      for (let i = inicio; i < Math.min(inicio + 60, linhas.length); i++) {
        corpo += linhas[i] + '\n';
        for (const char of linhas[i]) {
          if (char === '{') { abre++; comecou = true; }
          if (char === '}') abre--;
        }
        if (comecou &amp;&amp; abre <= 0) break;
      }
      return corpo;
    }

    function isCerebro(nome, corpo) {
      const nomeMin = nome.toLowerCase();
      const corpoMin = corpo.toLowerCase();
      return nomeMin.includes('memory') || nomeMin.includes('save') || 
             nomeMin.includes('load') || nomeMin.includes('cerebro') ||
             corpoMin.includes('localstorage') || corpoMin.includes('json.stringify');
    }

    function isImportante(nome, corpo) {
      const nomeMin = nome.toLowerCase();
      return nomeMin.includes('init') || nomeMin.includes('main') || 
             nomeMin.includes('start') || nomeMin.includes('chat') ||
             nomeMin.includes('send') || nomeMin.includes('api');
    }

    function explicarFuncao(nome, corpo, cerebro, importante) {
      if (cerebro) {
        return {
          oque: `🧠 Função de MEMÓRIA: &quot;${nome}&quot;`,
          quando: 'Salva ou carrega dados do localStorage',
          dica: 'COPIE ESTA FUNÇÃO — é essencial para o sistema de memória'
        };
      }
      if (importante) {
        return {
          oque: `⭐ Função IMPORTANTE: &quot;${nome}&quot;`,
          quando: 'Faz parte da lógica principal do aplicativo',
          dica: 'Recomendado copiar — é uma função central'
        };
      }
      return {
        oque: `⚡ Função: &quot;${nome}&quot;`,
        quando: 'Função auxiliar ou de suporte',
        dica: 'Copie se outras funções dependerem dela'
      };
    }

    function explicarHTML(tag, atributos) {
      const explicacoes = {
        button: { oque: '🔘 Botão clicável', quando: 'Para ações do usuário', dica: 'Verifique os eventos onclick' },
        input: { oque: '📝 Campo de entrada', quando: 'Para receber dados do usuário', dica: 'Importante para formulários' },
        div: { oque: '📦 Container', quando: 'Para organizar layout', dica: 'Verifique o ID/classe para estilização' },
        form: { oque: '📋 Formulário', quando: 'Para enviar dados', dica: 'Copie se precisar da estrutura de dados' }
      };
      return explicacoes[tag.toLowerCase()] || { oque: `🏗️ Tag HTML: <${tag}>`, quando: 'Elemento estrutural', dica: 'Parte da interface' };
    }

    function explicarCSS(seletor, regras) {
      return {
        oque: `🎨 Estilo para: ${seletor}`,
        quando: 'Define aparência visual',
        dica: regras.includes('display') ? 'Afeta o layout' : 'Afeta cores/tamanhos'
      };
    }

    // =====================
    // RENDERIZAR ELEMENTOS
    // =====================
    function renderizarElementos(lista) {
      const container = document.getElementById('lista-elementos');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = '<p style=&quot;color:#64748b;text-align:center;padding:20px&quot;>Nenhum elemento encontrado</p>';
        return;
      }

      lista.forEach((el, index) => {
        const tipoClasse = el.cerebro ? 'cerebro' : (el.importante ? 'importante' : el.tipo);
        const tagTexto = el.cerebro ? '🧠 Cérebro' : (el.importante ? '⭐ Importante' : 
          { funcao: '⚡ Função', html: '🏗️ HTML', css: '🎨 CSS' }[el.tipo]);
        const tagClasse = el.cerebro ? 'tag-cerebro' : (el.importante ? 'tag-importante' : `tag-${el.tipo}`);

        const div = document.createElement('div');
        div.className = 'elemento-card';
        div.dataset.tipo = el.tipo;
        div.dataset.nome = el.nome.toLowerCase();
        if (el.cerebro) div.dataset.cerebro = 'true';
        if (el.importante) div.dataset.importante = 'true';

        div.innerHTML = `
          <div class=&quot;elemento-header ${tipoClasse}&quot; onclick=&quot;toggleCorpo(${index})&quot;>
            <div>
              <strong style=&quot;font-size:1.1em&quot;>${el.nome}</strong>
              ${el.linha ? `<span style=&quot;color:#64748b;font-size:0.85em;margin-left:10px&quot;>linha ${el.linha}</span>` : ''}
            </div>
            <div style=&quot;display:flex;align-items:center;gap:10px&quot;>
              <span class=&quot;tag ${tagClasse}&quot;>${tagTexto}</span>
              <span id=&quot;seta-${index}&quot;>▼</span>
            </div>
          </div>
          <div class=&quot;elemento-corpo&quot; id=&quot;corpo-${index}&quot;>
            <div class=&quot;explicacao&quot;>
              <strong>O que é:</strong> ${el.explicacao.oque}<br><br>
              <strong>Quando usar:</strong> ${el.explicacao.quando}<br><br>
              <strong>💡 Dica:</strong> <span style=&quot;color:#fde68a&quot;>${el.explicacao.dica}</span>
            </div>
            <strong style=&quot;color:#94a3b8;font-size:0.85em&quot;>Código:</strong>
            <pre id=&quot;pre-${index}&quot;>${escaparHtml(el.corpo)}</pre>
            <button class=&quot;btn-copiar&quot; onclick=&quot;copiar(${index}, this)&quot;>📋 Copiar este código</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // =====================
    // TOGGLE ABRIR/FECHAR
    // =====================
    function toggleCorpo(index) {
      const corpo = document.getElementById(`corpo-${index}`);
      const seta = document.getElementById(`seta-${index}`);
      const aberto = corpo.classList.contains('aberto');
      corpo.classList.toggle('aberto');
      seta.textContent = aberto ? '▼' : '▲';
    }

    // =====================
    // COPIAR CÓDIGO
    // =====================
    function copiar(index, btn) {
      const codigo = todosElementos[index].corpo;
      navigator.clipboard.writeText(codigo).then(() => {
        btn.textContent = '✅ Copiado!';
        btn.classList.add('copiado');
        setTimeout(() => {
          btn.textContent = '📋 Copiar este código';
          btn.classList.remove('copiado');
        }, 2000);
      });
    }

    function copiarTudo() {
      const tudo = todosElementos.map(el => el.corpo).join('\n\n');
      navigator.clipboard.writeText(tudo).then(() => {
        mostrarToast('✅ Todo o código foi copiado!');
      });
    }

    // =====================
    // FILTROS E BUSCA
    // =====================
    function filtrar(tipo, btn) {
      filtroAtivo = tipo;
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');

      let filtradas = todosElementos;
      if (tipo === 'cerebro') filtradas = todosElementos.filter(e => e.cerebro);
      else if (tipo === 'importante') filtradas = todosElementos.filter(e => e.importante);
      else if (tipo !== 'todos') filtradas = todosElementos.filter(e => e.tipo === tipo);

      renderizarElementos(filtradas);
    }

    function filtrarBusca(termo) {
      const filtradas = termo 
        ? todosElementos.filter(e => e.nome.toLowerCase().includes(termo.toLowerCase()))
        : todosElementos;
      renderizarElementos(filtradas);
    }

    // =====================
    // SISTEMA DE MEMÓRIA
    // =====================
    function salvarNaMemoria() {
      if (!arquivoAtual || todosElementos.length === 0) {
        mostrarToast('❌ Nenhum arquivo analisado!', true);
        return;
      }

      const nota = {
        id: Date.now(),
        nome: arquivoAtual,
        data: new Date().toLocaleString('pt-BR'),
        elementos: todosElementos,
        resumo: {
          total: todosElementos.length,
          funcoes: todosElementos.filter(e => e.tipo === 'funcao').length,
          html: todosElementos.filter(e => e.tipo === 'html').length,
          css: todosElementos.filter(e => e.tipo === 'css').length,
          cerebro: todosElementos.filter(e => e.cerebro).length
        }
      };

      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      notas.push(nota);
      localStorage.setItem('notasProjeto', JSON.stringify(notas));

      carregarNotas();
      mostrarToast('💾 Análise salva na memória!');
    }

    function carregarNotas() {
      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      const container = document.getElementById('lista-notas');
      const painel = document.getElementById('painel-memoria');

      if (notas.length === 0) {
        painel.style.display = 'none';
        return;
      }

      painel.style.display = 'block';
      container.innerHTML = '';

      notas.reverse().forEach(nota => {
        const div = document.createElement('div');
        div.className = 'nota-item';
        div.innerHTML = `
          <div class=&quot;nota-info&quot;>
            <div class=&quot;nota-nome&quot;>📄 ${nota.nome}</div>
            <div class=&quot;nota-data&quot;>${nota.data} • ${nota.resumo.total} elementos</div>
          </div>
          <div class=&quot;nota-acoes&quot;>
            <button class=&quot;btn-nota&quot; onclick=&quot;carregarNota(${nota.id})&quot;>📂 Abrir</button>
            <button class=&quot;btn-nota deletar&quot; onclick=&quot;deletarNota(${nota.id})&quot;>🗑️</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function carregarNota(id) {
      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      const nota = notas.find(n => n.id === id);
      if (!nota) return;

      todosElementos = nota.elementos;
      arquivoAtual = nota.nome;

      document.getElementById('total-elementos').textContent = nota.resumo.total;
      document.getElementById('total-funcoes').textContent = nota.resumo.funcoes;
      document.getElementById('total-html').textContent = nota.resumo.html;
      document.getElementById('total-css').textContent = nota.resumo.css;
      document.getElementById('total-cerebro').textContent = nota.resumo.cerebro;

      document.getElementById('resumo').style.display = 'block';
      document.getElementById('acoes-principais').style.display = 'flex';
      document.getElementById('lista-elementos').style.display = 'block';
      document.getElementById('barra-busca').style.display = 'block';
      document.getElementById('filtros').style.display = 'flex';

      renderizarElementos(todosElementos);
      mostrarToast(`✅ Nota &quot;${nota.nome}&quot; carregada!`);
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function deletarNota(id) {
      if (!confirm('Tem certeza que deseja deletar esta nota?')) return;

      let notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      notas = notas.filter(n => n.id !== id);
      localStorage.setItem('notasProjeto', JSON.stringify(notas));

      carregarNotas();
      mostrarToast('🗑️ Nota deletada!');
    }

    function limparTodasNotas() {
      if (!confirm('Tem certeza que deseja limpar TODAS as notas da memória?')) return;

      localStorage.removeItem('notasProjeto');
      carregarNotas();
      mostrarToast('🗑️ Memória limpa!');
    }

    // =====================
    // EXPORTAR JSON
    // =====================
    function exportarJSON() {
      const dados = {
        arquivo: arquivoAtual,
        data: new Date().toISOString(),
        elementos: todosElementos
      };

      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `analise-${arquivoAtual}.json`;
      a.click();

      mostrarToast('📥 JSON exportado!');
    }

    // =====================
    // TOAST
    // =====================
    function mostrarToast(mensagem, erro = false) {
      const toast = document.getElementById('toast');
      toast.textContent = mensagem;
      toast.className = 'toast' + (erro ? ' erro' : '');
      toast.style.display = 'block';

      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    // =====================
    // ESCAPAR HTML
    // =====================
    function escaparHtml(texto) {
      return texto
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/</g, '&amp;lt;')
        .replace(/>/g, '&amp;gt;');
    }
  </script>
</body>
</html>

    if (data.p2) { document.getElementById('nome2').value = data.p2.nome || ''; document.getElementById('codigo2').value = data.p2.codigo || ''; }
    if (data.p3) { document.getElementById('nome3').value = data.p3.nome || ''; document.getElementById('codigo3').value = data.p3.codigo || ''; }

  } catch(e) {}

function renderizarSalvos() {
  const data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  const container = document.getElementById('projetosSalvos');
  const projetos = [
    { n: 1, nome: data.p1?.nome, codigo: data.p1?.codigo },
    { n: 2, nome: data.p2?.nome, codigo: data.p2?.codigo },
    { n: 3, nome: data.p3?.nome, codigo: data.p3?.codigo }
  ].filter(p => p.codigo &amp;&amp; p.codigo.trim());

  if (projetos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;&quot;>Nenhum projeto salvo ainda.</p>';
    return;

  container.innerHTML = projetos.map(p => `
    <div class=&quot;project-card&quot;>
      <h3>🔷 ${escHtml(p.nome || 'Projeto ' + p.n)}</h3>
      <div style=&quot;font-size:11px;color:var(--text2);&quot;>${p.codigo.length} caracteres</div>
      <div class=&quot;actions&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;testarProjeto(${p.n})&quot;>👁️ Testar</button>

      <button class=&quot;btn btn-danger&quot; onclick=&quot;limparTudo()&quot;>🗑️ Limpar Tudo</button>
    </div>
  </div>

  <div class=&quot;panel&quot;>
    <div class=&quot;panel-header&quot;>
      <div class=&quot;panel-title&quot;>📋 Módulos Salvos</div>
      <input type=&quot;text&quot; class=&quot;input&quot; style=&quot;width:200px;margin:0;&quot; placeholder=&quot;🔍 Buscar...&quot; oninput=&quot;filtrarArquivos(this.value)&quot; />
    </div>
    <div id=&quot;arquivosList&quot;></div>
  </div>
</div>

<!-- Hidden inputs -->
<input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display:none&quot; accept=&quot;.html,.htm,.js,.css,.txt&quot; />
<input type=&quot;file&quot; id=&quot;backupInput&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; />

<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
// ========== STORAGE ==========
const LS_MODULOS = 'workstation-modulos-v1';
const LS_SELECTED = 'workstation-selected-v1';

function getModulos() {
  try { return JSON.parse(localStorage.getItem(LS_MODULOS) || '[]'); }
  catch { return []; }
}

function setModulos(list) {
  localStorage.setItem(LS_MODULOS, JSON.stringify(list));
  atualizarContador();
}

function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); }
  catch { return []; }
}

function setSelected(list) {
  localStorage.setItem(LS_SELECTED, JSON.stringify(list));
}

// ========== NAVEGAÇÃO ==========
function trocarAba(nome) {
  // Esconde todas
  document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  
  // Mostra a selecionada
  document.getElementById('ws-' + nome).classList.add('active');
  event.target.classList.add('active');
  
  // Atualiza conteúdo
  if (nome === 'montador') renderModulos();
  if (nome === 'arquivos') renderArquivos();
}

// ========== SCANNER ==========
function analisarCodigo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo),
    elementos: extrairElementos(codigo),
    scripts: extrairScripts(codigo)
  };

  renderAnalise(analise);
}

function extrairFuncoes(codigo) {
  const regex = /function\s+(\w+)\s*\([^)]*\)\s*\{/g;
  const funcoes = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    const inicio = match.index;
    const fim = encontrarFimFuncao(codigo, inicio);
    funcoes.push({
      nome: match[1],
      codigo: codigo.substring(inicio, fim)
    });
  }
  return funcoes;
}

function encontrarFimFuncao(codigo, inicio) {
  let nivel = 0;
  for (let i = inicio; i < codigo.length; i++) {
    if (codigo[i] === '{') nivel++;
    if (codigo[i] === '}') {
      nivel--;
      if (nivel === 0) return i + 1;
    }
  }
  return codigo.length;
}

function extrairEstilos(codigo) {
  const regex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  const estilos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    estilos.push(match[1].trim());
  }
  return estilos;
}

function extrairElementos(codigo) {
  const regex = /<(\w+)[^>]*id=[&quot;']([^&quot;']+)[&quot;'][^>]*>/g;
  const elementos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    elementos.push({ tag: match[1], id: match[2] });
  }
  return elementos;
}

function extrairScripts(codigo) {
  const regex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const scripts = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    scripts.push(match[1].trim());
  }
  return scripts;
}

function renderAnalise(analise) {
  const container = document.getElementById('scannerResults');
  
  let html = '';
  
  // Funções
  if (analise.funcoes.length > 0) {
    html += `
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-header&quot;>
          <div class=&quot;panel-title&quot;>🔧 Funções Encontradas (${analise.funcoes.length})</div>
        </div>
        ${analise.funcoes.map((f, i) => `
          <div class=&quot;file-item&quot;>
            <div>
              <strong style=&quot;color:var(--green);&quot;>${escHtml(f.nome)}()</strong>
              <span class=&quot;tag tag-func&quot;>função</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;verCodigo(${i}, 'funcao')&quot;>👁️</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground('${escHtml(f.codigo).replace(/'/g, &quot;\\'&quot;)}')&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('${escHtml(f.nome)}', 'funcao', \`${f.codigo.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  // Estilos
  if (analise.estilos.length > 0) {
    html += `
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-header&quot;>
          <div class=&quot;panel-title&quot;>💅 Estilos CSS (${analise.estilos.length})</div>
        </div>
        ${analise.estilos.map((css, i) => `
          <div class=&quot;file-item&quot;>
            <div>
              <strong style=&quot;color:var(--blue);&quot;>Bloco CSS ${i + 1}</strong>
              <span class=&quot;tag tag-css&quot;>css</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${css.replace(/`/g, '\\`')}\`)&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('CSS_${i + 1}', 'css', \`${css.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  container.innerHTML = html || '<div class=&quot;status status-warning&quot;>⚠️ Nenhum elemento extraível encontrado</div>';
  toast('✅ Análise concluída!');
}

function extrairTudo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo)
  };

  let contador = 0;
  
  analise.funcoes.forEach(f => {
    salvarComoModulo(f.nome, 'funcao', f.codigo);
    contador++;
  });
  
  analise.estilos.forEach((css, i) => {
    salvarComoModulo(`CSS_${i + 1}`, 'css', css);
    contador++;
  });

  toast(`✅ ${contador} módulos extraídos e salvos!`);
  renderModulos();
}

function copiarParaPlayground(codigo) {
  document.getElementById('playgroundCode').value = codigo;
  trocarAba('playground');
  document.querySelectorAll('.nav-tab')[2].classList.add('active');
  toast('✅ Código copiado para o Playground!');
}

function salvarComoModulo(nome, tipo, codigo) {
  const modulos = getModulos();
  modulos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    nome,
    tipo,
    codigo,
    data: new Date().toISOString()
  });
  setModulos(modulos);
}

// ========== MONTADOR ==========
function salvarModulo() {
  const nome = document.getElementById('modNome').value.trim();
  const tipo = document.getElementById('modTipo').value;
  const codigo = document.getElementById('modCodigo').value;

  if (!nome || !codigo.trim()) {
    toast('❌ Preencha nome e código!');
    return;
  }

  salvarComoModulo(nome, tipo, codigo);
  limparModulo();
  renderModulos();
  toast('✅ Módulo salvo!');
}

function limparModulo() {
  document.getElementById('modNome').value = '';
  document.getElementById('modCodigo').value = '';
}

function renderModulos() {
  const modulos = getModulos();
  const selected = getSelected();
  const container = document.getElementById('modulosList');
  const checklist = document.getElementById('montadorChecklist');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;text-align:center;padding:20px;&quot;>Nenhum módulo salvo</p>';
    if (checklist) checklist.innerHTML = '';
    return;
  }

  // Lista de módulos
  container.innerHTML = modulos.slice(-10).reverse().map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editarModulo('${m.id}')&quot;>✏️</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');

  // Checklist para montagem
  if (checklist) {
    checklist.innerHTML = '<div style=&quot;max-height:300px;overflow-y:auto;&quot;>' + modulos.map(m => `
      <label style=&quot;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border);&quot;>
        <input type=&quot;checkbox&quot; ${selected.includes(m.id) ? 'checked' : ''} onchange=&quot;toggleModulo('${m.id}')&quot; />
        <strong style=&quot;font-size:12px;&quot;>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </label>
    `).join('') + '</div>';
  }
}

function toggleModulo(id) {
  let selected = getSelected();
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    selected.push(id);
  }
  setSelected(selected);
}

function selecionarTodos() {
  setSelected(getModulos().map(m => m.id));
  renderModulos();
}

function desselecionarTodos() {
  setSelected([]);
  renderModulos();
}

function deletarModulo(id) {
  if (!confirm('Deletar este módulo?')) return;
  setModulos(getModulos().filter(m => m.id !== id));
  renderModulos();
  toast('🗑️ Módulo deletado!');
}

function editarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  document.getElementById('modNome').value = modulo.nome;
  document.getElementById('modTipo').value = modulo.tipo;
  document.getElementById('modCodigo').value = modulo.codigo;
  
  deletarModulo(id);
  toast('✏️ Editando módulo...');
}

function gerarProjetoFinal() {
  const modulos = getModulos();
  const selected = getSelected();
  const escolhidos = modulos.filter(m => selected.includes(m.id));

  if (escolhidos.length === 0) {
    toast('❌ Selecione pelo menos um módulo!');
    return;
  }

  const nome = document.getElementById('projetoNome').value || 'Projeto';
  
  const html = escolhidos.filter(m => m.tipo === 'html').map(m => m.codigo).join('\n\n');
  const css = escolhidos.filter(m => m.tipo === 'css').map(m => m.codigo).join('\n\n');
  const js = escolhidos.filter(m => m.tipo === 'js' || m.tipo === 'funcao').map(m => m.codigo).join('\n\n');

  const projeto = `<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>${escHtml(nome)}</title>
<style>
${css}
</style>
</head>
<body>

${html}

<script>
${js}
<\/script>
</body>
</html>`;

  baixarArquivo(projeto, nome.replace(/[^a-z0-9]/gi, '_') + '.html', 'text/html');
  toast('✅ Projeto gerado!');
}

// ========== PLAYGROUND ==========
function executarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  const iframe = document.getElementById('playgroundPreview');
  
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  iframe.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  
  toast('▶️ Executando...');
}

function salvarDePlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  if (!codigo.trim()) {
    toast('❌ Nada para salvar!');
    return;
  }
  
  const nome = prompt('Nome do módulo:');
  if (!nome) return;
  
  salvarComoModulo(nome, 'html', codigo);
  toast('✅ Salvo como módulo!');
}

function copiarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  navigator.clipboard.writeText(codigo);
  toast('📋 Código copiado!');
}

function abrirPreviewNovo() {
  const codigo = document.getElementById('playgroundCode').value;
  const blob = new Blob([codigo], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function limparPlayground() {
  document.getElementById('playgroundCode').value = '';
  document.getElementById('playgroundPreview').src = '';
}

// ========== ARQUIVOS ==========
function renderArquivos() {
  const modulos = getModulos();
  const container = document.getElementById('arquivosList');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);text-align:center;padding:40px;&quot;>Nenhum arquivo salvo</p>';
    return;
  }

  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
        <span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;>${new Date(m.data).toLocaleDateString('pt-BR')}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}'); renderArquivos();&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filtrarArquivos(busca) {
  const modulos = getModulos().filter(m => 
    m.nome.toLowerCase().includes(busca.toLowerCase())
  );
  
  const container = document.getElementById('arquivosList');
  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
      </div>
    </div>
  `).join('');
}

function baixarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  const ext = { html: '.html', css: '.css', js: '.js', funcao: '.js' }[modulo.tipo] || '.txt';
  baixarArquivo(modulo.codigo, modulo.nome + ext, 'text/plain');
}

function exportarTudo() {
  const data = {
    modulos: getModulos(),
    selected: getSelected(),
    data: new Date().toISOString()
  };
  
  baixarArquivo(JSON.stringify(data, null, 2), 'backup-workstation-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  toast('💾 Backup exportado!');
}

function importarTudo() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modulos) {
        setModulos(data.modulos);
        if (data.selected) setSelected(data.selected);
        toast('✅ Backup importado!');
        renderModulos();
        renderArquivos();
      }
    } catch (err) {
      toast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function limparTudo() {
  if (!confirm('⚠️ ATENÇÃO: Isso vai apagar TUDO! Tem certeza?')) return;
  if (!confirm('Última chance! Realmente deseja apagar tudo?')) return;
  
  localStorage.clear();
  toast('🗑️ Tudo limpo!');
  renderModulos();
  renderArquivos();
}

// ========== IMPORT ==========
function importarParaScanner() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('scannerInput').value = ev.target.result;
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function importarParaPlayground() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('playgroundCode').value = ev.target.result;
      executarPlayground();
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function limparScanner() {
  document.getElementById('scannerInput').value = '';
  document.getElementById('scannerResults').innerHTML = '';
}

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;/g, '&amp;amp;').replace(/</g, '&amp;lt;').replace(/>/g, '&amp;gt;').replace(/&quot;/g, '&amp;quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

function atualizarContador() {
  const count = getModulos().length;
  const el = document.getElementById('modCount');
  if (el) el.textContent = count;
}

// Init
atualizarContador();
renderModulos();
</script>

.card-actions { display:flex; gap:4px; margin-top:8px; }

/* Área de trabalho */
.workspace { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
.workspace h2 { font-size:14px; color:var(--accent); margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* Botões */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:none; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; transition:all 0.15s; }
.btn-sm { padding:5px 10px; font-size:10px; }
.btn-primary { background:var(--accent); color:#000; }
.btn-primary:hover { background:var(--accent2); }
.btn-success { background:var(--green); color:#000; }
.btn-danger { background:rgba(239,68,68,0.2); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
.btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--bg3); color:var(--text); }
.btn-blue { background:rgba(96,165,250,0.15); color:var(--blue); border:1px solid rgba(96,165,250,0.3); }

/* Textarea */
.code-area { width:100%; min-height:200px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; font-family:'Consolas','Fira Code',monospace; font-size:12px; color:var(--text); resize:vertical; line-height:1.6; }
.code-area:focus { outline:none; border-color:var(--accent); }
.code-area.large { min-height:400px; }

/* Input */
.input { width:100%; padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:12px; }
.input:focus { outline:none; border-color:var(--accent); }
.input-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.input-row { margin-bottom:8px; }
.input-row label { display:block; font-size:10px; color:var(--text2); margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; font-weight:600; }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab-btn { padding:8px 16px; border:1px solid var(--border); background:transparent; color:var(--text2); border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; }
.tab-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }

/* Preview */
.preview-frame { width:100%; height:500px; border:1px solid var(--border); border-radius:8px; background:white; }

/* Status */
.status { padding:10px 14px; border-radius:8px; font-size:11px; font-weight:600; margin-bottom:12px; }
.status-info { background:rgba(96,165,250,0.1); color:var(--blue); border:1px solid rgba(96,165,250,0.2); }
.status-success { background:rgba(74,222,128,0.1); color:var(--green); border:1px solid rgba(74,222,128,0.2); }

/* Responsive */
@media(max-width:768px) {
  .modules-grid { grid-template-columns:1fr; }
  .input-group { grid-template-columns:1fr; }
  .container { padding:12px; }
}

.empty-state { text-align:center; padding:40px; color:var(--text2); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

.section-title { font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:2px; font-weight:700; margin:24px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }

.flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

.checklist { list-style:none; }
.checklist li { padding:6px 0; font-size:12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); }
.checklist li:last-child { border:none; }
.check { width:18px; height:18px; border-radius:4px; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; transition:all 0.15s; }
.check.checked { background:var(--green); border-color:var(--green); color:#000; }
</style>
</head>
<body>

<div class=&quot;header&quot;>
  <h1>🧩 Montador de Módulos <small>PWA JURÍDICO — MAIKON CALDEIRA</small></h1>
  <div style=&quot;display:flex;gap:6px;flex-wrap:wrap;&quot;>
    <button class=&quot;btn btn-primary&quot; onclick=&quot;exportFinal()&quot;>📦 Gerar HTML Final</button>
    <button class=&quot;btn btn-ghost&quot; onclick=&quot;exportBackup()&quot;>💾 Backup Módulos</button>
    <button class=&quot;btn btn-ghost&quot; onclick=&quot;importBackup()&quot;>📂 Importar Backup</button>
  </div>
</div>

<div class=&quot;container&quot;>

  <!-- Instruções -->
  <div class=&quot;status status-info&quot;>
    💡 <strong>Como usar:</strong> Cole pedaços de código HTML nos módulos abaixo. Dê um nome e descrição para cada um. 
    Depois marque quais quer incluir e clique em &quot;Gerar HTML Final&quot; para combinar tudo num arquivo só.
  </div>

  <!-- Tabs -->
  <div class=&quot;tabs&quot;>
    <button class=&quot;tab-btn active&quot; onclick=&quot;showSection('add')&quot;>➕ Adicionar Módulo</button>
    <button class=&quot;tab-btn&quot; onclick=&quot;showSection('modules')&quot;>📦 Meus Módulos (<span id=&quot;moduleCount&quot;>0</span>)</button>
    <button class=&quot;tab-btn&quot; onclick=&quot;showSection('build')&quot;>🔨 Montar Projeto</button>
    <button class=&quot;tab-btn&quot; onclick=&quot;showSection('preview')&quot;>👁️ Preview</button>
    <button class=&quot;tab-btn&quot; onclick=&quot;showSection('guide')&quot;>📖 Guia</button>
  </div>

  <!-- Section: Add Module -->
  <div id=&quot;section-add&quot; class=&quot;workspace&quot;>
    <h2>➕ Adicionar Novo Módulo de Código</h2>
    
    <div class=&quot;input-group&quot;>
      <div class=&quot;input-row&quot;>
        <label>Nome do Módulo</label>
        <input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modName&quot; placeholder=&quot;Ex: Importar PDF, Exportar Word, Formulário Cliente...&quot; />
      </div>
      <div class=&quot;input-row&quot;>
        <label>Tipo</label>
        <select class=&quot;input&quot; id=&quot;modType&quot;>
          <option value=&quot;funcao&quot;>🔧 Função/Lógica (JavaScript)</option>
          <option value=&quot;visual&quot;>🎨 Visual/Interface (HTML+CSS)</option>
          <option value=&quot;completo&quot;>📄 Bloco Completo (HTML+CSS+JS)</option>
          <option value=&quot;estilo&quot;>💅 Apenas CSS/Estilo</option>
          <option value=&quot;dados&quot;>📊 Dados/Templates</option>
        </select>
      </div>
    </div>
    
    <div class=&quot;input-row&quot;>
      <label>Descrição (o que esse código faz?)</label>
      <input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modDesc&quot; placeholder=&quot;Ex: Lê arquivo PDF e extrai nome, CPF e endereço do segurado...&quot; />
    </div>
    
    <div class=&quot;input-row&quot;>
      <label>Tags (separadas por vírgula)</label>
      <input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modTags&quot; placeholder=&quot;Ex: pdf, importar, inss, dados&quot; />
    </div>
    
    <div class=&quot;input-row&quot;>
      <label>Cole o Código Aqui</label>
      <textarea class=&quot;code-area large&quot; id=&quot;modCode&quot; placeholder=&quot;Cole aqui o pedaço de código HTML/CSS/JS que quer salvar como módulo...&quot;></textarea>
    </div>
    
    <div style=&quot;display:flex;gap:8px;margin-top:12px;&quot;>
      <button class=&quot;btn btn-primary&quot; onclick=&quot;saveModule()&quot;>💾 Salvar Módulo</button>
      <button class=&quot;btn btn-ghost&quot; onclick=&quot;clearForm()&quot;>🗑️ Limpar</button>
      <button class=&quot;btn btn-blue&quot; onclick=&quot;importFromFile()&quot;>📂 Importar de Arquivo</button>
    </div>
  </div>

  <!-- Section: Modules List -->
  <div id=&quot;section-modules&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;>
    <div class=&quot;flex-between&quot;>
      <h2>📦 Módulos Salvos</h2>
      <input type=&quot;text&quot; class=&quot;input&quot; style=&quot;width:200px;&quot; placeholder=&quot;🔍 Buscar...&quot; oninput=&quot;filterModules(this.value)&quot; />
    </div>
    <div class=&quot;modules-grid&quot; id=&quot;modulesGrid&quot;></div>
  </div>

  <!-- Section: Build -->
  <div id=&quot;section-build&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;>
    <h2>🔨 Montar Projeto Final</h2>
    <p style=&quot;font-size:12px;color:var(--text2);margin-bottom:16px;&quot;>
      Marque os módulos que deseja incluir no HTML final. A ordem importa — arraste ou use as setas para reorganizar.
    </p>
    
    <div class=&quot;input-row&quot;>
      <label>Título do Projeto Final</label>
      <input type=&quot;text&quot; class=&quot;input&quot; id=&quot;buildTitle&quot; value=&quot;PWA Jurídico — Maikon Caldeira&quot; />
    </div>
    
    <div class=&quot;input-row&quot;>
      <label>CSS Base (opcional — será incluído no &amp;lt;head&amp;gt;)</label>
      <textarea class=&quot;code-area&quot; id=&quot;buildBaseCss&quot; style=&quot;min-height:80px;&quot; placeholder=&quot;/* CSS base que vai em todos os projetos */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; }&quot;></textarea>
    </div>
    
    <div class=&quot;section-title&quot;>Selecione os Módulos para Incluir</div>
    <div id=&quot;buildChecklist&quot;></div>
    
    <div style=&quot;margin-top:16px;display:flex;gap:8px;&quot;>
      <button class=&quot;btn btn-success&quot; onclick=&quot;exportFinal()&quot;>📦 Gerar HTML Final</button>
      <button class=&quot;btn btn-ghost&quot; onclick=&quot;selectAll()&quot;>✅ Selecionar Todos</button>
      <button class=&quot;btn btn-ghost&quot; onclick=&quot;deselectAll()&quot;>⬜ Desmarcar Todos</button>
    </div>
  </div>

  <!-- Section: Preview -->
  <div id=&quot;section-preview&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;>
    <div class=&quot;flex-between&quot;>
      <h2>👁️ Preview do Projeto Montado</h2>
      <div style=&quot;display:flex;gap:6px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;refreshPreview()&quot;>🔄 Atualizar</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;openFullPreview()&quot;>🔳 Tela Cheia</button>
      </div>
    </div>
    <iframe class=&quot;preview-frame&quot; id=&quot;previewFrame&quot;></iframe>
  </div>

  <!-- Section: Guide -->
  <div id=&quot;section-guide&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;>
    <h2>📖 Guia — Como Montar seu PWA</h2>
    
    <div class=&quot;status status-info&quot; style=&quot;margin-top:12px;&quot;>
      🎯 <strong>Estratégia:</strong> Em vez de tentar fazer tudo de uma vez, vamos por partes. 
      Cada funcionalidade vira um &quot;módulo&quot; independente. Depois juntamos.
    </div>
    
    <div class=&quot;section-title&quot;>Passo a Passo</div>
    <ol style=&quot;font-size:12px;line-height:2;padding-left:20px;color:var(--text2);&quot;>
      <li><strong style=&quot;color:var(--text)&quot;>Separe os códigos por função</strong> — cada pedaço faz UMA coisa (importar PDF, gerar documento, salvar dados...)</li>
      <li><strong style=&quot;color:var(--text)&quot;>Cole cada pedaço como módulo</strong> — use a aba &quot;Adicionar Módulo&quot; e dê nome descritivo</li>
      <li><strong style=&quot;color:var(--text)&quot;>Teste individual</strong> — na aba Preview, veja se cada módulo funciona sozinho</li>
      <li><strong style=&quot;color:var(--text)&quot;>Monte o projeto</strong> — na aba &quot;Montar&quot;, selecione os módulos e gere o HTML final</li>
      <li><strong style=&quot;color:var(--text)&quot;>Ajuste conflitos</strong> — se algo quebrar, traga aqui que te ajudo a resolver</li>
    </ol>
    
    <div class=&quot;section-title&quot;>Tipos de Módulo</div>
    <table style=&quot;width:100%;font-size:11px;border-collapse:collapse;&quot;>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--blue);&quot;>🔧 Função/Lógica</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Código JavaScript puro (funções, cálculos, processamento de dados)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--green);&quot;>🎨 Visual/Interface</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>HTML + CSS (botões, formulários, layout, cards)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:var(--accent);&quot;>📄 Bloco Completo</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>HTML + CSS + JS juntos (componente inteiro que funciona sozinho)</td>
      </tr>
      <tr style=&quot;border-bottom:1px solid var(--border);&quot;>
        <td style=&quot;padding:8px;color:#c084fc;&quot;>💅 Apenas CSS</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Estilos visuais (tema, cores, fontes, animações)</td>
      </tr>
      <tr>
        <td style=&quot;padding:8px;color:var(--red);&quot;>📊 Dados/Templates</td>
        <td style=&quot;padding:8px;color:var(--text2);&quot;>Modelos de documentos, arrays de dados, configurações</td>
      </tr>
    </table>
    
    <div class=&quot;section-title&quot;>Sobre o Banco de Dados (Neon)</div>
    <div style=&quot;font-size:12px;color:var(--text2);line-height:1.8;&quot;>
      <p>⚠️ <strong style=&quot;color:var(--text)&quot;>Importante:</strong> Um HTML puro no navegador <strong>NÃO consegue</strong> conectar direto no Neon (PostgreSQL). Precisa de um &quot;servidor&quot; no meio.</p>
      <p style=&quot;margin-top:8px;&quot;>🟢 <strong style=&quot;color:var(--green)&quot;>Alternativa que funciona sem servidor:</strong></p>
      <ul style=&quot;padding-left:16px;margin-top:4px;&quot;>
        <li><strong>localStorage</strong> — salva no navegador (o que estamos usando aqui)</li>
        <li><strong>IndexedDB</strong> — banco mais robusto no navegador (suporta mais dados)</li>
        <li><strong>Exportar/Importar JSON</strong> — backup manual dos dados</li>
      </ul>
      <p style=&quot;margin-top:8px;&quot;>🔵 <strong style=&quot;color:var(--blue)&quot;>Se quiser Neon no futuro:</strong> Precisará de um backend (Vercel Functions, Cloudflare Workers, ou Supabase que já dá tudo pronto).</p>
    </div>
  </div>

</div>

<!-- Hidden -->
<input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display:none&quot; accept=&quot;.html,.htm,.js,.css,.txt,.json&quot; />
<input type=&quot;file&quot; id=&quot;backupInput&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; />

<!-- Toast -->
<div class=&quot;toast&quot; id=&quot;toast&quot; style=&quot;position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;&quot;></div>

<script>
// ========== STATE ==========
const LS_MODULES = 'pwa-modules-v1';
const LS_SELECTED = 'pwa-selected-v1';

function getModules() {
  try { return JSON.parse(localStorage.getItem(LS_MODULES) || '[]'); } catch { return []; }
}
function setModules(list) { localStorage.setItem(LS_MODULES, JSON.stringify(list)); }
function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); } catch { return []; }
}
function setSelected(list) { localStorage.setItem(LS_SELECTED, JSON.stringify(list)); }

// ========== UI ==========
function showSection(name) {
  ['add','modules','build','preview','guide'].forEach(s => {
    document.getElementById('section-' + s).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const sections = ['add','modules','build','preview','guide'];
    btn.classList.toggle('active', sections[i] === name);
  });
  if (name === 'modules') renderModules();
  if (name === 'build') renderBuildChecklist();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => { t.style.transform = 'translateY(100px)'; t.style.opacity = '0'; }, 2500);
}

// ========== MODULES ==========
function saveModule() {
  const name = document.getElementById('modName').value.trim();
  const type = document.getElementById('modType').value;
  const desc = document.getElementById('modDesc').value.trim();
  const tags = document.getElementById('modTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const code = document.getElementById('modCode').value;
  
  if (!name) { showToast('❌ Dê um nome ao módulo!'); return; }
  if (!code.trim()) { showToast('❌ Cole algum código!'); return; }
  
  const modules = getModules();
  modules.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, type, desc, tags, code,
    date: new Date().toISOString()
  });
  setModules(modules);
  updateCount();
  clearForm();
  showToast('✅ Módulo &quot;' + name + '&quot; salvo!');
}

function clearForm() {
  document.getElementById('modName').value = '';
  document.getElementById('modDesc').value = '';
  document.getElementById('modTags').value = '';
  document.getElementById('modCode').value = '';
}

function renderModules(filter = '') {
  const modules = getModules().filter(m => 
    !filter || m.name.toLowerCase().includes(filter.toLowerCase()) || m.tags.some(t => t.toLowerCase().includes(filter.toLowerCase()))
  );
  const grid = document.getElementById('modulesGrid');
  
  if (modules.length === 0) {
    grid.innerHTML = '<div class=&quot;empty-state&quot;><div class=&quot;icon&quot;>📭</div><p>Nenhum módulo salvo ainda.<br>Use a aba &quot;Adicionar Módulo&quot; para começar!</p></div>';
    return;
  }
  
  grid.innerHTML = modules.map(m => `
    <div class=&quot;module-card&quot;>
      <div class=&quot;card-header&quot;>
        <h3>${escHtml(m.name)}</h3>
        <span class=&quot;tag ${m.type === 'visual' ? 'visual' : m.type === 'funcao' ? 'logica' : ''}&quot;>${getTypeLabel(m.type)}</span>
      </div>
      ${m.desc ? `<div class=&quot;desc&quot;>${escHtml(m.desc)}</div>` : ''}
      <div class=&quot;tags&quot;>${m.tags.map(t => `<span class=&quot;tag&quot;>${escHtml(t)}</span>`).join('')}</div>
      <pre>${escHtml(m.code.slice(0, 200))}${m.code.length > 200 ? '...' : ''}</pre>
      <div class=&quot;card-actions&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;viewModule('${m.id}')&quot;>👁️ Ver</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editModule('${m.id}')&quot;>✏️ Editar</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copyModule('${m.id}')&quot;>📋 Copiar</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deleteModule('${m.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filterModules(query) { renderModules(query); }

function deleteModule(id) {
  if (!confirm('Excluir este módulo?')) return;
  setModules(getModules().filter(m => m.id !== id));
  renderModules();
  updateCount();
  showToast('🗑️ Módulo excluído!');
}

function copyModule(id) {
  const m = getModules().find(x => x.id === id);
  if (m) { navigator.clipboard.writeText(m.code); showToast('📋 Código copiado!'); }
}

function viewModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
}

function editModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  // Remove old and let user save as new
  setModules(getModules().filter(x => x.id !== id));
  viewModule(id); // This won't find it anymore, so we set manually
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
  updateCount();
  showToast('✏️ Editando módulo — salve quando terminar!');
}

// ========== BUILD ==========
function renderBuildChecklist() {
  const modules = getModules();
  const selected = getSelected();
  const container = document.getElementById('buildChecklist');
  
  if (modules.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;&quot;>Nenhum módulo disponível. Adicione módulos primeiro.</p>';
    return;
  }
  
  container.innerHTML = '<ul class=&quot;checklist&quot;>' + modules.map((m, i) => `
    <li>
      <div class=&quot;check ${selected.includes(m.id)?'checked':''}&quot; onclick=&quot;toggleSelect('${m.id}')&quot;>
        ${selected.includes(m.id) ? '✓' : ''}
      </div>
      <div style=&quot;flex:1;&quot;>
        <strong style=&quot;font-size:12px;&quot;>${escHtml(m.name)}</strong>
        <span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;>${getTypeLabel(m.type)}</span>
        ${m.desc ? `<br><span style=&quot;font-size:10px;color:var(--text2);&quot;>${escHtml(m.desc)}</span>` : ''}
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},-1)&quot;>⬆️</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},1)&quot;>⬇️</button>
      </div>
    </li>
  `).join('') + '</ul>';
}

function toggleSelect(id) {
  let selected = getSelected();
  if (selected.includes(id)) selected = selected.filter(x => x !== id);
  else selected.push(id);
  setSelected(selected);
  renderBuildChecklist();
}

function selectAll() {
  setSelected(getModules().map(m => m.id));
  renderBuildChecklist();
}

function deselectAll() {
  setSelected([]);
  renderBuildChecklist();
}

function moveModule(index, dir) {
  const modules = getModules();
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= modules.length) return;
  [modules[index], modules[newIndex]] = [modules[newIndex], modules[index]];
  setModules(modules);
  renderBuildChecklist();
}

// ========== EXPORT ==========
function exportFinal() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  if (chosen.length === 0) {
    showToast('⚠️ Selecione pelo menos um módulo na aba &quot;Montar&quot;!');
    showSection('build');
    return;
  }
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  
  // Separate by type
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => `\n<!-- === MÓDULO: ${m.name} === -->\n${m.code}`).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => `\n// === MÓDULO: ${m.name} ===\n${m.code}`).join('\n');
  
  // Check if any module is a complete document
  const completeDoc = chosen.find(m => m.code.trim().toLowerCase().includes('<!doctype') || m.code.trim().toLowerCase().includes('<html'));
  
  let finalHtml;
  if (completeDoc &amp;&amp; chosen.length === 1) {
    finalHtml = completeDoc.code;
  } else {
    finalHtml = `<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>${escHtml(title)}</title>
<style>
/* === CSS BASE === */
${baseCss}

/* === MÓDULOS CSS === */
${styles}
</style>
</head>
<body>

${htmlParts}

<script>
${scripts}
<\/script>
</body>
</html>`;
  }
  
  // Download
  const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title.replace(/[^a-zA-Z0-9]/g, '_') || 'projeto') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📦 HTML final gerado e baixado!');
}

function refreshPreview() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => m.code).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => m.code).join('\n');
  
  const doc = `<!DOCTYPE html><html><head><meta charset=&quot;UTF-8&quot;><style>${baseCss}\n${styles}</style></head><body>${htmlParts}<script>${scripts}<\/script></body></html>`;
  
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  document.getElementById('previewFrame').src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function openFullPreview() {
  refreshPreview();
  const frame = document.getElementById('previewFrame');
  if (frame.src) window.open(frame.src, '_blank');
}

// ========== BACKUP ==========
function exportBackup() {
  const data = { modules: getModules(), selected: getSelected(), date: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pwa-modulos-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Backup exportado!');
}

function importBackup() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modules) {
        const existing = getModules();
        const merged = [...existing, ...data.modules.filter(m => !existing.find(e => e.id === m.id))];
        setModules(merged);
        if (data.selected) setSelected(data.selected);
        updateCount();
        showToast('📂 Backup importado! ' + data.modules.length + ' módulos.');
      }
    } catch(err) {
      showToast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Import code from file
function importFromFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('modCode').value = ev.target.result;
    if (!document.getElementById('modName').value) {
      document.getElementById('modName').value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('📂 Código do arquivo carregado!');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== UTILS ==========
function escHtml(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }
function getTypeLabel(type) {
  const labels = { funcao:'🔧 Função', visual:'🎨 Visual', completo:'📄 Completo', estilo:'💅 CSS', dados:'📊 Dados' };
  return labels[type] || type;
}
function updateCount() {
  document.getElementById('moduleCount').textContent = getModules().length;
}

// Init
updateCount();
</script>

<div class=&quot;modal-overlay&quot; id=&quot;savedModal&quot;>
  <div class=&quot;modal&quot;>
    <button class=&quot;btn-icon modal-close&quot; onclick=&quot;closeSavedModal()&quot;>✕</button>

    <h3>🔍 Ir para Linha</h3>

      <input type=&quot;number&quot; id=&quot;gotoLineInput&quot; class=&quot;form-input&quot; placeholder=&quot;Número da linha...&quot; min=&quot;1&quot; style=&quot;flex:1;&quot; />
      <button class=&quot;btn btn-primary&quot; onclick=&quot;gotoLine()&quot;>Ir</button>
