<script>
let codigoOriginal = &quot;&quot;;
let nomArquivo = &quot;&quot;;

// =====================
// CARREGAR ARQUIVO
// =====================
function carregarArquivo() {
  const input = document.getElementById(&quot;arquivo&quot;);
  const file = input.files[0];
  if (!file) {
    alert(&quot;Selecione um arquivo primeiro!&quot;);
    return;
  }
  nomArquivo = file.name;
  const reader = new FileReader();
  reader.onload = function(e) {
    codigoOriginal = e.target.result;
    processarCodigo(file.name);
  };
  reader.readAsText(file, &quot;UTF-8&quot;);
}

function abrirColagem() {
  const texto = prompt(&quot;Cole aqui o código (pode ser grande):&quot;);
  if (!texto) return;
  codigoOriginal = texto;
  nomArquivo = &quot;codigo-colado.txt&quot;;
  processarCodigo(&quot;Código Colado&quot;);
}

// =====================
// PROCESSAR
// =====================
function processarCodigo(nome) {
  const linhas = codigoOriginal.split('\n').length;
  const kb = (codigoOriginal.length / 1024).toFixed(1);

  // Contar functions
  const regexFunc = /function\s+(\w+)\s*\(/g;
  const regexArrow = /const\s+(\w+)\s*=\s*(?:async\s*)?\(/g;
  const funcs = [...codigoOriginal.matchAll(regexFunc)];
  const arrows = [...codigoOriginal.matchAll(regexArrow)];
  const totalFuncs = funcs.length + arrows.length;

  // Contar JSONs
  const jsonMatches = codigoOriginal.match(/\{[^{}]{10,}\}/g) || [];

  // Atualizar stats
  document.getElementById(&quot;statLinhas&quot;).textContent = linhas.toLocaleString();
  document.getElementById(&quot;statKB&quot;).textContent = kb;
  document.getElementById(&quot;statFunctions&quot;).textContent = totalFuncs;
  document.getElementById(&quot;statJsons&quot;).textContent = jsonMatches.length;

  // Detectar tecnologias
  let tags = &quot;&quot;;
  if (codigoOriginal.includes(&quot;localStorage&quot;)) tags += '<span class=&quot;tag tag-verde&quot;>🧠 localStorage</span>';
  if (codigoOriginal.includes(&quot;gemini&quot;) || codigoOriginal.includes(&quot;Gemini&quot;)) tags += '<span class=&quot;tag tag-azul&quot;>🤖 Gemini</span>';
  if (codigoOriginal.includes(&quot;openai&quot;) || codigoOriginal.includes(&quot;OpenAI&quot;) || codigoOriginal.includes(&quot;gpt&quot;)) tags += '<span class=&quot;tag tag-azul&quot;>🤖 OpenAI/GPT</span>';
  if (codigoOriginal.includes(&quot;fetch(&quot;)) tags += '<span class=&quot;tag tag-amarelo&quot;>🌐 fetch/API</span>';
  if (codigoOriginal.includes(&quot;checkpoint&quot;)) tags += '<span class=&quot;tag tag-roxo&quot;>💾 Checkpoint</span>';
  if (codigoOriginal.includes(&quot;memoria&quot;) || codigoOriginal.includes(&quot;memory&quot;)) tags += '<span class=&quot;tag tag-verde&quot;>💭 Memória</span>';
  if (codigoOriginal.includes(&quot;cerebro&quot;) || codigoOriginal.includes(&quot;brain&quot;)) tags += '<span class=&quot;tag tag-verde&quot;>🧠 Cérebro</span>';
  if (codigoOriginal.includes(&quot;<html&quot;) || codigoOriginal.includes(&quot;<!DOCTYPE&quot;)) tags += '<span class=&quot;tag tag-azul&quot;>🖼️ HTML</span>';
  if (codigoOriginal.includes(&quot;import &quot;) || codigoOriginal.includes(&quot;require(&quot;)) tags += '<span class=&quot;tag tag-amarelo&quot;>📦 Módulos</span>';
  if (codigoOriginal.includes(&quot;class &quot;)) tags += '<span class=&quot;tag tag-roxo&quot;>🏗️ Classes</span>';

  document.getElementById(&quot;tagDetectadas&quot;).innerHTML = tags;

  // Mostrar cards
  document.getElementById(&quot;cardStats&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;cardAcoes&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;statusCarga&quot;).innerHTML = `✅ <strong>${nome}</strong> carregado com sucesso`;
  document.getElementById(&quot;statusCarga&quot;).style.color = &quot;#4ade80&quot;;

  // Mostrar resumo na visualização
  mostrarNaVisualizacao(&quot;📊 ANÁLISE DO ARQUIVO: &quot; + nome, `
ARQUIVO: ${nome}
TAMANHO: ${kb} KB
LINHAS: ${linhas.toLocaleString()}
FUNCTIONS: ${totalFuncs}
BLOCOS JSON: ${jsonMatches.length}

TECNOLOGIAS DETECTADAS:

function mostrarFunctions() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  const linhas = codigoOriginal.split('\n');
  const blocos = [];

  linhas.forEach((linha, i) => {
    const limpada = linha.trim();

    // function normal
    const mFunc = limpada.match(/^(?:async\s+)?function\s+(\w+)\s*\(/);
    if (mFunc) {
      blocos.push({ tipo: 'function', nome: mFunc[1], linha: i+1, preview: limpada.substring(0, 80) });
    }

    // arrow function / const
    const mArrow = limpada.match(/^(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?\(/);
    if (mArrow) {
      blocos.push({ tipo: 'arrow', nome: mArrow[1], linha: i+1, preview: limpada.substring(0, 80) });
    }

    // classe
    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) {
      blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    }

    // localStorage
    if (limpada.includes(&quot;localStorage&quot;)) {
      blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    }

    // fetch / API
    if (limpada.includes(&quot;fetch(&quot;) || limpada.includes(&quot;apiKey&quot;) || limpada.includes(&quot;api_key&quot;)) {
      blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
    }
  });

  // Mostrar lista
  const cardBlocos = document.getElementById(&quot;cardBlocos&quot;);
  const listaBlocos = document.getElementById(&quot;listaBlocos&quot;);
  const tituloBlocos = document.getElementById(&quot;tituloBlocos&quot;);

  tituloBlocos.textContent = `📋 ${blocos.length} Blocos Encontrados`;
  cardBlocos.style.display = &quot;block&quot;;

  if (blocos.length === 0) {
    listaBlocos.innerHTML = '<div class=&quot;aviso&quot;>Nenhuma function encontrada. O código pode estar muito minificado (tudo em uma linha).</div>';
    return;
  }

  let html = &quot;&quot;;
  blocos.forEach((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    const icone = b.tipo === 'local' ? '🧠' : b.tipo === 'api' ? '🌐' : b.tipo === 'classe' ? '🏗️' : '⚡';
    html += `
      <div class=&quot;item-funcao ${cor}&quot; onclick=&quot;extrairFuncaoEspecifica(${idx})&quot; title=&quot;Clique para ver o código desta função&quot;>
        <div class=&quot;nome-funcao&quot;>${icone} ${b.nome}</div>
        <div class=&quot;desc-funcao&quot;>${b.preview}...</div>
        <div class=&quot;linha-funcao&quot;>Linha ${b.linha} · Clique para extrair</div>
      </div>
    `;
  });

  listaBlocos.innerHTML = html;

  // Guardar para referência
  window._blocos = blocos;

  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES/BLOCOS ENCONTRADOS`,
    blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n')
  );
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;

  const linhas = codigoOriginal.split('\n');
  const inicio = bloco.linha - 1;

  // Tenta pegar o bloco completo contando chaves
  let codigo = &quot;&quot;;
  let abertas = 0;
  let comecou = false;

  for (let i = inicio; i < Math.min(inicio + 200, linhas.length); i++) {
    const linha = linhas[i];
    codigo += linha + '\n';

    for (const char of linha) {
      if (char === '{') { abertas++; comecou = true; }
      if (char === '}') abertas--;
    }

    if (comecou &amp;&amp; abertas <= 0) break;
  }

  mostrarNaVisualizacao(`📋 BLOCO EXTRAÍDO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

function extrairLocalStorage() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  const linhas = codigoOriginal.split('\n');
  const encontrados = [];

  linhas.forEach((linha, i) => {
    if (linha.includes(&quot;localStorage&quot;)) {
      // Pega contexto (3 linhas antes e depois)
      const inicio = Math.max(0, i - 2);
      const fim = Math.min(linhas.length, i + 3);
      const contexto = linhas.slice(inicio, fim).join('\n');
      encontrados.push(`[Linha ${i+1}]:\n${contexto}`);
    }
  });

  if (encontrados.length === 0) {
    mostrarNaVisualizacao(&quot;🧠 CÉREBRO (localStorage)&quot;, &quot;❌ localStorage não encontrado.\nO código pode não usar localStorage, ou pode estar minificado com nome diferente.&quot;);
    return;
  }

  mostrarNaVisualizacao(
    `🧠 CÉREBRO: ${encontrados.length} usos de localStorage encontrados`,
    encontrados.join('\n\n' + '─'.repeat(60) + '\n\n')
  );
}

// =====================
// EXTRAIR JSON
// =====================
function extrairJSON() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  const jsonRegex = /\{(?:[^{}]|\{[^{}]*\})*\}/g;
  const matches = codigoOriginal.match(jsonRegex) || [];

  const jsonsValidos = [];
  matches.forEach((m, i) => {
    if (m.length < 20) return; // ignora JSONs muito pequenos
    try {
      const parsed = JSON.parse(m);
      jsonsValidos.push({ index: i, original: m, parsed: JSON.stringify(parsed, null, 2) });
    } catch(e) {
      // não é JSON válido, mas pode ser objeto JS
      if (m.length > 50) {
        jsonsValidos.push({ index: i, original: m, parsed: m });
      }
    }
  });

  if (jsonsValidos.length === 0) {
    mostrarNaVisualizacao(&quot;📦 BLOCOS JSON&quot;, &quot;Nenhum JSON válido encontrado.\nO código pode estar muito minificado.&quot;);
    return;
  }

  mostrarNaVisualizacao(
    `📦 ${jsonsValidos.length} BLOCOS JSON ENCONTRADOS`,
    jsonsValidos.slice(0, 20).map((j, i) =>
      `═══ JSON #${i+1} (${j.original.length} chars) ═══\n${j.parsed}`
    ).join('\n\n')
  );
}

// =====================
// EXTRAIR API

function extrairAPI() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  const linhas = codigoOriginal.split('\n');
  const encontrados = [];
  const palavrasChave = ['fetch(', 'apiKey', 'api_key', 'Authorization', 'Bearer', 'gemini', 'openai', 'gpt-', 'claude', 'anthropic', 'generativelanguage', 'googleapis'];

  linhas.forEach((linha, i) => {

    if (palavrasChave.some(p => linhaBaixa.includes(p.toLowerCase()))) {
      const inicio = Math.max(0, i - 1);
      const fim = Math.min(linhas.length, i + 4);
      const contexto = linhas.slice(inicio, fim).join('\n');
      encontrados.push(`[Linha ${i+1}]:\n${contexto}`);
    }
  });

  if (encontrados.length === 0) {
    mostrarNaVisualizacao(&quot;🌐 CHAMADAS DE API/IA&quot;, &quot;Nenhuma chamada de API encontrada.\nPode estar minificada ou usando outro método.&quot;);
    return;
  }

  mostrarNaVisualizacao(
    `🌐 ${encontrados.length} CHAMADAS DE API/IA ENCONTRADAS`,
    encontrados.join('\n\n' + '─'.repeat(60) + '\n\n')
  );
}

// =====================
// ORGANIZAR CÓDIGO
// =====================
function organizarCodigo() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  let organizado = codigoOriginal;

  // Adiciona quebras de linha em lugares estratégicos
  organizado = organizado
    .replace(/;(?!\n)/g, ';\n')
    .replace(/\{(?!\n)/g, '{\n')
    .replace(/\}(?!\n)/g, '}\n')
    .replace(/,(?!\n)(?!\s)/g, ',\n')
    .replace(/\n{3,}/g, '\n\n'); // remove linhas em branco demais

  // Tenta indentar (simples)
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';

    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel - 1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;

    return resultado;
  });

  organizado = indentado.join('\n');

  mostrarNaVisualizacao(&quot;✨ CÓDIGO ORGANIZADO (Beautified)&quot;, organizado);
}

function gerarManual() {

  if (temCheckpoint) manual += &quot;✅ Tem sistema de Checkpoint (salva progresso)\n&quot;;
  if (temMemoria) manual += &quot;✅ Tem sistema de Memória\n&quot;;

  manual += &quot;\n📋 ESTRUTURA ENCONTRADA:\n&quot;;
  manual += &quot;─&quot;.repeat(40) + &quot;\n&quot;;

  if (secoes.length > 0) {

  } else {
    manual += &quot;⚠️ Código muito minificado - estrutura difícil de detectar automaticamente.\n&quot;;
    manual += &quot;Use 'Organizar Código' primeiro, depois gere o manual novamente.\n&quot;;
  }

  manual += &quot;\n💡 RECOMENDAÇÃO:\n&quot;;
  manual += &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  manual += &quot;1. Extraia o Cérebro (localStorage) → é a parte mais valiosa\n&quot;;
  manual += &quot;2. Extraia as chamadas de API → para saber qual IA estava usando\n&quot;;
  manual += &quot;3. Copie os blocos que funcionam\n&quot;;
  manual += &quot;4. Traga aqui para criar um projeto novo e limpo\n&quot;;

  mostrarNaVisualizacao(&quot;📖 MANUAL DO CÓDIGO&quot;, manual);
}

<script>
// =====================
// ESTADO GLOBAL
// =====================
let codigoOriginal = &quot;&quot;;
let nomArquivo = &quot;&quot;;
let arquivosZip = []; // lista de arquivos dentro do ZIP/APK
let memoriaArquivos = JSON.parse(localStorage.getItem(&quot;cirurgiao_memoria&quot;) || &quot;[]&quot;);

// =====================
// AUTO-DETECTAR PROVEDOR DE IA
// =====================
const PROVEDORES = [
  { prefix: &quot;gsk_&quot;,   url: &quot;https://api.groq.com/openai/v1&quot;,                              model: &quot;llama-3.3-70b-versatile&quot;,  nome: &quot;Groq&quot; },
  { prefix: &quot;sk-or-&quot;, url: &quot;https://openrouter.ai/api/v1&quot;,                                model: &quot;openai/gpt-4o-mini&quot;,       nome: &quot;OpenRouter&quot; },
  { prefix: &quot;pplx-&quot;,  url: &quot;https://api.perplexity.ai&quot;,                                   model: &quot;sonar-pro&quot;,                nome: &quot;Perplexity&quot; },
  { prefix: &quot;AIza&quot;,   url: &quot;https://generativelanguage.googleapis.com/v1beta/openai&quot;,      model: &quot;gemini-2.0-flash&quot;,         nome: &quot;Google Gemini&quot; },
  { prefix: &quot;xai-&quot;,   url: &quot;https://api.x.ai/v1&quot;,                                         model: &quot;grok-2-latest&quot;,            nome: &quot;xAI/Grok&quot; },
  { prefix: &quot;sk-&quot;,    url: &quot;https://api.openai.com/v1&quot;,                                   model: &quot;gpt-4o-mini&quot;,              nome: &quot;OpenAI&quot; },
];

function detectarProvedor(chave) {
  const k = (chave || &quot;&quot;).trim();
  for (const p of PROVEDORES) {
    if (k.startsWith(p.prefix)) return p;
  }
  return null;
}

document.getElementById(&quot;iaApiKey&quot;).addEventListener(&quot;input&quot;, function() {
  const p = detectarProvedor(this.value);
  const el = document.getElementById(&quot;iaProviderDetectado&quot;);
  el.textContent = p ? `✅ Detectado: ${p.nome} · Modelo: ${p.model}` : &quot;&quot;;
  if (this.value.trim()) localStorage.setItem(&quot;cirurgiao_apikey&quot;, this.value.trim());
});

// Restaurar chave salva
window.addEventListener(&quot;load&quot;, () => {
  const chaveSalva = localStorage.getItem(&quot;cirurgiao_apikey&quot;);
  if (chaveSalva) {
    document.getElementById(&quot;iaApiKey&quot;).value = chaveSalva;
    const p = detectarProvedor(chaveSalva);
    if (p) document.getElementById(&quot;iaProviderDetectado&quot;).textContent = `✅ Detectado: ${p.nome} · Modelo: ${p.model}`;
  }
  renderizarMemoria();
});

function toggleVerChave() {
  const inp = document.getElementById(&quot;iaApiKey&quot;);
  inp.type = inp.type === &quot;password&quot; ? &quot;text&quot; : &quot;password&quot;;
}

// =====================
// CARREGAR ARQUIVO
// =====================
function carregarArquivo() {
  const input = document.getElementById(&quot;arquivo&quot;);
  const file = input.files[0];
  if (!file) { alert(&quot;Selecione um arquivo primeiro!&quot;); return; }
  nomArquivo = file.name;
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === &quot;zip&quot; || ext === &quot;apk&quot;) {
    carregarZIP(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(e) {
      codigoOriginal = e.target.result;
      document.getElementById(&quot;cardExplorador&quot;).style.display = &quot;none&quot;;
      arquivosZip = [];
      processarCodigo(file.name);
    };
    reader.readAsText(file, &quot;UTF-8&quot;);
  }
}

async function carregarZIP(file) {
  setStatus(&quot;⏳ Abrindo &quot; + file.name + &quot;...&quot;, &quot;#38bdf8&quot;);
  try {
    const zip = await JSZip.loadAsync(file);
    arquivosZip = [];
    const promessas = [];

    zip.forEach((caminho, entrada) => {
      if (!entrada.dir) {
        const ext = caminho.split('.').pop().toLowerCase();
        const legivel = [&quot;js&quot;,&quot;ts&quot;,&quot;tsx&quot;,&quot;jsx&quot;,&quot;html&quot;,&quot;htm&quot;,&quot;css&quot;,&quot;json&quot;,&quot;txt&quot;,&quot;md&quot;,&quot;xml&quot;,&quot;yaml&quot;,&quot;yml&quot;,&quot;env&quot;,&quot;config&quot;,&quot;gradle&quot;,&quot;properties&quot;,&quot;kt&quot;,&quot;java&quot;,&quot;swift&quot;,&quot;py&quot;].includes(ext);
        arquivosZip.push({ caminho, entrada, ext, legivel, tamanho: 0 });
      }
    });

    // Pegar tamanhos
    for (const arq of arquivosZip) {
      promessas.push(
        arq.entrada.async(&quot;uint8array&quot;).then(data => { arq.tamanho = data.length; })
      );
    }
    await Promise.all(promessas);

    arquivosZip.sort((a, b) => {
      if (a.legivel &amp;&amp; !b.legivel) return -1;
      if (!a.legivel &amp;&amp; b.legivel) return 1;
      return a.caminho.localeCompare(b.caminho);
    });

    renderizarListaArquivos(arquivosZip);
    document.getElementById(&quot;cardExplorador&quot;).style.display = &quot;block&quot;;

    // Concatenar arquivos legíveis para análise
    let conteudoTotal = &quot;&quot;;
    let count = 0;
    for (const arq of arquivosZip) {
      if (arq.legivel &amp;&amp; arq.tamanho < 500000) {
        try {
          const texto = await arq.entrada.async(&quot;text&quot;);
          conteudoTotal += `\n\n${&quot;═&quot;.repeat(60)}\n📄 ARQUIVO: ${arq.caminho}\n${&quot;═&quot;.repeat(60)}\n${texto}`;
          count++;
        } catch(e) {}
      }
    }
    codigoOriginal = conteudoTotal;
    processarCodigo(`${file.name} (${count} arquivos legíveis de ${arquivosZip.length} total)`);

  } catch(e) {
    setStatus(&quot;❌ Erro ao abrir ZIP/APK: &quot; + e.message, &quot;#ef4444&quot;);
  }
}

function renderizarListaArquivos(lista) {
  const container = document.getElementById(&quot;listaArquivos&quot;);
  const contador = document.getElementById(&quot;contadorArquivos&quot;);
  contador.textContent = `${lista.length} arquivos`;

  if (lista.length === 0) {
    container.innerHTML = '<div style=&quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&quot;>Nenhum arquivo encontrado</div>';
    return;
  }

  container.innerHTML = lista.map((arq, i) => {
    const icone = arq.legivel ? &quot;📄&quot; : &quot;🔒&quot;;
    const extClass = [&quot;js&quot;,&quot;ts&quot;,&quot;tsx&quot;,&quot;jsx&quot;].includes(arq.ext) ? &quot;ext-js&quot; :
                     [&quot;html&quot;,&quot;htm&quot;].includes(arq.ext) ? &quot;ext-html&quot; :
                     arq.ext === &quot;json&quot; ? &quot;ext-json&quot; :
                     [&quot;txt&quot;,&quot;md&quot;].includes(arq.ext) ? &quot;ext-txt&quot; : &quot;ext-outro&quot;;
    const kb = (arq.tamanho / 1024).toFixed(1);
    return `
      <div class=&quot;arquivo-item&quot; onclick=&quot;abrirArquivoDoZip(${i})&quot; title=&quot;${arq.caminho}&quot;>
        <span>${icone}</span>

function detectarReplit() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);

  const linhas = codigoOriginal.split('\n');
  const padroes = [
    { regex: /replit\.com/gi,          tipo: &quot;🌐 URL replit.com&quot;,           solucao: &quot;Substituir pela URL do seu próprio servidor ou GitHub Pages&quot; },
    { regex: /replit\.dev/gi,          tipo: &quot;🌐 URL replit.dev&quot;,           solucao: &quot;Substituir pela URL do seu próprio servidor&quot; },
    { regex: /REPL_ID/g,               tipo: &quot;🔑 Variável REPL_ID&quot;,         solucao: &quot;Remover ou substituir por variável própria&quot; },
    { regex: /REPLIT_DB_URL/g,         tipo: &quot;🗄️ Banco Replit DB&quot;,          solucao: &quot;Substituir por localStorage ou outro banco gratuito&quot; },
    { regex: /replit\.nix/g,           tipo: &quot;⚙️ Config replit.nix&quot;,        solucao: &quot;Pode remover — é configuração interna da Replit&quot; },
    { regex: /\.replit/g,              tipo: &quot;⚙️ Arquivo .replit&quot;,          solucao: &quot;Pode remover — é configuração interna da Replit&quot; },
    { regex: /\/api\/code-assistant/g, tipo: &quot;🔗 Rota /api/code-assistant&quot;, solucao: &quot;Substituir por chamada direta à API de IA com sua chave&quot; },
    { regex: /\/api\/tts/g,            tipo: &quot;🔗 Rota /api/tts&quot;,            solucao: &quot;Substituir por Web Speech API (gratuita, funciona no navegador)&quot; },
    { regex: /\/api\//g,               tipo: &quot;🔗 Rota /api/ genérica&quot;,      solucao: &quot;Verificar se é rota da Replit ou do seu próprio backend&quot; },
    { regex: /process\.env\./g,        tipo: &quot;🔑 Variável de ambiente&quot;,     solucao: &quot;Substituir por campo de input para o usuário colar a chave&quot; },
  ];

  const encontrados = [];
  padroes.forEach(p => {
    linhas.forEach((linha, i) => {
      if (p.regex.test(linha)) {
        p.regex.lastIndex = 0;
        encontrados.push({ linha: i + 1, tipo: p.tipo, conteudo: linha.trim(), solucao: p.solucao });
      }
    });
    p.regex.lastIndex = 0;
  });

  if (encontrados.length === 0) {
    mostrarNaVisualizacao(&quot;✅ VERIFICAÇÃO REPLIT&quot;, &quot;Nenhum vínculo com a Replit encontrado!\n\nSeu código parece estar limpo de dependências da Replit.\nAinda assim, verifique as chamadas de API (/api/) manualmente.&quot;);
    return;
  }

  // Agrupar por tipo
  const porTipo = {};
  encontrados.forEach(e => {
    if (!porTipo[e.tipo]) porTipo[e.tipo] = [];
    porTipo[e.tipo].push(e);
  });

  let resultado = `🚨 VÍNCULOS COM REPLIT ENCONTRADOS: ${encontrados.length} ocorrências\n`;
  resultado += &quot;═&quot;.repeat(60) + &quot;\n\n&quot;;
  resultado += &quot;⚠️  ATENÇÃO: Estas partes param de funcionar quando você\n&quot;;
  resultado += &quot;   para de pagar a Replit!\n\n&quot;;
  resultado += &quot;═&quot;.repeat(60) + &quot;\n\n&quot;;

  Object.entries(porTipo).forEach(([tipo, itens]) => {
    resultado += `${tipo} (${itens.length}x)\n`;
    resultado += `💡 Como corrigir: ${itens[0].solucao}\n`;
    resultado += &quot;─&quot;.repeat(40) + &quot;\n&quot;;
    itens.slice(0, 5).forEach(item => {
      resultado += `  Linha ${item.linha}: ${item.conteudo.substring(0, 80)}\n`;
    });
    if (itens.length > 5) resultado += `  ... e mais ${itens.length - 5} ocorrências\n`;
    resultado += &quot;\n&quot;;
  });

  resultado += &quot;═&quot;.repeat(60) + &quot;\n&quot;;
  resultado += &quot;💡 PRÓXIMO PASSO:\n&quot;;
  resultado += &quot;Use o botão '🤖 Pedir IA: Limpar Replit' para gerar\n&quot;;
  resultado += &quot;automaticamente o código corrigido sem essas dependências.\n&quot;;

  mostrarNaVisualizacao(`🚨 ${encontrados.length} VÍNCULOS REPLIT ENCONTRADOS`, resultado);

  // Também mostrar na lista de blocos
  const cardBlocos = document.getElementById(&quot;cardBlocos&quot;);
  const listaBlocos = document.getElementById(&quot;listaBlocos&quot;);
  document.getElementById(&quot;tituloBlocos&quot;).textContent = `🚨 ${encontrados.length} Vínculos Replit`;
  cardBlocos.style.display = &quot;block&quot;;
  listaBlocos.innerHTML = encontrados.slice(0, 30).map(e => `
    <div class=&quot;item-funcao replit&quot; onclick=&quot;irParaLinha(${e.linha})&quot;>
      <div class=&quot;nome-funcao&quot;>${e.tipo}</div>
      <div class=&quot;desc-funcao&quot;>${e.conteudo.substring(0, 80)}</div>
      <div class=&quot;linha-funcao&quot;>Linha ${e.linha} · ${e.solucao}</div>
    </div>
  `).join(&quot;&quot;);
}

function mostrarFunctions() {

    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;localStorage&quot;)) blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;fetch(&quot;) || limpada.includes(&quot;apiKey&quot;)) blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
  });

  const cardBlocos = document.getElementById(&quot;cardBlocos&quot;);
  const listaBlocos = document.getElementById(&quot;listaBlocos&quot;);
  document.getElementById(&quot;tituloBlocos&quot;).textContent = `📋 ${blocos.length} Blocos Encontrados`;
  cardBlocos.style.display = &quot;block&quot;;
  if (blocos.length === 0) {
    listaBlocos.innerHTML = '<div class=&quot;aviso&quot;>Nenhuma function encontrada. O código pode estar minificado.</div>';
    return;
  }
  listaBlocos.innerHTML = blocos.map((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    const icone = b.tipo === 'local' ? '🧠' : b.tipo === 'api' ? '🌐' : b.tipo === 'classe' ? '🏗️' : '⚡';
    return `
      <div class=&quot;item-funcao ${cor}&quot; onclick=&quot;extrairFuncaoEspecifica(${idx})&quot;>
        <div class=&quot;nome-funcao&quot;>${icone} ${b.nome}</div>
        <div class=&quot;desc-funcao&quot;>${b.preview}...</div>
        <div class=&quot;linha-funcao&quot;>Linha ${b.linha} · Clique para extrair</div>
      </div>
    `;
  }).join(&quot;&quot;);
  window._blocos = blocos;
  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES ENCONTRADAS`,
    blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n')
  );
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;
  const linhas = codigoOriginal.split('\n');
  const inicio = bloco.linha - 1;
  let codigo = &quot;&quot;;
  let abertas = 0;
  let comecou = false;
  for (let i = inicio; i < Math.min(inicio + 200, linhas.length); i++) {
    const linha = linhas[i];
    codigo += linha + '\n';
    for (const char of linha) {
      if (char === '{') { abertas++; comecou = true; }
      if (char === '}') abertas--;
    }
    if (comecou &amp;&amp; abertas <= 0) break;
  }
  mostrarNaVisualizacao(`📋 BLOCO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

function organizarCodigo() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  let organizado = codigoOriginal
    .replace(/;(?!\n)/g, ';\n')
    .replace(/\{(?!\n)/g, '{\n')
    .replace(/\}(?!\n)/g, '}\n')
    .replace(/,(?!\n)(?!\s)/g, ',\n')
    .replace(/\n{3,}/g, '\n\n');
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';
    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel - 1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;
    return resultado;
  });
  mostrarNaVisualizacao(&quot;✨ CÓDIGO ORGANIZADO&quot;, indentado.join('\n'));
}

  if (temFetch) manual += &quot;✅ Faz chamadas para a internet (fetch/API)\n&quot;;
  if (temGemini) manual += &quot;✅ Usa a IA do Google Gemini\n&quot;;
  if (temGPT) manual += &quot;✅ Usa OpenAI / ChatGPT\n&quot;;
  if (temCapacitor) manual += &quot;📱 Usa Capacitor (pode virar APK)\n&quot;;
  if (temElectron) manual += &quot;🖥️ Usa Electron (pode virar app de computador)\n&quot;;
  if (temReplit) manual += &quot;\n⚠️  ATENÇÃO: TEM VÍNCULOS COM A REPLIT!\n   Partes do código param quando você para de pagar.\n   Use 'Detectar Vínculos Replit' para ver o que trocar.\n&quot;;

  const secoes = [];
  linhas.forEach((linha, i) => {
    const trim = linha.trim();
    if (trim.match(/^\/\/\s*.{3,}/)) secoes.push(`Linha ${i+1}: ${trim}`);
    if (trim.match(/^function\s+\w+/)) secoes.push(`Linha ${i+1}: FUNÇÃO → ${trim.substring(0, 60)}`);
    if (trim.match(/^class\s+\w+/)) secoes.push(`Linha ${i+1}: CLASSE → ${trim.substring(0
, 60)}`);
  });

  manual += &quot;\n📋 ESTRUTURA ENCONTRADA:\n&quot; + &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  if (secoes.length > 0) {
    secoes.slice(0, 50).forEach(s => { manual += s + &quot;\n&quot;; });
  } else {
    manual += &quot;⚠️ Código muito minificado — use 'Organizar Código' primeiro.\n&quot;;
  }

  manual += &quot;\n💡 RECOMENDAÇÃO:\n&quot; + &quot;─&quot;.repeat(40) + &quot;\n&quot;;
  manual += &quot;1. Extraia o localStorage → parte mais valiosa\n&quot;;
  manual += &quot;2. Extraia as chamadas de API → saber qual IA usava\n&quot;;
  manual += &quot;3. Detecte vínculos Replit → saber o que trocar\n&quot;;
  manual += &quot;4. Use a IA para limpar e corrigir automaticamente\n&quot;;

  mostrarNaVisualizacao(&quot;📖 MANUAL DO CÓDIGO&quot;, manual);
}

// =====================
// MEMÓRIA
// =====================
function salvarNaMemoria() {
  if (!codigoOriginal) return alert(&quot;Carregue um arquivo primeiro!&quot;);
  const nome = nomArquivo || &quot;arquivo-&quot; + Date.now();
  const existe = memoriaArquivos.findIndex(m => m.nome === nome);
  const item = {
    id: Date.now().toString(),
    nome,
    conteudo: codigoOriginal,
    tamanho: (codigoOriginal.length / 1024).toFixed(1),
    data: new Date().toLocaleString(&quot;pt-BR&quot;)
  };
  if (existe >= 0) {
    memoriaArquivos[existe] = item;
  } else {
    memoriaArquivos.push(item);
  }
  localStorage.setItem(&quot;cirurgiao_memoria&quot;, JSON.stringify(memoriaArquivos));
  renderizarMemoria();
  mostrarNaVisualizacao(&quot;💾 SALVO NA MEMÓRIA&quot;, `✅ &quot;${nome}&quot; salvo com sucesso!\n\nTamanho: ${item.tamanho} KB\nData: ${item.data}\n\nTotal na memória: ${memoriaArquivos.length} arquivo(s)`);
}

function renderizarMemoria() {
  const container = document.getElementById(&quot;listaMemoria&quot;);
  if (memoriaArquivos.length === 0) {
    container.innerHTML = '<div style=&quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&quot;>Nenhum arquivo salvo ainda.</div>';
    return;
  }
  container.innerHTML = memoriaArquivos.map((m, i) => `
    <div class=&quot;memoria-item&quot;>
      <div style=&quot;display:flex; justify-content:space-between; align-items:start; gap:6px;&quot;>
        <div style=&quot;flex:1; min-width:0;&quot;>
          <div class=&quot;memoria-nome&quot; style=&quot;overflow:hidden; text-overflow:ellipsis; white-space:nowrap;&quot; title=&quot;${m.nome}&quot;>${m.nome}</div>
          <div class=&quot;memoria-valor&quot;>${m.tamanho} KB · ${m.data}</div>
        </div>
        <div style=&quot;display:flex; gap:4px; flex-shrink:0;&quot;>
          <button onclick=&quot;carregarDaMemoria(${i})&quot; style=&quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&quot; class=&quot;verde&quot;>📂</button>
          <button onclick=&quot;baixarDaMemoria(${i})&quot; style=&quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&quot; class=&quot;roxo&quot;>⬇️</button>
          <button onclick=&quot;removerDaMemoria(${i})&quot; style=&quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&quot; class=&quot;vermelho&quot;>🗑️</button>
        </div>
      </div>
    </div>
  `).join(&quot;&quot;);
}

function carregarDaMemoria(idx) {
  const m = memoriaArquivos[idx];
  if (!m) return;
  codigoOriginal = m.conteudo;
  nomArquivo = m.nome;
  processarCodigo(m.nome);
}

function baixarDaMemoria(idx) {
  const m = memoriaArquivos[idx];
  if (!m) return;
  const blob = new Blob([m.conteudo], { type: &quot;text/plain&quot; });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = m.nome.replace(/[^a-z0-9._-]/gi, &quot;_&quot;);
  a.click();
  URL.revokeObjectURL(url);
}

function removerDaMemoria(idx) {
  if (!confirm(&quot;Remover este arquivo da memória?&quot;)) return;
  memoriaArquivos.splice(idx, 1);
  localStorage.setItem(&quot;cirurgiao_memoria&quot;, JSON.stringify(memoriaArquivos));
  renderizarMemoria();
}

function limparMemoria() {
  if (!confirm(&quot;Limpar TODA a memória? Esta ação não pode ser desfeita.&quot;)) return;
  memoriaArquivos = [];
  localStorage.setItem(&quot;cirurgiao_memoria&quot;, JSON.stringify([]));
  renderizarMemoria();
}

function baixarMemoriaCompleta() {
  if (memoriaArquivos.length === 0) return alert(&quot;Nenhum arquivo na memória.&quot;);
  let conteudo = &quot;=== MEMÓRIA COMPLETA — CIRURGIÃO DE CÓDIGO 2.0 ===\n&quot;;
  conteudo += `Data: ${new Date().toLocaleString(&quot;pt-BR&quot;)}\n`;
  conteudo += `Total de arquivos: ${memoriaArquivos.length}\n\n`;
  memoriaArquivos.forEach((m, i) => {
    conteudo += &quot;═&quot;.repeat(70) + &quot;\n&quot;;
    conteudo += `ARQUIVO ${i+1}: ${m.nome}\n`;
    conteudo += `Tamanho: ${m.tamanho} KB · Salvo em: ${m.data}\n`;
    conteudo += &quot;═&quot;.repeat(70) + &quot;\n&quot;;
    conteudo += m.conteudo + &quot;\n\n&quot;;
  });
  const blob = new Blob([conteudo], { type: &quot;text/plain&quot; });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = `memoria-cirurgiao-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// =====================
// IA INTEGRADA
// =====================
async function consultarIA(perguntaOverride) {
  const chave = document.getElementById(&quot;iaApiKey&quot;).value.trim();
  if (!chave) { alert(&quot;Cole sua chave de API no painel da IA (painel esquerdo).&quot;); return; }

  const pergunta = perguntaOverride || document.getElementById(&quot;iaPergunta&quot;).value.trim();
  if (!pergunta) { alert(&quot;Digite uma pergunta para a IA.&quot;); return; }

  const provedor = detectarProvedor(chave);
  if (!provedor) { alert(&quot;Chave não reconhecida. Use: gsk_ (Groq), AIza (Gemini), sk- (OpenAI), sk-or- (OpenRouter), pplx- (Perplexity), xai- (xAI)&quot;); return; }

  const contexto = codigoOriginal
    ? `\n\nCÓDIGO ATUAL (${nomArquivo || &quot;sem nome&quot;}, ${(codigoOriginal.length/1024).toFixed(1)}KB):\n\`\`\`\n${codigoOriginal.substring(0, 8000)}${codigoOriginal.length > 8000 ? &quot;\n... [código truncado para caber no contexto]&quot; : &quot;&quot;}\n\`\`\``
    : &quot;&quot;;

  const btn = document.getElementById(&quot;btnConsultarIA&quot;);
  btn.disabled = true;
  btn.innerHTML = '<span class=&quot;spinner&quot;></span>Consultando...';

  const respostaEl = document.getElementById(&quot;iaResposta&quot;);
  respostaEl.style.display = &quot;block&quot;;
  respostaEl.textContent = &quot;⏳ Aguardando resposta da IA...&quot;;

  try {
    const resp = await fetch(`${provedor.url}/chat/completions`, {
      method: &quot;POST&quot;,
      headers: {
        &quot;Content-Type&quot;: &quot;application/json&quot;,
        &quot;Authorization&quot;: `Bearer ${chave}`
      },
      body: JSON.stringify({
        model: provedor.model,
        messages: [
          {
            role: &quot;system&quot;,
            content: &quot;Você é um especialista em análise e limpeza de código. Responda sempre em português brasileiro. Seja direto, prático e explique de forma simples para um usuário leigo. Quando sugerir código, forneça o código completo e pronto para usar.&quot;
          },
          {
            role: &quot;user&quot;,
            content: pergunta + contexto
          }
        ],
        max_tokens: 2000,
        temperature: 0.3
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Erro ${resp.status}`);
    }

    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content || &quot;Sem resposta.&quot;;
    respostaEl.textContent = resposta;
    mostrarNaVisualizacao(`🤖 RESPOSTA DA IA (${provedor.nome})`, resposta);

  } catch(e) {
    respostaEl.textContent = `❌ Erro: ${e.message}\n\nVerifique se a chave está correta e tem créditos disponíveis.`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🤖 Consultar IA';
  }
}

function analisarReplitComIA() {
  const pergunta = `Analise este código e faça o seguinte:
1. Liste TODOS os vínculos com a Replit (URLs, rotas /api/, variáveis REPL_ID, etc.)
2. Para cada vínculo encontrado, mostre EXATAMENTE como substituir por uma alternativa gratuita e independente
3. Substitua as rotas /api/code-assistant e /api/tts por chamadas diretas às APIs de IA usando uma variável de chave que o usuário cola na tela
4. Entregue o código COMPLETO já corrigido, pronto para usar sem a Replit`;
  document.getElementById(&quot;iaPergunta&quot;).value = pergunta;
  consultarIA(pergunta);
}

function pedirCorrecaoIA() {
  const pergunta = `Analise este código e:
1. Liste todos os bugs e erros que encontrar
2. Explique em linguagem simples o que cada erro causa
3. Corrija todos os bugs
4. Entregue o código completo corrigido e funcional
5. Destaque o que foi mudado e por quê`;
  document.getElementById(&quot;iaPergunta&quot;).value = pergunta;
  consultarIA(pergunta);
}

function analisarAtualComIA() {
  const conteudoAtual = document.getElementById(&quot;areaVisualizacao&quot;).textContent;
  if (!conteudoAtual || conteudoAtual.includes(&quot;Bem-vindo&quot;)) {
    alert(&quot;Primeiro gere algum resultado (functions, API, Replit, etc.) para depois analisar com a IA.&quot;);
    return;
  }
  const pergunta = `Analise este trecho de código extraído e explique:\n1. O que ele faz\n2. Se tem algum problema ou bug\n3. Como melhorar ou corrigir\n\nTRECHO:\n${conteudoAtual.substring(0, 4000)}`;
  document.getElementById(&quot;iaPergunta&quot;).value = pergunta;
  consultarIA(pergunta);
}

function mostrarNaVisualizacao(titulo, conteudo) {
  document.getElementById(&quot;tituloVisualizacao&quot;).textContent = titulo;
  document.getElementById(&quot;areaVisualizacao&quot;).textContent = conteudo;
}

function copiarVisualizacao() {
  const texto = document.getElementById(&quot;areaVisualizacao&quot;).textContent;
  if (!texto) return;
  navigator.clipboard.writeText(texto).then(() => {
    const btn = event.target.closest(&quot;button&quot;);
    const original = btn.textContent;
    btn.textContent = &quot;✅ Copiado!&quot;;
    btn.classList.add(&quot;copiado&quot;);
    setTimeout(() => { btn.textContent = original; btn.classList.remove(&quot;copiado&quot;); }, 2000);
  });
}

function baixarVisualizacao() {

  if (!texto) return;

  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = `cirurgiao-${Date.now()}.txt`;

  URL.revokeObjectURL(url);
}

}

function limparTudo() {

function setStatus(html, cor) {

function detectarProvedor(chave) {
  const k = (chave || &quot;&quot;).trim();
  for (const p of PROVEDORES) { if (k.startsWith(p.prefix)) return p; }
  return null;
}

function carregarArquivo() {
  const input = document.getElementById(&quot;arquivo&quot;);
  const file = input.files[0];
  if (!file) { alert(&quot;Selecione um arquivo primeiro!&quot;); return; }
  nomArquivo = file.name;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === &quot;zip&quot; || ext === &quot;apk&quot;) { carregarZIP(file); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    codigoOriginal = e.target.result;
    document.getElementById(&quot;cardExplorador&quot;).style.display = &quot;none&quot;;
    arquivosZip = [];
    processarCodigo(file.name);
  };
  reader.readAsText(file, &quot;UTF-8&quot;);
}

async function carregarZIP(file) {
  setStatus(&quot;⏳ Abrindo &quot; + file.name + &quot;...&quot;, &quot;#38bdf8&quot;);
  try {
    const zip = await JSZip.loadAsync(file);
    arquivosZip = [];
    const promessas = [];
    zip.forEach((caminho, entrada) => {
      if (!entrada.dir) {
        const ext = caminho.split('.').pop().toLowerCase();
        const legivel = [&quot;js&quot;,&quot;ts&quot;,&quot;tsx&quot;,&quot;jsx&quot;,&quot;html&quot;,&quot;htm&quot;,&quot;css&quot;,&quot;json&quot;,&quot;txt&quot;,&quot;md&quot;,&quot;xml&quot;,&quot;yaml&quot;,&quot;yml&quot;,&quot;env&quot;,&quot;config&quot;,&quot;gradle&quot;,&quot;properties&quot;,&quot;kt&quot;,&quot;java&quot;,&quot;swift&quot;,&quot;py&quot;,&quot;php&quot;,&quot;cs&quot;].includes(ext);
        arquivosZip.push({ caminho, entrada, ext, legivel, tamanho: 0 });
      }
    });
    for (const arq of arquivosZip) {
      promessas.push(arq.entrada.async(&quot;uint8array&quot;).then(data => { arq.tamanho = data.length; }));
    }
    await Promise.all(promessas);
    arquivosZip.sort((a, b) => { if (a.legivel &amp;&amp; !b.legivel) return -1; if (!a.legivel &amp;&amp; b.legivel) return 1; return a.caminho.localeCompare(b.caminho); });
    renderizarListaArquivos(arquivosZip);
    document.getElementById(&quot;cardExplorador&quot;).style.display = &quot;block&quot;;
    let conteudoTotal = &quot;&quot;, count = 0;
    for (const arq of arquivosZip) {
      if (arq.legivel &amp;&amp; arq.tamanho < 500000) {
        try { const t = await arq.entrada.async(&quot;text&quot;); conteudoTotal += `\n\n${&quot;═&quot;.repeat(60)}\n📄 ARQUIVO: ${arq.caminho}\n${&quot;═&quot;.repeat(60)}\n${t}`; count++; }
        catch(e) {}
      }
    }
    codigoOriginal = conteudoTotal;
    processarCodigo(`${file.name} (${count} arquivos legíveis de ${arquivosZip.length} total)`);
  } catch(e) { setStatus(&quot;❌ Erro ao abrir ZIP/APK: &quot; + e.message, &quot;#ef4444&quot;); }
}

function renderizarListaArquivos(lista) {
  const container = document.getElementById(&quot;listaArquivos&quot;);
  document.getElementById(&quot;contadorArquivos&quot;).textContent = `${lista.length} arquivos`;
  if (!lista.length) { container.innerHTML = '<div style=&quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&quot;>Nenhum arquivo</div>'; return; }
  container.innerHTML = lista.map((arq, i) => {
    const icone = arq.legivel ? &quot;📄&quot; : &quot;🔒&quot;;
    const extClass = [&quot;js&quot;,&quot;ts&quot;,&quot;tsx&quot;,&quot;jsx&quot;].includes(arq.ext) ? &quot;ext-js&quot; : [&quot;html&quot;,&quot;htm&quot;].includes(arq.ext) ? &quot;ext-html&quot; : arq.ext === &quot;json&quot; ? &quot;ext-json&quot; : [&quot;txt&quot;,&quot;md&quot;].includes(arq.ext) ? &quot;ext-txt&quot; : &quot;ext-outro&quot;;
    return `<div class=&quot;arquivo-item&quot; onclick=&quot;abrirArquivoDoZip(${i})&quot; title=&quot;${arq.caminho}&quot;>
      <span>${icone}</span><span class=&quot;ext ${extClass}&quot;>.${arq.ext}</span>
      <span style=&quot;flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;&quot;>${arq.caminho}</span>
      <span style=&quot;color:#475569; font-size:10px; white-space:nowrap;&quot;>${(arq.tamanho/1024).toFixed(1)}KB</span>
    </div>`;
  }).join(&quot;&quot;);
}

function filtrarArquivos() {
  const t = document.getElementById(&quot;campoBuscaArquivo&quot;).value.toLowerCase();
  renderizarListaArquivos(arquivosZip.filter(a => a.caminho.toLowerCase().includes(t)));
}

async function abrirArquivoDoZip(idx) {
  const arq = arquivosZip[idx];
  if (!arq) return;
  if (!arq.legivel) { mostrarNaVisualizacao(`🔒 ${arq.caminho}`, `Arquivo binário — não pode ser lido como texto.\nExtensão: .${arq.ext}\nTamanho: ${(arq.tamanho/1024).toFixed(1)} KB`); return; }
  try {
    const texto = await arq.entrada.async(&quot;text&quot;);
    codigoOriginal = texto; nomArquivo = arq.caminho;
    mostrarNaVisualizacao(`📄 ${arq.caminho}`, texto);
    processarCodigo(arq.caminho);
  } catch(e) { mostrarNaVisualizacao(`❌ Erro`, `Não foi possível ler: ${e.message}`); }
}

function buscarNoCodigo() {
  const campo = document.getElementById(&quot;campoBusca&quot;).value.trim();
  if (!campo) return;
  if (!codigoOriginal) { alert(&quot;Carregue um arquivo primeiro!&quot;); return; }

  const termos = campo.split(&quot;,&quot;).map(t => t.trim()).filter(Boolean);
  const linhas = codigoOriginal.split('\n');
  const resultados = [];
  const cores = [&quot;busca-destaque&quot;, &quot;busca-destaque-2&quot;, &quot;busca-destaque-3&quot;];

  linhas.forEach((linha, i) => {
    const linhaLower = linha.toLowerCase();
    const termosEncontrados = termos.filter(t => linhaLower.includes(t.toLowerCase()));
    if (termosEncontrados.length > 0) {
      resultados.push({ linha: i + 1, conteudo: linha.trim(), termos: termosEncontrados });
    }
  });

  const container = document.getElementById(&quot;resultadoBusca&quot;);
  if (!resultados.length) {
    container.innerHTML = `<div class=&quot;aviso&quot;>Nenhum resultado para: ${termos.map(t=>`&quot;${t}&quot;`).join(&quot;, &quot;)}</div>`;
    return;
  }

  container.innerHTML = `
    <div class=&quot;aviso-verde&quot; style=&quot;margin-bottom:6px;&quot;>✅ ${resultados.length} linha(s) encontrada(s) para: ${termos.map(t=>`&quot;${t}&quot;`).join(&quot;, &quot;)}</div>
    <div style=&quot;max-height:220px; overflow-y:auto;&quot;>
      ${resultados.slice(0, 60).map(r => {
        let conteudo = r.conteudo;
        r.termos.forEach((t, idx) => {
          const cls = cores[idx % cores.length];
          conteudo = conteudo.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;'), 'gi'), m => `<span class=&quot;${cls}&quot;>${m}</span>`);
        });
        return `<div class=&quot;busca-resultado&quot; onclick=&quot;irParaLinha(${r.linha})&quot;>
          <div class=&quot;busca-linha&quot;>Linha ${r.linha} · encontrou: ${r.termos.join(&quot;, &quot;)}</div>
          <div class=&quot;busca-conteudo&quot;>${conteudo}</div>
        </div>`;
      }).join(&quot;&quot;)}
      ${resultados.length > 60 ? `<div style=&quot;color:#64748b; font-size:11px; text-align:center; padding:6px;&quot;>... e mais ${resultados.length - 60} resultados</div>` : &quot;&quot;}
    </div>
  `;
}

function buscarReplit() {
  document.getElementById(&quot;campoBusca&quot;).value = &quot;replit.com, replit.dev, REPL_ID, REPLIT_DB, /api/code-assistant, /api/tts&quot;;
  buscarNoCodigo();
}

function irParaLinha(numLinha) {
  const linhas = codigoOriginal.split('\n');
  const inicio = Math.max(0, numLinha - 5);
  const fim = Math.min(linhas.length, numLinha + 10);
  const contexto = linhas.slice(inicio, fim).map((l, i) => {
    const n = inicio + i + 1;
    return (n === numLinha ? `>>> ` : `    `) + `[${n}] ${l}`;
  }).join('\n');
  mostrarNaVisualizacao(`🔍 Contexto da Linha ${numLinha}`, contexto);
}

// DETECTAR REPLIT
// =====================
function detectarReplit() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const padroes = [
    { regex: /replit\.com/gi,          tipo: &quot;🌐 URL replit.com&quot;,            solucao: &quot;Substituir pela URL do seu próprio servidor ou GitHub Pages&quot; },
    { regex: /replit\.dev/gi,          tipo: &quot;🌐 URL replit.dev&quot;,            solucao: &quot;Substituir pela URL do seu próprio servidor&quot; },
    { regex: /REPL_ID/g,               tipo: &quot;🔑 Variável REPL_ID&quot;,          solucao: &quot;Remover ou substituir por variável própria&quot; },
    { regex: /REPLIT_DB_URL/g,         tipo: &quot;🗄️ Banco Replit DB&quot;,           solucao: &quot;Substituir por localStorage ou Neon (gratuito)&quot; },
    { regex: /replit\.nix/g,           tipo: &quot;⚙️ Config replit.nix&quot;,         solucao: &quot;Pode remover — é configuração interna da Replit&quot; },
    { regex: /\.replit/g,              tipo: &quot;⚙️ Arquivo .replit&quot;,           solucao: &quot;Pode remover — é configuração interna da Replit&quot; },
    { regex: /\/api\/code-assistant/g, tipo: &quot;🔗 Rota /api/code-assistant&quot;,  solucao: &quot;Substituir por chamada direta à API de IA com sua chave&quot; },
    { regex: /\/api\/tts/g,            tipo: &quot;🔗 Rota /api/tts&quot;,             solucao: &quot;Substituir por Web Speech API (gratuita, funciona no navegador)&quot; },
    { regex: /\/api\//g,               tipo: &quot;🔗 Rota /api/ genérica&quot;,       solucao: &quot;Verificar se é rota da Replit ou do seu próprio backend&quot; },
    { regex: /process\.env\./g,        tipo: &quot;🔑 Variável de ambiente&quot;,      solucao: &quot;Substituir por campo de input para o usuário colar a chave&quot; },
    { regex: /@replit\//g,             tipo: &quot;📦 Pacote @replit/&quot;,           solucao: &quot;Remover ou substituir por alternativa sem Replit&quot; },
    { regex: /replit-dev\.com/g,       tipo: &quot;🌐 Domínio replit-dev&quot;,        solucao: &quot;Substituir pelo seu próprio domínio&quot; },
  ];

  const encontrados = [];
  padroes.forEach(p => {
    linhas.forEach((linha, i) => {
      if (p.regex.test(linha)) { p.regex.lastIndex = 0; encontrados.push({ linha: i+1, tipo: p.tipo, conteudo: linha.trim(), solucao: p.solucao }); }
    });
    p.regex.lastIndex = 0;
  });

  if (!encontrados.length) {
    mostrarNaVisualizacao(&quot;✅ VERIFICAÇÃO REPLIT&quot;, &quot;Nenhum vínculo com a Replit encontrado!\n\nSeu código parece limpo de dependências da Replit.&quot;);
    return;
  }

  const porTipo = {};
  encontrados.forEach(e => { if (!porTipo[e.tipo]) porTipo[e.tipo] = []; porTipo[e.tipo].push(e); });

  let resultado = `🚨 VÍNCULOS COM REPLIT: ${encontrados.length} ocorrências\n${&quot;═&quot;.repeat(60)}\n\n`;
  resultado += &quot;⚠️  Estas partes param de funcionar quando você para de pagar!\n\n&quot; + &quot;═&quot;.repeat(60) + &quot;\n\n&quot;;

  Object.entries(porTipo).forEach(([tipo, itens]) => {
    resultado += `${tipo} (${itens.length}x)\n`;
    resultado += `💡 Solução: ${itens[0].solucao}\n${&quot;─&quot;.repeat(40)}\n`;
    itens.slice(0, 5).forEach(item => { resultado += `  Linha ${item.linha}: ${item.conteudo.substring(0, 80)}\n`; });
    if (itens.length > 5) resultado += `  ... e mais ${itens.length - 5} ocorrências\n`;
    resultado += &quot;\n&quot;;
  });
  resultado += `${&quot;═&quot;.repeat(60)}\n💡 PRÓXIMO PASSO: Use '🤖 Pedir IA: Limpar Replit' para corrigir automaticamente.`;

  mostrarNaVisualizacao(`🚨 ${encontrados.length} VÍNCULOS REPLIT`, resultado);

  const listaBlocos = document.getElementById(&quot;listaBlocos&quot;);
  document.getElementById(&quot;tituloBlocos&quot;).textContent = `🚨 ${encontrados.length} Vínculos Replit`;
  document.getElementById(&quot;cardBlocos&quot;).style.display = &quot;block&quot;;
  listaBlocos.innerHTML = encontrados.slice(0, 40).map(e => `
    <div class=&quot;item-funcao replit&quot; onclick=&quot;irParaLinha(${e.linha})&quot;>
      <div class=&quot;nome-funcao&quot;>${e.tipo}</div>
      <div class=&quot;desc-funcao&quot;>${e.conteudo.substring(0, 80)}</div>
      <div class=&quot;linha-funcao&quot;>Linha ${e.linha} · ${e.solucao}</div>
    </div>
  `).join(&quot;&quot;);
}

function detectarBugs() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const bugs = [];

  // Padrões de bugs comuns
  const padroesBug = [
    { regex: /console\.log\s*\([^)]*$/, tipo: &quot;🐛 console.log incompleto&quot;, solucao: &quot;Parêntese não fechado — adicione ) no final&quot; },
    { regex: /=\s*undefined\b/, tipo: &quot;⚠️ Atribuição para undefined&quot;, solucao: &quot;Variável recebe 'undefined' diretamente — provavelmente um erro&quot; },
    { regex: /[^=!<>]==[^=]/, tipo: &quot;⚠️ Comparação fraca (==)&quot;, solucao: &quot;Use === em vez de == para comparação segura&quot; },
    { regex: /\.\.\/\.\.\/\.\.\/\.\.\//, tipo: &quot;📁 Caminho relativo muito profundo&quot;, solucao: &quot;Caminho ../../../../ pode estar errado — verifique a estrutura de pastas&quot; },
    { regex: /http:\/\/localhost/, tipo: &quot;🌐 URL localhost no código&quot;, solucao: &quot;URL localhost não funciona em produção — use URL relativa ou variável&quot; },
    { regex: /http:\/\/127\.0\.0\.1/, tipo: &quot;🌐 URL 127.0.0.1 no código&quot;, solucao: &quot;URL local não funciona em produção&quot; },
    { regex: /throw\s+[&quot;']/, tipo: &quot;⚠️ throw com string simples&quot;, solucao: &quot;Use 'throw new Error(...)' em vez de 'throw \&quot;...\&quot;'&quot; },
    { regex: /catch\s*\(\s*\)\s*\{/, tipo: &quot;🐛 catch vazio sem variável de erro&quot;, solucao: &quot;Use catch(e) para capturar o erro e saber o que deu errado&quot; },
    { regex: /var\s+\w+/, tipo: &quot;⚠️ Uso de 'var' (obsoleto)&quot;, solucao: &quot;Prefira 'const' ou 'let' em vez de 'var'&quot; },
    { regex: /XMLHttpRequest/, tipo: &quot;🌐 XMLHttpRequest (obsoleto)&quot;, solucao: &quot;Substitua por fetch() que é mais moderno e simples&quot; },
    { regex: /innerHTML\s*\+=/, tipo: &quot;⚠️ innerHTML += (lento e inseguro)&quot;, solucao: &quot;Pode causar problemas de performance — considere usar textContent ou createElement&quot; },
    { regex: /eval\s*\(/, tipo: &quot;🔴 EVAL detectado (perigoso)&quot;, solucao: &quot;eval() é perigoso e pode ser bloqueado pelo navegador — evite usar&quot; },
    { regex: /document\.write\s*\(/, tipo: &quot;⚠️ document.write (obsoleto)&quot;, solucao: &quot;Substituir por getElementById + innerHTML ou appendChild&quot; },
    { regex: /\bNaN\b/, tipo: &quot;🐛 Comparação com NaN&quot;, solucao: &quot;NaN nunca é igual a nada — use isNaN() ou Number.isNaN() para verificar&quot; },
    { regex: /setTimeout\s*\([^,]+,\s*0\s*\)/, tipo: &quot;⚠️ setTimeout com 0ms&quot;, solucao: &quot;setTimeout com 0ms é hack — verifique se há forma melhor&quot; },
    { regex: /async\s+function.*(?!await)/, tipo: &quot;⚠️ Função async sem await&quot;, solucao: &quot;Função declarada async mas pode não usar await — verifique se é necessário&quot; },
  ];

  linhas.forEach((linha, i) => {
    const trim = linha.trim();
    if (!trim || trim.startsWith(&quot;//&quot;) || trim.startsWith(&quot;*&quot;)) return;
    padroesBug.forEach(p => {
      if (p.regex.test(linha)) {
        bugs.push({ linha: i+1, tipo: p.tipo, conteudo: trim.substring(0, 80), solucao: p.solucao });
      }
    });
  });

  // Verificar balanço de chaves (básico)
  let abertas = 0, fechadas = 0;
  let primeiraDesbalanceada = -1;
  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i];
    for (const c of l) {
      if (c === '{') abertas++;
      if (c === '}') { fechadas++; if (fechadas > abertas &amp;&amp; primeiraDesbalanceada === -1) primeiraDesbalanceada = i+1; }
    }
  }
  if (abertas !== fechadas) {
    bugs.push({
      linha: primeiraDesbalanceada > 0 ? primeiraDesbalanceada : linhas.length,
      tipo: `🔴 CHAVES DESBALANCEADAS: ${abertas} abertas × ${fechadas} fechadas`,
      conteudo: `Diferença de ${Math.abs(abertas-fechadas)} chave(s) ${abertas > fechadas ? 'faltando fechar }' : 'sobrando }'}`,
      solucao: abertas > fechadas ? `Falta(m) ${abertas-fechadas} chave(s) de fechamento } no código` : `Sobra(m) ${fechadas-abertas} chave(s) de fechamento }`
    });
  }

  // Verificar parênteses
  let parenA = 0, parenF = 0;
  for (const l of linhas) { for (const c of l) { if (c==='(') parenA++; if (c===')') parenF++; } }
  if (parenA !== parenF) {
    bugs.push({
      linha: linhas.length,
      tipo: `🔴 PARÊNTESES DESBALANCEADOS: ${parenA} abertos × ${parenF} fechados`,
      conteudo: `Diferença de ${Math.abs(parenA-parenF)} parêntese(s)`,
      solucao: parenA > parenF ? `Falta(m) ${parenA-parenF} parêntese(s) de fechamento )` : `Sobra(m) ${parenF-parenA} parêntese(s) de fechamento )`
    });
  }

  if (!bugs.length) {
    mostrarNaVisualizacao(&quot;✅ VERIFICAÇÃO DE BUGS&quot;, &quot;Nenhum bug óbvio detectado!\n\nIsso não significa que o código está 100% correto — bugs de lógica precisam da IA para serem encontrados.\n\n💡 Use '🔧 Pedir IA: Corrigir Bugs' para uma análise mais profunda.&quot;);
    return;
  }

  let resultado = `🐛 ${bugs.length} PROBLEMA(S) ENCONTRADO(S)\n${&quot;═&quot;.repeat(60)}\n\n`;
  bugs.forEach((b, i) => {
    resultado += `${i+1}. ${b.tipo}\n`;
    resultado += `   Linha ${b.linha}: ${b.conteudo}\n`;
    resultado += `   💡 ${b.solucao}\n\n`;
  });
  resultado += `${&quot;═&quot;.repeat(60)}\n💡 Use '🤖 Pedir IA: Corrigir Bugs' para corrigir automaticamente.`;

  mostrarNaVisualizacao(`🐛 ${bugs.length} PROBLEMAS DETECTADOS`, resultado);

  document.getElementById(&quot;tituloBlocos&quot;).textContent = `🐛 ${bugs.length} Bugs Encontrados`;
  document.getElementById(&quot;cardBlocos&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;listaBlocos&quot;).innerHTML = bugs.map((b, i) => `
    <div class=&quot;bug-item&quot; onclick=&quot;irParaLinha(${b.linha})&quot;>
      <div class=&quot;bug-tipo&quot;>${b.tipo}</div>
      <div class=&quot;bug-linha&quot;>Linha ${b.linha}</div>
      <div class=&quot;bug-desc&quot;>${b.conteudo}</div>
      <div class=&quot;bug-solucao&quot;>💡 ${b.solucao}</div>
    </div>
  `).join(&quot;&quot;);
}

// =====================
// DETECTAR CONFLITOS DE DEPENDÊNCIA
// =====================
function detectarConflitos() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  const linhas = codigoOriginal.split('\n');
  const conflitos = [];
  const importados = new Map();
  const usados = new Set();

  // Coletar imports/requires
  linhas.forEach((linha, i) => {
    const importMatch = linha.match(/import\s+.*?\s+from\s+['&quot;](.+?)['&quot;]/);
    const requireMatch = linha.match(/require\s*\(\s*['&quot;](.+?)['&quot;]\s*\)/);
    const scriptMatch = linha.match(/src=[&quot;'].*?([\w@/-]+\.js)[&quot;']/);

    if (importMatch) importados.set(importMatch[1], i+1);
    if (requireMatch) importados.set(requireMatch[1], i+1);
    if (scriptMatch) importados.set(scriptMatch[1], i+1);
  });

  // Verificar conflitos conhecidos
  const conflitosConhecidos = [
    { libs: [&quot;react&quot;, &quot;react-dom&quot;], descricao: &quot;React detectado&quot;, nota: &quot;Verifique se as versões de react e react-dom são iguais&quot; },
    { libs: [&quot;jquery&quot;, &quot;react&quot;], descricao: &quot;jQuery + React&quot;, nota: &quot;Mistura de jQuery com React pode causar conflitos de DOM&quot; },
    { libs: [&quot;moment&quot;, &quot;date-fns&quot;], descricao: &quot;Duas libs de data&quot;, nota: &quot;Moment.js e date-fns fazem a mesma coisa — use apenas uma&quot; },
    { libs: [&quot;lodash&quot;, &quot;underscore&quot;], descricao: &quot;Duas libs de utilitários&quot;, nota: &quot;Lodash e Underscore se sobrepõem — use apenas uma&quot; },
    { libs: [&quot;axios&quot;, &quot;fetch&quot;], descricao: &quot;Axios + fetch&quot;, nota: &quot;Axios e fetch fazem requisições HTTP — mantenha apenas um padrão&quot; },
    { libs: [&quot;bootstrap&quot;, &quot;tailwind&quot;], descricao: &quot;Bootstrap + Tailwind&quot;, nota: &quot;Duas libs CSS pode causar conflito de estilos&quot; },
    { libs: [&quot;webpack&quot;, &quot;vite&quot;], descricao: &quot;Webpack + Vite&quot;, nota: &quot;Dois bundlers diferentes — use apenas um&quot; },
  ];

  conflitosConhecidos.forEach(c => {
    const encontradas = c.libs.filter(lib => {
      return [...importados.keys()].some(k => k.toLowerCase().includes(lib)) ||
             codigoOriginal.toLowerCase().includes(`&quot;${lib}&quot;`) ||
             codigoOriginal.toLowerCase().includes(`'${lib}'`);
    });
    if (encontradas.length >= 2) {
      conflitos.push({ tipo: `⚡ ${c.descricao}`, libs: encontradas, nota: c.nota });
    }
  });

  // Verificar variáveis declaradas mas não usadas (simplificado)
  const varsDeclaradas = [];
  linhas.forEach((linha, i) => {
    const m = linha.match(/^(?:const|let|var)\s+(\w+)\s*=/);
    if (m &amp;&amp; m[1].length > 2) varsDeclaradas.push({ nome: m[1], linha: i+1 });
  });

  const codigoSemDecls = codigoOriginal.replace(/^(?:const|let|var)\s+\w+\s*=.*$/gm, '');
  let naoUsadas = 0;
  varsDeclaradas.slice(0, 30).forEach(v => {
    const regex = new RegExp(`\\b${v.nome}\\b`, 'g');
    const ocorrencias = (codigoSemDecls.match(regex) || []).length;
    if (ocorrencias === 0) {
      naoUsadas++;
      if (naoUsadas <= 10) conflitos.push({ tipo: `⚠️ Variável declarada mas não usada`, libs: [v.nome], nota: `Linha ${v.linha}: '${v.nome}' foi declarada mas nunca usada no código` });
    }
  });

  // Múltiplas declarações da mesma variável
  const nomesVars = varsDeclaradas.map(v => v.nome);
  const duplicadas = nomesVars.filter((v, i) => nomesVars.indexOf(v) !== i);
  [...new Set(duplicadas)].slice(0, 5).forEach(nome => {
    const linhasD = varsDeclaradas.filter(v => v.nome === nome).map(v => v.linha).join(&quot;, &quot;);
    conflitos.push({ tipo: `🔴 Variável declarada mais de uma vez`, libs: [nome], nota: `'${nome}' foi declarada nas linhas: ${linhasD}` });
  });

  if (!conflitos.length) {
    mostrarNaVisualizacao(&quot;✅ VERIFICAÇÃO DE CONFLITOS&quot;, &quot;Nenhum conflito de dependência óbvio detectado!\n\nPara uma análise mais profunda, use '🤖 Consultar IA' e pergunte:\n'Este código tem conflitos de dependência ou variáveis duplicadas?'&quot;);
    return;
  }

  let resultado = `⚡ ${conflitos.length} CONFLITO(S) DETECTADO(S)\n${&quot;═&quot;.repeat(60)}\n\n`;
  conflitos.forEach((c, i) => {
    resultado += `${i+1}. ${c.tipo}\n`;
    if (c.libs.length > 0) resultado += `   Envolvidos: ${c.libs.join(&quot;, &quot;)}\n`;
    resultado += `   ⚠️ ${c.nota}\n\n`;
  });
  resultado += `${&quot;═&quot;.repeat(60)}\n💡 Para corrigir, use '🤖 Pedir IA: Corrigir Bugs' ou pergunte à IA sobre cada conflito.`;

  mostrarNaVisualizacao(`⚡ ${conflitos.length} CONFLITOS ENCONTRADOS`, resultado);
}

function mostrarFunctions() {

  linhas.forEach((linha, i) => {

    if (mFunc) blocos.push({ tipo: 'function', nome: mFunc[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mArrow = limpada.match(/^(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?\(/);
    if (mArrow) blocos.push({ tipo: 'arrow', nome: mArrow[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;localStorage&quot;)) blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&quot;fetch(&quot;) || limpada.includes(&quot;apiKey&quot;)) blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
  });

  document.getElementById(&quot;tituloBlocos&quot;).textContent = `📋 ${blocos.length} Blocos Encontrados`;
  document.getElementById(&quot;cardBlocos&quot;).style.display = &quot;block&quot;;
  if (!blocos.length) { document.getElementById(&quot;listaBlocos&quot;).innerHTML = '<div class=&quot;aviso&quot;>Nenhuma function encontrada. O código pode estar minificado.</div>'; return; }
  document.getElementById(&quot;listaBlocos&quot;).innerHTML = blocos.map((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    return `<div class=&quot;item-funcao ${cor}&quot; onclick=&quot;extrairFuncaoEspecifica(${idx})&quot;>
      <div class=&quot;nome-funcao&quot;>${b.nome}</div>
      <div class=&quot;desc-funcao&quot;>${b.preview}</div>
      <div class=&quot;linha-funcao&quot;>Linha ${b.linha} · ${b.tipo}</div>
    </div>`;
  }).join(&quot;&quot;);
  window._blocos = blocos;
  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES`, blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n'));
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;
  const linhas = codigoOriginal.split('\n');
  let codigo = &quot;&quot;, abertas = 0, comecou = false;
  for (let i = bloco.linha - 1; i < Math.min(bloco.linha + 200, linhas.length); i++) {
    const linha = linhas[i]; codigo += linha + '\n';
    for (const c of linha) { if (c==='{'){abertas++;comecou=true;} if(c==='}')abertas--; }
    if (comecou &amp;&amp; abertas <= 0) break;
  }
  mostrarNaVisualizacao(`📋 BLOCO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

// =====================

function organizarCodigo() {
  if (!codigoOriginal) return alert(&quot;Carregue o arquivo primeiro!&quot;);
  let organizado = codigoOriginal.replace(/;(?!\n)/g,';\n').replace(/\{(?!\n)/g,'{\n').replace(/\}(?!\n)/g,'}\n').replace(/,(?!\n)(?!\s)/g,',\n').replace(/\n{3,}/g,'\n\n');
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';
    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel-1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;
    return resultado;
  });
  mostrarNaVisualizacao(&quot;✨ CÓDIGO ORGANIZADO&quot;, indentado.join('\n'));
}

function salvarNaMemoria() {

async function consultarIA(perguntaOverride) {
  const chave = document.getElementById(&quot;iaApiKey&quot;).value.trim();
  if (!chave) { alert(&quot;Cole sua chave de API no painel da IA.&quot;); return; }
  const pergunta = perguntaOverride || document.getElementById(&quot;iaPergunta&quot;).value.trim();
  if (!pergunta) { alert(&quot;Digite uma pergunta para a IA.&quot;); return; }
  const provedor = detectarProvedor(chave);
  if (!provedor) { alert(&quot;Chave não reconhecida. Use: gsk_ (Groq), AIza (Gemini), sk- (OpenAI), sk-or- (OpenRouter), xai- (xAI), sk-ant (Anthropic)&quot;); return; }

  const contexto = codigoOriginal
    ? `\n\nCÓDIGO ATUAL (${nomArquivo || &quot;sem nome&quot;}, ${(codigoOriginal.length/1024).toFixed(1)}KB):\n\`\`\`\n${codigoOriginal.substring(0, 8000)}${codigoOriginal.length > 8000 ? &quot;\n... [truncado]&quot; : &quot;&quot;}\n\`\`\``
    : &quot;&quot;;

  const btn = document.getElementById(&quot;btnConsultarIA&quot;);
  btn.disabled = true; btn.innerHTML = '<span class=&quot;spinner&quot;></span>Consultando...';
  const respostaEl = document.getElementById(&quot;iaResposta&quot;);
  respostaEl.style.display = &quot;block&quot;; respostaEl.textContent = &quot;⏳ Aguardando resposta...&quot;;

  try {
    const resp = await fetch(`${provedor.url}/chat/completions`, {
      method: &quot;POST&quot;,
      headers: { &quot;Content-Type&quot;: &quot;application/json&quot;, &quot;Authorization&quot;: `Bearer ${chave}` },
      body: JSON.stringify({
        model: provedor.model,
        messages: [
          { role: &quot;system&quot;, content: &quot;Você é especialista em análise e limpeza de código. Responda sempre em português brasileiro. Seja direto e prático para usuário leigo. Quando sugerir código, forneça completo e pronto para usar.&quot; },
          { role: &quot;user&quot;, content: pergunta + contexto }
        ],
        max_tokens: 2000, temperature: 0.3
      })
    });

    if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err?.error?.message || `Erro ${resp.status}`); }
    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content || &quot;Sem resposta.&quot;;
    respostaEl.textContent = resposta;
    mostrarNaVisualizacao(`🤖 RESPOSTA DA IA (${provedor.nome})`, resposta);
    salvarNoHistorico(pergunta, resposta, provedor.nome); // ← SALVA NO HISTÓRICO
  } catch(e) {
    const msg = `❌ Erro: ${e.message}\n\nVerifique se a chave está correta e tem créditos disponíveis.`;
    respostaEl.textContent = msg;
  } finally {
    btn.disabled = false; btn.innerHTML = '🤖 Consultar IA';
  }
}

function copiarVisualizacao() {

    const original = btn.textContent;
    btn.textContent = &quot;✅ Copiado!&quot;; btn.classList.add(&quot;copiado&quot;);

function baixarTexto(conteudo, nome) {
  const blob = new Blob([conteudo], { type: &quot;text/plain&quot; });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;); a.href = url; a.download = nome; a.click();
