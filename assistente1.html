  <div class=&quot;empty-state&quot; id=&quot;emptyState&quot;>
    <span class=&quot;icon&quot;>⚖️</span>
    <h2>Chat IA Pro — Saulo</h2>
    <p>IA livre por padrão. Configure o 🧠 System Prompt para ajustar o comportamento.</p>
    <div class=&quot;chips&quot;>
      <div class=&quot;chip&quot; onclick=&quot;setPrompt('Olá! Me apresente seus recursos.')&quot;>Olá!</div>
      <div class=&quot;chip&quot; onclick=&quot;setPrompt('Resuma a jurisprudência recente do STF sobre dano moral.')&quot;>⚖️ Jurisprudência</div>
      <div class=&quot;chip&quot; onclick=&quot;setPrompt('Me ajude a estruturar uma petição inicial.')&quot;>📝 Petição</div>
      <div class=&quot;chip&quot; onclick=&quot;setPrompt('Quais são as ferramentas de IA mais úteis em 2026?')&quot;>🤖 IA atual</div>
    </div>
  </div>
</div>

<div class=&quot;input-bar&quot;>
  <textarea id=&quot;msgInput&quot; placeholder=&quot;Digite sua mensagem… (Enter envia, Shift+Enter quebra linha)&quot; onkeydown=&quot;handleKey(event)&quot; oninput=&quot;adjustHeight(this);autoSaveDraft()&quot;></textarea>
  <button class=&quot;mic-btn&quot; id=&quot;micBtn&quot; title=&quot;Ditar por voz&quot; onclick=&quot;toggleVoice()&quot;>🎤</button>
  <button class=&quot;stop-btn&quot; id=&quot;stopBtn&quot; style=&quot;display:none&quot; onclick=&quot;abortStream()&quot; title=&quot;Parar&quot;>⏹</button>
  <button class=&quot;send-btn&quot; id=&quot;sendBtn&quot; onclick=&quot;send()&quot; title=&quot;Enviar&quot;>➤</button>
</div>

<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
'use strict';

// ═══════════════════════════════════════
// AUTO-DETECÇÃO DE PROVEDORES
// ═══════════════════════════════════════
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile',  name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',       name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest',  name:'Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',                name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',         name:'Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',            name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',            name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',              name:'OpenAI' },
];
const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];
function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

// ═══════════════════════════════════════
// SYSTEM PROMPT PRESETS
// ═══════════════════════════════════════
const PRESETS = {
  livre: '',
  juridico: `Você é um assistente jurídico especializado no direito brasileiro.
Responda de forma técnica, cite legislação e jurisprudência quando relevante.
Seja objetivo e preciso. Não use linguagem informal.`,
  codigo: `Você é um assistente de programação.
Ao responder: entregue o código completo e funcional.
Explique brevemente o que mudou. Seja direto.`,
  direto: `Responda sempre de forma direta e objetiva.
Sem introduções longas. Sem frases de empatia.
Vá direto ao ponto. Entregue a resposta e pronto.`,
  custom: null,
};

let currentPreset = localStorage.getItem('cia_preset') || 'livre';
let customSysPrompt = localStorage.getItem('cia_sysprompt') || '';
let feedbackOn = localStorage.getItem('cia_feedback') !== 'off';

function getSysPrompt() {
  if (currentPreset === 'custom') return customSysPrompt;
  return PRESETS[currentPreset] || '';
}

function applyPreset(name) {
  currentPreset = name;
  localStorage.setItem('cia_preset', name);
  document.querySelectorAll('.sys-preset').forEach(b => b.classList.remove('active'));
  document.getElementById('preset-'+name)?.classList.add('active');
  if (name !== 'custom') {
    document.getElementById('sysPromptInput').value = PRESETS[name] || '';
    toast('Preset &quot;'+name+'&quot; aplicado');
  } else {
    document.getElementById('sysPromptInput').value = customSysPrompt;
  }
}

function saveSystemPrompt() {
  const val = document.getElementById('sysPromptInput').value.trim();
  customSysPrompt = val;
  currentPreset = 'custom';
  localStorage.setItem('cia_sysprompt', val);
  localStorage.setItem('cia_preset', 'custom');
  document.querySelectorAll('.sys-preset').forEach(b => b.classList.remove('active'));
  document.getElementById('preset-custom')?.classList.add('active');
  toast('System Prompt salvo ✓');
}

function initSysPanel() {
  document.getElementById('sysPromptInput').value = getSysPrompt();
  document.querySelectorAll('.sys-preset').forEach(b => b.classList.remove('active'));
  document.getElementById('preset-'+currentPreset)?.classList.add('active');
}

// ═══════════════════════════════════════
// FEEDBACK
// ═══════════════════════════════════════
function toggleFeedback() {
  feedbackOn = !feedbackOn;
  localStorage.setItem('cia_feedback', feedbackOn ? 'on' : 'off');
  document.getElementById('fbToggleBtn').style.opacity = feedbackOn ? '1' : '0.4';
  toast(feedbackOn ? '⭐ Feedback ATIVADO' : 'Feedback desativado');
}

function addFeedbackBar(msgEl, responseText) {
  if (!feedbackOn) return;
  const bar = document.createElement('div');
  bar.className = 'feedback-bar';

  const label = document.createElement('span');
  label.textContent = 'Resposta útil?';

  const btnUp = document.createElement('button');
  btnUp.className = 'fb-btn';
  btnUp.textContent = '👍';
  btnUp.title = 'Boa resposta';

  const btnDown = document.createElement('button');
  btnDown.className = 'fb-btn';
  btnDown.textContent = '👎';
  btnDown.title = 'Resposta ruim';

  const btnCopy = document.createElement('button');
  btnCopy.className = 'fb-btn';
  btnCopy.textContent = '📋 Copiar';
  btnCopy.onclick = () => {
    navigator.clipboard.writeText(responseText || '');
    btnCopy.textContent = '✓ Copiado';
    setTimeout(() => btnCopy.textContent = '📋 Copiar', 1800);
  };

  const note = document.createElement('span');
  note.className = 'fb-note';
  note.id = 'fb-note-'+Date.now();

  let voted = false;
  btnUp.onclick = () => {
    if (voted) return;
    voted = true;
    btnUp.classList.add('selected');
    note.textContent = 'Obrigado! ✓';
    saveFeedback('up', responseText);
  };
  btnDown.onclick = () => {
    if (voted) return;
    voted = true;
    btnDown.classList.add('selected');
    note.textContent = 'Anotado. ✓';
    saveFeedback('down', responseText);
  };

  bar.appendChild(label);
  bar.appendChild(btnUp);
  bar.appendChild(btnDown);
  bar.appendChild(btnCopy);
  bar.appendChild(note);
  msgEl.appendChild(bar);
}

function saveFeedback(type, text) {
  const feedbacks = JSON.parse(localStorage.getItem('cia_feedbacks') || '[]');
  feedbacks.push({ type, text: text?.slice(0,200), date: new Date().toISOString(), conv: currentConvId });
  if (feedbacks.length > 200) feedbacks.splice(0, feedbacks.length - 200);
  localStorage.setItem('cia_feedbacks', JSON.stringify(feedbacks));
}

// ═══════════════════════════════════════
// INDEXEDDB
// ═══════════════════════════════════════
const DB_NAME = 'ChatIAProDB_v2';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ev => {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) d.createObjectStore('conversations', { keyPath:'id' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror   = () => reject(req.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res,rej) => { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
}
function dbGetAll(store) {
  return new Promise((res,rej) => { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function dbGet(store, key) {
  return new Promise((res,rej) => { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function dbDelete(store, key) {
  return new Promise((res,rej) => { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
}

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history       = [];
let currentConvId = null;
let controller    = null;
let isRecording   = false;
let recog         = null;
let silTimer      = null;
let saveTimer     = null;

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  document.getElementById('keyInput').value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    document.getElementById('urlInput').value   = d ? d.url   : (apiUrl   || '');
    document.getElementById('modelInput').value = d ? d.model : (apiModel || '');
  }

  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity    = ttsOn ? '1' : '0.4';
  document.getElementById('fbToggleBtn').style.opacity = feedbackOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);

  initSysPanel();
  renderSavedKeys();
  await renderConvList();

  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;&amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv?.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  const draft = localStorage.getItem('cia_draft');
  if (draft) { document.getElementById('msgInput').value = draft; adjustHeight(document.getElementById('msgInput')); }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m => appendMsg(m.role==='user'?'user':'bot', m.content, false, true));
  addCopyListeners();
}

// ═══════════════════════════════════════
// AUTO-SAVE
// ═══════════════════════════════════════
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_'+Date.now();
  const title = (history.find(m=>m.role==='user')?.content||'Conversa').slice(0,60).replace(/\n/g,' ');
  const obj = { id:currentConvId, title, messages:history, updatedAt:Date.now(), provider:apiKey?(detectProvider(apiKey)?.name||'Custom'):'Demo' };
  try { await dbPut('conversations', obj); localStorage.setItem('cia_current_conv', currentConvId); } catch(e) {}
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 400); }
function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  v ? localStorage.setItem('cia_draft',v) : localStorage.removeItem('cia_draft');
}

// ═══════════════════════════════════════
// PAINÉIS
// ═══════════════════════════════════════
function togglePanel(panelId, btnId) {
  const all = ['cfgPanel','keysPanel','convPanel','ioPanel','sysPanel'];
  const allB= ['cfgBtn','keysBtn','convBtn','ioBtn','sysBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  all.forEach(id=>document.getElementById(id).classList.remove('show'));
  allB.forEach(id=>document.getElementById(id)?.classList.remove('active'));
  if (show) { target.classList.add('show'); document.getElementById(btnId)?.classList.add('active'); }
  if (panelId==='sysPanel') initSysPanel();
  if (panelId==='convPanel') renderConvList();
}

// ═══════════════════════════════════════
// CHAVES
// ═══════════════════════════════════════
function onKeyInput(val) {
  val = val.trim(); apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value= d.model;
    apiUrl=d.url; apiModel=d.model;
    localStorage.setItem('cia_url',d.url); localStorage.setItem('cia_model',d.model);
    document.getElementById('cfgProvOk').textContent='✓ '+d.name+' · '+d.model;
    document.getElementById('cfgProvOk').style.display='block';
    document.getElementById('cfgNote').style.display='none';
  } else {
    document.getElementById('cfgProvOk').style.display='none';
    document.getElementById('cfgNote').style.display='';
  }
  document.getElementById('saveRow').style.display = val?'flex':'none';
  updateProvBadge(); updateCfgStatus();
}
function updateProvBadge() {
  const b=document.getElementById('provBadge');
  if (apiKey) { const d=detectProvider(apiKey); b.textContent=d?d.name:'Custom'; b.style.borderColor='#5aab56'; b.style.color='#7ec87a'; }
  else { b.textContent='Demo ✨'; b.style.borderColor='#60a5fa'; b.style.color='#93c5fd'; }
}
function updateCfgStatus() {
  const el=document.getElementById('cfgStatus');
  if (apiKey) { const d=detectProvider(apiKey); el.textContent='✓ '+(d?d.name:'Custom')+' ativa'; el.className='cfg-status ok'; }
  else { el.textContent='Sem chave'; el.className='cfg-status demo'; }
}
function toggleShowKey() { showKey=!showKey; document.getElementById('keyInput').type=showKey?'text':'password'; }
function saveKey() {
  const key=document.getElementById('keyInput').value.trim();
  const label=document.getElementById('labelInput').value.trim();
  const url=document.getElementById('urlInput').value.trim();
  const model=document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k=>k.key===key)) { toast('Chave já salva','err'); return; }
  const d=detectProvider(key);
  savedKeys.push({ id:Date.now()+'', label:label||(d?d.name:'Chave '+(savedKeys.length+1)), key, url, model, provider:d?d.name:'Custom' });
  localStorage.setItem('cia_saved',JSON.stringify(savedKeys));
  document.getElementById('labelInput').value='';
  renderSavedKeys(); toast('Chave salva ✓');
}
function renderSavedKeys() {
  const list=document.getElementById('keysList');
  document.getElementById('keysTitle').textContent='Chaves Salvas ('+savedKeys.length+')';
  if (!savedKeys.length) { list.innerHTML='<div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;>Nenhuma chave salva.</div>'; return; }
  list.innerHTML='';
  savedKeys.forEach(sk=>{
    const div=document.createElement('div');
    div.className='saved-key'+(sk.key===apiKey?' active':'');
    div.innerHTML='<div class=&quot;saved-key-info&quot; onclick=&quot;loadKey(\''+sk.id+'\')&quot;><div class=&quot;saved-key-label&quot;>'+esc(sk.label)+'</div><div class=&quot;saved-key-meta&quot;>'+esc(sk.provider)+' · '+sk.key.slice(0,6)+'…'+sk.key.slice(-3)+'</div></div>'+(sk.key===apiKey?'<span class=&quot;active-tag&quot;>ATIVA</span>':'')+'<button class=&quot;del-btn&quot; onclick=&quot;deleteKey(\''+sk.id+'\')&quot;>✕</button>';
    list.appendChild(div);
  });
}
function loadKey(id) {
  const sk=savedKeys.find(k=>k.id===id); if (!sk) return;
  apiKey=sk.key; apiUrl=sk.url; apiModel=sk.model;
  localStorage.setItem('cia_key',sk.key); localStorage.setItem('cia_url',sk.url); localStorage.setItem('cia_model',sk.model);
  document.getElementById('keyInput').value=sk.key; document.getElementById('urlInput').value=sk.url; document.getElementById('modelInput').value=sk.model;
  onKeyInput(sk.key); renderSavedKeys(); togglePanel('keysPanel','keysBtn'); toast('Chave &quot;'+sk.label+'&quot; ativada');
}
function deleteKey(id) { savedKeys=savedKeys.filter(k=>k.id!==id); localStorage.setItem('cia_saved',JSON.stringify(savedKeys)); renderSavedKeys(); }

// ═══════════════════════════════════════
// HISTÓRICO
// ═══════════════════════════════════════
async function renderConvList() {
  const list=document.getElementById('convList');
  if (!db) { list.innerHTML='<div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;>DB indisponível</div>'; return; }
  const convs=(await dbGetAll('conversations')).sort((a,b)=>b.updatedAt-a.updatedAt);
  document.getElementById('convTitle').textContent='Conversas ('+convs.length+')';
  if (!convs.length) { list.innerHTML='<div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;>Nenhuma conversa salva ainda.</div>'; return; }
  list.innerHTML='';
  convs.forEach(c=>{
    const div=document.createElement('div');
    div.className='conv-item'+(c.id===currentConvId?' active':'');
    const date=new Date(c.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    div.innerHTML='<div class=&quot;conv-info&quot; onclick=&quot;loadConv(\''+c.id+'\')&quot;><div class=&quot;conv-title&quot;>'+esc(c.title)+'</div><div class=&quot;conv-meta&quot;>'+date+' · '+c.messages.length+' msgs · '+esc(c.provider||'')+'</div></div><button class=&quot;del-btn&quot; onclick=&quot;deleteConv(\''+c.id+'\')&quot;>✕</button>';
    list.appendChild(div);
  });
}
async function loadConv(id) {
  const c=await dbGet('conversations',id); if (!c) return;
  currentConvId=c.id; history=c.messages;
  localStorage.setItem('cia_current_conv',id);
  restoreUI(); togglePanel('convPanel','convBtn'); toast('Conversa carregada');
}
async function deleteConv(id) {
  if (!confirm('Excluir esta conversa?')) return;
  await dbDelete('conversations',id);
  if (id===currentConvId) { currentConvId=null; history=[]; restoreUI(); }
  await renderConvList();
}
function newChat() {
  if (history.length&amp;&amp;!confirm('Nova conversa? A atual já está salva.')) return;
  abortStream(); history=[]; currentConvId=null;
  localStorage.removeItem('cia_current_conv');
  window.speechSynthesis?.cancel();
  const chat=document.getElementById('chat'); chat.innerHTML='';
  const empty=document.createElement('div'); empty.className='empty-state'; empty.id='emptyState';
  empty.innerHTML='<span class=&quot;icon&quot;>⚖️</span><h2>Chat IA Pro</h2><p>Nova conversa pronta!</p><div class=&quot;chips&quot;><div class=&quot;chip&quot; onclick=&quot;setPrompt(\'Olá!\')&quot;>Olá!</div><div class=&quot;chip&quot; onclick=&quot;setPrompt(\'Me ajude com uma questão jurídica.\')&quot;>⚖️ Jurídico</div></div>';
  chat.appendChild(empty);
}

// ═══════════════════════════════════════
// WEB SEARCH
// ═══════════════════════════════════════
function toggleWeb() {
  webOn=!webOn; localStorage.setItem('cia_web',webOn?'on':'off');
  document.getElementById('webBtn').classList.toggle('web-on',webOn);
  toast(webOn?'🌐 Busca web ATIVADA':'Busca web desativada');
}
async function webSearch(query) {
  try {
    const url='https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;format=json&amp;no_html=1&amp;skip_disambig=1';
    const r=await fetch(url); const j=await r.json();
    const parts=[];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText);
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.RelatedTopics?.length) {
      const t=j.RelatedTopics.slice(0,5).filter(t=>t.Text).map((t,i)=>(i+1)+'. '+t.Text);
      if (t.length) parts.push('TÓPICOS:\n'+t.join('\n'));
    }
    return parts.length?parts.join('\n\n'):null;
  } catch { return null; }
}

// ═══════════════════════════════════════
// ENVIAR
// ═══════════════════════════════════════
function handleKey(e) { if (e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();send();} }
function adjustHeight(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,130)+'px'; }
function setPrompt(txt) { const el=document.getElementById('msgInput'); el.value=txt; adjustHeight(el); el.focus(); }

async function send(textOverride) {
  const el=document.getElementById('msgInput');
  const text=(textOverride||el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) { const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }

  document.getElementById('emptyState')?.remove();
  el.value=''; el.style.height='44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller=new AbortController();
  document.getElementById('sendBtn').style.display='none';
  document.getElementById('stopBtn').style.display='flex';

  const { content:contentEl, wrap:wrapEl } = appendMsg('bot','',true);

  // Web search
  let webContext='';
  if (webOn) {
    const note=document.createElement('div'); note.className='progress'; note.textContent='🌐 Buscando...';
    contentEl.appendChild(note);
    const result=await webSearch(text); note.remove();
    if (result) { webContext='\n\n[CONTEXTO WEB]:\n'+result+'\n[FIM]'; }
  }

  try {
    const key=apiKey.trim();
    const url=(document.getElementById('urlInput').value||apiUrl||'https://api.groq.com/openai/v1').trim().replace(/\/$/,'');
    const model=document.getElementById('modelInput').value||apiModel||'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML='<span style=&quot;color:#60a5fa&quot;>⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: <a href=&quot;https://console.groq.com&quot; target=&quot;_blank&quot; style=&quot;color:#7ec87a&quot;>console.groq.com</a></span>';
      history.pop(); scheduleSave(); return;
    }

    // Monta mensagens com system prompt
    const sys = getSysPrompt();
    let msgs = sys ? [{ role:'system', content:sys }, ...history] : [...history];
    if (webContext) {
      const last=msgs[msgs.length-1];
      msgs[msgs.length-1]={ role:'user', content:last.content+webContext };
    }

    const resp=await fetch(url+'/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key, 'HTTP-Referer':location.origin, 'X-Title':'Chat IA Pro' },
      body:JSON.stringify({ model, messages:msgs, stream:true, max_tokens:16384 }),
      signal:controller.signal
    });

    if (!resp.ok) {
      const errText=await resp.text();
      let msg='Erro '+resp.status;
      try { msg=JSON.parse(errText)?.error?.message||msg; } catch {}
      contentEl.innerHTML='<span style=&quot;color:var(--err)&quot;>❌ '+esc(msg)+'</span>';
      history.pop(); scheduleSave(); return;
    }

    const reader=resp.body.getReader(); const decoder=new TextDecoder();
    let full='', buf='';
    const cursor=document.createElement('span'); cursor.className='cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value }=await reader.read(); if (done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j=line.slice(6).trim(); if (j==='[DONE]') continue;
        try {
          const p=JSON.parse(j);
          if (p.error) throw new Error(typeof p.error==='string'?p.error:p.error.message||'Erro');
          const delta=p.choices?.[0]?.delta?.content||p.text||p.content||'';
          if (delta) { full+=delta; cursor.remove(); contentEl.innerHTML=renderMarkdown(full); contentEl.appendChild(cursor); scrollBottom(); }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML=renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
      // FEEDBACK AUTOMÁTICO
      addFeedbackBar(wrapEl, full);
    }

  } catch(err) {
    if (err.name==='AbortError') {
      contentEl.innerHTML+='<em style=&quot;color:var(--muted);font-size:11px&quot;> [parado]</em>';
    } else {
      contentEl.innerHTML='<span style=&quot;color:var(--err)&quot;>❌ '+esc(err.message)+'</span>';
      history.pop(); scheduleSave();
    }
  } finally {
    controller=null;
    document.getElementById('sendBtn').style.display='flex';
    document.getElementById('stopBtn').style.display='none';
    scrollBottom(); addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

// ═══════════════════════════════════════
// RENDERIZAÇÃO
// ═══════════════════════════════════════
function appendMsg(role, text, streaming, isRestore) {
  const wrap=document.createElement('div'); wrap.className='msg '+role;
  const bubble=document.createElement('div'); bubble.className='msg-bubble';
  const content=document.createElement('div'); content.className='msg-content';
  if (role==='user') content.textContent=text;
  else if (streaming) content.innerHTML='';
  else content.innerHTML=renderMarkdown(text);
  bubble.appendChild(content); wrap.appendChild(bubble);
  const meta=document.createElement('div'); meta.className='msg-meta';
  if (role==='bot') {
    const prov=apiKey?(detectProvider(apiKey)?.name||'IA'):'IA';
    const lbl=document.createElement('span'); lbl.className='prov-label'; lbl.textContent=prov;
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,content.textContent);};
    meta.appendChild(lbl); meta.appendChild(btn);
  } else {
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,text);};
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);
  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el:wrap, content, wrap };
}

let copyBlockId=0;
function renderMarkdown(text) {
  let html=esc(text);
  html=html.replace(/```(\w*?)\n([\s\S]*?)```/g,(_,lang,code)=>{
    const id='cb'+(++copyBlockId);
    return '<div class=&quot;code-block&quot;><div class=&quot;code-header&quot;><span>'+(lang||'código')+'</span><button class=&quot;copy-btn&quot; data-copy=&quot;'+escAttr(code)+'&quot; id=&quot;'+id+'&quot;>📋 Copiar</button></div><div class=&quot;code-body&quot;>'+code+'</div></div>';
  });
  html=html.replace(/`([^`\n]+?)`/g,'<span class=&quot;inline-code&quot;>$1</span>');
  html=html.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/\*([^*]+?)\*/g,'<em>$1</em>');
  html=html.replace(/(https?:\/\/[^\s<>&quot;']+)/g,'<a href=&quot;$1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>$1</a>');
  html=html.replace(/\n/g,'<br>');
  return html;
}
function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn=>{
    if (btn.dataset.bound) return; btn.dataset.bound='1';
    btn.onclick=function(){copyText(this,this.dataset.copy);};
  });
}
function copyText(btn,text) {
  navigator.clipboard.writeText(text||'').catch(()=>{});
  const orig=btn.innerHTML; btn.innerHTML='✓ Copiado!';
  setTimeout(()=>{btn.innerHTML=orig;},1800);
}
function scrollBottom() { const c=document.getElementById('chat'); c.scrollTop=c.scrollHeight; }

// ═══════════════════════════════════════
// EXPORTAR
// ═══════════════════════════════════════
function exportConv(format) {
  

  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date=new Date().toLocaleString('pt-BR');
  let content='', mime='text/plain', ext=format;

  if (format==='txt') {
    const lines=['=== CONVERSA — Chat IA Pro ===','Data: '+date,''];
    history.forEach(m=>{ lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']'); lines.push(m.content); lines.push(''); });
    content=lines.join('\n');
  }
  else if (format==='md') {
    const lines=['# Conversa Chat IA Pro','> '+date,''];
    history.forEach(m=>{ lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA')); lines.push(''); lines.push(m.content); lines.push(''); });
    content=lines.join('\n'); mime='text/markdown';
  }
  else if (format==='json') {
    const sys=getSysPrompt();
    content=JSON.stringify({
      title: (history.find(m=>m.role==='user')?.content||'Conversa').slice(0,60),
      exportedAt: date,
      provider: apiKey?(detectProvider(apiKey)?.name||'Custom'):'Demo',
      systemPrompt: sys||null,
      preset: currentPreset,
      messages: history,
    },null,2);
    mime='application/json';
  }
  else if (format==='pdf') {
    const w=window.open('','_blank');
    const html=['<!DOCTYPE html><html><head><meta charset=&quot;UTF-8&quot;><title>Conversa</title>',
      '<style>body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      '@media print{body{margin:0}}</style></head><body>',
      '<h1>Conversa — Chat IA Pro</h1>',
      '<div class=&quot;meta&quot;>Exportado em '+date+' · '+history.length+' mensagens</div>'];
    history.forEach(m=>{
      const safe=esc(m.content).replace(/\n/g,'<br>');
      html.push('<div class=&quot;msg '+(m.role==='user'?'user':'bot')+'&quot;>');
      html.push('<div class=&quot;role&quot;>'+(m.role==='user'?'🧑 Você':'🤖 IA')+'</div>');
      html.push('<div>'+safe+'</div></div>');
    });
    html.push('<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');
    w.document.write(html.join('')); w.document.close();
    toast('PDF: use &quot;Salvar como PDF&quot; na impressão'); return;
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));
  a.download='conversa-'+Date.now()+'.'+ext;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Exportado: '+ext.toUpperCase());
}

// ═══════════════════════════════════════
// IMPORTAR
// ═══════════════════════════════════════
async function importFile(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  const name=file.name.toLowerCase();
  const el=document.getElementById('msgInput');
  try {
    let txt='';
    if (name.endsWith('.pdf')) { toast('📕 Lendo PDF...'); txt=await extractPDF(file); }
    else if (name.endsWith('.json')) {
      const raw=await file.text();
      try {
        const j=JSON.parse(raw);
        // Conversa exportada — oferece restaurar
        if (j.messages&amp;&amp;Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar agora?\n\n&quot;'+j.title+'&quot;')) {
            history=j.messages; currentConvId=null;
            // Restaura system prompt se tiver
            if (j.systemPrompt) {
              customSysPrompt=j.systemPrompt;
              currentPreset='custom';
              localStorage.setItem('cia_sysprompt',j.systemPrompt);
              localStorage.setItem('cia_preset','custom');
            }
            restoreUI(); scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa restaurada ✓ ('+history.length+' msgs)'); return;
          }
        }
        txt=JSON.stringify(j,null,2);
      } catch { txt=raw; }
    }
    else { txt=await file.text(); }
    if (txt) {
      el.value=el.value?el.value+'\n\n'+txt:txt;
      adjustHeight(el); autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Importado ('+txt.length+' chars)');
    }
  } catch(err) { toast('Erro: '+err.message,'err'); }
}

async function extractPDF(file) {
  if (typeof pdfjsLib==='undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for (let i=1;i<=pdf.numPages;i++) {
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    pages.push('--- Página '+i+' ---\n'+tc.items.map(it=>it.str).join(' '));
  }
  return pages.join('\n\n');
}

// ═══════════════════════════════════════
// OCR
// ═══════════════════════════════════════
async function importImage(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  if (typeof Tesseract==='undefined') { toast('Tesseract não carregou','err'); return; }
  const el=document.getElementById('msgInput');
  const prog=document.createElement('div');
  prog.className='progress';
  prog.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;';
  prog.textContent='🔍 OCR iniciando...';
  document.body.appendChild(prog);
  try {
    const { data }=await Tesseract.recognize(file,'por+eng',{
      logger:m=>{ if (m.status==='recognizing text') prog.textContent='🔍 OCR: '+Math.round(m.progress*100)+'%'; }
    });
    const txt=(data?.text||'').trim();
    if (txt) {
      el.value=el.value?el.value+'\n\n[OCR]\n'+txt:'[OCR]\n'+txt;
      adjustHeight(el); autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else { toast('Nenhum texto encontrado','err'); }
  } catch(err) { toast('Erro OCR: '+err.message,'err'); }
  finally { prog.remove(); }
}

async function backupAll() {
  const convs=db?await dbGetAll('conversations'):[];
  const feedbacks=JSON.parse(localStorage.getItem('cia_feedbacks')||'[]');
  const data={
    version:2,
    exportedAt:new Date().toISOString(),
    keys:savedKeys,
    conversations:convs,
    feedbacks,
    settings:{ apiKey, apiUrl, apiModel, ttsOn, webOn, currentPreset, customSysPrompt }
  };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='chatia-backup-'+Date.now()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup completo ✓');
}

async function restoreBackup(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  if (!confirm('Restaurar backup? Dados atuais serão MESCLADOS.')) return;
  try {
    const data=JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing=new Set(savedKeys.map(k=>k.key));
      data.keys.forEach(k=>{ if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved',JSON.stringify(savedKeys));
    }
    if (data.conversations?.length&amp;&amp;db) {
      for (const c of data.conversations) await dbPut('conversations',c);
    }
    if (data.settings?.customSysPrompt) {
      customSysPrompt=data.settings.customSysPrompt;
      localStorage.setItem('cia_sysprompt',customSysPrompt);
    }
    if (data.settings?.currentPreset) {
      currentPreset=data.settings.currentPreset;
      localStorage.setItem('cia_preset',currentPreset);
    }
    renderSavedKeys(); await renderConvList();
    toast('Backup restaurado ✓');
  } catch { toast('Erro: backup inválido','err'); }
}

// ═══════════════════════════════════════
// VOZ — STT
// ═══════════════════════════════════════
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }
  recog=new SR(); recog.lang='pt-BR'; recog.continuous=true; recog.interimResults=true;
  let fullText='';
  const schedSend=()=>{ clearTimeout(silTimer); silTimer=setTimeout(()=>{ try{recog.stop();}catch{} if(fullText.trim()){setPrompt('');send(fullText.trim());} },1800); };
  recog.onresult=ev=>{
    let final='',interim='';
    for (let i=0;i<ev.results.length;i++) { if(ev.results[i].isFinal) final+=ev.results[i][0].transcript; else interim+=ev.results[i][0].transcript; }
    fullText=final||interim;
    document.getElementById('msgInput').value=fullText; adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };
  recog.onerror=recog.onend=()=>{ clearTimeout(silTimer); isRecording=false; recog=null; document.getElementById('micBtn').classList.remove('listening'); };
  try { recog.start(); } catch { return; }
  isRecording=true; document.getElementById('micBtn').classList.add('listening');
}
function stopVoice() { try{recog?.stop();}catch{} recog=null; isRecording=false; clearTimeout(silTimer); document.getElementById('micBtn').classList.remove('listening'); }

// ═══════════════════════════════════════
// TTS
// ═══════════════════════════════════════
function toggleTTS() {
  ttsOn=!ttsOn; localStorage.setItem('cia_tts',ttsOn?'on':'off');
  document.getElementById('ttsBtn').style.opacity=ttsOn?'1':'0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
  toast(ttsOn?'🔊 Voz ATIVADA':'Voz desativada');
}
function speakText(text) {
  if (!ttsOn||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/<[^>]+>/g,'').replace(/[`*#]/g,'').substring(0,800);
  const u=new SpeechSynthesisUtterance(clean); u.lang='pt-BR';
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function esc(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }
function escAttr(s) { return esc(s).replace(/'/g,'&amp;#39;'); }

let toastTimer;
function toast(msg,type) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err',type==='err');
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

window.addEventListener('beforeunload',()=>{ if(history.length) autoSave(); autoSaveDraft(); });

boot();

/* ── TEXTAREA ── */
textarea {
  width: 100%; resize: none;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 12px;
  padding: 10px 12px; outline: none; line-height: 1.6; font-family: Arial;
}
textarea:focus { border-color: var(--amber); }

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap; background: none;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-amber  { background: #92400e33; border-color: #d9770655; color: var(--amber2); }
.btn-amber:hover:not(:disabled)  { background: #92400e55; }
.btn-ghost  { background: none; border-color: var(--border); color: var(--muted); }
.btn-ghost:hover:not(:disabled)  { color: var(--text); border-color: #4b5563; }
.btn-red    { background: #7f1d1d33; border-color: #ef444433; color: var(--red); }
.btn-red:hover:not(:disabled)    { background: #7f1d1d55; }
.btn-green  { background: #14532d33; border-color: #22c55e33; color: var(--green); }
.btn-green:hover:not(:disabled)  { background: #14532d55; }
.btn-purple { background: #4c1d9533; border-color: #8b5cf633; color: var(--purple); }
.btn-purple:hover:not(:disabled) { background: #4c1d9555; }
.btn-blue   { background: #1e3a5f33; border-color: #3b82f633; color: var(--blue); }
.btn-blue:hover:not(:disabled)   { background: #1e3a5f55; }
.btn-cyan   { background: #164e6333; border-color: #22d3ee33; color: var(--cyan); }
.btn-cyan:hover:not(:disabled)   { background: #164e6355; }
.btn-full { width: 100%; justify-content: center; }

/* ── GRID AÇÕES ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.action-btn {
  padding: 10px 6px; border-radius: 10px; border: 1px solid;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s;
  text-align: center; background: var(--bg2);
}
.action-btn:hover:not(:disabled) { filter: brightness(1.2); }
.action-btn:disabled { opacity: .4; cursor: not-allowed; }
.action-btn.ativo { filter: brightness(1.3); }

/* ── RESULTADO ── */
.resultado-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
  font-family: 'Times New Roman', Georgia, serif;
  font-size: 13px; line-height: 1.9; color: var(--text);
  min-height: 80px; white-space: pre-wrap;
  overflow-x: auto;
}
.resultado-box p { margin: 0; text-align: justify; }
.resultado-box .titulo-peca { font-weight: bold; text-indent: 0 !important; }
.resultado-box .item-lista  { padding-left: 1cm; text-indent: 0 !important; }
.resultado-box .citacao     { padding-left: 4cm; font-size: 12px; text-indent: 0 !important; }
.resultado-box .paragrafo   { text-indent: 4cm; }

/* ── EDITOR FORMATAÇÃO ── */
.editor-toolbar {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; margin-bottom: 10px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.editor-toolbar select, .editor-toolbar input[type=number] {
  height: 28px; padding: 0 8px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); font-size: 11px; outline: none;
}
.editor-toolbar select:focus, .editor-toolbar input:focus { border-color: var(--amber); }
.editor-toolbar .sep { width: 1px; height: 24px; background: var(--border); }
.format-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--muted); font-size: 11px;
  cursor: pointer; transition: all .15s; font-weight: 600;
}
.format-btn:hover { background: #ffffff10; color: var(--text); }
.format-btn.ativo { background: var(--amber); color: #000; border-color: var(--amber); }

/* ── CHAT ── */
.chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding: 4px 0; }
.msg-user { background: #78350f33; border: 1px solid #92400e44; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-left: 20px; }
.msg-ia   { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-right: 20px; }
.msg-role { font-size: 10px; font-weight: 700; opacity: .5; margin-bottom: 3px; }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.card-title { font-size: 12px; font-weight: 700; color: var(--amber2); margin-bottom: 4px; }
.card-sub   { font-size: 11px; color: var(--muted); }
.card-selected { border-color: #22c55e55; background: #14532d22; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: #00000088; backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-overlay.aberto { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; max-width: 600px; width: 100%;
  max-height: 80vh; overflow-y: auto; padding: 20px;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 14px; font-weight: 700; color: var(--amber2); }
.modal-close {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 20px; padding: 0; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
}
.modal-close:hover { background: #ffffff10; color: var(--text); }

/* ── MISC ── */
.section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; margin-top: 14px; }
.section-title:first-child { margin-top: 0; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spacer { height: 10px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.spinner { width: 14px; height: 14px; border: 2px solid #ffffff22; border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.text-amber  { color: var(--amber2); }
.text-muted  { color: var(--muted); }
.text-purple { color: var(--purple); }
.text-blue   { color: var(--blue); }
.text-cyan   { color: var(--cyan); }
.fs10 { font-size: 10px; }
.fs11 { font-size: 11px; }
.fs12 { font-size: 12px; }

/* ── EMENTA CHECK ── */
.ementa-check { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.ementa-check.marcado { background: #22c55e; border-color: #22c55e; }

/* ── STOP BAR ── */
.stop-bar { padding: 8px 14px; flex-shrink: 0; }

/* ── TTS CONTROLS ── */
.tts-controls {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; margin-top: 10px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.tts-controls select { height: 28px; padding: 0 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
</style>
</head>

async function importarArquivo(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let texto = '';
    if (ext === 'pdf') {
      texto = await extrairPDF(file);
    } else if (ext === 'docx' || ext === 'doc') {
      texto = await extrairDOCX(file);
    } else if (ext === 'md' || ext === 'markdown') {
      texto = await file.text();
    } else {
      texto = await file.text();
    }
    if (!texto.trim()) throw new Error('Arquivo sem texto legível.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + texto : texto;
  } catch(e) { alert('Erro ao importar: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

async function extrairPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(it => it.str).join(' ') + '\n';
  }
  return texto;
}

async function extrairDOCX(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

// ══════════════════════════════════════════════════════
async function importarImagem(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const worker = await Tesseract.createWorker('por');
    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + text : text;
  } catch(e) { alert('Erro no OCR: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

// ══════════════════════════════════════════════════════
//  VOZ
// ══════════════════════════════════════════════════════
function toggleVoz() {
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome ou Edge para ditar por voz.'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = true; recognition.interimResults = true;
  let fullText = ''; let timer = null;
  const scheduleStop = () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => { try { recognition.stop(); } catch {} }, 1800);
  };
  recognition.onresult = e => {
    let f = '', itr = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) f += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    fullText = f || itr;
    if (fullText) scheduleStop();
  };
  recognition.onend = () => {
    if (timer) clearTimeout(timer);
    isListening = false;
    document.getElementById('btn-voz').textContent = '🎤 Ditar';
    if (fullText.trim()) {
      const ta = document.getElementById('txt-processo');
      ta.value = ta.value ? ta.value.trimEnd() + '\n\n' + fullText.trim() : fullText.trim();
    }
  };
  recognition.onerror = () => { isListening = false; document.getElementById('btn-voz').textContent = '🎤 Ditar'; };
  recognition.start();
  isListening = true;
  document.getElementById('btn-voz').textContent = '🔴 Parar';
}

// ══════════════════════════════════════════════════════
//  CHAMADAS DE API
// ══════════════════════════════════════════════════════
async function chamarGemini(chave, msgs, modelo) {
  modelo = modelo || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chave}`;
  const system = msgs.find(m => m.role === 'system');
  const contents = msgs.filter(m => m.role !== 'system').map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (system &amp;&amp; contents.length > 0) contents[0].parts[0].text = system.content + '\n\n' + contents[0].parts[0].text;
  const resp = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `Gemini erro ${resp.status}`); }
  const d = await resp.json();
  return d.candidates[0].content.parts[0].text;
}

async function chamarOpenAI(chave, msgs, modelo, baseUrl) {
  modelo = modelo || 'gpt-4o';
  baseUrl = baseUrl || 'https://api.openai.com/v1';
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chave}` },
    body: JSON.stringify({ model: modelo, messages: msgs, temperature: 0.7, stream: false })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `OpenAI erro ${resp.status}`); }
  const d = await resp.json();
  return d.choices[0].message.content;
}

async function chamarClaude(chave, msgs, modelo) {
  modelo = modelo || 'claude-haiku-3-5';
  const system = msgs.find(m => m.role === 'system');
  const messages = msgs.filter(m => m.role !== 'system');
  const body = { model: modelo, max_tokens: 8192, messages, temperature: 0.7 };
  if (system) body.system = system.content;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `Claude erro ${resp.status}`); }
  const d = await resp.json();
  return d.content[0].text;
}

async function chamarGroq(chave, msgs, modelo) {
  modelo = modelo || 'llama-3.3-70b-versatile';
  return chamarOpenAI(chave, msgs, modelo, 'https://api.groq.com/openai/v1');
}

async function chamarIA(chave, msgs, modeloOverride) {
  const prov = detectProvider(chave);
  const modelo = modeloOverride || getModelo() || '';
  if (prov === 'Gemini')  return chamarGemini(chave, msgs, modelo || 'gemini-1.5-pro');
  if (prov === 'Claude')  return chamarClaude(chave, msgs, modelo || 'claude-haiku-3-5');
  if (prov === 'Groq')    return chamarGroq(chave, msgs, modelo);
  return chamarOpenAI(chave, msgs, modelo || 'gpt-4o');
}

// ══════════════════════════════════════════════════════
//  EXECUTAR AÇÃO PRINCIPAL
// ══════════════════════════════════════════════════════
async function executar(acao, customPrompt) {
  const texto = document.getElementById('txt-processo').value.trim();
  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();
  const kg = getChaveGeracao();

  // Ementas selecionadas
  const emsTexto = [...emsSelected].map(id => {
    const em = ementas.find(e => e.id === id);
    return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';
  }).filter(Boolean).join('\n\n');

  const jurisManual = document.getElementById('txt-juris').value.trim();
  const jurisFull = [jurisManual, emsTexto].filter(Boolean).join('\n\n');

  setLoading(true);
  document.getElementById('badge-demo').classList.add('hidden');

  try {
    let textoFinal = texto;

    // ── PASSO 1: Resumir/limpar com Gemini (se chave disponível e texto longo) ──
    if (kr &amp;&amp; texto.length > 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');
      const resumoMsgs = [
        { role: 'system', content: 'Você é um assistente jurídico. Resuma o texto abaixo de forma objetiva, mantendo todos os fatos relevantes, partes, pedidos, decisões e fundamentos legais. Elimine cabeçalhos de página, rodapés, certificados digitais e repetições.' },
        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');
      textoResumido = textoFinal;
    }

    // ── PASSO 2: Gerar peça com chave principal ──
    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR:\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');
      resposta = await chamarIA(kg, msgs);
    } else {
      // Demo: usa Gemini Flash gratuito se tiver chave de resumo, senão avisa
      if (kr) {
        atualizarResultado('⏳ Gerando (modo demo com Gemini)...');
        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }
    }

    // Salvar resultado
    resultado = resposta;
    renderResultado(resposta);
    chatHistory = [
      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a => a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ══════════════════════════════════════════════════════
//  RENDER RESULTADO
// ══════════════════════════════════════════════════════
function atualizarResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  box.textContent = txt;
}

function renderResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  const blocks = txt.split(/\n{2,}/);
  blocks.forEach(block => {
    const t = block.trim(); if (!t) return;
    const p = document.createElement('p');
    const lines = t.split('\n');
    const isSingle = lines.length === 1;
    const isTitulo = isSingle &amp;&amp; t === t.toUpperCase() &amp;&amp; t.length > 2 &amp;&amp; /[A-ZÁÉÍÓÚÃÕ]/.test(t) &amp;&amp; !/^\d+\./.test(t);
    const isLista  = /^\d+[.)]\s/.test(t) || /^[a-z]\)/.test(t) || /^[-–]\s/.test(t);
    const isCitacao = (t.startsWith('&quot;') || t.startsWith('\u201c')) &amp;&amp; t.length > 60;
    if (isTitulo)  p.className = 'titulo-peca';
    else if (isLista)   p.className = 'item-lista';
    else if (isCitacao) p.className = 'citacao';
    else p.className = 'paragrafo';
    lines.forEach((l, i) => { if (i > 0) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    box.appendChild(p);
  });
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function baixarRtf() {
  if (!resultado) return;
  const rtf = `{\\rtf1\\ansi\\deff0\n{\\fonttbl{\\f0 Times New Roman;}}\n{\\f0\\fs26\n${
    resultado.split(/\n\n+/).map(block => {
      const t = block.trim(); if (!t) return '';
      if (t === t.toUpperCase() &amp;&amp; t.length > 2 &amp;&amp; /[A-Z]/.test(t) &amp;&amp; !/^\d/.test(t))
        return `\\pard\\qj\\b ${t.replace(/[\\{}]/g,'\\$&amp;')}\\b0\\par\\par`;
      if (/^\d+[.)]\s/.test(t) || /^[-–]\s/.test(t))
        return `\\pard\\qj\\li720 ${t.replace(/[\\{}]/g,'\\$&amp;')}\\par\\par`;
      return `\\pard\\qj\\fi2268 ${t.replace(/[\\{}]/g,'\\$&amp;')}\\par\\par`;
    }).join('\n')
  }\n}}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rtf], { type: 'application/rtf' }));
  a.download = `juridico-${Date.now()}.rtf`; a.click();
}

// ══════════════════════════════════════════════════════
//  EXPORTAR WORD (DOCX)
// ══════════════════════════════════════════════════════
function baixarWord() {
  if (!resultado || !window.docx) { alert('Biblioteca docx não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType, HeadingLevel } = docx;
  const paragrafos = resultado.split(/\n{2,}/).map(block => {
    const t = block.trim();
    if (!t) return null;
    
    const isTitulo = t === t.toUpperCase() &amp;&amp; t.length > 2 &amp;&amp; /[A-Z]/.test(t) &amp;&amp; !/^\d/.test(t);
    
    if (isTitulo) {
      return new Paragraph({
        text: t,
        heading: HeadingLevel.HEADING_1,
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120 }
      });
    }
    
    return new Paragraph({
      children: [new TextRun(t)],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: 1134 },
      spacing: { line: 360 }
    });
  }).filter(Boolean);

  const doc = new Document({
    sections: [{
      properties: {},
      children: paragrafos
    }]
  });

  docx.Packer.toBlob(doc).then(blob => {
    saveAs(blob, `juridico-${Date.now()}.docx`);
  });
}

async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();
  const kr = getChaveResumo();
  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length > resultado.length * 0.5 &amp;&amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}
document.getElementById('chat-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
function renderChat() {
  const container = document.getElementById('chat-msgs');
  container.innerHTML = '';
  chatHistory.filter(m => m.role !== 'system').forEach(m => {
    const div = document.createElement('div');
    div.className = m.role === 'user' ? 'msg-user' : 'msg-ia';
    const role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = m.role === 'user' ? 'Você' : 'IA';
    div.appendChild(role);
    div.appendChild(document.createTextNode(m.content));
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function baixarEditorWord() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo || !window.docx) { alert('Editor vazio ou biblioteca não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType } = docx;
  const paragrafos = conteudo.split(/\n{2,}/).map(t => {
    if (!t.trim()) return null;
    return new Paragraph({
      children: [new TextRun(t.trim())],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: formatacaoAtual.recuo * 567 },
      spacing: { line: formatacaoAtual.espacamento * 240 }
    });
  }).filter(Boolean);

  const doc = new Document({ sections: [{ properties: {}, children: paragrafos }] });
  docx.Packer.toBlob(doc).then(blob => saveAs(blob, `editor-${Date.now()}.docx`));
}

function baixarEditorMarkdown() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/markdown' }));
  a.download = `editor-${Date.now()}.md`;
  a.click();
}

function salvarComoTemplate() {
  abrirFormTemplate();
}

function abrirFormTemplate(id) {
  editTemplateId = id || null;
  const modal = document.getElementById('modal-template');
  const titulo = document.getElementById('modal-template-titulo');
  
  if (id) {
    const tpl = templates.find(t => t.id === id);
    document.getElementById('tpl-nome').value = tpl.nome;
    document.getElementById('tpl-desc').value = tpl.descricao || '';
    titulo.textContent = 'Editar Template';
  } else {
    document.getElementById('tpl-nome').value = '';
    document.getElementById('tpl-desc').value = '';
    titulo.textContent = 'Novo Template';
  }
  
  modal.classList.add('aberto');
}

function fecharModalTemplate() {
  document.getElementById('modal-template').classList.remove('aberto');
  editTemplateId = null;
}

function confirmarSalvarTemplate() {
  const nome = document.getElementById('tpl-nome').value.trim();
  if (!nome) { alert('Digite um nome para o template.'); return; }
  
  const desc = document.getElementById('tpl-desc').value.trim();
  const config = { ...formatacaoAtual };
  
  if (editTemplateId) {
    templates = templates.map(t => t.id === editTemplateId ? { ...t, nome, descricao: desc, config } : t);
  } else {
    templates.push({
      id: Date.now().toString(),
      nome,
      descricao: desc,
      config,
      criadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  
  saveLS('aj_templates', templates);
  fecharModalTemplate();
  renderTemplates();
}

function deletarTemplate(id) {
  if (!confirm('Remover este template?')) return;
  templates = templates.filter(t => t.id !== id);
  if (templateAtivo === id) {
    templateAtivo = null;
    saveLS('aj_template_ativo', null);
  }
  saveLS('aj_templates', templates);
  renderTemplates();
}

function ativarTemplate(id) {
  templateAtivo = id;
  saveLS('aj_template_ativo', id);
  renderTemplates();
}

function aplicarTemplateAtivo() {
  if (!templateAtivo) { alert('Selecione um template primeiro.'); return; }
  const tpl = templates.find(t => t.id === templateAtivo);
  if (!tpl) return;
  
  formatacaoAtual = { ...tpl.config };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  ['bold','italic','underline'].forEach(t => {
    document.getElementById(`fmt-${t}`).classList.toggle('ativo', formatacaoAtual[t]);
  });
  
  ['left','center','right','justify'].forEach(a => {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === formatacaoAtual.alinhamento);
  });
  
  aplicarFormatacao();
  alert(`Template &quot;${tpl.nome}&quot; aplicado!`);
}

function renderTemplates() {
  const lista = document.getElementById('lista-templates');
  lista.innerHTML = '';
  
  document.getElementById('tab-templates-btn').textContent = 
    `📐 Templates${templates.length ? ` (${templates.length})` : ''}`;
  
  if (!templates.length) {
    lista.innerHTML = '<div class=&quot;text-muted fs12&quot; style=&quot;text-align:center;padding:20px&quot;>Nenhum template salvo. Configure o editor e clique em &quot;💾 Salvar Template&quot;.</div>';
    return;
  }
  
  templates.forEach(tpl => {
    const ativo = tpl.id === templateAtivo;
    const div = document.createElement('div');
    div.className = 'card' + (ativo ? ' card-selected' : '');
    div.innerHTML = `
      <div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:4px&quot;>
        <span class=&quot;card-title&quot; style=&quot;margin:0&quot;>${ativo ? '✓ ' : ''}${tpl.nome}</span>
        <div class=&quot;row&quot; style=&quot;gap:4px&quot;>
          <button class=&quot;btn-icon&quot; onclick=&quot;ativarTemplate('${tpl.id}')&quot; title=&quot;Ativar&quot;>⭐</button>
          <button class=&quot;btn-icon&quot; onclick=&quot;abrirFormTemplate('${tpl.id}')&quot; title=&quot;Editar&quot;>✏️</button>
          <button class=&quot;btn-icon&quot; onclick=&quot;deletarTemplate('${tpl.id}')&quot; title=&quot;Remover&quot;>🗑</button>
        </div>
      </div>
      ${tpl.descricao ? `<div class=&quot;card-sub&quot; style=&quot;margin-bottom:6px&quot;>${tpl.descricao}</div>` : ''}
      <div class=&quot;fs10 text-muted&quot;>
        Fonte: ${tpl.config.fonte} ${tpl.config.tamanho}pt | 
        Recuo: ${tpl.config.recuo}cm | 
        Espaço: ${tpl.config.espacamento}x | 
        Alinhamento: ${tpl.config.alinhamento}
      </div>
      <button class=&quot;btn btn-purple&quot; style=&quot;margin-top:8px&quot; onclick=&quot;aplicarTemplate('${tpl.id}')&quot;>▶ Aplicar</button>`;
    lista.appendChild(div);
  });
}

function aplicarTemplate(id) {
  ativarTemplate(id);
  aplicarTemplateAtivo();
}

function carregarFiltros() {
  const filtrosSalvos = loadLS('aj_filtros', {});
  
  if (filtrosSalvos.regexManter) document.getElementById('regex-manter').value = filtrosSalvos.regexManter.join('\n');
  if (filtrosSalvos.regexExcluir) document.getElementById('regex-excluir').value = filtrosSalvos.regexExcluir.join('\n');
  if (filtrosSalvos.termosManter) document.getElementById('termos-manter').value = filtrosSalvos.termosManter.join(', ');
  if (filtrosSalvos.termosExcluir) document.getElementById('termos-excluir').value = filtrosSalvos.termosExcluir.join(', ');
  
  document.getElementById('filtro-ocr').checked = filtrosSalvos.limparOCR !== false;
  document.getElementById('filtro-markdown').checked = filtrosSalvos.limparMarkdown !== false;
  document.getElementById('filtro-certificados').checked = filtrosSalvos.limparCertificados !== false;
}

function salvarFiltros() {
  const regexManter = document.getElementById('regex-manter').value.split('\n').filter(Boolean);
  const regexExcluir = document.getElementById('regex-excluir').value.split('\n').filter(Boolean);
  const termosManter = document.getElementById('termos-manter').value.split(',').map(t => t.trim()).filter(Boolean);
  const termosExcluir = document.getElementById('termos-excluir').value.split(',').map(t => t.trim()).filter(Boolean);
  
  const filtros = {
    regexManter,
    regexExcluir,
    termosManter,
    termosExcluir,
    limparOCR: document.getElementById('filtro-ocr').checked,
    limparMarkdown: document.getElementById('filtro-markdown').checked,
    limparCertificados: document.getElementById('filtro-certificados').checked
  };
  
  saveLS('aj_filtros', filtros);
  filtrosAtivos = filtros;
}

function adicionarRegexPreset(tipo, preset) {
  const presets = {
    manter: {
      ementa: '^EMENTA.*|^Ementa.*',
      acordao: '^ACÓRDÃO.*|^Acórdão.*',
      sentenca: '^SENTENÇA.*|^Sentença.*|^DECISÃO.*'
    },
    excluir: {
      pagina: '^Página \\d+.*|^Pág\\. \\d+.*|^\\d+/\\d+$',
      certificado: '.*[Cc]ertificado [Dd]igital.*|.*[Aa]ssinado eletronicamente.*|.*[Aa]ssinatura [Ee]letrônica.*',
      cabecalho: '^PODER JUDICIÁRIO.*|^TRIBUNAL.*|^JUSTIÇA.*'
    }
  };
  
  const campo = tipo === 'manter' ? 'regex-manter' : 'regex-excluir';
  const textarea = document.getElementById(campo);
  const valor = textarea.value.trim();
  const novoValor = valor ? valor + '\n' + presets[tipo][preset] : presets[tipo][preset];
  textarea.value = novoValor;
  salvarFiltros();
}

function limparTexto(texto) {
  let resultado = texto;
  
  // Limpar OCR
  if (filtrosAtivos.limparOCR) {
    // Remover caracteres estranhos comuns em OCR
    resultado = resultado.replace(/[�]/g, '');
    resultado = resultado.replace(/\s{3,}/g, ' ');
    resultado = resultado.replace(/\n{4,}/g, '\n\n\n');
    resultado = resultado.replace(/[^\S\n]{2,}/g, ' ');
  }
  
  // Limpar Markdown
  if (filtrosAtivos.limparMarkdown) {
    resultado = resultado.replace(/^#{1,6}\s+/gm, '');
    resultado = resultado.replace(/\*\*(.+?)\*\*/g, '$1');
    resultado = resultado.replace(/__(.+?)__/g, '$1');
    resultado = resultado.replace(/\*(.+?)\*/g, '$1');
    resultado = resultado.replace(/_(.+?)_/g, '$1');
    resultado = resultado.replace(/~~(.+?)~~/g, '$1');
    resultado = resultado.replace(/`(.+?)`/g, '$1');
  }
  
  // Limpar certificados
  if (filtrosAtivos.limparCertificados) {
    const linhas = resultado.split('\n');
    resultado = linhas.filter(linha => {
      const l = linha.toLowerCase();
      return !l.includes('certificado digital') &amp;&amp;
             !l.includes('assinado eletronicamente') &amp;&amp;
             !l.includes('assinatura eletrônica') &amp;&amp;
             !l.includes('documento assinado digitalmente') &amp;&amp;
             !/^[A-F0-9]{32,}$/.test(linha.trim());
    }).join('\n');
  }
  
  return resultado;
}

function aplicarFiltros() {
  salvarFiltros();
  
  const textoProcesso = document.getElementById('txt-processo').value.trim();
  if (!textoProcesso) {
    alert('Cole um texto na aba Processar primeiro.');
    return;
  }
  
  textoOriginal = textoProcesso;
  let texto = limparTexto(textoOriginal);
  
  const linhas = texto.split('\n');
  let linhasMantidas = [...linhas];
  let linhasExcluidas = [];
  
  // Aplicar filtros de regex para manter
  if (filtrosAtivos.regexManter &amp;&amp; filtrosAtivos.regexManter.length > 0) {
    const regexs = filtrosAtivos.regexManter.map(r => {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length > 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha => {
        const mantida = regexs.some(regex => regex.test(linha));
        if (mantida) novasLinhasMantidas.push(linha);
        else linhasExcluidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros de regex para excluir
  if (filtrosAtivos.regexExcluir &amp;&amp; filtrosAtivos.regexExcluir.length > 0) {
    const regexs = filtrosAtivos.regexExcluir.map(r => {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length > 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha => {
        const excluida = regexs.some(regex => regex.test(linha));
        if (excluida) linhasExcluidas.push(linha);
        else novasLinhasMantidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros por termo para manter
  if (filtrosAtivos.termosManter &amp;&amp; filtrosAtivos.termosManter.length > 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p => {
      const mantido = filtrosAtivos.termosManter.some(termo => 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (mantido) paragrafosMantidos.push(p);
      else paragrafosExcluidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  // Aplicar filtros por termo para excluir
  if (filtrosAtivos.termosExcluir &amp;&amp; filtrosAtivos.termosExcluir.length > 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p => {
      const excluido = filtrosAtivos.termosExcluir.some(termo => 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (excluido) paragrafosExcluidos.push(p);
      else paragrafosMantidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  textoFiltrado = linhasMantidas.join('\n').trim();
  textoExcluido = linhasExcluidas.join('\n').trim();
  
  // Atualizar estatísticas
  atualizarEstatisticas();
  
  // Mostrar resultado
  verTextoMantido();
}

function atualizarEstatisticas() {
  const lenOriginal = textoOriginal.length;
  const lenMantido = textoFiltrado.length;
  const lenExcluido = textoExcluido.length;
  const reducao = lenOriginal > 0 ? Math.round((lenExcluido / lenOriginal) * 100) : 0;
  
  document.getElementById('stat-original').textContent = lenOriginal.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-mantido').textContent = lenMantido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-excluido').textContent = lenExcluido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-reducao').textContent = reducao + '%';
}

      `[${i}] ${e.titulo} (${e.categoria})\n${e.texto.substring(0, 300)}...`

${texto.substring(0, 2000)}

EMENTAS DISPONÍVEIS:
${ementasTexto}

Responda APENAS com os números das ementas mais relevantes, separados por vírgula (ex: 0,2,5).`;

    const msgs = [

async function extrairTrechosRelevantes(ementa, contexto) {
  const kr = getChaveResumo();

  try {

CONTEXTO:
${contexto.substring(0, 500)}

window.executar = async function(acao, customPrompt) {

  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();

  if (emsSelected.size > 0 &amp;&amp; kr) {

    const ementasProcessadas = [];

      const em = ementas.find(e => e.id === id);

        const trechoRelevante = await extrairTrechosRelevantes(em, texto);
        ementasProcessadas.push(`[${em.titulo} — ${em.categoria}]\n${trechoRelevante}\nFonte: ${em.titulo}`);
      }

    emsTexto = ementasProcessadas.join('\n\n');
  } else if (emsSelected.size > 0) {
    // Sem chave de resumo, usa texto completo

      const em = ementas.find(e => e.id === id);
      return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';

      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a => a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
};
