&amp;lt;script&amp;gt;
let projetos = [];
let projetoAtivo = null;
let abaAtiva = &amp;quot;render&amp;quot;;
let filtrados = [];

// DRAG DROP
const drop = document.getElementById(&amp;quot;drop&amp;quot;);
drop.addEventListener(&amp;quot;dragover&amp;quot;, e =&amp;gt; { e.preventDefault(); drop.style.background = &amp;quot;#dbeafe&amp;quot;; });
drop.addEventListener(&amp;quot;dragleave&amp;quot;, () =&amp;gt; { drop.style.background = &amp;quot;#eff6ff&amp;quot;; });
drop.addEventListener(&amp;quot;drop&amp;quot;, e =&amp;gt; {
  e.preventDefault();
  drop.style.background = &amp;quot;#eff6ff&amp;quot;;
  const f = e.dataTransfer.files[0];
  if (f) processarArquivo(f);
});

function carregarCSV(e) {
  const f = e.target.files[0];
  if (f) processarArquivo(f);
}

function processarArquivo(file) {
  document.getElementById(&amp;quot;progressArea&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  document.getElementById(&amp;quot;progressTxt&amp;quot;).textContent = &amp;quot;Lendo arquivo...&amp;quot;;
  document.getElementById(&amp;quot;progressBar&amp;quot;).style.width = &amp;quot;10%&amp;quot;;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById(&amp;quot;progressBar&amp;quot;).style.width = &amp;quot;40%&amp;quot;;
    document.getElementById(&amp;quot;progressTxt&amp;quot;).textContent = &amp;quot;Processando linhas...&amp;quot;;

    setTimeout(() =&amp;gt; {
      try {
        projetos = parseCSVCompleto(e.target.result);
        document.getElementById(&amp;quot;progressBar&amp;quot;).style.width = &amp;quot;90%&amp;quot;;
        document.getElementById(&amp;quot;progressTxt&amp;quot;).textContent = projetos.length + &amp;quot; projetos encontrados!&amp;quot;;

        setTimeout(() =&amp;gt; {
          document.getElementById(&amp;quot;progressArea&amp;quot;).style.display = &amp;quot;none&amp;quot;;
          document.getElementById(&amp;quot;painelPrincipal&amp;quot;).style.display = &amp;quot;block&amp;quot;;
          filtrados = [...projetos];
          renderizarLista();
        }, 400);
      } catch(err) {
        alert(&amp;quot;Erro ao processar CSV:\n&amp;quot; + err.message);
        document.getElementById(&amp;quot;progressArea&amp;quot;).style.display = &amp;quot;none&amp;quot;;
      }
    }, 50);
  };
  reader.readAsText(file, &amp;quot;UTF-8&amp;quot;);
}

// PARSER CSV ROBUSTO — lida com campos gigantes com quebras de linha
function parseCSVCompleto(texto) {
  const resultado = [];
  let i = 0;
  const len = texto.length;

  // Detectar separador
  const primeiraLinha = texto.slice(0, 500);
  const sep = primeiraLinha.includes(&amp;quot;\t&amp;quot;) ? &amp;quot;\t&amp;quot; : &amp;quot;,&amp;quot;;

  // Ler cabeçalho
  const cabecalho = lerLinha(texto, 0, sep);
  const colunas = cabecalho.valores.map(c =&amp;gt; c.trim().toLowerCase());
  i = cabecalho.proximo;

  // Mapear índices
  const iId    = colunas.findIndex(c =&amp;gt; c === &amp;quot;id&amp;quot;);
  const iTitle = colunas.findIndex(c =&amp;gt; c.includes(&amp;quot;title&amp;quot;) || c.includes(&amp;quot;titulo&amp;quot;) || c.includes(&amp;quot;nome&amp;quot;));
  const iHtml  = colunas.findIndex(c =&amp;gt; c === &amp;quot;html&amp;quot;);
  const iCss   = colunas.findIndex(c =&amp;gt; c === &amp;quot;css&amp;quot;);
  const iJs    = colunas.findIndex(c =&amp;gt; c === &amp;quot;js&amp;quot; || c === &amp;quot;javascript&amp;quot;);
  const iMode  = colunas.findIndex(c =&amp;gt; c === &amp;quot;mode&amp;quot; || c === &amp;quot;tipo&amp;quot; || c === &amp;quot;type&amp;quot;);

  let count = 0;
  while (i &amp;lt; len) {
    const linha = lerLinha(texto, i, sep);
    if (!linha) break;
    i = linha.proximo;

    const v = linha.valores;
    if (!v || v.length &amp;lt; 2) continue;

    const proj = {
      id:    iId    &amp;gt;= 0 ? v[iId]    || &amp;quot;&amp;quot; : String(count + 1),
      title: iTitle &amp;gt;= 0 ? v[iTitle] || &amp;quot;&amp;quot; : &amp;quot;Projeto &amp;quot; + (count + 1),
      html:  iHtml  &amp;gt;= 0 ? v[iHtml]  || &amp;quot;&amp;quot; : &amp;quot;&amp;quot;,
      css:   iCss   &amp;gt;= 0 ? v[iCss]   || &amp;quot;&amp;quot; : &amp;quot;&amp;quot;,
      js:    iJs    &amp;gt;= 0 ? v[iJs]    || &amp;quot;&amp;quot; : &amp;quot;&amp;quot;,
      mode:  iMode  &amp;gt;= 0 ? v[iMode]  || &amp;quot;&amp;quot; : &amp;quot;&amp;quot;,
    };

    if (!proj.title.trim()) proj.title = &amp;quot;Projeto &amp;quot; + (count + 1);

    resultado.push(proj);
    count++;
  }

  return resultado;
}

function lerLinha(texto, inicio, sep) {
  const valores = [];
  let i = inicio;
  const len = texto.length;
  let campo = &amp;quot;&amp;quot;;
  let dentroAspas = false;

  while (i &amp;lt; len) {
    const c = texto[i];

    if (c === '&amp;quot;') {
      if (dentroAspas &amp;amp;&amp;amp; texto[i+1] === '&amp;quot;') {
        campo += '&amp;quot;';
        i += 2;
        continue;
      }
      dentroAspas = !dentroAspas;
      i++;
      continue;
    }

    if (c === sep &amp;amp;&amp;amp; !dentroAspas) {
      valores.push(campo);
      campo = &amp;quot;&amp;quot;;
      i++;
      continue;
    }

    if ((c === &amp;quot;\n&amp;quot; || (c === &amp;quot;\r&amp;quot; &amp;amp;&amp;amp; texto[i+1] === &amp;quot;\n&amp;quot;)) &amp;amp;&amp;amp; !dentroAspas) {
      valores.push(campo);
      if (c === &amp;quot;\r&amp;quot;) i++;
      i++;
      return { valores, proximo: i };
    }

    campo += c;
    i++;
  }

  if (campo || valores.length) {
    valores.push(campo);
    return { valores, proximo: i };
  }

  return null;
}

// FILTRAR
function filtrar() {
  const termo = document.getElementById(&amp;quot;busca&amp;quot;).value.toLowerCase().trim();
  filtrados = termo
    ? projetos.filter(p =&amp;gt; p.title.toLowerCase().includes(termo) || p.mode.toLowerCase().includes(termo))
    : [...projetos];
  renderizarLista();
}

// RENDERIZAR LISTA
function renderizarLista() {
  const lista = document.getElementById(&amp;quot;lista&amp;quot;);
  const contador = document.getElementById(&amp;quot;contadorGeral&amp;quot;);
  lista.innerHTML = &amp;quot;&amp;quot;;

  contador.textContent = filtrados.length + &amp;quot; de &amp;quot; + projetos.length + &amp;quot; projeto(s)&amp;quot;;

  if (!filtrados.length) {
    lista.innerHTML = '&amp;lt;div class=&amp;quot;vazio&amp;quot;&amp;gt;Nenhum projeto encontrado.&amp;lt;/div&amp;gt;';
    return;
  }

  filtrados.forEach(p =&amp;gt; {
    const temHtml = p.html.trim().length &amp;gt; 0;
    const temCss  = p.css.trim().length &amp;gt; 0;
    const temJs   = p.js.trim().length &amp;gt; 0;

    const tamanho = ((p.html.length + p.css.length + p.js.length) / 1024).toFixed(1);

    const card = document.createElement(&amp;quot;div&amp;quot;);
    card.className = &amp;quot;card&amp;quot; + (projetoAtivo?.id === p.id ? &amp;quot; ativo&amp;quot; : &amp;quot;&amp;quot;);
    card.innerHTML = `
      &amp;lt;div class=&amp;quot;card-topo&amp;quot;&amp;gt;
        &amp;lt;div class=&amp;quot;icone&amp;quot;&amp;gt;🌐&amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;card-info&amp;quot;&amp;gt;
          &amp;lt;div class=&amp;quot;card-titulo&amp;quot;&amp;gt;${esc(p.title)}&amp;lt;/div&amp;gt;
          &amp;lt;div class=&amp;quot;card-meta&amp;quot;&amp;gt;ID: ${esc(p.id)} · ${tamanho} KB ${p.mode ? &amp;quot;· &amp;quot; + esc(p.mode) : &amp;quot;&amp;quot;}&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;tags&amp;quot;&amp;gt;
        ${temHtml ? '&amp;lt;span class=&amp;quot;tag tag-html&amp;quot;&amp;gt;HTML&amp;lt;/span&amp;gt;' : '&amp;lt;span class=&amp;quot;tag tag-vazio&amp;quot;&amp;gt;sem HTML&amp;lt;/span&amp;gt;'}
        ${temCss  ? '&amp;lt;span class=&amp;quot;tag tag-css&amp;quot;&amp;gt;CSS&amp;lt;/span&amp;gt;'   : &amp;quot;&amp;quot;}
        ${temJs   ? '&amp;lt;span class=&amp;quot;tag tag-js&amp;quot;&amp;gt;JS&amp;lt;/span&amp;gt;'     : &amp;quot;&amp;quot;}
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;mini-acoes&amp;quot;&amp;gt;
        &amp;lt;button class=&amp;quot;b-azul&amp;quot;   onclick=&amp;quot;abrirProjeto('${esc(p.id)}')&amp;quot;&amp;gt;👁 Ver&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;b-verde&amp;quot;  onclick=&amp;quot;baixarProjeto('${esc(p.id)}')&amp;quot;&amp;gt;⬇ HTML&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;b-roxo&amp;quot;   onclick=&amp;quot;copiarProjeto('${esc(p.id)}')&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;
      &amp;lt;/div&amp;gt;
    `;

    card.addEventListener(&amp;quot;click&amp;quot;, function(ev) {
      if (ev.target.tagName === &amp;quot;BUTTON&amp;quot;) return;
      abrirProjeto(p.id);
    });

    lista.appendChild(card);
  });
}

// ABRIR PROJETO
function abrirProjeto(id) {
  projetoAtivo = projetos.find(p =&amp;gt; p.id === id) || filtrados.find(p =&amp;gt; p.id === id);
  if (!projetoAtivo) return;
  abaAtiva = &amp;quot;render&amp;quot;;
  renderizarLista();
  renderizarPreview();
  document.getElementById(&amp;quot;painelPrincipal&amp;quot;).scrollIntoView({ behavior: &amp;quot;smooth&amp;quot; });
}

// RENDERIZAR PREVIEW
function renderizarPreview() {
  const p = projetoAtivo;
  if (!p) return;

  document.getElementById(&amp;quot;previewTitulo&amp;quot;).textContent = &amp;quot;👁 &amp;quot; + p.title;

  // Ações
  document.getElementById(&amp;quot;previewAcoes&amp;quot;).innerHTML = `
    &amp;lt;button class=&amp;quot;b-verde&amp;quot;  onclick=&amp;quot;baixarProjeto('${esc(p.id)}')&amp;quot;&amp;gt;⬇ Baixar HTML&amp;lt;/button&amp;gt;
    &amp;lt;button class=&amp;quot;b-roxo&amp;quot;   onclick=&amp;quot;copiarProjeto('${esc(p.id)}')&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;
    &amp;lt;button class=&amp;quot;b-laranja&amp;quot; onclick=&amp;quot;abrirNovaAba('${esc(p.id)}')&amp;quot;&amp;gt;🔗 Abrir em nova aba&amp;lt;/button&amp;gt;
  `;

  // Abas
  const abas = [
    { id: &amp;quot;render&amp;quot;, label: &amp;quot;🌐 Render&amp;quot; },
    { id: &amp;quot;html&amp;quot;,   label: &amp;quot;HTML&amp;quot; },
    { id: &amp;quot;css&amp;quot;,    label: &amp;quot;CSS&amp;quot; },
    { id: &amp;quot;js&amp;quot;,     label: &amp;quot;JS&amp;quot; },
    { id: &amp;quot;tudo&amp;quot;,   label: &amp;quot;📄 Código completo&amp;quot; },
  ];

  document.getElementById(&amp;quot;abas&amp;quot;).innerHTML = abas.map(a =&amp;gt;
    `&amp;lt;div class=&amp;quot;aba ${abaAtiva === a.id ? &amp;quot;ativa&amp;quot; : &amp;quot;&amp;quot;}&amp;quot; onclick=&amp;quot;mudarAba('${a.id}')&amp;quot;&amp;gt;${a.label}&amp;lt;/div&amp;gt;`
  ).join(&amp;quot;&amp;quot;);

  // Conteúdo
  const box = document.getElementById(&amp;quot;previewBox&amp;quot;);

  if (abaAtiva === &amp;quot;render&amp;quot;) {
    const html = montarHTML(p);
    box.innerHTML = `&amp;lt;iframe id=&amp;quot;iframePreview&amp;quot; srcdoc=&amp;quot;${escAttr(html)}&amp;quot;&amp;gt;&amp;lt;/iframe&amp;gt;`;
  } else if (abaAtiva === &amp;quot;html&amp;quot;) {
    box.innerHTML = `&amp;lt;pre&amp;gt;${esc(p.html || &amp;quot;(vazio)&amp;quot;)}&amp;lt;/pre&amp;gt;`;
  } else if (abaAtiva === &amp;quot;css&amp;quot;) {
    box.innerHTML = `&amp;lt;pre&amp;gt;${esc(p.css || &amp;quot;(vazio)&amp;quot;)}&amp;lt;/pre&amp;gt;`;
  } else if (abaAtiva === &amp;quot;js&amp;quot;) {
    box.innerHTML = `&amp;lt;pre&amp;gt;${esc(p.js || &amp;quot;(vazio)&amp;quot;)}&amp;lt;/pre&amp;gt;`;
  } else if (abaAtiva === &amp;quot;tudo&amp;quot;) {
    box.innerHTML = `&amp;lt;pre&amp;gt;${esc(montarHTML(p))}&amp;lt;/pre&amp;gt;`;
  }
}

function mudarAba(aba) {
  abaAtiva = aba;
  renderizarPreview();
}

// MONTAR HTML COMPLETO
function montarHTML(p) {
  // Se o HTML já é um documento completo
  const htmlTrim = (p.html || &amp;quot;&amp;quot;).trim();

  if (htmlTrim.toLowerCase().includes(&amp;quot;&amp;lt;!doctype&amp;quot;) || htmlTrim.toLowerCase().startsWith(&amp;quot;&amp;lt;html&amp;quot;)) {
    // Já é documento completo — injeta CSS e JS se existirem separados
    let resultado = htmlTrim;

    if (p.css &amp;amp;&amp;amp; p.css.trim()) {
      resultado = resultado.replace(&amp;quot;&amp;lt;/head&amp;gt;&amp;quot;, `&amp;lt;style&amp;gt;\n${p.css}\n&amp;lt;/style&amp;gt;\n&amp;lt;/head&amp;gt;`);
      if (!resultado.includes(&amp;quot;&amp;lt;/head&amp;gt;&amp;quot;)) {
        resultado = `&amp;lt;style&amp;gt;\n${p.css}\n&amp;lt;/style&amp;gt;\n` + resultado;
      }
    }

    if (p.js &amp;amp;&amp;amp; p.js.trim()) {
      resultado = resultado.replace(&amp;quot;&amp;lt;/body&amp;gt;&amp;quot;, `&amp;lt;script&amp;gt;\n${p.js}\n&amp;lt;\/script&amp;gt;\n&amp;lt;/body&amp;gt;`);
      if (!resultado.includes(&amp;quot;&amp;lt;/body&amp;gt;&amp;quot;)) {
        resultado += `\n&amp;lt;script&amp;gt;\n${p.js}\n&amp;lt;\/script&amp;gt;`;
      }
    }

    return resultado;
  }

  // Monta documento do zero
  return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html lang=&amp;quot;pt-BR&amp;quot;&amp;gt;
&amp;lt;head&amp;gt;
  &amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
  &amp;lt;meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width, initial-scale=1.0&amp;quot;&amp;gt;
  &amp;lt;title&amp;gt;${esc(p.title)}&amp;lt;/title&amp;gt;
  &amp;lt;style&amp;gt;
${p.css || &amp;quot;&amp;quot;}
  &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;
${p.html || &amp;quot;&amp;quot;}
&amp;lt;script&amp;gt;
${p.js || &amp;quot;&amp;quot;}
&amp;lt;\/script&amp;gt;
&amp;lt;/body&amp;gt;
&amp;lt;/html&amp;gt;`;
}

// BAIXAR PROJETO
function baixarProjeto(id) {
  const p = projetos.find(x =&amp;gt; x.id === id) || filtrados.find(x =&amp;gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const nome = limparNome(p.title) + &amp;quot;.html&amp;quot;;
  baixarBlob(html, nome, &amp;quot;text/html;charset=utf-8&amp;quot;);
}

// ABRIR EM NOVA ABA
function abrirNovaAba(id) {
  const p = projetos.find(x =&amp;gt; x.id === id) || filtrados.find(x =&amp;gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const blob = new Blob([html], { type: &amp;quot;text/html;charset=utf-8&amp;quot; });
  const url = URL.createObjectURL(blob);
  window.open(url, &amp;quot;_blank&amp;quot;);
}

// COPIAR
function copiarProjeto(id) {
  const p = projetos.find(x =&amp;gt; x.id === id) || filtrados.find(x =&amp;gt; x.id === id);
  if (!p) return;

  navigator.clipboard.writeText(montarHTML(p))
    .then(() =&amp;gt; alert(&amp;quot;Código copiado! Cole no Bloco de Notas e salve como .html&amp;quot;))
    .catch(() =&amp;gt; alert(&amp;quot;Não foi possível copiar automaticamente.&amp;quot;));
}

// BAIXAR TODOS
function baixarTodos() {
  if (!filtrados.length) return;

  if (!confirm(&amp;quot;Baixar &amp;quot; + filtrados.length + &amp;quot; projetos? Serão baixados um por um.&amp;quot;)) return;

  let i = 0;
  function proximo() {
    if (i &amp;gt;= filtrados.length) {
      alert(&amp;quot;Todos os projetos foram baixados!&amp;quot;);
      return;
    }
    baixarProjeto(filtrados[i].id);
    i++;
    setTimeout(proximo, 600);
  }
  proximo();
}

// LIMPAR
function limpar() {
  if (!confirm(&amp;quot;Limpar tudo?&amp;quot;)) return;
  projetos = [];
  filtrados = [];
  projetoAtivo = null;
  document.getElementById(&amp;quot;painelPrincipal&amp;quot;).style.display = &amp;quot;none&amp;quot;;
  document.getElementById(&amp;quot;inp&amp;quot;).value = &amp;quot;&amp;quot;;
}

// UTILITÁRIOS
function limparNome(nome) {
  return String(nome)
    .normalize(&amp;quot;NFD&amp;quot;).replace(/[\u0300-\u036f]/g, &amp;quot;&amp;quot;)
    .replace(/[^\w\s\-]/g, &amp;quot;&amp;quot;)
    .replace(/\s+/g, &amp;quot;-&amp;quot;)
    .replace(/-+/g, &amp;quot;-&amp;quot;)
    .replace(/^-|-$/g, &amp;quot;&amp;quot;)
    .toLowerCase()
    .slice(0, 80) || &amp;quot;projeto&amp;quot;;
}

function baixarBlob(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&amp;quot;a&amp;quot;);
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(str) {
  return String(str || &amp;quot;&amp;quot;)
    .replace(/&amp;amp;/g, &amp;quot;&amp;amp;amp;&amp;quot;)
    .replace(/&amp;lt;/g, &amp;quot;&amp;amp;lt;&amp;quot;)
    .replace(/&amp;gt;/g, &amp;quot;&amp;amp;gt;&amp;quot;)
    .replace(/&amp;quot;/g, &amp;quot;&amp;amp;quot;&amp;quot;);
}

function escAttr(str) {
  return esc(str).replace(/\n/g, &amp;quot;&amp;amp;#10;&amp;quot;).replace(/'/g, &amp;quot;&amp;amp;#039;&amp;quot;);
}
&amp;lt;/script&amp;gt;
&amp;lt;/body&amp;gt;
&amp;lt;/html&amp;gt;
