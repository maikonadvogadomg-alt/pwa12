// ══════════════════════════════════════════════════════
const importarImagemOriginal = window.importarImagem;
window.importarImagem = async function(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  
  try {
    // Criar preview
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise(resolve => img.onload = resolve);
    
    // Pré-processar imagem para melhor OCR
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    
    // Aplicar filtros para melhorar OCR
    ctx.filter = 'contrast(1.2) brightness(1.1)';
    ctx.drawImage(img, 0, 0);
    
    // Converter para blob
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    
    // OCR com configurações otimizadas
    const worker = await Tesseract.createWorker('por', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          atualizarResultado(`⏳ Processando OCR... ${pct}%`);
        }
      }
    });
    
    await worker.setParameters({
      tessedit_pageseg_mode: Tesseract.PSM.AUTO,
      preserve_interword_spaces: '1',
    });
    
    const { data: { text, confidence } } = await worker.recognize(blob);
    await worker.terminate();
    
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    
    // Limpar texto automaticamente
    let textoLimpo = text;
    textoLimpo = textoLimpo.replace(/[�]/g, '');
    textoLimpo = textoLimpo.replace(/\s{3,}/g, ' ');
    textoLimpo = textoLimpo.replace(/\n{4,}/g, '\n\n');
    
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + textoLimpo : textoLimpo;
    
    // Mostrar confiança
    const confPct = Math.round(confidence);
    atualizarResultado(`✅ OCR concluído! Confiança: ${confPct}%${confPct < 80 ? ' (revise o texto)' : ''}`);
    
  } catch(e) { 
    alert('Erro no OCR: ' + e.message); 
    atualizarResultado('');
  } finally { 
    sp.classList.add('hidden'); 
  }
};

// ── INDEXEDDB SETUP ──
let db = null;
const DB_NAME = 'AssistenteJuridicoProDB';
const DB_VERSION = 1;

async function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      db = request.result;
      resolve(db);
    };
    
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      
      // Store para documentos/peças
      if (!db.objectStoreNames.contains('documentos')) {
        const docStore = db.createObjectStore('documentos', { keyPath: 'id', autoIncrement: true });
        docStore.createIndex('tipo', 'tipo', { unique: false });
        docStore.createIndex('timestamp', 'timestamp', { unique: false });
        docStore.createIndex('tags', 'tags', { unique: false, multiEntry: true });
      }
      
      // Store para ementas
      if (!db.objectStoreNames.contains('ementas')) {
        const ementaStore = db.createObjectStore('ementas', { keyPath: 'id' });
        ementaStore.createIndex('categoria', 'categoria', { unique: false });
        ementaStore.createIndex('titulo', 'titulo', { unique: false });
      }
      
      // Store para templates
      if (!db.objectStoreNames.contains('templates')) {
        db.createObjectStore('templates', { keyPath: 'id' });
      }
      
      // Store para configurações
      if (!db.objectStoreNames.contains('config')) {
        db.createObjectStore('config', { keyPath: 'key' });
      }
      
      // Store para histórico
      if (!db.objectStoreNames.contains('historico')) {
        const histStore = db.createObjectStore('historico', { keyPath: 'id' });
        histStore.createIndex('timestamp', 'timestamp', { unique: false });
      }
    };
  });
}

// Funções auxiliares IndexedDB
async function salvarNoDB(storeName, data) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.put(data);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function lerDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function listarDoDB(storeName) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function deletarDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.delete(key);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

// Auto-save para IndexedDB
let autoSaveTimer = null;
function agendarAutoSave() {
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(async () => {
    try {
      await sincronizarComDB();
      console.log('✅ Auto-save realizado');
    } catch(e) {
      console.error('Erro no auto-save:', e);
    }
  }, 3000);
}

async function sincronizarComDB() {
  if (!db) await initDB();
  
  // Salvar ementas
  for (const ementa of ementas) {
    await salvarNoDB('ementas', ementa);
  }
  
  // Salvar templates
  for (const template of templates) {
    await salvarNoDB('templates', template);
  }
  
  // Salvar histórico
  for (const item of historico) {
    await salvarNoDB('historico', item);
  }
  
  // Salvar configurações
  await salvarNoDB('config', { key: 'filtros', value: filtrosAtivos });
  await salvarNoDB('config', { key: 'formatacao', value: formatacaoAtual });
  await salvarNoDB('config', { key: 'acoes_custom', value: acoesCustom });
}

async function carregarDoDB() {
  if (!db) await initDB();
  
  try {
    // Carregar ementas
    const ementasDB = await listarDoDB('ementas');
    if (ementasDB.length > 0) {
      ementas = ementasDB;
      saveLS('aj_ementas', ementas);
    }
    
    // Carregar templates
    const templatesDB = await listarDoDB('templates');
    if (templatesDB.length > 0) {
      templates = templatesDB;
      saveLS('aj_templates', templates);
    }
    
    // Carregar histórico
    const historicoDB = await listarDoDB('historico');
    if (historicoDB.length > 0) {
      historico = historicoDB;
      saveLS('aj_historico', historico);
    }
    
    // Carregar configurações
    const configFiltros = await lerDoDB('config', 'filtros');
    if (configFiltros) {
      filtrosAtivos = configFiltros.value;
      saveLS('aj_filtros', filtrosAtivos);
    }
    
    const configAcoes = await lerDoDB('config', 'acoes_custom');
    if (configAcoes) {
      acoesCustom = configAcoes.value;
      saveLS('aj_acoes_custom', acoesCustom);
    }
    
    console.log('✅ Dados carregados do IndexedDB');
  } catch(e) {
    console.error('Erro ao carregar do DB:', e);
  }
}

async function importarBackup(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  try {
    const texto = await file.text();
    const backup = JSON.parse(texto);
    
    if (!backup.versao || !backup.dados) {
      throw new Error('Arquivo de backup inválido');
    }
    
    if (!confirm('⚠️ Isso substituirá TODOS os dados atuais. Deseja continuar?')) {
      return;
    }
    
    // Restaurar dados
    ementas = backup.dados.ementas || [];
    templates = backup.dados.templates || [];
    historico = backup.dados.historico || [];
    acoesCustom = backup.dados.acoesCustom || [];
    filtrosAtivos = backup.dados.filtros || filtrosAtivos;
    formatacaoAtual = backup.dados.formatacao || formatacaoAtual;
    
    // Restaurar configurações
    if (backup.dados.config) {
      effortLevel = backup.dados.config.effort || 3;
      verbosity = backup.dados.config.verbosity || 'longa';
      templateAtivo = backup.dados.config.templateAtivo || null;
    }
    
    // Restaurar chaves (opcional)
    if (backup.dados.chaves &amp;&amp; confirm('Deseja restaurar também as chaves de API?')) {
      document.getElementById('key-resumo').value = backup.dados.chaves.resumo || '';
      document.getElementById('key-geracao').value = backup.dados.chaves.geracao || '';
      document.getElementById('modelo-geracao').value = backup.dados.chaves.modelo || '';
      document.getElementById('prompt-global').value = backup.dados.chaves.promptGlobal || '';
      salvarChaves();
    }
    
    // Salvar tudo
    saveLS('aj_ementas', ementas);
    saveLS('aj_templates', templates);
    saveLS('aj_historico', historico);
    saveLS('aj_acoes_custom', acoesCustom);
    saveLS('aj_filtros', filtrosAtivos);
    saveLS('aj_formatacao', formatacaoAtual);
    saveLS('aj_effort', effortLevel);
    saveLS('aj_verbosity', verbosity);
    saveLS('aj_template_ativo', templateAtivo);
    
    // Sincronizar com IndexedDB
    await sincronizarComDB();
    
    // Atualizar interface
    renderEmentas();
    renderTemplates();
    renderHistorico();
    renderAcoes();
    renderAcoesCustomGrid();
    atualizarEstatisticas();
    
    alert('✅ Backup restaurado com sucesso! Recarregue a página para aplicar todas as mudanças.');
    
  } catch(e) {
    alert('❌ Erro ao importar backup: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════
//  CRIPTOGRAFIA SIMPLES (Base64 + XOR)
// ══════════════════════════════════════════════════════
function criptografar(texto, senha) {
  const key = senha.split('').map(c => c.charCodeAt(0));
  const encrypted = texto.split('').map((c, i) => {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
  return btoa(encrypted);
}

function descriptografar(textoCripto, senha) {
  const encrypted = atob(textoCripto);
  const key = senha.split('').map(c => c.charCodeAt(0));
  return encrypted.split('').map((c, i) => {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
}

async function exportarBackupCriptografado() {
  const senha = prompt('Digite uma senha para criptografar o backup:');
  if (!senha) return;
  
  const senhaConfirm = prompt('Confirme a senha:');
  if (senha !== senhaConfirm) {
    alert('❌ Senhas não coincidem!');
    return;
  }
  
  try {
    const backup = {
      versao: '2.0',
      timestamp: new Date().toISOString(),
      dados: {
        ementas, templates, historico, acoesCustom,
        filtros: filtrosAtivos,
        formatacao: formatacaoAtual
      }
    };
    
    const json = JSON.stringify(backup);
    const encrypted = criptografar(json, senha);
    
    const blob = new Blob([encrypted], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-criptografado-${Date.now()}.enc`;
    a.click();
    URL.revokeObjectURL(url);
    
    alert('✅ Backup criptografado exportado! Guarde a senha em local seguro.');
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

async function importarBackupCriptografado(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  const senha = prompt('Digite a senha do backup:');
  if (!senha) return;
  
  try {
    const encrypted = await file.text();
    const json = descriptografar(encrypted, senha);
    const backup = JSON.parse(json);
    
    if (!confirm('⚠️ Isso substituirá todos os dados. Continuar?')) return;
    
    ementas = backup.dados.ementas || [];
    templates = backup.dados.templates || [];
    historico = backup.dados.historico || [];
    acoesCustom = backup.dados.acoesCustom || [];
    filtrosAtivos = backup.dados.filtros || filtrosAtivos;
    formatacaoAtual = backup.dados.formatacao || formatacaoAtual;
    
    saveLS('aj_ementas', ementas);
    saveLS('aj_templates', templates);
    saveLS('aj_historico', historico);
    saveLS('aj_acoes_custom', acoesCustom);
    
    await sincronizarComDB();
    
    renderEmentas();

  }
}

async function enviarParaDrive(nomeArquivo, conteudo, mimeType) {
  const token = loadLS('aj_drive_token', '');
  const folderId = loadLS('aj_drive_folder', '');
  
  if (!token) {
    alert('Configure o Google Drive primeiro na aba Backup.');
    return;
  }
  
  try {
    const metadata = {
      name: nomeArquivo,
      mimeType: mimeType
    };
    
    if (folderId) metadata.parents = [folderId];
    
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([conteudo], { type: mimeType }));
    
    const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: form
    });
    
    if (!resp.ok) throw new Error('Erro ao enviar');
    
    alert('✅ Arquivo enviado para o Drive!');
  } catch(e) {
    alert('❌ Erro ao enviar: ' + e.message);
  }
}

  const toggle = document.getElementById('toggle-internet');

  const numResults = document.getElementById('internet-num-results');
  
  if (provider) provider.value = apiInternetConfig.provider || 'serper';
  if (apiKey) apiKey.value = apiInternetConfig.apiKey || '';
  if (customUrl) customUrl.value = apiInternetConfig.customUrl || '';
  if (toggle) toggle.checked = internetAtivo;
  if (autoSearch) autoSearch.checked = apiInternetConfig.autoSearch !== false;
  if (jurisprudencia) jurisprudencia.checked = apiInternetConfig.jurisprudencia !== false;
  if (numResults) numResults.value = apiInternetConfig.numResults || 5;

      const customField = document.getElementById('internet-custom-url-field');
      if (customField) {

async function buscarNaInternet(query) {
  if (!internetAtivo || !apiInternetConfig.apiKey) {
    throw new Error('Configure o acesso à internet primeiro');
  }
  
  const provider = apiInternetConfig.provider;
  const apiKey = apiInternetConfig.apiKey;
  const numResults = apiInternetConfig.numResults || 5;
  
  try {
    let resultados = [];
    
    if (provider === 'serper') {
      const resp = await fetch('https://google.serper.dev/search', {
        method: 'POST',
        headers: {
          'X-API-KEY': apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          q: query,
          num: numResults,
          gl: 'br',
          hl: 'pt'
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic || []).map(r => ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'serpapi') {
      const url = `https://serpapi.com/search?q=${encodeURIComponent(query)}&amp;api_key=${apiKey}&amp;num=${numResults}&amp;gl=br&amp;hl=pt`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic_results || []).map(r => ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'brave') {
      const resp = await fetch(`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&amp;count=${numResults}`, {
        headers: {
          'X-Subscription-Token': apiKey,
          'Accept': 'application/json'
        }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.web?.results || []).map(r => ({
        titulo: r.title,
        snippet: r.description,
        url: r.url
      }));
      
    } else if (provider === 'tavily') {
      const resp = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          api_key: apiKey,
          query: query,
          search_depth: 'advanced',
          max_results: numResults
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.results || []).map(r => ({
        titulo: r.title,
        snippet: r.content,
        url: r.url
      }));
      
    } else if (provider === 'custom') {
      const url = apiInternetConfig.customUrl.replace('{query}', encodeURIComponent(query));
      const resp = await fetch(url, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      // Assumir formato padrão ou adaptar conforme necessário
      resultados = data.results || data.items || [];
    }
    
    return resultados;
    
  } catch(e) {
    throw new Error('Erro ao buscar: ' + e.message);
  }
}

function instalarPWA() {
  // Criar manifest.json dinamicamente
  const manifest = {
    name: 'Assistente Jurídico Pro',
    short_name: 'AJ Pro',
    description: 'Assistente jurídico avançado com IA, filtros inteligentes e backup completo',
    start_url: '.',
    display: 'standalone',
    background_color: '#141c0d',
    theme_color: '#d97706',
    orientation: 'any',
    icons: [
      {
        src: 'data:image/svg+xml,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;><rect fill=&quot;%23d97706&quot; width=&quot;100&quot; height=&quot;100&quot;/><text y=&quot;75&quot; font-size=&quot;70&quot; fill=&quot;white&quot; text-anchor=&quot;middle&quot; x=&quot;50&quot;>⚖️</text></svg>',
        sizes: '512x512',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }
    ]
  };
  
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
  
  // Service Worker inline
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'aj-pro-v2';
      const urlsToCache = ['/'];
      
      self.addEventListener('install', event => {
        event.waitUntil(
          caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
        );
      });
      
      self.addEventListener('fetch', event => {
        event.respondWith(
          caches.match(event.request).then(response => response || fetch(event.request))
        );
      });
    `;
    
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swURL).then(() => {
      console.log('✅ PWA instalado');
    }).catch(err => {
      console.error('Erro ao registrar SW:', err);
    });
  }
}

// Debounce para inputs
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

// Aplicar debounce em campos de texto
window.addEventListener('DOMContentLoaded', () => {

    const textareas = document.querySelectorAll('textarea');
    textareas.forEach(ta => {
      if (ta.oninput) {
        const originalHandler = ta.oninput;
        ta.oninput = debounce(originalHandler, 500);
      }
    });
  }, 3000);
});

        // Text utilities
        function cleanMarkdownNoise(t) {
            let s = t || &quot;&quot;;
            if (document.getElementById(&quot;cleanAsterisk1&quot;).checked) s = s.replace(/\*/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanAsterisk2&quot;).checked) s = s.replace(/\*\*/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanAsterisk3&quot;).checked) s = s.replace(/\*\*\*/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanHash1&quot;).checked) s = s.replace(/#/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanHash2&quot;).checked) s = s.replace(/##/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanHash3&quot;).checked) s = s.replace(/###/g, &quot;&quot;);
            if (document.getElementById(&quot;cleanSymbols&quot;).checked) {
                s = s.replace(/^\s{0,6}(?:[•\-–—]+|#{1,6}|>+)\s+/gm, &quot;&quot;);
                s = s.replace(/[#~]{2,}/g, &quot; &quot;);
            }
            s = s.replace(/[&quot;&quot;]/g, '&quot;').replace(/[']/g, &quot;'&quot;);
            s = s.replace(/[ \t]+/g, &quot; &quot;);
            s = s.replace(/\n{3,}/g, &quot;\n\n&quot;);
            return s;
        }
        function splitParagraphs(t, splitLarge = false) {
            const paragraphs = (t || &quot;&quot;)
                .replace(/\r\n/g, &quot;\n&quot;)
                .split(/\n{2,}|\n(?=\s*[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ]{3,}[\s:])/g)
                .map(p => p.trim())
                .filter(Boolean);
            if (splitLarge) {
                const splitSize = 500;
                const result = [];
                paragraphs.forEach(p => {
                    if (p.length > splitSize) {
                        let start = 0;
                        while (start < p.length) {
                            result.push(p.slice(start, start + splitSize));
                            start += splitSize;
                        }
                    } else {
                        result.push(p);
                    }
                });
                return result;
            }
            return paragraphs;
        }
        function normalizeForCompare(s) {
            return (s || &quot;&quot;).toLowerCase().normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;).replace(/[^a-z0-9\s]/g, &quot; &quot;).replace(/\s+/g, &quot; &quot;).trim();
        }
        function makeShingles(words, size) {
            const out = [];
            for (let i = 0; i + size <= words.length; i++) out.push(words.slice(i, i + size).join(&quot; &quot;));
            return out;
        }
        function signature(norm, shingleSize) {
            const words = norm.split(&quot; &quot;).filter(Boolean);
            const sh = makeShingles(words, shingleSize);
            const limited = sh.length > 250 ? sh.slice(0, 250) : sh;
            return new Set(limited);
        }
        function jaccard(a, b) {
            if (!a.size || !b.size) return 0;
            let inter = 0;
            const small = a.size < b.size ? a : b;
            const big = a.size < b.size ? b : a;
            for (const x of small) if (big.has(x)) inter++;
            const uni = a.size + b.size - inter;
            return uni ? inter / uni : 0;
        }
        function parseLines(text) {
            return (text || &quot;&quot;).split(&quot;\n&quot;).map(s => s.trim()).filter(Boolean);
        }
        function buildRegexList(lines) {
            const out = [];
            for (const l of lines) {
                try { out.push(new RegExp(l, &quot;i&quot;)); } catch (e) {}
            }
            return out;
        }

        // Importers
        async function extractTextFromPDF(file, useOCR) {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            let full = &quot;&quot;;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                if (content.items.length > 0) {
                    full += `--- Página ${i} ---\n` + content.items.map(it => it.str).join(&quot; &quot;) + &quot;\n\n&quot;;
                } else if (useOCR) {
                    ov(true, `OCR: Processando Página ${i}...`, &quot;Isso pode demorar um pouco.&quot;);
                    try {
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement(&quot;canvas&quot;);
                        const context = canvas.getContext(&quot;2d&quot;);
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport }).promise;
                        const imageData = canvas.toDataURL(&quot;image/png&quot;);
                        const worker = await Tesseract.createWorker('por');
                        const result = await worker.recognize(imageData);
                        await worker.terminate();
                        full += `--- Página ${i} (OCR) ---\n` + result.data.text + &quot;\n\n&quot;;
                    } catch (e) {
                        full += `--- Página ${i} (Erro OCR) ---\nNão foi possível extrair texto.\n\n`;
                    } finally {
                        ov(false);
                    }
                } else {
                    full += `--- Página ${i} ---\nTexto não extraído (ative OCR se necessário).\n\n`;
                }
            }
            return full;
        }
        async function extractTextFromDOCX(file) {
            const buf = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: buf });
            return res.value || &quot;&quot;;
        }
        async function extractTextFromJSON(file) {
            const txt = await file.text();
            let obj;
            try { obj = JSON.parse(txt); } catch (e) { return txt; }
            const parts = [];
            (function walk(x) {
                if (x == null) return;
                if (typeof x === &quot;string&quot;) { if (x.trim().length > 0) parts.push(x); return; }
                if (Array.isArray(x)) { x.forEach(walk); return; }
                if (typeof x === &quot;object&quot;) { Object.values(x).forEach(walk); return; }
            })(obj);
            return parts.join(&quot;\n\n&quot;);
        }

        // Core filtering
        let res = { removed: [], outText: &quot;&quot;, outPars: [], stats: { total: 0, kept: 0, removed: 0 } };
        function applyBanRules(par, banWords, banRegexList, keepWords, keepRegexList) {
            const low = par.toLowerCase();
            for (const w of keepWords) if (w &amp;&amp; low.includes(w.toLowerCase())) return { drop: false, reason: `mantido por palavra: &quot;${w}&quot;` };
            for (const rx of keepRegexList) if (rx.test(par)) return { drop: false, reason: `mantido por regex: /${rx.source}/i` };
            for (const w of banWords) if (w &amp;&amp; low.includes(w.toLowerCase())) return { drop: true, reason: `regra palavra: &quot;${w}&quot;` };
            for (const rx of banRegexList) if (rx.test(par)) return { drop: true, reason: `regex: /${rx.source}/i` };
            return { drop: false };
        }
        function applyCaptureRules(par, captureWords, captureRegexList) {
            const low = par.toLowerCase();
            for (const w of captureWords) if (w &amp;&amp; low.includes(w.toLowerCase())) return { highlight: true, reason: `capturado por palavra: &quot;${w}&quot;` };
            for (const rx of captureRegexList) if (rx.test(par)) return { highlight: true, reason: `capturado por regex: /${rx.source}/i` };
            return { highlight: false };
        }
        function filterText(rawText, cfg) {
            const removed = [];
            let text = rawText || &quot;&quot;;
            if (cfg.cleanSymbols) text = cleanMarkdownNoise(text);
            let pars = splitParagraphs(text, cfg.splitLarge)
                .map(p => p.replace(/\s+/g, &quot; &quot;).trim())
                .filter(p => p.length >= cfg.minChars);
            const exactSet = new Set();
            const kept = [];
            const out = [];
            for (const p of pars) {
                const rule = applyBanRules(p, cfg.banWords, cfg.banRegexList, cfg.keepWords, cfg.keepRegexList);
                if (rule.drop) {
                    removed.push({ motivo: rule.reason, texto: p });
                    continue;
                }
                const capture = applyCaptureRules(p, cfg.captureWords, cfg.captureRegexList);
                const norm = normalizeForCompare(p);
                if (cfg.dedupeExact) {
                    if (exactSet.has(norm)) {
                        removed.push({ motivo: &quot;duplicata exata&quot;, texto: p });
                        continue;
                    }
                    exactSet.add(norm);
                }
                if (cfg.dedupeNear) {
                    const sig = signature(norm, cfg.shingleSize);
                    let dup = false;
                    const start = Math.max(0, kept.length - cfg.windowN);
                    for (let i = start; i < kept.length; i++) {
                        if (jaccard(sig, kept[i].sig) >= cfg.sim) {
                            dup = true;
                            break;
                        }
                    }
                    if (dup) {
                        removed.push({ motivo: &quot;duplicata aproximada&quot;, texto: p });
                        continue;
                    }
                    kept.push({ raw: p, norm, sig });
                }
                out.push(capture.highlight ? `**${p}** (Destacado: ${capture.reason})` : p);
            }
            return {
                outText: out.join(&quot;\n\n&quot;),
                outPars: out,
                removed,
                stats: { total: pars.length, kept: out.length, removed: removed.length }
            };
        }

function startQuickEdit() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  
  if (start === end) {
    showToast('⚠️ Selecione um trecho para editar');
    return;
  }
  
  quickEditSelection = { start, end };
  quickEditMode = true;
  document.getElementById('quickEditBar').style.display = 'flex';
  document.getElementById('quickEditInput').focus();
  showToast('✏️ Modo edição rápida ativado');
}

function applyQuickEdit() {
  if (!quickEditSelection) return;
  
  const instruction = document.getElementById('quickEditInput').value.trim();
  if (!instruction) {
    showToast('⚠️ Digite uma instrução');
    return;
  }
  
  const selectedText = editor.value.substring(quickEditSelection.start, quickEditSelection.end);
  const before = editor.value.substring(0, quickEditSelection.start);
  const after = editor.value.substring(quickEditSelection.end);
  
  // Aqui você pode chamar a IA para alterar o trecho
  // Por enquanto, vou fazer uma alteração simples como exemplo
  const modified = `/* ${instruction} */\n${selectedText}`;
  
  editor.value = before + modified + after;
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  updatePreview();
  
  cancelQuickEdit();
  showToast('✅ Trecho atualizado!');
}

function cancelQuickEdit() {
  quickEditMode = false;
  quickEditSelection = null;
  document.getElementById('quickEditBar').style.display = 'none';
  document.getElementById('quickEditInput').value = '';
  editor.focus();
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='csv') {
      // Importar CSV
      importCSV(content);
      return;
    }

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &quot;'+file.name+'&quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function importCSV(csvContent) {
  try {
    const lines = csvContent.trim().split('\n');
    if (lines.length < 2) {
      showToast('⚠️ CSV inválido');
      return;
    }
    
    const snippets = getSnippets();
    let imported = 0;
    
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      const parts = parseCSVLine(line);
      
      if (parts.length >= 6) {
        const item = {
          id: parts[0],
          title: parts[1],
          html: parts[2],
          css: parts[3],
          js: parts[4],
          mode: parts[5],
          jsx: '',
          python: '',
          activeTab: 'html',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        
        const idx = snippets.findIndex(s => s.id === item.id);
        if (idx >= 0) {
          snippets[idx] = item;
        } else {
          snippets.push(item);
        }
        imported++;
      }
    }
    
    setSnippets(snippets);
    showToast(`✅ ${imported} projeto(s) importado(s)!`);
  } catch (err) {
    showToast('❌ Erro ao importar CSV: ' + err.message);
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    
    if (char === '&quot;') {
      inQuotes = !inQuotes;
    } else if (char === ';' &amp;&amp; !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  
  result.push(current);
  return result;
}

  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));

  if (state.mode==='react') state.jsx='';
  else if (state.mode==='python') state.python='';
  else { state.html=''; state.css=''; state.js=''; }
  loadEditorContent(); updatePreview(); autoSave(); showToast('🗑️ Limpo!');
}

// ═══════════════════════════════════════
// FULLSCREEN EDITOR
// ═══════════════════════════════════════
function openFsEditor() {
  document.getElementById('fsEditor').value = editor.value;
  document.getElementById('fsModal').classList.add('open');
}
function closeFsEditor() {
  editor.value = document.getElementById('fsEditor').value;
  document.getElementById('fsModal').classList.remove('open');
  saveCurrentTab(); updateLineNumbers(); autoSave(); updatePreview();
}

function openPreviewTab() {
  const blob=new Blob([buildDocument()],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

// ═══════════════════════════════════════
// API KEY MODAL
// ═══════════════════════════════════════
function openApiModal() {
  document.getElementById('apiKeyInput').value=apiKey;
  document.getElementById('apiProvider').value=provider;
  document.getElementById('sysPromptInput').value=sysPrompt;
  document.getElementById('apiModal').classList.add('open');
}
function closeApiModal() {
  document.getElementById('apiModal').classList.remove('open');
}
function saveApiConfig() {
  apiKey    = document.getElementById('apiKeyInput').value.trim();
  provider  = document.getElementById('apiProvider').value;
  sysPrompt = document.getElementById('sysPromptInput').value.trim() || DEFAULT_SYSTEM;
  localStorage.setItem(K_APIKEY,    apiKey);
  localStorage.setItem(K_PROVIDER,  provider);
  localStorage.setItem(K_SYSPROMPT, sysPrompt);
  updateModelTag();
  closeApiModal();
  showToast('✅ IA configurada!');
}
function updateModelTag() {
  const p = document.getElementById('apiProvider')?.value || provider;
  document.getElementById('modelTag').textContent = p==='gemini'?'Gemini':'GPT-4o';
}

// ═══════════════════════════════════════
// CHAT IA
// ═══════════════════════════════════════
function toggleChat() {
  const p = document.getElementById('chatPanel');
  p.classList.toggle('hidden');
  document.getElementById('btnChat').style.color = p.classList.contains('hidden') ? 'var(--text2)' : 'var(--green)';
}

function chatKey(e) {
  if (e.key==='Enter'&amp;&amp;!e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addMsg(role, text, code) {
  const box = document.getElementById('chatMessages');
  const d = document.createElement('div');
  d.className = 'msg msg-'+role;
  d.textContent = text;
  if (code &amp;&amp; role==='ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor + atualizar preview';
    btn.onclick = () => {
      if (state.mode==='react') { state.jsx=code; state.activeTab='jsx'; }
      else if (state.mode==='python') { state.python=code; state.activeTab='python'; }
      else { state.html=code; state.css=''; state.js=''; state.activeTab='html'; }
      updateTabs(); loadEditorContent(); updateLineNumbers(); autoSave(); updatePreview();
      addMsg('sys','✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showDots() {
  const box=document.getElementById('chatMessages');
  const d=document.createElement('div');
  d.id='ldots'; d.className='dots';
  d.innerHTML='<div class=&quot;dot&quot;></div><div class=&quot;dot&quot;></div><div class=&quot;dot&quot;></div>';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function hideDots() { const el=document.getElementById('ldots'); if(el)el.remove(); }

async function sendMsg() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  if (!apiKey) { openApiModal(); showToast('🔑 Configure a API Key primeiro.'); return; }

  inp.value='';
  document.getElementById('chatSend').disabled=true;
  addMsg('user', text);

  const code = buildDocument();
  const fullMsg = `${sysPrompt}

MODO: ${state.mode} | ARQUIVO: ${state.title}

CÓDIGO ATUAL NO EDITOR:
\`\`\`${state.mode==='python'?'python':state.mode==='react'?'jsx':'html'}
${code.substring(0,12000)}
\`\`\`

PEDIDO:
${text}`;

  showDots();
  try {
    const reply = provider==='gemini' ? await callGemini(fullMsg) : await callOpenAI(fullMsg);
    hideDots();
    const match = reply.match(/```(?:html|js|javascript|jsx|tsx|css|python|py)?\n?([\s\S]*?)```/);
    addMsg('ai', reply, match ? match[1].trim() : null);
  } catch(err) {
    hideDots();
    addMsg('sys','❌ '+err.message);
  }
  document.getElementById('chatSend').disabled=false;
}

async function callGemini(msg) {
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    contents:[{role:'user',parts:[{text:msg}]}],
    generationConfig:{temperature:0.2,maxOutputTokens:8192}
  })});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro Gemini');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

async function callOpenAI(msg) {
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:msg}],temperature:0.2,max_tokens:8192})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro OpenAI');}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'Sem resposta.';
}

// ═══════════════════════════════════════
// VOZ
// ═══════════════════════════════════════
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('🎙️ Navegador não suporta voz. Use Chrome.'); return; }

  const p = document.getElementById('chatPanel');
  if (p.classList.contains('hidden')) toggleChat();

  const rec = new SR();
  rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;

  showToast('🎙️ Fale agora...');

  rec.onresult = e => {
    const txt = e.results[0][0].transcript;
    document.getElementById('chatInput').value = txt;
    showToast('🎙️ Capturado: &quot;'+txt+'&quot;');
  };
  rec.onerror = e => showToast('Erro no microfone: '+e.error);
  rec.start();
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function esc(s) { 
  return String(s)
    .replace(/&amp;/g,'&amp;amp;')
    .replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;')
    .replace(/&quot;/g,'&amp;quot;')
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'\\r')
    .replace(/\t/g,'\\t');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; 
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Fecha modais clicando fora
['savedModal','apiModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id===id) document.getElementById(id).classList.remove('open');
  });
});

// Atalhos de teclado
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey)&amp;&amp;e.key==='s'){
    e.preventDefault();
    saveProject();
  }
  if ((e.ctrlKey||e.metaKey)&amp;&amp;e.key==='Enter'){
    e.preventDefault();
    updatePreview();
  }
  if ((e.ctrlKey||e.metaKey)&amp;&amp;e.key==='q'){
    e.preventDefault();
    startQuickEdit();
  }
});
</script>
</body>
</html>

        if (nome.endsWith(&amp;quot;.csv&amp;quot;)) {
          processarCSV(conteudo);
        } else if (nome.endsWith(&amp;quot;.json&amp;quot;)) {
          processarJSON(conteudo);
        } else if (nome.endsWith(&amp;quot;.xml&amp;quot;)) {
          processarXML(conteudo);
        } else {
          alert(&amp;quot;Formato não reconhecido. Use CSV, JSON ou XML.&amp;quot;);
          return;
        }

        document.getElementById(&amp;quot;infoArquivo&amp;quot;).innerHTML =
          `&amp;lt;strong&amp;gt;Arquivo:&amp;lt;/strong&amp;gt; ${arquivo.name} &amp;amp;nbsp;|&amp;amp;nbsp; 
           &amp;lt;strong&amp;gt;Tamanho:&amp;lt;/strong&amp;gt; ${(arquivo.size / 1024).toFixed(1)} KB &amp;amp;nbsp;|&amp;amp;nbsp;
           &amp;lt;strong&amp;gt;Registros:&amp;lt;/strong&amp;gt; ${dadosGlobais.length}`;

        document.getElementById(&amp;quot;painelResultados&amp;quot;).style.display = &amp;quot;block&amp;quot;;
        document.getElementById(&amp;quot;painelResultados&amp;quot;).scrollIntoView({ behavior: &amp;quot;smooth&amp;quot; });

      } catch (erro) {
        alert(&amp;quot;Erro ao processar o arquivo:\n&amp;quot; + erro.message);
      }
    };

    leitor.readAsText(arquivo, &amp;quot;UTF-8&amp;quot;);
  }

  // ===================== CSV =====================
  function processarCSV(texto) {
    const linhas = texto.trim().split(/\r?\n/);
    if (linhas.length &amp;lt; 2) throw new Error(&amp;quot;CSV vazio ou sem dados.&amp;quot;);

    const separador = detectarSeparador(linhas[0]);
    colunasGlobais = parseLinha(linhas[0], separador);
    dadosGlobais = [];

    for (let i = 1; i &amp;lt; linhas.length; i++) {
      if (!linhas[i].trim()) continue;
      const valores = parseLinha(linhas[i], separador);
      const obj = {};
      colunasGlobais.forEach((col, idx) =&amp;gt; {
        obj[col] = valores[idx] !== undefined ? valores[idx] : &amp;quot;&amp;quot;;
      });
      dadosGlobais.push(obj);
    }

    renderizarTabela(dadosGlobais);
  }

  function detectarSeparador(linha) {
    const contadores = {
      &amp;quot;,&amp;quot;: (linha.match(/,/g) || []).length,
      &amp;quot;;&amp;quot;: (linha.match(/;/g) || []).length,
      &amp;quot;\t&amp;quot;: (linha.match(/\t/g) || []).length,
      &amp;quot;|&amp;quot;: (linha.match(/\|/g) || []).length
    };
    return Object.keys(contadores).reduce((a, b) =&amp;gt; contadores[a] &amp;gt; contadores[b] ? a : b);
  }

  function parseLinha(linha, sep) {
    const resultado = [];
    let atual = &amp;quot;&amp;quot;;
    let dentroAspas = false;

    for (let i = 0; i &amp;lt; linha.length; i++) {
      const c = linha[i];
      if (c === '&amp;quot;') {
        dentroAspas = !dentroAspas;
      } else if (c === sep &amp;amp;&amp;amp; !dentroAspas) {
        resultado.push(atual.trim());
        atual = &amp;quot;&amp;quot;;
      } else {
        atual += c;
      }
    }

    resultado.push(atual.trim());
    return resultado;
  }

  // ===================== JSON =====================
  function processarJSON(texto) {
    let dados = JSON.parse(texto);

    if (!Array.isArray(dados)) {
      const chaves = Object.keys(dados);
      for (const chave of chaves) {
        if (Array.isArray(dados[chave])) {
          dados = dados[chave];
          break;
        }
      }
    }

    if (!Array.isArray(dados) || dados.length === 0) {
      throw new Error(&amp;quot;JSON não contém um array de dados reconhecível.&amp;quot;);
    }

    colunasGlobais = [...new Set(dados.flatMap(obj =&amp;gt; Object.keys(obj)))];
    dadosGlobais = dados.map(obj =&amp;gt; {
      const linha = {};
      colunasGlobais.forEach(col =&amp;gt; {
        const val = obj[col];
        linha[col] = val !== undefined &amp;amp;&amp;amp; val !== null
          ? (typeof val === &amp;quot;object&amp;quot; ? JSON.stringify(val) : String(val))
          : &amp;quot;&amp;quot;;
      });
      return linha;
    });

    renderizarTabela(dadosGlobais);
  }

  // ===================== XML =====================
  function processarXML(texto) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(texto, &amp;quot;application/xml&amp;quot;);

    const erroParser = doc.querySelector(&amp;quot;parsererror&amp;quot;);
    if (erroParser) throw new Error(&amp;quot;XML inválido.&amp;quot;);

    const raiz = doc.documentElement;
    const filhos = Array.from(raiz.children);

    if (filhos.length === 0) throw new Error(&amp;quot;XML sem registros filhos.&amp;quot;);

    colunasGlobais = [];
    dadosGlobais = [];

    filhos.forEach(filho =&amp;gt; {
      const obj = {};

      // Atributos
      Array.from(filho.attributes).forEach(attr =&amp;gt; {
        obj[attr.name] = attr.value;
        if (!colunasGlobais.includes(attr.name)) colunasGlobais.push(attr.name);
      });

      // Elementos filhos
      Array.from(filho.children).forEach(el =&amp;gt; {
        obj[el.tagName] = el.textContent.trim();
        if (!colunasGlobais.includes(el.tagName)) colunasGlobais.push(el.tagName);
      });

      // Se não tem filhos, usa o texto do próprio elemento
      if (filho.children.length === 0) {
        obj[&amp;quot;valor&amp;quot;] = filho.textContent.trim();
        if (!colunasGlobais.includes(&amp;quot;valor&amp;quot;)) colunasGlobais.push(&amp;quot;valor&amp;quot;);
      }

      dadosGlobais.push(obj);
    });

    renderizarTabela(dadosGlobais);
  }

  // ===================== TABELA =====================
  function renderizarTabela(dados) {
    const cabecalho = document.getElementById(&amp;quot;cabecalho&amp;quot;);
    const corpo = document.getElementById(&amp;quot;corpo&amp;quot;);

    cabecalho.innerHTML = &amp;quot;&amp;quot;;
    corpo.innerHTML = &amp;quot;&amp;quot;;

    if (!dados || dados.length === 0) {
      corpo.innerHTML = `&amp;lt;tr&amp;gt;&amp;lt;td colspan=&amp;quot;99&amp;quot; class=&amp;quot;sem-dados&amp;quot;&amp;gt;Nenhum dado encontrado.&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;`;
      return;
    }

    const tr = document.createElement(&amp;quot;tr&amp;quot;);
    colunasGlobais.forEach((col, idx) =&amp;gt; {
      const th = document.createElement(&amp;quot;th&amp;quot;);
      th.textContent = col;
      th.title = &amp;quot;Clique para ordenar&amp;quot;;
      th.onclick = () =&amp;gt; ordenarPor(idx);
      tr.appendChild(th);
    });
    cabecalho.appendChild(tr);

    dados.forEach(linha =&amp;gt; {
      const tr = document.createElement(&amp;quot;tr&amp;quot;);
      colunasGlobais.forEach(col =&amp;gt; {
        const td = document.createElement(&amp;quot;td&amp;quot;);
        td.textContent = linha[col] || &amp;quot;&amp;quot;;
        tr.appendChild(td);
      });
      corpo.appendChild(tr);
    });

    atualizarContador(dados.length);
  }

  function atualizarContador(total) {
    document.getElementById(&amp;quot;contador&amp;quot;).textContent =
      `Exibindo ${total} de ${dadosGlobais.length} registro(s).`;
  }

  // ===================== FILTRO =====================
  function filtrarTabela() {
    const termo = document.getElementById(&amp;quot;filtro&amp;quot;).value.toLowerCase();

    if (!termo) {
      renderizarTabela(dadosGlobais);
      return;
    }

    const filtrados = dadosGlobais.filter(linha =&amp;gt;
      Object.values(linha).some(val =&amp;gt; String(val).toLowerCase().includes(termo))
    );

    renderizarTabela(filtrados);
  }

  // ===================== ORDENAÇÃO =====================
  function ordenarPor(idx) {
    const col = colunasGlobais[idx];

    if (ordenacaoAtual.coluna === idx) {
      ordenacaoAtual.asc = !ordenacaoAtual.asc;
    } else {
      ordenacaoAtual.coluna = idx;
      ordenacaoAtual.asc = true;
    }

    const ordenados = [...dadosGlobais].sort((a, b) =&amp;gt; {
      const va = a[col] || &amp;quot;&amp;quot;;
      const vb = b[col] || &amp;quot;&amp;quot;;
      const numA = parseFloat(va.replace(/[^\d.,-]/g, &amp;quot;&amp;quot;).replace(&amp;quot;,&amp;quot;, &amp;quot;.&amp;quot;));
      const numB = parseFloat(vb.replace(/[^\d.,-]/g, &amp;quot;&amp;quot;).replace(&amp;quot;,&amp;quot;, &amp;quot;.&amp;quot;));

      if (!isNaN(numA) &amp;amp;&amp;amp; !isNaN(numB)) {
        return ordenacaoAtual.asc ? numA - numB : numB - numA;
      }

      return ordenacaoAtual.asc
        ? va.localeCompare(vb, &amp;quot;pt-BR&amp;quot;)
        : vb.localeCompare(va, &amp;quot;pt-BR&amp;quot;);
    });

    renderizarTabela(ordenados);
  }

  // ===================== COPIAR =====================
  function copiarTabela() {
    const linhas = [colunasGlobais.join(&amp;quot;\t&amp;quot;)];

    dadosGlobais.forEach(linha =&amp;gt; {
      linhas.push(colunasGlobais.map(col =&amp;gt; linha[col] || &amp;quot;&amp;quot;).join(&amp;quot;\t&amp;quot;));
    });

    navigator.clipboard.writeText(linhas.join(&amp;quot;\n&amp;quot;))
      .then(() =&amp;gt; alert(&amp;quot;Tabela copiada! Você pode colar direto no Excel ou Word.&amp;quot;))
      .catch(() =&amp;gt; alert(&amp;quot;Não foi possível copiar automaticamente.&amp;quot;));
  }

  function copiarBruto() {
    navigator.clipboard.writeText(dadosBrutosGlobais)
      .then(() =&amp;gt; alert(&amp;quot;Dados brutos copiados!&amp;quot;))
      .catch(() =&amp;gt; alert(&amp;quot;Não foi possível copiar automaticamente.&amp;quot;));
  }

  // ===================== BAIXAR =====================
  function baixarCSV() {
    const linhas = [colunasGlobais.join(&amp;quot;;&amp;quot;)];

    dadosGlobais.forEach(linha =&amp;gt; {
      linhas.push(colunasGlobais.map(col =&amp;gt; `&amp;quot;${(linha[col] || &amp;quot;&amp;quot;).replace(/&amp;quot;/g, '&amp;quot;&amp;quot;')}&amp;quot;`).join(&amp;quot;;&amp;quot;));
    });

    baixarArquivo(linhas.join(&amp;quot;\n&amp;quot;), &amp;quot;dados_exportados.csv&amp;quot;, &amp;quot;text/csv;charset=utf-8;&amp;quot;);
  }

  function baixarJSON() {
    const json = JSON.stringify(dadosGlobais, null, 2);
    baixarArquivo(json, &amp;quot;dados_exportados.json&amp;quot;, &amp;quot;application/json&amp;quot;);
  }

  function baixarArquivo(conteudo, nome, tipo) {
    const blob = new Blob([&amp;quot;\ufeff&amp;quot;, conteudo], { type: tipo });
    const link = document.createElement(&amp;quot;a&amp;quot;);
    link.href = URL.createObjectURL(blob);
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // ===================== ABAS =====================
  function trocarAba(qual, el) {
    document.getElementById(&amp;quot;abaTabela&amp;quot;).style.display = qual === &amp;quot;tabela&amp;quot; ? &amp;quot;block&amp;quot; : &amp;quot;none&amp;quot;;
    document.getElementById(&amp;quot;abaBruto&amp;quot;).style.display = qual === &amp;quot;bruto&amp;quot; ? &amp;quot;block&amp;quot; : &amp;quot;none&amp;quot;;

    document.querySelectorAll(&amp;quot;.aba&amp;quot;).forEach(a =&amp;gt; a.classList.remove(&amp;quot;ativa&amp;quot;));
    el.classList.add(&amp;quot;ativa&amp;quot;);
  }

  // ===================== LIMPAR =====================
  function limparTudo() {
    dadosGlobais = [];
    colunasGlobais = [];
    dadosBrutosGlobais = &amp;quot;&amp;quot;;
    document.getElementById(&amp;quot;painelResultados&amp;quot;).style.display = &amp;quot;none&amp;quot;;
    document.getElementById(&amp;quot;inputArquivo&amp;quot;).value = &amp;quot;&amp;quot;;
    document.getElementById(&amp;quot;filtro&amp;quot;).value = &amp;quot;&amp;quot;;
  }
&amp;lt;/script&amp;gt;

  &amp;lt;div class=&amp;quot;visualizador&amp;quot;&amp;gt;
    &amp;lt;div class=&amp;quot;abas&amp;quot; id=&amp;quot;abasVisualizador&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
    &amp;lt;div class=&amp;quot;conteudo-aba&amp;quot; id=&amp;quot;conteudoAba&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
  &amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;script&amp;gt;
  // ===================== ESTADO GLOBAL =====================
  const arquivos = []; // { id, nome, tipo, tamanho, dados, colunas, bruto, planilhas }
  let arquivoAtivo = null;
  let abaAtiva = &amp;quot;tabela&amp;quot;;
  let planilhaAtiva = 0;
  let ordenacao = { col: -1, asc: true };

  // ===================== DRAG &amp;amp; DROP =====================
  const zona = document.getElementById(&amp;quot;zonaDrop&amp;quot;);
  zona.addEventListener(&amp;quot;dragover&amp;quot;, e =&amp;gt; { e.preventDefault(); zona.classList.add(&amp;quot;ativo&amp;quot;); });
  zona.addEventListener(&amp;quot;dragleave&amp;quot;, () =&amp;gt; zona.classList.remove(&amp;quot;ativo&amp;quot;));
  zona.addEventListener(&amp;quot;drop&amp;quot;, e =&amp;gt; {
    e.preventDefault();
    zona.classList.remove(&amp;quot;ativo&amp;quot;);
    processarLista(e.dataTransfer.files);
  });

  // ===================== IMPORTAR =====================
  function importarArquivos(event) {
    processarLista(event.target.files);
  }

  function processarLista(lista) {
    Array.from(lista).forEach(arquivo =&amp;gt; {
      const leitor = new FileReader();
      const nome = arquivo.name;
      const ext = nome.split(&amp;quot;.&amp;quot;).pop().toLowerCase();

      if ([&amp;quot;xls&amp;quot;, &amp;quot;xlsx&amp;quot;, &amp;quot;xlsm&amp;quot;].includes(ext)) {
        const leitorBin = new FileReader();
        leitorBin.onload = e =&amp;gt; processarExcel(arquivo, e.target.result);
        leitorBin.readAsArrayBuffer(arquivo);
      } else {
        leitor.onload = e =&amp;gt; processarTexto(arquivo, e.target.result, ext);
        leitor.readAsText(arquivo, &amp;quot;UTF-8&amp;quot;);
      }
    });
  }

  // ===================== PROCESSAR TEXTO =====================
  function processarTexto(arquivo, conteudo, ext) {
    const id = Date.now() + Math.random();
    let dados = [], colunas = [], planilhas = null;

    try {
      if (ext === &amp;quot;csv&amp;quot;) {
        const r = parseCSV(conteudo);
        dados = r.dados; colunas = r.colunas;
      } else if (ext === &amp;quot;json&amp;quot;) {
        const r = parseJSON(conteudo);
        dados = r.dados; colunas = r.colunas;
      } else if (ext === &amp;quot;xml&amp;quot;) {
        const r = parseXML(conteudo);
        dados = r.dados; colunas = r.colunas;
      }
    } catch(e) {
      alert(&amp;quot;Erro ao processar &amp;quot; + arquivo.name + &amp;quot;:\n&amp;quot; + e.message);
      return;
    }

    arquivos.push({
      id, nome: arquivo.name, tipo: ext.toUpperCase(),
      tamanho: arquivo.size, dados, colunas,
      bruto: conteudo, planilhas
    });

    renderizarLista();
    abrirArquivo(id);
  }

  // ===================== PROCESSAR EXCEL =====================
  function processarExcel(arquivo, buffer) {
    const id = Date.now() + Math.random();
    const workbook = XLSX.read(buffer, { type: &amp;quot;array&amp;quot; });
    const planilhas = workbook.SheetNames.map(nome =&amp;gt; {
      const ws = workbook.Sheets[nome];
      const json = XLSX.utils.sheet_to_json(ws, { defval: &amp;quot;&amp;quot; });
      const colunas = json.length &amp;gt; 0 ? Object.keys(json[0]) : [];
      return { nome, dados: json, colunas };
    });

    const ext = arquivo.name.split(&amp;quot;.&amp;quot;).pop().toUpperCase();
    arquivos.push({
      id, nome: arquivo.name, tipo: ext,
      tamanho: arquivo.size,
      dados: planilhas[0]?.dados || [],
      colunas: planilhas[0]?.colunas || [],
      bruto: `Arquivo Excel com ${planilhas.length} planilha(s): ${planilhas.map(p=&amp;gt;p.nome).join(&amp;quot;, &amp;quot;)}`,
      planilhas
    });

    renderizarLista();
    abrirArquivo(id);
  }

  // ===================== PARSERS =====================
  function parseCSV(texto) {
    const linhas = texto.trim().split(/\r?\n/);
    if (linhas.length &amp;lt; 1) throw new Error(&amp;quot;CSV vazio.&amp;quot;);
    const sep = detectarSep(linhas[0]);
    const colunas = parseLinha(linhas[0], sep);
    const dados = [];
    for (let i = 1; i &amp;lt; linhas.length; i++) {
      if (!linhas[i].trim()) continue;
      const vals = parseLinha(linhas[i], sep);
      const obj = {};
      colunas.forEach((c, idx) =&amp;gt; obj[c] = vals[idx] ?? &amp;quot;&amp;quot;);
      dados.push(obj);
    }
    return { dados, colunas };
  }

  function detectarSep(linha) {
    const seps = [&amp;quot;,&amp;quot;, &amp;quot;;&amp;quot;, &amp;quot;\t&amp;quot;, &amp;quot;|&amp;quot;];
    return seps.reduce((a, b) =&amp;gt;
      (linha.match(new RegExp(&amp;quot;\\&amp;quot; + a, &amp;quot;g&amp;quot;)) || []).length &amp;gt;=
      (linha.match(new RegExp(&amp;quot;\\&amp;quot; + b, &amp;quot;g&amp;quot;)) || []).length ? a : b
    );
  }

  function parseLinha(linha, sep) {
    const res = []; let atual = &amp;quot;&amp;quot;; let aspas = false;
    for (const c of linha) {
      if (c === '&amp;quot;') { aspas = !aspas; }
      else if (c === sep &amp;amp;&amp;amp; !aspas) { res.push(atual.trim()); atual = &amp;quot;&amp;quot;; }
      else atual += c;
    }
    res.push(atual.trim());
    return res;
  }

  function parseJSON(texto) {
    let dados = JSON.parse(texto);
    if (!Array.isArray(dados)) {
      const chave = Object.keys(dados).find(k =&amp;gt; Array.isArray(dados[k]));
      if (chave) dados = dados[chave];
      else dados = [dados];
    }
    const colunas = [...new Set(dados.flatMap(o =&amp;gt; Object.keys(o)))];
    const norm = dados.map(o =&amp;gt; {
      const l = {};
      colunas.forEach(c =&amp;gt; {
        const v = o[c];
        l[c] = v != null ? (typeof v === &amp;quot;object&amp;quot; ? JSON.stringify(v) : String(v)) : &amp;quot;&amp;quot;;
      });
      return l;
    });
    return { dados: norm, colunas };
  }

  function parseXML(texto) {
    const doc = new DOMParser().parseFromString(texto, &amp;quot;application/xml&amp;quot;);
    if (doc.querySelector(&amp;quot;parsererror&amp;quot;)) throw new Error(&amp;quot;XML inválido.&amp;quot;);
    const raiz = doc.documentElement;
    const filhos = Array.from(raiz.children);
    const colunas = [];
    const dados = filhos.map(filho =&amp;gt; {
      const obj = {};
      Array.from(filho.attributes).forEach(a =&amp;gt; {
        obj[a.name] = a.value;
        if (!colunas.includes(a.name)) colunas.push(a.name);
      });
      Array.from(filho.children).forEach(el =&amp;gt; {
        obj[el.tagName] = el.textContent.trim();
        if (!colunas.includes(el.tagName)) colunas.push(el.tagName);
      });
      if (filho.children.length === 0) {
        obj[&amp;quot;valor&amp;quot;] = filho.textContent.trim();
        if (!colunas.includes(&amp;quot;valor&amp;quot;)) colunas.push(&amp;quot;valor&amp;quot;);
      }
      return obj;
    });
    return { dados, colunas };
  }

  // ===================== LISTA DE ARQUIVOS =====================
  function renderizarLista() {
    document.getElementById(&amp;quot;painelLista&amp;quot;).style.display = &amp;quot;block&amp;quot;;
    const lista = document.getElementById(&amp;quot;listaArquivos&amp;quot;);
    lista.innerHTML = &amp;quot;&amp;quot;;

    arquivos.forEach(arq =&amp;gt; {
      const card = document.createElement(&amp;quot;div&amp;quot;);
      card.className = &amp;quot;card-arquivo&amp;quot; + (arquivoAtivo?.id === arq.id ? &amp;quot; ativo&amp;quot; : &amp;quot;&amp;quot;);
      card.id = &amp;quot;card-&amp;quot; + arq.id;

      const icone = iconesTipo(arq.tipo);
      const kb = (arq.tamanho / 1024).toFixed(1);
      const registros = arq.planilhas
        ? arq.planilhas.reduce((s, p) =&amp;gt; s + p.dados.length, 0)
        : arq.dados.length;

      card.innerHTML = `
        &amp;lt;div class=&amp;quot;icone-tipo&amp;quot;&amp;gt;${icone}&amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;info-card&amp;quot;&amp;gt;
          &amp;lt;div class=&amp;quot;nome-arquivo&amp;quot;&amp;gt;${arq.nome}&amp;lt;/div&amp;gt;
          &amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;${arq.tipo} · ${kb} KB · ${registros} registro(s)&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
        &amp;lt;input class=&amp;quot;nome-edit&amp;quot; id=&amp;quot;nomeEdit-${arq.id}&amp;quot; value=&amp;quot;${arq.nome}&amp;quot; 
               title=&amp;quot;Renomear arquivo&amp;quot; placeholder=&amp;quot;Novo nome...&amp;quot;&amp;gt;
        &amp;lt;div class=&amp;quot;acoes-card&amp;quot;&amp;gt;
          &amp;lt;button class=&amp;quot;btn-azul&amp;quot; onclick=&amp;quot;abrirArquivo('${arq.id}')&amp;quot;&amp;gt;👁 Ver&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-verde&amp;quot; onclick=&amp;quot;renomear('${arq.id}')&amp;quot;&amp;gt;✏️ Renomear&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-escuro&amp;quot; onclick=&amp;quot;baixarHTML('${arq.id}')&amp;quot;&amp;gt;⬇ HTML&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-roxo&amp;quot; onclick=&amp;quot;baixarCSVArquivo('${arq.id}')&amp;quot;&amp;gt;⬇ CSV&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-laranja&amp;quot; onclick=&amp;quot;baixarJSONArquivo('${arq.id}')&amp;quot;&amp;gt;⬇ JSON&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-vermelho&amp;quot; onclick=&amp;quot;removerArquivo('${arq.id}')&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;
      `;

      lista.appendChild(card);
    });
  }

  function iconesTipo(tipo) {
    const mapa = {
      CSV: &amp;quot;📊&amp;quot;, JSON: &amp;quot;📋&amp;quot;, XML: &amp;quot;📄&amp;quot;,
      XLS: &amp;quot;📗&amp;quot;, XLSX: &amp;quot;📗&amp;quot;, XLSM: &amp;quot;📗&amp;quot;
    };
    return mapa[tipo] || &amp;quot;📁&amp;quot;;
  }

  // ===================== ABRIR ARQUIVO =====================
  function abrirArquivo(id) {
    arquivoAtivo = arquivos.find(a =&amp;gt; String(a.id) === String(id));
    if (!arquivoAtivo) return;

    planilhaAtiva = 0;
    ordenacao = { col: -1, asc: true };

    renderizarLista();
    renderizarVisualizador();

    document.getElementById(&amp;quot;painelVisualizador&amp;quot;).style.display = &amp;quot;block&amp;quot;;
    document.getElementById(&amp;quot;painelVisualizador&amp;quot;).scrollIntoView({ behavior: &amp;quot;smooth&amp;quot; });
  }

  // ===================== VISUALIZADOR =====================
  function renderizarVisualizador() {
    if (!arquivoAtivo) return;

    document.getElementById(&amp;quot;tituloVisualizador&amp;quot;).textContent =
      &amp;quot;Visualizando: &amp;quot; + arquivoAtivo.nome;

    const abasEl = document.getElementById(&amp;quot;abasVisualizador&amp;quot;);
    abasEl.innerHTML = &amp;quot;&amp;quot;;

    const abas = [&amp;quot;tabela&amp;quot;, &amp;quot;bruto&amp;quot;];
    const labels = { tabela: &amp;quot;📊 Tabela&amp;quot;, bruto: &amp;quot;🔤 Dados brutos&amp;quot; };

    abas.forEach(a =&amp;gt; {
      const el = document.createElement(&amp;quot;div&amp;quot;);
      el.className = &amp;quot;aba&amp;quot; + (abaAtiva === a ? &amp;quot; ativa&amp;quot; : &amp;quot;&amp;quot;);
      el.textContent = labels[a];
      el.onclick = () =&amp;gt; { abaAtiva = a; renderizarVisualizador(); };
      abasEl.appendChild(el);
    });

    const conteudo = document.getElementById(&amp;quot;conteudoAba&amp;quot;);
    conteudo.innerHTML = &amp;quot;&amp;quot;;

    if (abaAtiva === &amp;quot;tabela&amp;quot;) renderizarAbaTabela(conteudo);
    else renderizarAbaBruto(conteudo);
  }

  function renderizarAbaTabela(conteudo) {
    const arq = arquivoAtivo;
    let dados = arq.dados;
    let colunas = arq.colunas;

    // Seletor de planilha para Excel
    if (arq.planilhas &amp;amp;&amp;amp; arq.planilhas.length &amp;gt; 1) {
      const sel = document.createElement(&amp;quot;div&amp;quot;);
      sel.style.marginBottom = &amp;quot;12px&amp;quot;;
      sel.innerHTML = `&amp;lt;label style=&amp;quot;font-weight:bold;font-size:13px;margin-right:8px;&amp;quot;&amp;gt;Planilha:&amp;lt;/label&amp;gt;`;
      const select = document.createElement(&amp;quot;select&amp;quot;);
      arq.planilhas.forEach((p, i) =&amp;gt; {
        const opt = document.createElement(&amp;quot;option&amp;quot;);
        opt.value = i;
        opt.textContent = p.nome;
        if (i === planilhaAtiva) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = e =&amp;gt; {
        planilhaAtiva = parseInt(e.target.value);
        dados = arq.planilhas[planilhaAtiva].dados;
        colunas = arq.planilhas[planilhaAtiva].colunas;
        renderizarVisualizador();
      };
      sel.appendChild(select);
      conteudo.appendChild(sel);

      dados = arq.planilhas[planilhaAtiva].dados;
      colunas = arq.planilhas[planilhaAtiva].colunas;
    }

    // Barra de ações
    const barra = document.createElement(&amp;quot;div&amp;quot;);
    barra.className = &amp;quot;barra-filtro no-print&amp;quot;;
    barra.innerHTML = `
      &amp;lt;input type=&amp;quot;text&amp;quot; id=&amp;quot;filtroTabela&amp;quot; placeholder=&amp;quot;🔍 Filtrar...&amp;quot; oninput=&amp;quot;filtrar()&amp;quot;&amp;gt;
      &amp;lt;button class=&amp;quot;btn-verde&amp;quot; onclick=&amp;quot;copiarTabela()&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;
      &amp;lt;button class=&amp;quot;btn-laranja&amp;quot; onclick=&amp;quot;window.print()&amp;quot;&amp;gt;🖨 PDF&amp;lt;/button&amp;gt;
    `;
    conteudo.appendChild(barra);

    // Tabela
    const wrapper = document.createElement(&amp;quot;div&amp;quot;);
    wrapper.className = &amp;quot;tabela-wrapper&amp;quot;;
    wrapper.id = &amp;quot;tabelaWrapper&amp;quot;;
    conteudo.appendChild(wrapper);

    const contador = document.createElement(&amp;quot;div&amp;quot;);
    contador.className = &amp;quot;contador&amp;quot;;
    contador.id = &amp;quot;contadorTabela&amp;quot;;
    conteudo.appendChild(contador);

    renderizarTabela(dados, colunas, wrapper, contador);
  }

  function renderizarTabela(dados, colunas, wrapper, contador) {
    wrapper.innerHTML = &amp;quot;&amp;quot;;

    if (!dados || dados.length === 0) {
      wrapper.innerHTML = `&amp;lt;div class=&amp;quot;sem-dados&amp;quot;&amp;gt;Nenhum dado encontrado.&amp;lt;/div&amp;gt;`;
      return;
    }

    const table = document.createElement(&amp;quot;table&amp;quot;);
    const thead = document.createElement(&amp;quot;thead&amp;quot;);
    const tbody = document.createElement(&amp;quot;tbody&amp;quot;);

    const trHead = document.createElement(&amp;quot;tr&amp;quot;);
    colunas.forEach((col, idx) =&amp;gt; {
      const th = document.createElement(&amp;quot;th&amp;quot;);
      th.textContent = col;
      th.title = &amp;quot;Clique para ordenar&amp;quot;;
      th.onclick = () =&amp;gt; {
        if (ordenacao.col === idx) ordenacao.asc = !ordenacao.asc;
        else { ordenacao.col = idx; ordenacao.asc = true; }

        const ordenados = [...dados].sort((a, b) =&amp;gt; {
          const va = String(a[col] || &amp;quot;&amp;quot;);
          const vb = String(b[col] || &amp;quot;&amp;quot;);
          const na = parseFloat(va.replace(/[^\d.,-]/g, &amp;quot;&amp;quot;).replace(&amp;quot;,&amp;quot;, &amp;quot;.&amp;quot;));
          const nb = parseFloat(vb.replace(/[^\d.,-]/g, &amp;quot;&amp;quot;).replace(&amp;quot;,&amp;quot;, &amp;quot;.&amp;quot;));
          if (!isNaN(na) &amp;amp;&amp;amp; !isNaN(nb))
            return ordenacao.asc ? na - nb : nb - na;
          return ordenacao.asc
            ? va.localeCompare(vb, &amp;quot;pt-BR&amp;quot;)
            : vb.localeCompare(va, &amp;quot;pt-BR&amp;quot;);
        });

        renderizarTabela(ordenados, colunas, wrapper, contador);
      };
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    dados.forEach(linha =&amp;gt; {
      const tr = document.createElement(&amp;quot;tr&amp;quot;);
      colunas.forEach(col =&amp;gt; {
        const td = document.createElement(&amp;quot;td&amp;quot;);
        td.textContent = linha[col] ?? &amp;quot;&amp;quot;;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(thead);
    table.appendChild(tbody);
    wrapper.appendChild(table);

    if (contador)
      contador.textContent = `${dados.length} registro(s) exibido(s).`;
  }

  function renderizarAbaBruto(conteudo) {
    const barra = document.createElement(&amp;quot;div&amp;quot;);
    barra.className = &amp;quot;barra-filtro no-print&amp;quot;;
    barra.innerHTML = `
      &amp;lt;button class=&amp;quot;btn-verde&amp;quot; onclick=&amp;quot;copiarBruto()&amp;quot;&amp;gt;📋 Copiar dados brutos&amp;lt;/button&amp;gt;
    `;
    conteudo.appendChild(barra);

    const viewer = document.createElement(&amp;quot;div&amp;quot;);
    viewer.className = &amp;quot;json-viewer&amp;quot;;
    viewer.textContent = arquivoAtivo.bruto;
    conteudo.appendChild(viewer);
  }

  // ===================== FILTRO =====================
  function filtrar() {
    const termo = document.getElementById(&amp;quot;filtroTabela&amp;quot;)?.value?.toLowerCase() || &amp;quot;&amp;quot;;
    const arq = arquivoAtivo;
    let dados = arq.planilhas ? arq.planilhas[planilhaAtiva].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[planilhaAtiva].colunas : arq.colunas;

    const filtrados = termo
      ? dados.filter(l =&amp;gt; Object.values(l).some(v =&amp;gt; String(v).toLowerCase().includes(termo)))
      : dados;

    const wrapper = document.getElementById(&amp;quot;tabelaWrapper&amp;quot;);
    const contador = document.getElementById(&amp;quot;contadorTabela&amp;quot;);
    if (wrapper) renderizarTabela(filtrados, colunas, wrapper, contador);
  }

  // ===================== COPIAR =====================
  function copiarTabela() {
    const arq = arquivoAtivo;
    const dados = arq.planilhas ? arq.planilhas[planilhaAtiva].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[planilhaAtiva].colunas : arq.colunas;
    const linhas = [colunas.join(&amp;quot;\t&amp;quot;)];
    dados.forEach(l =&amp;gt; linhas.push(colunas.map(c =&amp;gt; l[c] ?? &amp;quot;&amp;quot;).join(&amp;quot;\t&amp;quot;)));
    navigator.clipboard.writeText(linhas.join(&amp;quot;\n&amp;quot;))
      .then(() =&amp;gt; alert(&amp;quot;Copiado! Cole direto no Excel ou Word.&amp;quot;))
      .catch(() =&amp;gt; alert(&amp;quot;Não foi possível copiar automaticamente.&amp;quot;));
  }

  function copiarBruto() {
    navigator.clipboard.writeText(arquivoAtivo.bruto)
      .then(() =&amp;gt; alert(&amp;quot;Dados brutos copiados!&amp;quot;))
      .catch(() =&amp;gt; alert(&amp;quot;Erro ao copiar.&amp;quot;));
  }

  // ===================== BAIXAR HTML =====================
  function baixarHTML(id) {
    const arq = arquivos.find(a =&amp;gt; String(a.id) === String(id));
    if (!arq) return;

    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[0].colunas : arq.colunas;

    let linhasHTML = dados.map(l =&amp;gt;
      `&amp;lt;tr&amp;gt;${colunas.map(c =&amp;gt; `&amp;lt;td&amp;gt;${l[c] ?? &amp;quot;&amp;quot;}&amp;lt;/td&amp;gt;`).join(&amp;quot;&amp;quot;)}&amp;lt;/tr&amp;gt;`
    ).join(&amp;quot;\n&amp;quot;);

    const html = `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html lang=&amp;quot;pt-BR&amp;quot;&amp;gt;
&amp;lt;head&amp;gt;
  &amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
  &amp;lt;title&amp;gt;${arq.nome}&amp;lt;/title&amp;gt;
  &amp;lt;style&amp;gt;
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { color: #1e3a5f; margin-bottom: 15px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { background: #1e3a5f; color: white; padding: 9px 12px; text-align: left; }
    td { padding: 7px 12px; border-bottom: 1px solid #e5e7eb; }
    tr:nth-child(even) { background: #f9fafb; }
    tr:hover { background: #eff6ff; }
    .meta { color: #888; font-size: 12px; margin-bottom: 15px; }
  &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;
  &amp;lt;h1&amp;gt;${arq.nome}&amp;lt;/h1&amp;gt;
  &amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;${arq.tipo} · ${dados.length} registro(s) · Exportado em ${new Date().toLocaleDateString(&amp;quot;pt-BR&amp;quot;)}&amp;lt;/div&amp;gt;
  &amp;lt;table&amp;gt;
    &amp;lt;thead&amp;gt;
      &amp;lt;tr&amp;gt;${colunas.map(c =&amp;gt; `&amp;lt;th&amp;gt;${c}&amp;lt;/th&amp;gt;`).join(&amp;quot;&amp;quot;)}&amp;lt;/tr&amp;gt;
    &amp;lt;/thead&amp;gt;
    &amp;lt;tbody&amp;gt;
      ${linhasHTML}
    &amp;lt;/tbody&amp;gt;
  &amp;lt;/table&amp;gt;
&amp;lt;/body&amp;gt;
&amp;lt;/html&amp;gt;`;

    baixarBlob(html, arq.nome.replace(/\.[^.]+$/, &amp;quot;&amp;quot;) + &amp;quot;.html&amp;quot;, &amp;quot;text/html&amp;quot;);
  }

  // ===================== BAIXAR CSV =====================
  function baixarCSVArquivo(id) {
    const arq = arquivos.find(a =&amp;gt; String(a.id) === String(id));
    if (!arq) return;
    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[0].colunas : arq.colunas;
    const linhas = [colunas.join(&amp;quot;;&amp;quot;)];
    dados.forEach(l =&amp;gt; linhas.push(colunas.map(c =&amp;gt; `&amp;quot;${String(l[c] ?? &amp;quot;&amp;quot;).replace(/&amp;quot;/g, '&amp;quot;&amp;quot;')}&amp;quot;`).join(&amp;quot;;&amp;quot;)));
    baixarBlob(linhas.join(&amp;quot;\n&amp;quot;), arq.nome.replace(/\.[^.]+$/, &amp;quot;&amp;quot;) + &amp;quot;.csv&amp;quot;, &amp;quot;text/csv&amp;quot;);
  }

  // ===================== BAIXAR JSON =====================
  function baixarJSONArquivo(id) {
    const arq = arquivos.find(a =&amp;gt; String(a.id) === String(id));
    if (!arq) return;
    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;
    baixarBlob(JSON.stringify(dados, null, 2), arq.nome.replace(/\.[^.]+$/, &amp;quot;&amp;quot;) + &amp;quot;.json&amp;quot;, &amp;quot;application/json&amp;quot;);
  }

  // ===================== RENOMEAR =====================
  function renomear(id) {
    const arq = arquivos.find(a =&amp;gt; String(a.id) === String(id));
    const input = document.getElementById(&amp;quot;nomeEdit-&amp;quot; + id);
    if (!arq || !input) return;
    const novoNome = input.value.trim();
    if (!novoNome) { alert(&amp;quot;Digite um nome válido.&amp;quot;); return; }
    arq.nome = novoNome;
    renderizarLista();
    if (arquivoAtivo?.id === arq.id) {
      arquivoAtivo = arq;
      renderizarVisualizador();
    }
    alert(&amp;quot;Renomeado para: &amp;quot; + novoNome);
  }

  // ===================== REMOVER =====================
  function removerArquivo(id) {
    const idx = arquivos.findIndex(a =&amp;gt; String(a.id) === String(id));
    if (idx === -1) return;
    if (!confirm(&amp;quot;Remover &amp;quot; + arquivos[idx].nome + &amp;quot; da lista?&amp;quot;)) return;
    arquivos.splice(idx, 1);
    if (arquivoAtivo?.id == id) {
      arquivoAtivo = null;
      document.getElementById(&amp;quot;painelVisualizador&amp;quot;).style.display = &amp;quot;none&amp;quot;;
    }
    if (arquivos.length === 0)
      document.getElementById(&amp;quot;painelLista&amp;quot;).style.display = &amp;quot;none&amp;quot;;
    else renderizarLista();
  }

  // ===================== UTILITÁRIO =====================
  function baixarBlob(conteudo, nome, tipo) {
    const blob = new Blob([&amp;quot;\ufeff&amp;quot;, conteudo], { type: tipo });
    const link = document.createElement(&amp;quot;a&amp;quot;);
    link.href = URL.createObjectURL(blob);
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
