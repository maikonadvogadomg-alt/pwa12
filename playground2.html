/* Preview */

.preview-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }

/* Dialog/Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
.modal h3 { font-size: 16px; margin-bottom: 12px; color: var(--accent); }
.modal-close { position: absolute; top: 12px; right: 12px; }

/* Snippet list */
.snippet-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }

.snippet-actions { display: flex; gap: 2px; }

/* Search */
.search-input { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; margin-bottom: 12px; }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg2); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 20px; font-size: 12px; font-weight: 600; color: var(--accent2); z-index: 2000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }

/* Responsive */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .editor-panel { width: 100% !important; height: 50%; border-right: none; border-bottom: 1px solid var(--border); }

.status-badge.react { background: rgba(59,130,246,0.15); color: var(--blue); }
.status-badge.python { background: rgba(251,191,36,0.15); color: var(--yellow); }
</style>
</head>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-snippets-v2';
const AUTOSAVE_KEY = 'playground-autosave-v2';

let state = {
  mode: 'html', // html | react | python
  activeTab: 'html',
  html: `<div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;>
  <h1 style=&quot;color:#333;&quot;>Bem-vindo ao HTML Playground</h1>
  <p style=&quot;color:#666;margin:16px 0;&quot;>Cole seu código HTML aqui e veja o resultado ao vivo!</p>

  css: '',
  js: `// Seu JavaScript aqui

    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>
      <h1>⚛️ React no Playground</h1>
      <p>Contador: <strong>{count}</strong></p>
      <button onClick={() => setCount(count + 1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>
        Incrementar
      </button>
    </div>
  );
}`,
  python: `# Python — output aparece no preview
# (Execução simulada no navegador via Pyodide)

dados = [&quot;João Silva&quot;, &quot;Maria Souza&quot;, &quot;Pedro Lima&quot;]

print(&quot;=== LISTA DE CLIENTES ===&quot;)
for i, nome in enumerate(dados, 1):
    print(f&quot;{i}. {nome}&quot;)

print(f&quot;\\nTotal: {len(dados)} clientes&quot;)`,
  title: 'Sem titulo',
  editorState: 'normal' // normal | collapsed | expanded
};

// Load autosave
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    Object.assign(state, parsed);
  }
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ========== EDITOR ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
});

// Paste detection
editor.addEventListener('paste', (e) => {
  setTimeout(() => {
    const content = editor.value;
    // Auto-detect mode
    if (state.activeTab === 'html' || state.mode === 'html') {
      if (/import\s+React|from\s+['&quot;]react['&quot;]|useState|useEffect|<[A-Z][a-zA-Z]*[\s/>]/.test(content)) {
        switchMode('react');
        state.jsx = content;
        loadEditorContent();
        showToast('⚛️ React/JSX detectado automaticamente!');
        return;
      }
      if (/^(def |class |import |from |print\(|#.*python)/im.test(content) &amp;&amp; !content.includes('<')) {
        switchMode('python');
        state.python = content;
        loadEditorContent();
        showToast('🐍 Python detectado automaticamente!');
        return;
      }
    }
    saveCurrentTab();
    updatePreview();
  }, 50);
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== FUNCTIONS ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  document.getElementById('lineCount').textContent = lines + ' linhas';
  let nums = '';
  for (let i = 1; i <= lines; i++) nums += i + '\n';
  lineNumbers.textContent = nums;
}

function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='html'?'active':''}&quot; id=&quot;tabHtml&quot; onclick=&quot;switchTab('html')&quot;>📄 HTML</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
      <button class=&quot;tab ${state.activeTab==='js'?'active':''}&quot; id=&quot;tabJs&quot; onclick=&quot;switchTab('js')&quot;>⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='jsx'?'active':''}&quot; id=&quot;tabJsx&quot; onclick=&quot;switchTab('jsx')&quot;>⚛️ JSX</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `
      <button class=&quot;tab active&quot; id=&quot;tabPython&quot; onclick=&quot;switchTab('python')&quot;>🐍 Python</button>
    `;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;><\/script>
<script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;><\/script>
<script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id=&quot;root&quot;></div>
<script type=&quot;text/babel&quot;>
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext, Fragment } = React;

function saveToLocal() {

  const item = {

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();

  if (snippets.length === 0) {
    container.innerHTML = '<p style=&quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&quot;>Nenhum código salvo.</p>';
    return;

  container.innerHTML = snippets.map(s => `

        <div class=&quot;name&quot;>${escapeHtml(s.title)}</div>

      </div>
    </div>
  `).join('');
}

function loadSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x => x.id === id);
  if (!s) return;
  
  state.title = s.title;
  state.mode = s.mode || 'html';
  state.html = s.html || '';
  state.css = s.css || '';
  state.js = s.js || '';
  state.jsx = s.jsx || '';
  state.python = s.python || '';
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 &quot;' + s.title + '&quot; carregado!');
}

function deleteSnippet(id) {
  if (!confirm('Excluir este código?')) return;
  const snippets = getSnippets().filter(s => s.id !== id);
  setSnippets(snippets);
  renderSavedList();
  showToast('🗑️ Código excluído!');
}

function renameSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x => x.id === id);
  if (!s) return;
  const newName = prompt('Novo nome:', s.title);

    s.title = newName.trim();
    setSnippets(snippets);

}

// ========== UTILS ==========
function escapeHtml(str) {

  }
});

<div class=&quot;modal-overlay&quot; id=&quot;aiModal&quot;>

  </div>
</div>

<!-- Toast -->
<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';
const AUTOSAVE_KEY = 'playground-autosave-v3';

let state = {
  mode: 'html',
  activeTab: 'html',
  html: `<div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;>
  <h1 style=&quot;color:#333;&quot;>Bem-vindo ao Playground Pro</h1>
  <p style=&quot;color:#666;margin:16px 0;&quot;>Cole seu código HTML aqui e veja o resultado ao vivo!</p>
  <button onclick=&quot;alert('Funcionou!')&quot; style=&quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&quot;>Clique aqui</button>
</div>`,
  css: '',
  js: `// Seu JavaScript aqui\nconsole.log(&quot;Hello from Playground Pro!&quot;);`,
  jsx: `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>\n      <h1>⚛️ React no Playground</h1>\n      <p>Contador: <strong>{count}</strong></p>\n      <button onClick={() => setCount(count + 1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}>\n        Incrementar\n      </button>\n    </div>\n  );\n}`,
  python: `# Python — output aparece no preview\ndados = [&quot;João Silva&quot;, &quot;Maria Souza&quot;, &quot;Pedro Lima&quot;]\n\nprint(&quot;=== LISTA DE CLIENTES ===&quot;)\nfor i, nome in enumerate(dados, 1):\n    print(f&quot;{i}. {nome}&quot;)\n\nprint(f&quot;\\nTotal: {len(dados)} clientes&quot;)`,
  title: 'Sem titulo',
  editorState: 'normal',
  currentLine: 1
};

// Load autosave
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) Object.assign(state, JSON.parse(saved));
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ========== EDITOR EVENTS ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  updateCursorPosition();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) => {
  // Tab support
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  // Ctrl+G: Go to line
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'g') {
    e.preventDefault();
    openGotoLine();
  }
  
  // Ctrl+S: Save
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 's') {
    e.preventDefault();
    saveToLocal();
  }
});

// Auto-detect on paste
editor.addEventListener('paste', (e) => {
  setTimeout(() => {
    const content = editor.value;
    if (state.activeTab === 'html' || state.mode === 'html') {
      if (/import\s+React|from\s+['&quot;]react['&quot;]|useState|useEffect/.test(content)) {
        switchMode('react');
        state.jsx = content;
        loadEditorContent();
        showToast('⚛️ React/JSX detectado!');
        return;
      }
      if (/^(def |class |import |from |print\(|#.*python)/im.test(content) &amp;&amp; !content.includes('<')) {
        switchMode('python');
        state.python = content;
        loadEditorContent();
        showToast('🐍 Python detectado!');
        return;
      }
    }
    saveCurrentTab();
    updatePreview();
  }, 50);
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) => {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `<div class=&quot;line ${isCurrent ? 'current' : ''}&quot; onclick=&quot;jumpToLine(${lineNum})&quot;>${lineNum}</div>`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i < lineNum - 1 &amp;&amp; i < lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

// ========== GO TO LINE ==========
function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() => {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;&amp; lineNum > 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// Enter key in goto modal
document.getElementById('gotoLineInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') gotoLine();
});

// ========== TABS &amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='html'?'active':''}&quot; id=&quot;tabHtml&quot; onclick=&quot;switchTab('html')&quot;>📄 HTML</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
      <button class=&quot;tab ${state.activeTab==='js'?'active':''}&quot; id=&quot;tabJs&quot; onclick=&quot;switchTab('js')&quot;>⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='jsx'?'active':''}&quot; id=&quot;tabJsx&quot; onclick=&quot;switchTab('jsx')&quot;>⚛️ JSX</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `<button class=&quot;tab active&quot; id=&quot;tabPython&quot; onclick=&quot;switchTab('python')&quot;>🐍 Python</button>`;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

// ========== PREVIEW ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;><\/script>
<script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;><\/script>
<script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id=&quot;root&quot;></div>
<script type=&quot;text/babel&quot;>
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext, Fragment } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style=&quot;color:red;padding:20px;font-family:monospace;white-space:pre-wrap&quot;>Erro: '+e.message+'</div>';
}
<\/script></body></html>`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px;}
#output{white-space:pre-wrap;font-size:13px;line-height:1.6;}
.loading{color:#60a5fa;}
.error{color:#f87171;}
.success{color:#4ade80;}
</style>
</head><body>
<div id=&quot;output&quot;><span class=&quot;loading&quot;>⟳ Carregando Pyodide...</span></div>
<script src=&quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&quot;><\/script>
<script>
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython(\`
import sys
from io import StringIO
sys.stdout = StringIO()
\`);
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.innerHTML = '<span class=&quot;success&quot;>$ python3 script.py</span>\\n' + stdout;
  } catch(e) {
    out.innerHTML = '<span class=&quot;error&quot;>Erro: ' + e.message + '</span>';
  }
}
main();
<\/script></body></html>`;
  }
  
  // HTML mode
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('<!doctype') || (lower.includes('<html') &amp;&amp; lower.includes('</html>'));
  
  if (isComplete) return state.html;
  
  return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;><meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;>
<style>${state.css}</style>
</head><body>
${state.html}
<script>${state.js}<\/script>
</body></html>`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== FILE OPERATIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() => showToast('📋 Código copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Arquivo baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      // HTML or text
      const lower = content.trim().toLowerCase();
      if (lower.includes('<!doctype') || lower.includes('<html')) {
        // Complete HTML document - extract parts
        const htmlMatch = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        const cssMatch = content.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
        const jsMatch = content.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 &quot;' + file.name + '&quot; importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
  } else if (state.editorState === 'expanded') {
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
  } else {
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
  }
}

function clearCode() {
  if (!confirm('Limpar todo o código atual?')) return;
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Código limpo!');
}

function resetCode() {
  if (!confirm('Resetar para o código padrão?')) return;
  if (state.mode === 'react') {
    state.jsx = `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}>\n      <h1>⚛️ React no Playground</h1>\n      <p>Contador: <strong>{count}</strong></p>\n      <button onClick={() => setCount(count + 1)}>\n        Incrementar\n      </button>\n    </div>\n  );\n}`;
  } else if (state.mode === 'python') {
    state.python = `# Python\ndados = [&quot;João&quot;, &quot;Maria&quot;, &quot;Pedro&quot;]\nfor i, nome in enumerate(dados, 1):\n    print(f&quot;{i}. {nome}&quot;)`;
  } else {

    state.css = '';
    state.js = '';
  }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Código resetado!');
}

// ========== PROJECT MANAGEMENT ==========
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const projects = getProjects();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  projects.unshift(item);
  setProjects(projects);
  showToast('💾 Projeto salvo!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const projects = getProjects().filter(s => s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (projects.length === 0) {
    container.innerHTML = '<p style=&quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&quot;>Nenhum projeto salvo.</p>';
    return;
  }
  
  container.innerHTML = projects.map(s => `
    <div class=&quot;snippet-item&quot; onclick=&quot;loadProject('${s.id}')&quot;>
      <div>
        <div class=&quot;name&quot;>${escapeHtml(s.title)}</div>
        <div class=&quot;meta&quot;>${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')} ${new Date(s.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class=&quot;snippet-actions&quot;>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();renameProject('${s.id}')&quot; title=&quot;Renomear&quot;>✏️</button>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();deleteProject('${s.id}')&quot; title=&quot;Excluir&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function loadProject(id) {
  const projects = getProjects();
  const p = projects.find(x => x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 &quot;' + p.title + '&quot; carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  const projects = getProjects().filter(s => s.id !== id);
  setProjects(projects);
  renderSavedList();
  showToast('🗑️ Projeto excluído!');
}

function renameProject(id) {
  const projects = getProjects();
  const p = projects.find(x => x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;&amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(projects);
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

// ========== AI HELPER ==========
function openAIHelper() {
  document.getElementById('aiModal').classList.add('open');
  document.getElementById('aiResponse').innerHTML = '';
  setTimeout(() => document.getElementById('aiPrompt').focus(), 100);
}

function closeAIHelper() {
  document.getElementById('aiModal').classList.remove('open');
}

function askAI() {
  const prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) {
    showToast('⚠️ Digite uma pergunta primeiro');
    return;
  }
  
  const responseDiv = document.getElementById('aiResponse');
  responseDiv.innerHTML = '<div class=&quot;loading&quot;></div> <span style=&quot;color:var(--text2);&quot;>Pensando...</span>';
  
  // Simulate AI response (replace with real API call)
  setTimeout(() => {
    const mockResponse = `🤖 Resposta da IA:\n\nPara &quot;${prompt}&quot;, aqui está uma sugestão:\n\n// Exemplo de código\nconst elemento = document.querySelector('.minha-div');\nelemento.style.display = 'flex';\nelemento.style.justifyContent = 'center';\nelemento.style.alignItems = 'center';\n\n💡 Dica: Você também pode usar Flexbox ou Grid para centralização mais robusta!\n\n⚠️ Nota: Esta é uma resposta simulada. Para respostas reais, integre uma API de IA (OpenAI, Claude, Gemini, etc).`;
    
    responseDiv.innerHTML = `<div class=&quot;ai-response&quot;>${escapeHtml(mockResponse)}</div>`;
  }, 1500);
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';
const AUTOSAVE_KEY = 'playground-autosave-v3';
const SETTINGS_KEY = 'playground-ai-settings-v3';

let state = {
  mode: 'html',
  activeTab: 'html',
  html: `<div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;>
  <h1 style=&quot;color:#333;&quot;>Bem-vindo ao Playground Pro</h1>
  <p style=&quot;color:#666;margin:16px 0;&quot;>Cole seu código HTML aqui!</p>
  <button onclick=&quot;alert('Funcionou!')&quot; style=&quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&quot;>Clique</button>
</div>`,
  css: '',
  js: `console.log(&quot;Hello from Playground Pro!&quot;);`,
  jsx: `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding:40,textAlign:'center'}}>\n      <h1>⚛️ React</h1>\n      <p>Contador: {count}</p>\n      <button onClick={() => setCount(count + 1)}>+</button>\n    </div>\n  );\n}`,
  python: `print(&quot;Hello from Python!&quot;)`,
  title: 'Sem titulo',
  editorState: 'normal',
  currentLine: 1
};

let aiSettings = {
  provider: 'openai',
  apiKey: '',
  enableWebSearch: false,
  enableTTS: false
};

// Load saved data
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) Object.assign(state, JSON.parse(saved));
  
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) Object.assign(aiSettings, JSON.parse(savedSettings));
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();
updateAIButton();

// ========== EDITOR EVENTS ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  updateCursorPosition();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'g') {
    e.preventDefault();
    openGotoLine();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 's') {
    e.preventDefault();
    saveToLocal();
  }
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) => {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `<div class=&quot;line ${isCurrent ? 'current' : ''}&quot; onclick=&quot;jumpToLine(${lineNum})&quot;>${lineNum}</div>`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i < lineNum - 1 &amp;&amp; i < lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() => {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;&amp; lineNum > 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// ========== TABS &amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;&amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;&amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='html'?'active':''}&quot; id=&quot;tabHtml&quot; onclick=&quot;switchTab('html')&quot;>📄 HTML</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
      <button class=&quot;tab ${state.activeTab==='js'?'active':''}&quot; id=&quot;tabJs&quot; onclick=&quot;switchTab('js')&quot;>⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class=&quot;tab ${state.activeTab==='jsx'?'active':''}&quot; id=&quot;tabJsx&quot; onclick=&quot;switchTab('jsx')&quot;>⚛️ JSX</button>
      <button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;>🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `<button class=&quot;tab active&quot; id=&quot;tabPython&quot; onclick=&quot;switchTab('python')&quot;>🐍 Python</button>`;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

// ========== PREVIEW ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;><\/script>
<script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;><\/script>
<script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id=&quot;root&quot;></div>
<script type=&quot;text/babel&quot;>
const { useState, useEffect, useRef } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style=&quot;color:red;padding:20px&quot;>Erro: '+e.message+'</div>';
}
<\/script></body></html>`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:monospace;padding:20px;}#output{white-space:pre-wrap;}</style>
</head><body>
<div id=&quot;output&quot;>⟳ Carregando Python...</div>
<script src=&quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&quot;><\/script>
<script>
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython('import sys; from io import StringIO; sys.stdout = StringIO()');
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.textContent = stdout || '(sem output)';
  } catch(e) {
    out.innerHTML = '<span style=&quot;color:#f87171&quot;>Erro: ' + e.message + '</span>';
  }
}
main();
<\/script></body></html>`;
  }
  
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('<!doctype') || (lower.includes('<html') &amp;&amp; lower.includes('</html>'));
  
  if (isComplete) return state.html;
  
  return `<!DOCTYPE html>
<html><head><meta charset=&quot;UTF-8&quot;>
<style>${state.css}</style>
</head><body>
${state.html}
<script>${state.js}<\/script>
</body></html>`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== FILE OPERATIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() => showToast('📋 Copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      const lower = content.trim().toLowerCase();
      if (lower.includes('<!doctype') || lower.includes('<html')) {
        const htmlMatch = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        const cssMatch = content.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
        const jsMatch = content.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 Importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
  } else if (state.editorState === 'expanded') {
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
  } else {
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
  }
}

function clearCode() {
  if (!confirm('Limpar código?')) return;
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Limpo!');
}

function resetCode() {
  if (!confirm('Resetar?')) return;
  if (state.mode === 'react') {
    state.jsx = `function App() {\n  return <div>React App</div>;\n}`;
  } else if (state.mode === 'python') {
    state.python = `print(&quot;Hello Python!&quot;)`;
  } else {
    state.html = `<h1>Hello World</h1>`;
    state.css = '';
    state.js = '';
  }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Resetado!');
}

// ========== PROJECT MANAGEMENT ==========
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const projects = getProjects();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  projects.unshift(item);
  setProjects(projects);
  showToast('💾 Salvo!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const projects = getProjects().filter(s => s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (projects.length === 0) {
    container.innerHTML = '<p style=&quot;text-align:center;color:var(--text2);padding:20px;&quot;>Nenhum projeto.</p>';
    return;
  }
  
  container.innerHTML = projects.map(s => `
    <div class=&quot;snippet-item&quot; onclick=&quot;loadProject('${s.id}')&quot;>
      <div>
        <div class=&quot;name&quot;>${escapeHtml(s.title)}</div>
        <div class=&quot;meta&quot;>${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')}</div>
      </div>
      <div class=&quot;snippet-actions&quot;>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();renameProject('${s.id}')&quot;>✏️</button>
        <button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();deleteProject('${s.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function loadProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 Carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir?')) return;
  setProjects(getProjects().filter(s => s.id !== id));
  renderSavedList();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;&amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(getProjects());
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

// ========== AI SETTINGS ==========

async function testAI() {

async function askAI() {
  const prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) {
    showToast('⚠️ Digite uma pergunta');
    return;
  }
  
  if (!aiSettings.apiKey) {
    showToast('⚠️ Configure a API Key primeiro');
    openSettings();
    return;
  }
  
  const responseDiv = document.getElementById('aiResponse');
  const btnAskAI = document.getElementById('btnAskAI');
  const originalText = document.getElementById('askBtnText').textContent;
  
  btnAskAI.disabled = true;
  document.getElementById('askBtnText').innerHTML = '<div class=&quot;loading&quot;></div> Pensando...';
  responseDiv.innerHTML = '<div style=&quot;color:var(--text2);&quot;><div class=&quot;loading&quot;></div> Consultando IA...</div>';
  
  try {
    const response = await callAI(prompt, aiSettings.enableWebSearch);
    
    responseDiv.innerHTML = `<div class=&quot;ai-response&quot;>🤖 <strong>Resposta:</strong>\n\n${escapeHtml(response)}</div>`;
    
    // TTS (Text-to-Speech)
    if (aiSettings.enableTTS) {
      speakText(response);
    }
    
  } catch(e) {

// ========== AI API CALLS ==========
async function callAI(prompt, useWebSearch) {
  const provider = aiSettings.provider;
  
  if (provider === 'openai') {
    return await callOpenAI(prompt, useWebSearch);
  } else if (provider === 'gemini') {
    return await callGemini(prompt, useWebSearch);
  } else if (provider === 'claude') {
    return await callClaude(prompt, useWebSearch);
  }
  
  throw new Error('Provedor não suportado');
}

async function callOpenAI(prompt, useWebSearch) {
  const messages = [
    {
      role: 'system',
      content: 'Você é um assistente de programação especializado em HTML, CSS, JavaScript, React e Python. Seja direto e prático.'
    },
    {
      role: 'user',
      content: prompt
    }
  ];
  
  // Se busca web estiver ativada, adiciona contexto
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      messages[0].content += `\n\nInformações da web: ${searchResults}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${aiSettings.apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini', // Modelo mais barato e rápido
      messages: messages,
      temperature: 0.7,
      max_tokens: 1000
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API OpenAI');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

async function callGemini(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${aiSettings.apiKey}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: fullPrompt
        }]
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Gemini');
  }
  
  const data = await response.json();
  return data.candidates[0].content.parts[0].text;
}

async function callClaude(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': aiSettings.apiKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-3-haiku-20240307', // Modelo mais barato
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: fullPrompt
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Claude');
  }
  
  const data = await response.json();
  return data.content[0].text;
}

// ========== WEB SEARCH ==========
async function searchWeb(query) {
  // Usando DuckDuckGo Instant Answer API (gratuita, sem API key)
  try {
    const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&amp;format=json&amp;no_html=1&amp;skip_disambig=1`);
    const data = await response.json();
    
    let results = '';
    if (data.AbstractText) results += data.AbstractText + '\n';
    if (data.RelatedTopics &amp;&amp; data.RelatedTopics.length > 0) {
      results += data.RelatedTopics.slice(0, 3).map(t => t.Text).filter(Boolean).join('\n');
    }
    
    return results || 'Nenhum resultado encontrado';
  } catch(e) {
    console.error('Erro na busca:', e);
    return '';
  }
}
// ========== TEXT-TO-SPEECH ==========
function speakText(text) {
  if (!window.speechSynthesis) {
    console.warn('TTS não suportado neste navegador');
    return;
  }
  
  // Cancela qualquer fala anterior
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  // Tenta usar uma voz em português
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.startsWith('pt'));
  if (ptVoice) utterance.voice = ptVoice;
  
  window.speechSynthesis.speak(utterance);
  showToast('🔊 Reproduzindo áudio...');
}

// Carrega vozes disponíveis
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Enter key shortcuts
document.getElementById('gotoLineInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') gotoLine();
});

document.getElementById('aiPrompt')?.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'Enter') {
    askAI();
  }
});
</script>

    .input-bar {

  </style>
</head>

<script>
'use strict';

/*══════════════════════════════════════════════════════════════════
  AUTO-DETECÇÃO AMPLIADA DE PROVEDORES
══════════════════════════════════════════════════════════════════*/
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile', name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',      name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest', name:'Anthropic Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',               name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',        name:'Google Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',           name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',           name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  // Mistral (32 chars hex), DeepSeek (sk-...), Cohere — detectados por regex abaixo
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',             name:'OpenAI' },
];

const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];

function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

/*══════════════════════════════════════════════════════════════════
  INDEXEDDB — Auto-save robusto
══════════════════════════════════════════════════════════════════*/
const DB_NAME = 'ChatIAProDB';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ev => {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath:'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror   = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

/*══════════════════════════════════════════════════════════════════
  ESTADO
══════════════════════════════════════════════════════════════════*/
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history    = [];
let currentConvId = null;
let controller = null;
let isRecording= false;
let recog      = null;
let silTimer   = null;
let saveTimer  = null;

/*══════════════════════════════════════════════════════════════════
  BOOT
══════════════════════════════════════════════════════════════════*/
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  const ki = document.getElementById('keyInput');
  ki.value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    if (d) {
      document.getElementById('urlInput').value = d.url;
      document.getElementById('modelInput').value = d.model;
    } else {
      document.getElementById('urlInput').value = apiUrl;
      document.getElementById('modelInput').value = apiModel;
    }
  }
  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  renderSavedKeys();
  await renderConvList();

  // Restaura conversa atual se houver
  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;&amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv &amp;&amp; conv.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  // Restaura rascunho do input
  const draft = localStorage.getItem('cia_draft');
  if (draft) {
    document.getElementById('msgInput').value = draft;
    adjustHeight(document.getElementById('msgInput'));
  }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'bot', m.content, false, true));
  addCopyListeners();
}

/*══════════════════════════════════════════════════════════════════
  AUTO-SAVE
══════════════════════════════════════════════════════════════════*/
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_' + Date.now();

  const firstUserMsg = history.find(m => m.role === 'user')?.content || 'Conversa';
  const title = firstUserMsg.slice(0, 60).replace(/\n/g,' ');

  const obj = {
    id: currentConvId,
    title,
    messages: history,
    updatedAt: Date.now(),
    provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
  };
  try {
    await dbPut('conversations', obj);
    localStorage.setItem('cia_current_conv', currentConvId);
  } catch(e) { console.warn('Auto-save falhou:', e); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 400);
}

function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  if (v) localStorage.setItem('cia_draft', v);
  else   localStorage.removeItem('cia_draft');
}

/*══════════════════════════════════════════════════════════════════
  PAINÉIS GENÉRICOS
══════════════════════════════════════════════════════════════════*/
function togglePanel(panelId, btnId) {
  const allPanels = ['cfgPanel','keysPanel','convPanel','ioPanel'];
  const allBtns   = ['cfgBtn','keysBtn','convBtn','ioBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  allPanels.forEach(id => document.getElementById(id).classList.remove('show'));
  allBtns.forEach(id => document.getElementById(id)?.classList.remove('active'));
  if (show) {
    target.classList.add('show');
    document.getElementById(btnId)?.classList.add('active');
  }
}

/*══════════════════════════════════════════════════════════════════
  CHAVES
══════════════════════════════════════════════════════════════════*/
function onKeyInput(val) {
  val = val.trim();
  apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value = d.model;
    apiUrl   = d.url;
    apiModel = d.model;
    localStorage.setItem('cia_url',   d.url);
    localStorage.setItem('cia_model', d.model);
    document.getElementById('cfgProvOk').textContent = '✓ ' + d.name + ' · ' + d.model;
    document.getElementById('cfgProvOk').style.display = 'block';
    document.getElementById('cfgNote').style.display = 'none';
  } else {
    document.getElementById('cfgProvOk').style.display = 'none';
    document.getElementById('cfgNote').style.display = '';
  }
  document.getElementById('saveRow').style.display = val ? 'flex' : 'none';
  updateProvBadge();
  updateCfgStatus();
}

function updateProvBadge() {
  const badge = document.getElementById('provBadge');
  if (apiKey) {
    const d = detectProvider(apiKey);
    badge.textContent = d ? d.name : 'Custom';
    badge.style.borderColor = '#5aab56';
    badge.style.color = '#7ec87a';
  } else {
    badge.textContent = 'Demo ✨';
    badge.style.borderColor = '#60a5fa';
    badge.style.color = '#93c5fd';
  }
}

function updateCfgStatus() {
  const el = document.getElementById('cfgStatus');
  if (apiKey) {
    const d = detectProvider(apiKey);
    el.textContent = '✓ ' + (d ? d.name : 'Personalizada') + ' ativa';
    el.className = 'cfg-status ok';
  } else {
    el.textContent = 'Sem chave configurada';
    el.className = 'cfg-status demo';
  }
}

function toggleShowKey() {
  showKey = !showKey;
  document.getElementById('keyInput').type = showKey ? 'text' : 'password';
}

function saveKey() {
  const key   = document.getElementById('keyInput').value.trim();
  const label = document.getElementById('labelInput').value.trim();
  const url   = document.getElementById('urlInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k => k.key === key)) { toast('Chave já salva','err'); return; }
  const d = detectProvider(key);
  const finalLabel = label || (d ? d.name : 'Chave ' + (savedKeys.length+1));
  savedKeys.push({ id:Date.now()+'', label:finalLabel, key, url, model, provider:d ? d.name : 'Custom' });
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  document.getElementById('labelInput').value = '';
  renderSavedKeys();
  toast('Chave salva ✓');
}

function renderSavedKeys() {
  const list = document.getElementById('keysList');
  document.getElementById('keysTitle').textContent = 'Chaves Salvas ('+savedKeys.length+')';
  if (!savedKeys.length) {
    list.innerHTML = '<div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;>Nenhuma chave salva.</div>';
    return;
  }
  list.innerHTML = '';
  savedKeys.forEach(sk => {
    const div = document.createElement('div');
    div.className = 'saved-key' + (sk.key === apiKey ? ' active' : '');
    div.innerHTML =
      '<div class=&quot;saved-key-info&quot; onclick=&quot;loadKey(\''+sk.id+'\')&quot;>'+
        '<div class=&quot;saved-key-label&quot;>'+esc(sk.label)+'</div>'+
        '<div class=&quot;saved-key-meta&quot;>'+esc(sk.provider)+' · '+sk.key.slice(0,6)+'…'+sk.key.slice(-3)+'</div>'+
      '</div>'+
      (sk.key === apiKey ? '<span class=&quot;active-tag&quot;>ATIVA</span>' : '')+
      '<button class=&quot;del-btn&quot; onclick=&quot;deleteKey(\''+sk.id+'\')&quot;>✕</button>';
    list.appendChild(div);
  });
}

function loadKey(id) {
  const sk = savedKeys.find(k => k.id === id);
  if (!sk) return;
  apiKey = sk.key; apiUrl = sk.url; apiModel = sk.model;
  localStorage.setItem('cia_key',   sk.key);
  localStorage.setItem('cia_url',   sk.url);

function toggleWeb() {

  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');

async function webSearch(query) {
  // Usa DuckDuckGo Instant Answer API (CORS-friendly)
  try {
    const url = 'https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;format=json&amp;no_html=1&amp;skip_disambig=1';
    const r = await fetch(url);
    const j = await r.json();
    const parts = [];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText+(j.AbstractURL?' (Fonte: '+j.AbstractURL+')':''));
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.Definition) parts.push('DEFINIÇÃO: '+j.Definition);
    if (j.RelatedTopics?.length) {
      const topics = j.RelatedTopics.slice(0,5)
        .filter(t => t.Text)
        .map((t,i) => (i+1)+'. '+t.Text+(t.FirstURL?' ['+t.FirstURL+']':''));
      if (topics.length) parts.push('TÓPICOS:\n'+topics.join('\n'));
    }
    return parts.length ? parts.join('\n\n') : null;
  } catch(e) {
    console.warn('Web search falhou:', e);
    return null;
  }
}

  ENVIAR
══════════════════════════════════════════════════════════════════*/
function handleKey(e) {
