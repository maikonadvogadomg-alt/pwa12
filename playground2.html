}
function adjustHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}
function setPrompt(txt) {
  const el = document.getElementById('msgInput');
  el.value = txt; adjustHeight(el); el.focus();
}

async function send(textOverride) {
  const el = document.getElementById('msgInput');
  const text = (textOverride || el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('emptyState')?.remove();
  el.value = ''; el.style.height = '44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller = new AbortController();
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  const { content: contentEl } = appendMsg('bot', '', true);

  // BUSCA WEB se ativada
  let webContext = '';
  if (webOn) {
    const note = document.createElement('div');
    note.className = 'progress';
    note.textContent = '🌐 Buscando na internet...';
    contentEl.appendChild(note);
    const result = await webSearch(text);
    note.remove();
    if (result) {
      webContext = '\n\n[CONTEXTO DA WEB — use estas informações atuais]:\n'+result+'\n[FIM DO CONTEXTO]';
      const ok = document.createElement('div');
      ok.className = 'progress';
      ok.textContent = '✓ Resultados da web incorporados';
      contentEl.appendChild
      contentEl.appendChild(ok);
      setTimeout(() => ok.remove(), 2000);
    } else {
      const fail = document.createElement('div');
      fail.className = 'progress';
      fail.style.color = '#f87171';
      fail.textContent = '⚠️ Busca web falhou — continuando sem contexto extra';
      contentEl.appendChild(fail);
      setTimeout(() => fail.remove(), 2500);
    }
  }

  try {
    const key   = apiKey.trim();
    const url   = (document.getElementById('urlInput').value || apiUrl || 'https://api.groq.com/openai/v1').trim().replace(/\/$/, '');
    const model = document.getElementById('modelInput').value || apiModel || 'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML = '<span style=&quot;color:#60a5fa&quot;>⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: <a href=&quot;https://console.groq.com&quot; target=&quot;_blank&quot; style=&quot;color:#7ec87a&quot;>console.groq.com</a></span>';
      history.pop();
      scheduleSave();
      return;
    }

    // Monta mensagens (injeta contexto web se houver)
    let msgs = [...history];
    if (webContext) {
      const last = msgs[msgs.length - 1];
      msgs[msgs.length - 1] = { role:'user', content:last.content + webContext };
    }

    const endpoint = url + '/chat/completions';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Chat IA Pro',
    };
    const body = JSON.stringify({ model, messages: msgs, stream: true, max_tokens: 16384 });

    const resp = await fetch(endpoint, { method:'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = 'Erro ' + resp.status;
      try { msg = JSON.parse(errText)?.error?.message || msg; } catch {}
      contentEl.innerHTML = '<span style=&quot;color:'+getCSSVar('--err')+'&quot;>❌ ' + esc(msg) + '</span>';
      history.pop();
      scheduleSave();
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j = line.slice(6).trim();
        if (j === '[DONE]') continue;
        try {
          const p = JSON.parse(j);
          if (p.error) throw new Error(typeof p.error === 'string' ? p.error : p.error.message || 'Erro do provedor');
          const delta = p.choices?.[0]?.delta?.content || p.text || p.content || '';
          if (delta) {
            full += delta;
            cursor.remove();
            contentEl.innerHTML = renderMarkdown(full);
            contentEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML = renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      contentEl.innerHTML += '<em style=&quot;color:var(--muted);font-size:11px&quot;> [parado]</em>';
    } else {
      contentEl.innerHTML = '<span style=&quot;color:var(--err)&quot;>❌ ' + esc(err.message) + '</span>';
      history.pop();
      scheduleSave();
    }
  } finally {
    controller = null;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    scrollBottom();
    addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

/*══════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO
══════════════════════════════════════════════════════════════════*/
function appendMsg(role, text, streaming, isRestore) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (role === 'user') {
    content.textContent = text;
  } else if (streaming) {
    content.innerHTML = '';
  } else {
    content.innerHTML = renderMarkdown(text);
  }

  bubble.appendChild(content);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (role === 'bot') {
    const prov = apiKey ? (detectProvider(apiKey)?.name || 'IA') : 'IA';
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, content.textContent); };
    const lbl = document.createElement('span');
    lbl.className = 'prov-label';
    lbl.textContent = prov;
    meta.appendChild(lbl);
    meta.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, text); };
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);

  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el: wrap, content };
}

let copyBlockId = 0;
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```(\w*?)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'cb' + (++copyBlockId);
    return (
      '<div class=&quot;code-block&quot;>' +
        '<div class=&quot;code-header&quot;>' +
          '<span>' + (lang || 'código') + '</span>' +
          '<button class=&quot;copy-btn&quot; data-copy=&quot;'+escAttr(code)+'&quot; id=&quot;'+id+'&quot;>📋 Copiar</button>' +
        '</div>' +
        '<div class=&quot;code-body&quot;>' + code + '</div>' +
      '</div>'
    );
  });
  html = html.replace(/`([^`\n]+?)`/g, '<span class=&quot;inline-code&quot;>$1</span>');
  html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  html = html.replace(/(https?:\/\/[^\s<>&quot;']+)/g, '<a href=&quot;$1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>$1</a>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.onclick = function() { copyText(this, this.dataset.copy); };
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').catch(() => {});
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado!';
  setTimeout(() => { btn.innerHTML = orig; }, 1800);
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR — TXT, MD, JSON, PDF
══════════════════════════════════════════════════════════════════*/
function exportConv(format) {
  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date = new Date().toLocaleString('pt-BR');
  let content = '', mime = 'text/plain', ext = format;

  if (format === 'txt') {
    const lines = ['=== CONVERSA — Chat IA Pro ===', 'Data: '+date, ''];
    history.forEach(m => {
      lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']');
      lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
  }
  else if (format === 'md') {
    const lines = ['# Conversa Chat IA Pro', '> '+date, ''];
    history.forEach(m => {
      lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA'));
      lines.push(''); lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
    mime = 'text/markdown';
  }
  else if (format === 'json') {
    content = JSON.stringify({
      title: history.find(m=>m.role==='user')?.content?.slice(0,60) || 'Conversa',
      exportedAt: date,
      provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
      messages: history,
    }, null, 2);
    mime = 'application/json';
  }
  else if (format === 'pdf') {
    // PDF via janela de impressão
    const w = window.open('', '_blank');
    const html = ['<!DOCTYPE html><html><head><meta charset=&quot;UTF-8&quot;><title>Conversa</title>',
      '<style>',
      'body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}',
      '.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}',
      '.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      'code{background:#eee;padding:1px 4px;border-radius:3px;font-size:12px}',
      '@media print { body{margin:0} }',
      '</style></head><body>',
      '<h1>Conversa — Chat IA Pro</h1>',
      '<div class=&quot;meta&quot;>Exportado em '+date+' · '+history.length+' mensagens</div>'];
    history.forEach(m => {
      const safe = esc(m.content).replace(/\n/g,'<br>');
      html.push('<div class=&quot;msg '+(m.role==='user'?'user':'bot')+'&quot;>');
      html.push('<div class=&quot;role&quot;>'+(m.role==='user'?'🧑 Você':'🤖 IA')+'</div>');
      html.push('<div>'+safe+'</div></div>');
    });
    html.push('<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');
    w.document.write(html.join(''));
    w.document.close();
    toast('PDF: use &quot;Salvar como PDF&quot; na impressão');
    return;
  }

  const blob = new Blob([content], { type: mime+';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversa-' + Date.now() + '.' + ext;
  a.click();
  toast('Exportado: ' + ext.toUpperCase());
}

/*══════════════════════════════════════════════════════════════════
  IMPORTAR — TXT, MD, CSV, JSON, PDF
══════════════════════════════════════════════════════════════════*/
async function importFile(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  const el = document.getElementById('msgInput');

  try {
    let txt = '';

    if (name.endsWith('.pdf')) {
      toast('📕 Lendo PDF...');
      txt = await extractPDF(file);
    }
    else if (name.endsWith('.json')) {
      const raw = await file.text();
      try {
        const j = JSON.parse(raw);
        // Se for conversa exportada, oferecer importar
        if (j.messages &amp;&amp; Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar como nova conversa?')) {
            history = j.messages;
            currentConvId = null;
            restoreUI();
            scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa importada ✓');
            return;
          }
        }
        txt = JSON.stringify(j, null, 2);
      } catch { txt = raw; }
    }
    else {
      txt = await file.text();
    }

    if (txt) {
      el.value = el.value ? el.value + '\n\n' + txt : txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Arquivo importado ('+txt.length+' chars)');
    }
  } catch(err) {
    toast('Erro: '+err.message, 'err');
  }
}

async function extractPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push('--- Página '+i+' ---\n' + tc.items.map(it => it.str).join(' '));
  }
  return pages.join('\n\n');
}

/*══════════════════════════════════════════════════════════════════
  OCR — Imagem para texto
══════════════════════════════════════════════════════════════════*/
async function importImage(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  if (typeof Tesseract === 'undefined') { toast('Tesseract não carregou','err'); return; }

  const el = document.getElementById('msgInput');
  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.style.position = 'fixed';
  progress.style.top = '60px';
  progress.style.left = '50%';
  progress.style.transform = 'translateX(-50%)';
  progress.style.zIndex = '1000';
  progress.textContent = '🔍 OCR iniciando...';
  document.body.appendChild(progress);

  try {
    const { data } = await Tesseract.recognize(file, 'por+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          progress.textContent = '🔍 OCR: ' + Math.round(m.progress*100) + '%';
        } else if (m.status) {
          progress.textContent = '🔍 ' + m.status + '...';
        }
      }
    });
    const txt = (data?.text || '').trim();
    if (txt) {
      el.value = el.value ? el.value + '\n\n[OCR]\n' + txt : '[OCR]\n' + txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else {
      toast('Nenhum texto encontrado na imagem','err');
    }
  } catch(err) {
    toast('Erro OCR: '+err.message,'err');
  } finally {
    progress.remove();
  }
}

async function backupAll() {

    version: 1,
    exportedAt: new Date().toISOString(),
    keys: savedKeys,
    conversations: convs,
    settings: {
      apiKey, apiUrl, apiModel,
      ttsOn, webOn,
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });

  a.download = 'chatia-backup-' + Date.now() + '.json';
  a.click();

async function restoreBackup(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm('Restaurar backup? Suas chaves e conversas atuais serão MESCLADAS.')) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing = new Set(savedKeys.map(k => k.key));
      data.keys.forEach(k => { if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
    }
    if (data.conversations?.length &amp;&amp; db) {
      for (const c of data.conversations) await dbPut('conversations', c);
    }
    renderSavedKeys();
    await renderConvList();
    toast('Backup restaurado ✓');
  } catch(err) {
    toast('Erro: backup inválido','err');
  }
}

/*══════════════════════════════════════════════════════════════════
  VOZ — STT
══════════════════════════════════════════════════════════════════*/
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }

  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = true;
  recog.interimResults = true;

  let fullText = '';
  const schedSend = () => {
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      try { recog.stop(); } catch {}
      if (fullText.trim()) { setPrompt(''); send(fullText.trim()); }
    }, 1800);
  };

  recog.onresult = ev => {
    let final = '', interim = '';
    for (let i = 0; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    fullText = final || interim;
    document.getElementById('msgInput').value = fullText;
    adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };

  recog.onerror = recog.onend = () => {
    clearTimeout(silTimer);
    isRecording = false;
    recog = null;
    document.getElementById('micBtn').classList.remove('listening');
  };

  try { recog.start(); } catch { return; }
  isRecording = true;
  document.getElementById('micBtn').classList.add('listening');
}

function stopVoice() {
  try { recog?.stop(); } catch {}
  recog = null;
  isRecording = false;
  clearTimeout(silTimer);
  document.getElementById('micBtn').classList.remove('listening');
}

/*══════════════════════════════════════════════════════════════════
  TTS
══════════════════════════════════════════════════════════════════*/
function toggleTTS() {
  ttsOn = !ttsOn;
  localStorage.setItem('cia_tts', ttsOn ? 'on' : 'off');
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
}

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '').replace(/[`*#]/g, '').substring(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function esc(s) {
  return String(s)
    .replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}
function escAttr(s) { return esc(s).replace(/'/g,'&amp;#39;'); }
function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('beforeunload', () => {

  autoSaveDraft();
});

boot();
</script>

function analisarCodigo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo),
    elementos: extrairElementos(codigo),
    scripts: extrairScripts(codigo)
  };

  renderAnalise(analise);

function extrairFuncoes(codigo) {
  const regex = /function\s+(\w+)\s*\([^)]*\)\s*\{/g;
  const funcoes = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    const inicio = match.index;
    const fim = encontrarFimFuncao(codigo, inicio);
    funcoes.push({
      nome: match[1],
      codigo: codigo.substring(inicio, fim)
    });
  }
  return funcoes;
}

function encontrarFimFuncao(codigo, inicio) {
  let nivel = 0;
  for (let i = inicio; i < codigo.length; i++) {
    if (codigo[i] === '{') nivel++;
    if (codigo[i] === '}') {
      nivel--;
      if (nivel === 0) return i + 1;
    }
  }
  return codigo.length;
}

function extrairEstilos(codigo) {
  const regex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  const estilos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    estilos.push(match[1].trim());
  }
  return estilos;
}

function extrairElementos(codigo) {
  const regex = /<(\w+)[^>]*id=[&quot;']([^&quot;']+)[&quot;'][^>]*>/g;
  const elementos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    elementos.push({ tag: match[1], id: match[2] });
  }
  return elementos;
}

function extrairScripts(codigo) {
  const regex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const scripts = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    scripts.push(match[1].trim());
  }
  return scripts;
}

        ${analise.funcoes.map((f, i) => `

              <span class=&quot;tag tag-func&quot;>função</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;verCodigo(${i}, 'funcao')&quot;>👁️</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground('${escHtml(f.codigo).replace(/'/g, &quot;\\'&quot;)}')&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('${escHtml(f.nome)}', 'funcao', \`${f.codigo.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  // Estilos
  if (analise.estilos.length > 0) {
    html += `
      <div class=&quot;panel&quot;>
        <div class=&quot;panel-header&quot;>
          <div class=&quot;panel-title&quot;>💅 Estilos CSS (${analise.estilos.length})</div>
        </div>
        ${analise.estilos.map((css, i) => `
          <div class=&quot;file-item&quot;>
            <div>
              <strong style=&quot;color:var(--blue);&quot;>Bloco CSS ${i + 1}</strong>
              <span class=&quot;tag tag-css&quot;>css</span>
            </div>
            <div style=&quot;display:flex;gap:4px;&quot;>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${css.replace(/`/g, '\\`')}\`)&quot;>⚡ Playground</button>
              <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;salvarComoModulo('CSS_${i + 1}', 'css', \`${css.replace(/`/g, '\\`')}\`)&quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  container.innerHTML = html || '<div class=&quot;status status-warning&quot;>⚠️ Nenhum elemento extraível encontrado</div>';
  toast('✅ Análise concluída!');
}

function extrairTudo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo)
  };

  let contador = 0;
  
  analise.funcoes.forEach(f => {
    salvarComoModulo(f.nome, 'funcao', f.codigo);
    contador++;
  });
  
  analise.estilos.forEach((css, i) => {
    salvarComoModulo(`CSS_${i + 1}`, 'css', css);
    contador++;
  });

  toast(`✅ ${contador} módulos extraídos e salvos!`);
  renderModulos();
}

function copiarParaPlayground(codigo) {
  document.getElementById('playgroundCode').value = codigo;
  trocarAba('playground');
  document.querySelectorAll('.nav-tab')[2].classList.add('active');
  toast('✅ Código copiado para o Playground!');
}

function salvarComoModulo(nome, tipo, codigo) {
  const modulos = getModulos();
  modulos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    nome,
    tipo,
    codigo,
    data: new Date().toISOString()
  });
  setModulos(modulos);
}

// ========== MONTADOR ==========
function salvarModulo() {
  const nome = document.getElementById('modNome').value.trim();
  const tipo = document.getElementById('modTipo').value;
  const codigo = document.getElementById('modCodigo').value;

  if (!nome || !codigo.trim()) {
    toast('❌ Preencha nome e código!');
    return;
  }

  salvarComoModulo(nome, tipo, codigo);
  limparModulo();
  renderModulos();
  toast('✅ Módulo salvo!');
}

function limparModulo() {
  document.getElementById('modNome').value = '';
  document.getElementById('modCodigo').value = '';
}

function renderModulos() {
  const modulos = getModulos();
  const selected = getSelected();
  const container = document.getElementById('modulosList');
  const checklist = document.getElementById('montadorChecklist');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);font-size:12px;text-align:center;padding:20px;&quot;>Nenhum módulo salvo</p>';
    if (checklist) checklist.innerHTML = '';
    return;
  }

  // Lista de módulos
  container.innerHTML = modulos.slice(-10).reverse().map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editarModulo('${m.id}')&quot;>✏️</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}')&quot;>🗑️</button>
      </div>
    </div>
  `).join('');

  // Checklist para montagem
  if (checklist) {
    checklist.innerHTML = '<div style=&quot;max-height:300px;overflow-y:auto;&quot;>' + modulos.map(m => `
      <label style=&quot;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border);&quot;>
        <input type=&quot;checkbox&quot; ${selected.includes(m.id) ? 'checked' : ''} onchange=&quot;toggleModulo('${m.id}')&quot; />
        <strong style=&quot;font-size:12px;&quot;>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </label>
    `).join('') + '</div>';
  }
}

function toggleModulo(id) {
  let selected = getSelected();
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    selected.push(id);
  }
  setSelected(selected);
}

function selecionarTodos() {
  setSelected(getModulos().map(m => m.id));
  renderModulos();
}

function desselecionarTodos() {
  setSelected([]);
  renderModulos();
}

function deletarModulo(id) {
  if (!confirm('Deletar este módulo?')) return;
  setModulos(getModulos().filter(m => m.id !== id));
  renderModulos();
  toast('🗑️ Módulo deletado!');
}

function editarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  document.getElementById('modNome').value = modulo.nome;
  document.getElementById('modTipo').value = modulo.tipo;
  document.getElementById('modCodigo').value = modulo.codigo;
  
  deletarModulo(id);
  toast('✏️ Editando módulo...');
}

function gerarProjetoFinal() {
  const modulos = getModulos();
  const selected = getSelected();
  const escolhidos = modulos.filter(m => selected.includes(m.id));

  if (escolhidos.length === 0) {
    toast('❌ Selecione pelo menos um módulo!');
    return;
  }

  const nome = document.getElementById('projetoNome').value || 'Projeto';
  
  const html = escolhidos.filter(m => m.tipo === 'html').map(m => m.codigo).join('\n\n');
  const css = escolhidos.filter(m => m.tipo === 'css').map(m => m.codigo).join('\n\n');
  const js = escolhidos.filter(m => m.tipo === 'js' || m.tipo === 'funcao').map(m => m.codigo).join('\n\n');

  const projeto = `<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>${escHtml(nome)}</title>
<style>
${css}
</style>
</head>
<body>

${html}

<script>
${js}
<\/script>
</body>
</html>`;

  baixarArquivo(projeto, nome.replace(/[^a-z0-9]/gi, '_') + '.html', 'text/html');
  toast('✅ Projeto gerado!');
}

// ========== PLAYGROUND ==========
function executarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  const iframe = document.getElementById('playgroundPreview');
  
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  iframe.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  
  toast('▶️ Executando...');
}

function salvarDePlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  if (!codigo.trim()) {
    toast('❌ Nada para salvar!');
    return;
  }
  
  const nome = prompt('Nome do módulo:');
  if (!nome) return;
  
  salvarComoModulo(nome, 'html', codigo);
  toast('✅ Salvo como módulo!');
}

function copiarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  navigator.clipboard.writeText(codigo);
  toast('📋 Código copiado!');
}

function abrirPreviewNovo() {
  const codigo = document.getElementById('playgroundCode').value;
  const blob = new Blob([codigo], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function limparPlayground() {
  document.getElementById('playgroundCode').value = '';
  document.getElementById('playgroundPreview').src = '';
}

// ========== ARQUIVOS ==========
function renderArquivos() {
  const modulos = getModulos();
  const container = document.getElementById('arquivosList');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&quot;color:var(--text2);text-align:center;padding:40px;&quot;>Nenhum arquivo salvo</p>';
    return;
  }

  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
        <span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;>${new Date(m.data).toLocaleDateString('pt-BR')}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
        <button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}'); renderArquivos();&quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filtrarArquivos(busca) {
  const modulos = getModulos().filter(m => 
    m.nome.toLowerCase().includes(busca.toLowerCase())
  );
  
  const container = document.getElementById('arquivosList');
  container.innerHTML = modulos.map(m => `
    <div class=&quot;file-item&quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&quot;tag tag-${m.tipo}&quot;>${m.tipo}</span>
      </div>
      <div style=&quot;display:flex;gap:4px;&quot;>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;>⚡</button>
        <button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;>📥</button>
      </div>
    </div>
  `).join('');
}

function baixarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  const ext = { html: '.html', css: '.css', js: '.js', funcao: '.js' }[modulo.tipo] || '.txt';
  baixarArquivo(modulo.codigo, modulo.nome + ext, 'text/plain');
}

function exportarTudo() {
  const data = {
    modulos: getModulos(),
    selected: getSelected(),
    data: new Date().toISOString()
  };
  
  baixarArquivo(JSON.stringify(data, null, 2), 'backup-workstation-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  toast('💾 Backup exportado!');
}

function importarTudo() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modulos) {
        setModulos(data.modulos);
        if (data.selected) setSelected(data.selected);
        toast('✅ Backup importado!');
        renderModulos();
        renderArquivos();
      }
    } catch (err) {
      toast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function limparTudo() {
  if (!confirm('⚠️ ATENÇÃO: Isso vai apagar TUDO! Tem certeza?')) return;
  if (!confirm('Última chance! Realmente deseja apagar tudo?')) return;
  
  localStorage.clear();
  toast('🗑️ Tudo limpo!');
  renderModulos();
  renderArquivos();
}

// ========== IMPORT ==========
function importarParaScanner() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('scannerInput').value = ev.target.result;
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function importarParaPlayground() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('playgroundCode').value = ev.target.result;
      executarPlayground();
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function limparScanner() {
  document.getElementById('scannerInput').value = '';
  document.getElementById('scannerResults').innerHTML = '';
}

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;/g, '&amp;amp;').replace(/</g, '&amp;lt;').replace(/>/g, '&amp;gt;').replace(/&quot;/g, '&amp;quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

function atualizarContador() {
  const count = getModulos().length;
  const el = document.getElementById('modCount');
  if (el) el.textContent = count;
}

// Init
atualizarContador();
renderModulos();
</script>
</body>

<script>
function trocar(i) {
  document.querySelectorAll('.projeto').forEach(function(el){ el.classList.remove('ativo'); });
  document.querySelectorAll('.nav-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('p'+i).classList.add('ativo');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  localStorage.setItem('mc-ultimo', i);
}
window.onload = function() {
  var u = localStorage.getItem('mc-ultimo');
  if (u !== null) trocar(parseInt(u));
};
</script>
