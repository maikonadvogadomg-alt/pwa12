    <script>
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projeto = null;
        let planoGerado = '';
        let secoes = {};

        // =====================
        // DRAG &amp; DROP
        // =====================
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                carregarProjeto({ target: { files: [file] } });
            }
        });

        // =====================
        // DETECTAR PROVEDOR IA
        // =====================
        const PROVEDORES = [
            { prefix: &quot;gsk_&quot;, nome: &quot;Groq&quot;, url: &quot;https://api.groq.com/openai/v1&quot;, model: &quot;llama-3.3-70b-versatile&quot; },
            { prefix: &quot;AIza&quot;, nome: &quot;Google Gemini&quot;, url: &quot;https://generativelanguage.googleapis.com/v1beta/openai&quot;, model: &quot;gemini-2.0-flash&quot; },
            { prefix: &quot;sk-&quot;, nome: &quot;OpenAI&quot;, url: &quot;https://api.openai.com/v1&quot;, model: &quot;gpt-4o-mini&quot; },
            { prefix: &quot;sk-or-&quot;, nome: &quot;OpenRouter&quot;, url: &quot;https://openrouter.ai/api/v1&quot;, model: &quot;openai/gpt-4o-mini&quot; },
        ];

        document.getElementById('iaApiKey').addEventListener('input', function() {
            const chave = this.value.trim();
            const provedor = PROVEDORES.find(p => chave.startsWith(p.prefix));
            const el = document.getElementById('iaProviderDetectado');
            
            if (provedor) {
                el.textContent = `✅ Detectado: ${provedor.nome}`;
                if (projeto) document.getElementById('btnIA').disabled = false;
            } else if (chave) {
                el.textContent = '❓ Chave não reconhecida';
            } else {
                el.textContent = '';
            }
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLoading();

            const ext = file.name.split('.').pop().toLowerCase();
            projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    caminho: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            analisarProjeto();
            mostrarStats();
            document.getElementById('btnGerar').disabled = false;
            
            const chave = document.getElementById('iaApiKey').value.trim();
            if (chave &amp;&amp; PROVEDORES.some(p => chave.startsWith(p.prefix))) {
                document.getElementById('btnIA').disabled = false;
            }
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml','yaml','yml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho.split('/').pop(),
                                caminho: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        // =====================
        // ANALISAR PROJETO
        // =====================
        function analisarProjeto() {
            const analise = {
                totalArquivos: Object.keys(projeto.arquivos).length,
                totalLinhas: 0,
                funcoes: [],
                apis: [],
                tipos: [],
                rotas: [],
                componentes: [],
                hooks: [],
                dependencias: {}
            };

            for (const [caminho, arquivo] of Object.entries(projeto.arquivos)) {
                const linhas = arquivo.conteudo.split('\n');
                analise.totalLinhas += linhas.length;

                // Funções
                const funcoes = [...arquivo.conteudo.matchAll(/(?:function|const|let|var)\s+(\w+)\s*=?\s*(?:async\s*)?\(/g)];
                funcoes.forEach(m => {
                    analise.funcoes.push({
                        nome: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // APIs
                const apis = [...arquivo.conteudo.matchAll(/(?:fetch|axios\.(?:get|post|put|delete))\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g)];
                apis.forEach(m => {
                    analise.apis.push({
                        url: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // Tipos/Interfaces (TypeScript)
                if (['ts', 'tsx'].includes(arquivo.tipo)) {
                    const tipos = [...arquivo.conteudo.matchAll(/(?:interface|type)\s+(\w+)/g)];
                    tipos.forEach(m => {
                        analise.tipos.push({
                            nome: m[1],
                            arquivo: caminho,
                            linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                        });
                    });
                }

                // Componentes React
                if (['jsx', 'tsx'].includes(arquivo.tipo)) {
                    const componentes = [...arquivo.conteudo.matchAll(/(?:function|const)\s+([A-Z]\w+)\s*[=:]?\s*(?:\([^)]*\))?\s*(?:=>)?\s*\{/g)];
                    componentes.forEach(m => {
                        analise.componentes.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });

                    // Hooks customizados
                    const hooks = [...arquivo.conteudo.matchAll(/(?:function|const)\s+(use[A-Z]\w+)/g)];
                    hooks.forEach(m => {
                        analise.hooks.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });
                }

                // Rotas
                const rotas = [...arquivo.conteudo.matchAll(/(?:path|route):\s*['&quot;`]([^'&quot;`]+)['&quot;`]/gi)];
                rotas.forEach(m => {
                    analise.rotas.push({
                        caminho: m[1],
                        arquivo: caminho
                    });
                });

                // package.json
                if (arquivo.nome === 'package.json') {
                    try {
                        const pkg = JSON.parse(arquivo.conteudo);
                        analise.dependencias = {
                            ...pkg.dependencies,
                            ...pkg.devDependencies
                        };
                    } catch(e) {}
                }
            }

            projeto.analise = analise;
        }

        function mostrarStats() {
            const a = projeto.analise;
            document.getElementById('projetoInfo').style.display = 'block';
            document.getElementById('stats').innerHTML = `
                <div class=&quot;stat-box&quot;>
                    <div class=&quot;stat-numero&quot;>${a.totalArquivos}</div>
                    <div class=&quot;stat-label&quot;>Arquivos</div>
                </div>
                <div class=&quot;stat-box&quot;>
                    <div class=&quot;stat-numero&quot;>${a.totalLinhas.toLocaleString()}</div>
                    <div class=&quot;stat-label&quot;>Linhas</div>
                </div>
                <div class=&quot;stat-box&quot;>
                    <div class=&quot;stat-numero&quot;>${a.funcoes.length}</div>
                    <div class=&quot;stat-label&quot;>Funções</div>
                </div>
                <div class=&quot;stat-box&quot;>
                    <div class=&quot;stat-numero&quot;>${a.apis.length}</div>
                    <div class=&quot;stat-label&quot;>APIs</div>
                </div>
            `;
        }

        // =====================
        // GERAR PLANO
        // =====================
        function gerarPlano() {
            if (!projeto) return;

            mostrarLoading();

            setTimeout(() => {
                const opcoes = {
                    arvore: document.getElementById('opt_arvore').checked,
                    funcoes: document.getElementById('opt_funcoes').checked,
                    apis: document.getElementById('opt_apis').checked,
                    tipos: document.getElementById('opt_tipos').checked,
                    dependencias: document.getElementById('opt_dependencias').checked,
                    rotas: document.getElementById('opt_rotas').checked,
                    componentes: document.getElementById('opt_componentes').checked,
                    hooks: document.getElementById('opt_hooks').checked
                };

                planoGerado = gerarMarkdown(opcoes);
                mostrarPlano(planoGerado);
                gerarSecoes();
                
                document.getElementById('btnCopiar').disabled = false;
                document.getElementById('btnBaixar').disabled = false;
                document.getElementById('cardSecoes').style.display = 'block';
            }, 500);
        }

        function gerarMarkdown(opcoes) {
            const a = projeto.analise;
            let md = '';

            // CABEÇALHO
            md += `# 📋 Plano do Projeto: ${projeto.nome}\n\n`;
            md += `> Gerado automaticamente em ${new Date().toLocaleString('pt-BR')}\n\n`;
            md += `---\n\n`;

            // ÍNDICE
            md += `## 📑 Índice\n\n`;
            if (opcoes.arvore) md += `- [🌳 Estrutura de Arquivos](#estrutura)\n`;
            if (opcoes.dependencias) md += `- [📦 Dependências](#dependencias)\n`;
            if (opcoes.funcoes) md += `- [⚡ Funções](#funcoes)\n`;
            if (opcoes.apis) md += `- [🌐 Rotas de API](#apis)\n`;
            if (opcoes.tipos) md += `- [📘 Tipos/Interfaces](#tipos)\n`;
            if (opcoes.rotas) md += `- [🛣️ Rotas/Páginas](#rotas)\n`;
            if (opcoes.componentes) md += `- [🧩 Componentes React](#componentes)\n`;
            if (opcoes.hooks) md += `- [🪝 Hooks Customizados](#hooks)\n`;
            md += `\n---\n\n`;

            // ESTATÍSTICAS
            md += `## 📊 Estatísticas\n\n`;
            md += `| Métrica | Valor |\n`;
            md += `|---------|-------|\n`;
            md += `| **Arquivos** | ${a.totalArquivos} |\n`;
            md += `| **Linhas de código** | ${a.totalLinhas.toLocaleString()} |\n`;
            md += `| **Funções** | ${a.funcoes.length} |\n`;
            md += `| **Rotas de API** | ${a.apis.length} |\n`;
            md += `| **Componentes** | ${a.componentes.length} |\n`;
            md += `| **Tipos/Interfaces** | ${a.tipos.length} |\n`;
            md += `\n---\n\n`;

            // ESTRUTURA
            if (opcoes.arvore) {
                md += `## 🌳 Estrutura de Arquivos {#estrutura}\n\n`;
                md += '```\n';
                md += gerarArvore();
                md += '```\n\n';
                md += `---\n\n`;
                
                secoes['estrutura'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // DEPENDÊNCIAS
            if (opcoes.dependencias &amp;&amp; Object.keys(a.dependencias).length > 0) {
                md += `## 📦 Dependências {#dependencias}\n\n`;
                md += `Total: **${Object.keys(a.dependencias).length}** pacotes\n\n`;
                md += `| Pacote | Versão |\n`;
                md += `|--------|--------|\n`;
                Object.entries(a.dependencias).slice(0, 50).forEach(([nome, versao]) => {
                    md += `| \`${nome}\` | ${versao} |\n`;
                });
                if (Object.keys(a.dependencias).length > 50) {
                    md += `\n... e mais ${Object.keys(a.dependencias).length - 50} pacotes\n`;
                }
                md += `\n---\n\n`;
                
                secoes['dependencias'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // FUNÇÕES
            if (opcoes.funcoes &amp;&amp; a.funcoes.length > 0) {
                md += `## ⚡ Funções {#funcoes}\n\n`;
                md += `Total: **${a.funcoes.length}** funções encontradas\n\n`;
                
                const porArquivo = {};
                a.funcoes.forEach(f => {
                    if (!porArquivo[f.arquivo]) porArquivo[f.arquivo] = [];
                    porArquivo[f.arquivo].push(f);
                });

                Object.entries(porArquivo).forEach(([arquivo, funcoes]) => {
                    md += `### 📄 \`${arquivo}\`\n\n`;
                    funcoes.forEach(f => {
                        md += `- **${f.nome}()** (linha ${f.linha})\n`;
                    });
                    md += `\n`;
                });
                
                md += `---\n\n`;
                secoes['funcoes'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // APIs
            if (opcoes.apis &amp;&amp; a.apis.length > 0) {
                md += `## 🌐 Rotas de API {#apis}\n\n`;
                md += `Total: **${a.apis.length}** chamadas de API encontradas\n\n`;
                md += `| Endpoint | Arquivo | Linha |\n`;
                md += `|----------|---------|-------|\n`;
                a.apis.forEach(api => {
                    md += `| \`${api.url}\` | ${api.arquivo} | ${api.linha} |\n`;
                });
                md += `\n---\n\n`;
                
                secoes['apis'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // TIPOS
            if (opcoes.tipos &amp;&amp; a.tipos.length > 0) {
                md += `## 📘 Tipos/Interfaces TypeScript {#tipos}\n\n`;
                md += `Total: **${a.tipos.length}** tipos/interfaces\n\n`;
                
                const porArquivo = {};
                a.tipos.forEach(t => {
                    if (!porArquivo[t.arquivo]) porArquivo[t.arquivo] = [];
                    porArquivo[t.arquivo].push(t);
                });

                Object.entries(porArquivo).forEach(([arquivo, tipos]) => {
                    md += `### 📄 \`${arquivo}\`\n\n`;
                    tipos.forEach(t => {
                        md += `- **${t.nome}** (linha ${t.linha})\n`;
                    });
                    md += `\n`;
                });
                
                md += `---\n\n`;
                secoes['tipos'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // ROTAS
            if (opcoes.rotas &amp;&amp; a.rotas.length > 0) {
                md += `## 🛣️ Rotas/Páginas {#rotas}\n\n`;
                md += `Total: **${a.rotas.length}** rotas\n\n`;
                md += `| Rota | Arquivo |\n`;
                md += `|------|----------|\n`;
                a.rotas.forEach(r => {
                    md += `| \`${r.caminho}\` | ${r.arquivo} |\n`;
                });
                md += `\n---\n\n`;
                
                secoes['rotas'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // COMPONENTES
            if (opcoes.componentes &amp;&amp; a.componentes.length > 0) {
                md += `## 🧩 Componentes React {#componentes}\n\n`;
                md += `Total: **${a.componentes.length}** componentes\n\n`;
                
                const porArquivo = {};
                a.componentes.forEach(c => {
                    if (!porArquivo[c.arquivo]) porArquivo[c.arquivo] = [];
                    porArquivo[c.arquivo].push(c);
                });

                Object.entries(porArquivo).forEach(([arquivo, componentes]) => {
                    md += `### 📄 \`${arquivo}\`\n\n`;
                    componentes.forEach(c => {
                        md += `- **<${c.nome} />**\n`;
                    });
                    md += `\n`;
                });
                
                md += `---\n\n`;
                secoes['componentes'] = md.split('---\n\n')[md.split('---\n\n').length - 2];

            // HOOKS
            if (opcoes.hooks &amp;&amp; a.hooks.length > 0) {
                md += `## 🪝 Hooks Customizados {#hooks}\n\n`;

                a.hooks.forEach(h => {
                    md += `- **${h.nome}()** em \`${h.arquivo}\`\n`;
                });
                md += `\n---\n\n`;
                
                secoes['hooks'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // RODAPÉ
            md += `---\n\n`;
            md += `*Plano gerado automaticamente pelo Gerador de Plano de Projeto*\n`;
            md += `*Data: ${new Date().toLocaleString('pt-BR')}*\n`;

            return md;
        }

        function gerarArvore() {
            const caminhos = Object.keys(projeto.arquivos).sort();
            let arvore = `${projeto.nome}/\n`;

            const estrutura = {};
            caminhos.forEach(caminho => {
                const partes = caminho.split('/');
                let atual = estrutura;
                partes.forEach((parte, idx) => {
                    if (!atual[parte]) {
                        atual[parte] = idx === partes.length - 1 ? null : {};
                    }
                    if (atual[parte]) atual = atual[parte];
                });
            });

            function renderizar(obj, prefixo = '') {
                let resultado = '';
                const chaves = Object.keys(obj).sort();
                chaves.forEach((chave, idx) => {
                    const ultimo = idx === chaves.length - 1;
                    const simbolo = ultimo ? '└── ' : '├── ';
                    const proximoPrefixo = prefixo + (ultimo ? '    ' : '│   ');
                    
                    resultado += prefixo + simbolo + chave + '\n';
                    
                    if (obj[chave] !== null) {
                        resultado += renderizar(obj[chave], proximoPrefixo);
                    }
                });
                return resultado;
            }

            arvore += renderizar(estrutura);
            return arvore;
        }

        function gerarSecoes() {
            const lista = document.getElementById('listaSecoes');
            lista.innerHTML = '';

            const secoesList = [
                { id: 'estrutura', titulo: '🌳 Estrutura de Arquivos', desc: 'Árvore completa' },
                { id: 'dependencias', titulo: '📦 Dependências', desc: 'Pacotes npm' },
                { id: 'funcoes', titulo: '⚡ Funções', desc: 'Todas as funções' },
                { id: 'apis', titulo: '🌐 APIs', desc: 'Rotas e endpoints' },
                { id: 'tipos', titulo: '📘 Tipos', desc: 'TypeScript' },
                { id: 'rotas', titulo: '🛣️ Rotas', desc: 'Páginas do app' },
                { id: 'componentes', titulo: '🧩 Componentes', desc: 'React' },
                { id: 'hooks', titulo: '🪝 Hooks', desc: 'Customizados' }
            ];

            secoesList.forEach(s => {
                if (secoes[s.id]) {
                    const div = document.createElement('div');
                    div.className = 'secao';
                    div.onclick = () => copiarSecao(s.id);
                    div.innerHTML = `
                        <div class=&quot;secao-titulo&quot;>${s.titulo}</div>
                        <div class=&quot;secao-desc&quot;>${s.desc} · Clique para copiar</div>
                    `;
                    lista.appendChild(div);
                }
            });
        }

        // =====================
        // ANALISAR COM IA
        // =====================
        async function analisarComIA() {
            const chave = document.getElementById('iaApiKey').value.trim();
            if (!chave || !projeto) return;

            const provedor = PROVEDORES.find(p => chave.startsWith(p.prefix));
            if (!provedor) {
                alert('Chave de API não reconhecida!');
                return;
            }

            mostrarLoading('Analisando com IA...');

            const resumo = `
Projeto: ${projeto.nome}
Arquivos: ${projeto.analise.totalArquivos}
Linhas: ${projeto.analise.totalLinhas}
Funções: ${projeto.analise.funcoes.length}
APIs: ${projeto.analise.apis.length}

Arquivos principais:
${Object.keys(projeto.arquivos).slice(0, 10).join('\n')}

Funções principais:
${projeto.analise.funcoes.slice(0, 20).map(f => f.nome).join(', ')}

APIs detectadas:
${projeto.analise.apis.slice(0, 10).map(a => a.url).join('\n')}
            `.trim();

            try {
                const resp = await fetch(`${provedor.url}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${chave}`
                    },
                    body: JSON.stringify({
                        model: provedor.model,
                        messages: [
                            {
                                role: 'system',
                                content: 'Você é um especialista em análise de código. Responda em português brasileiro de forma clara e objetiva.'
                            },
                            {
                                role: 'user',
                                content: `Analise este projeto e me diga:
1. Qual é o propósito do projeto?
2. Quais são as principais funcionalidades?
3. Que tecnologias/frameworks são usados?
4. Há algum problema ou código suspeito?
5. Sugestões de melhoria

Dados do projeto:
${resumo}`
                            }
                        ],
                        max_tokens: 2000,
                        temperature: 0.3
                    })
                });

                if (!resp.ok) throw new Error('Erro na API');

                const data = await resp.json();
                const analise = data.choices[0].message.content;

                planoGerado += `\n\n---\n\n## 🤖 Análise da IA (${provedor.nome})\n\n${analise}\n`;
                mostrarPlano(planoGerado);

            } catch(e) {
                alert('Erro ao consultar IA: ' + e.message);
                mostrarPlano(planoGerado);
            }
        }

        // =====================
        // EXIBIR E COPIAR
        // =====================
        function mostrarPlano(conteudo) {
            document.getElementById('planoContainer').textContent = conteudo;
        }

        function mostrarLoading(texto = 'Gerando plano...') {
            document.getElementById('planoContainer').innerHTML = `
                <div class=&quot;loading&quot;>
                    <div class=&quot;spinner&quot;></div>
                    <div style=&quot;margin-top: 16px;&quot;>${texto}</div>
                </div>
            `;
        }

        function copiarPlanoCompleto() {
            navigator.clipboard.writeText(planoGerado).then(() => {
                const btn = document.getElementById('btnCopiar');
                const original = btn.textContent;
                btn.textContent = '✅ Copiado!';
                btn.classList.add('copiado');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copiado');
                }, 2000);
            });
        }

        function copiarSecao(id) {
            if (!secoes[id]) return;
            navigator.clipboard.writeText(secoes[id]).then(() => {
                event.target.closest('.secao').style.background = '#065f46';
                setTimeout(() => {
                    event.target.closest('.secao').style.background = '';
                }, 1000);
            });
        }

        function baixarMarkdown() {
            const blob = new Blob([planoGerado], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `plano-${projeto.nome.replace(/\.[^.]+$/, '')}-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

/* MARKDOWN RENDERIZADO */
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{
  color:var(--accent2); margin:24px 0 12px 0; line-height:1.3;
  scroll-margin-top:20px; position:relative;
}
.md h1{font-size:24px; border-bottom:2px solid var(--border); padding-bottom:8px}
.md h2{font-size:20px; border-bottom:1px solid var(--border); padding-bottom:6px}
.md h3{font-size:17px}
.md h4{font-size:15px}
.md h5,.md h6{font-size:13px}
.md h1:first-child,.md h2:first-child{margin-top:0}

/* Botão de copiar seção em cada heading */
.section-copy{
  position:absolute; right:0; top:50%; transform:translateY(-50%);
  display:none; gap:4px; align-items:center;
}
.md h1:hover .section-copy,.md h2:hover .section-copy,
.md h3:hover .section-copy,.md h4:hover .section-copy{display:flex}
.section-copy button{
  font-size:10px; padding:4px 8px; border-radius:5px;
  border:1px solid var(--border); background:var(--panel);
  color:var(--muted); cursor:pointer;
}
.section-copy button:hover{color:var(--accent2); border-color:var(--accent)}

.md p{margin:10px 0; line-height:1.7; font-size:14px}
.md strong{color:var(--accent2)}
.md em{color:#a5c8a2; font-style:italic}
.md a{color:#60a5fa; text-decoration:underline; word-break:break-all}
.md ul,.md ol{margin:10px 0 10px 24px; line-height:1.7}
.md li{margin:4px 0}
.md blockquote{
  border-left:3px solid var(--accent); padding:8px 14px;
  margin:12px 0; background:rgba(90,171,86,0.06);
  color:#a5c8a2; border-radius:0 6px 6px 0;
}
.md hr{border:none; border-top:1px solid var(--border); margin:20px 0}
.md table{
  border-collapse:collapse; margin:14px 0; font-size:13px;
  display:block; overflow-x:auto; max-width:100%;
}
.md th,.md td{
  border:1px solid var(--border); padding:8px 12px; text-align:left;
}
.md th{background:var(--panel); color:var(--accent2); font-weight:700}
.md tr:nth-child(even){background:rgba(255,255,255,0.02)}
.md img{max-width:100%; border-radius:6px; margin:10px 0}

/* Inline code */
.md :not(pre) > code{
  background:var(--code-bg); padding:2px 6px; border-radius:4px;
  font-family:'Consolas','Courier New',monospace; font-size:12px;
  color:#a8d5a2; border:1px solid var(--border);
}

/* Code block wrapper */
.code-wrap{
  margin:14px 0; border-radius:8px; overflow:hidden;
  border:1px solid var(--border); background:var(--code-bg);
}
.code-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; background:#0a1008; font-size:10px;
  font-family:monospace; color:var(--muted);
  border-bottom:1px solid var(--border);
}
.code-lang{text-transform:uppercase; letter-spacing:0.05em}
.code-copy{
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:10px; font-family:inherit; display:flex; align-items:center; gap:4px;
  padding:2px 6px; border-radius:4px;
}
.code-copy:hover{color:var(--accent2); background:rgba(90,171,86,0.1)}
.md pre{
  margin:0; padding:12px 14px; overflow-x:auto;
  font-size:12px; line-height:1.55;
  font-family:'Consolas','Courier New',monospace;
}
.md pre code{background:transparent !important; padding:0; color:#d4f1d4}

/* Highlight de busca */
mark.search-hit{background:#fbbf24; color:#000; padding:0 2px; border-radius:2px}
mark.search-hit.current{background:#f87171; color:#fff}

/* Toast */
.toast{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--accent);
  color:var(--accent2); padding:10px 18px; border-radius:10px;
  font-size:12px; z-index:9999; box-shadow:0 4px 14px rgba(0,0,0,0.5);
  opacity:0; transition:opacity 0.2s; pointer-events:none;
}
.toast.show{opacity:1}
.toast.err{border-color:var(--err); color:var(--err)}

/* MOBILE */
@media (max-width:768px){
  #toc{
    position:absolute; left:0; top:0; bottom:0; z-index:50;
    transform:translateX(-100%); width:80%; max-width:300px;
    box-shadow:4px 0 20px rgba(0,0,0,0.5);
  }
  #toc.show-mobile{transform:translateX(0)}
  #content{padding:16px 18px 50px 18px}
  .md h1{font-size:20px} .md h2{font-size:17px} .md h3{font-size:15px}
  .section-copy{display:flex !important; opacity:0.6}
  header h1{font-size:13px}
  .btn span.lbl{display:none}
}

::-webkit-scrollbar{width:6px; height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* Backdrop mobile */
.backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.5);
  z-index:40; display:none;
}
.backdrop.show{display:block}
</style>
</head>
<body>

<header>
  <button class=&quot;icon-btn&quot; id=&quot;tocToggle&quot; title=&quot;Mostrar/ocultar árvore&quot; onclick=&quot;toggleTOC()&quot;>📑</button>
  <h1 id=&quot;docTitle&quot;>Visualizador de Markdown</h1>
  <button class=&quot;icon-btn&quot; title=&quot;Buscar (Ctrl+F)&quot; onclick=&quot;toggleSearch()&quot;>🔍</button>
  <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileIn').click()&quot;>
    📂 <span class=&quot;lbl&quot;>Abrir</span>
  </button>
  <button class=&quot;btn&quot; id=&quot;exportBtn&quot; onclick=&quot;exportHTML()&quot; style=&quot;display:none&quot;>
    💾 <span class=&quot;lbl&quot;>Exportar</span>
  </button>
  <input type=&quot;file&quot; id=&quot;fileIn&quot; accept=&quot;.md,.markdown,.txt,.mdx&quot; style=&quot;display:none&quot; onchange=&quot;loadFile(event)&quot;>
</header>

<div id=&quot;searchBar&quot;>
  <input id=&quot;searchInput&quot; placeholder=&quot;Buscar no documento... (Enter = próximo, Shift+Enter = anterior)&quot;
         oninput=&quot;doSearch()&quot; onkeydown=&quot;searchKey(event)&quot;>
  <span id=&quot;searchCount&quot;>0/0</span>
  <button class=&quot;icon-btn&quot; onclick=&quot;toggleSearch()&quot; title=&quot;Fechar&quot;>✕</button>
</div>

<div class=&quot;layout&quot;>
  <aside id=&quot;toc&quot;>
    <div class=&quot;toc-title&quot;>📑 Sumário</div>
    <div id=&quot;tocList&quot;>
      <div style=&quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&quot;>
        Abra um arquivo .md pra ver o sumário aqui
      </div>
    </div>
  </aside>

  <div class=&quot;backdrop&quot; id=&quot;backdrop&quot; onclick=&quot;toggleTOC()&quot;></div>

  <main id=&quot;content&quot;>
    <div id=&quot;emptyState&quot;>
      <div class=&quot;big&quot;>📄</div>
      <h2>Visualizador de Markdown</h2>
      <p>
        Abra qualquer arquivo <strong>.md</strong> (Markdown) pra visualizar bonito,
        com sumário lateral, busca e botões pra copiar cada pedaço.<br><br>
        Perfeito pra trazer documentação de projetos pra conversar com a IA.
      </p>
      <div id=&quot;dropZone&quot; onclick=&quot;document.getElementById('fileIn').click()&quot;>
        <div class=&quot;icon&quot;>📂</div>
        <strong style=&quot;color:var(--accent2)&quot;>Clique aqui ou arraste um arquivo</strong>
        <div style=&quot;font-size:11px; color:var(--muted); margin-top:6px&quot;>
          Suporta: .md, .markdown, .mdx, .txt
        </div>
      </div>
      <p style=&quot;margin-top:18px; font-size:11px&quot;>
        💡 Você também pode <strong>colar texto Markdown</strong> direto: Ctrl+V em qualquer lugar
      </p>
    </div>
  </main>
</div>

<div class=&quot;toast&quot; id=&quot;toast&quot;></div>

<script>
'use strict';

let rawMarkdown = '';
let currentFileName = '';
let searchHits = [];
let searchIdx = 0;

/*══════════════════════════════════════════════════════════════════
  CONFIG MARKED
══════════════════════════════════════════════════════════════════*/
marked.setOptions({
  breaks: true,
  gfm: true,
  headerIds: true,
  mangle: false,
});

// Renderer customizado pra blocos de código
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const language = (lang || '').toLowerCase().trim() || 'texto';
  let highlighted = escapeHTML(code);
  try {
    if (lang &amp;&amp; hljs.getLanguage(lang)) {
      highlighted = hljs.highlight(code, { language: lang }).value;
    } else {
      highlighted = hljs.highlightAuto(code).value;
    }
  } catch(e) { /* fallback pra escape */ }

  const safeCode = escapeAttr(code);
  return (
    '<div class=&quot;code-wrap&quot;>'+
      '<div class=&quot;code-head&quot;>'+
        '<span class=&quot;code-lang&quot;>'+language+'</span>'+
        '<button class=&quot;code-copy&quot; data-code=&quot;'+safeCode+'&quot;>📋 Copiar código</button>'+
      '</div>'+
      '<pre><code class=&quot;hljs language-'+language+'&quot;>'+highlighted+'</code></pre>'+
    '</div>'
  );
};

// Headings com botões de copiar seção
renderer.heading = function(text, level, raw) {
  const slug = slugify(raw);
  return (
    '<h'+level+' id=&quot;'+slug+'&quot; data-heading=&quot;'+level+'&quot; data-raw=&quot;'+escapeAttr(raw)+'&quot;>'+
      text+
      '<span class=&quot;section-copy&quot;>'+
        '<button onclick=&quot;copySection(\''+slug+'\')&quot; title=&quot;Copiar essa seção inteira&quot;>📋 Seção</button>'+
        '<button onclick=&quot;copySectionMD(\''+slug+'\')&quot; title=&quot;Copiar a seção em Markdown&quot;>📝 MD</button>'+
      '</span>'+
    '</h'+level+'>'
  );
};

marked.use({ renderer });

/*══════════════════════════════════════════════════════════════════
  CARREGAR ARQUIVO
══════════════════════════════════════════════════════════════════*/
function loadFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  readFile(file);
}

function readFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    rawMarkdown = ev.target.result || '';
    render();
    toast('✓ '+file.name+' carregado');
  };
  reader.onerror = () => toast('Erro ao ler arquivo','err');
  reader.readAsText(file, 'UTF-8');
}

/*══════════════════════════════════════════════════════════════════
  RENDERIZAR
══════════════════════════════════════════════════════════════════*/
function render() {
  if (!rawMarkdown) return;
  const html = marked.parse(rawMarkdown);
  const content = document.getElementById('content');
  content.innerHTML = '<div class=&quot;md&quot; id=&quot;md&quot;>'+html+'</div>';
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('docTitle').textContent = currentFileName || 'Documento';
  buildTOC();
  bindCodeCopies();
}

function buildTOC() {
  const list = document.getElementById('tocList');
  const headings = document.querySelectorAll('#md h1, #md h2, #md h3, #md h4, #md h5, #md h6');
  if (!headings.length) {
    list.innerHTML = '<div style=&quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&quot;>Documento sem títulos</div>';
    return;
  }
  list.innerHTML = '';
  headings.forEach(h => {
    const lvl = h.tagName.toLowerCase();
    const id  = h.id;
    const txt = h.dataset.raw || h.textContent.replace(/📋.*$/,'').trim();
    const item = document.createElement('div');
    item.className = 'toc-item ' + lvl;
    item.innerHTML =
      '<span class=&quot;toc-text&quot; title=&quot;'+escapeAttr(txt)+'&quot;>'+escapeHTML(txt)+'</span>'+
      '<button class=&quot;toc-copy&quot; title=&quot;Copiar essa seção&quot; onclick=&quot;event.stopPropagation();copySection(\''+id+'\')&quot;>📋</button>';
    item.onclick = () => {
      document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
      if (window.innerWidth <= 768) toggleTOC();
      document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    };
    list.appendChild(item);
  });
}

function bindCodeCopies() {
  document.querySelectorAll('.code-copy').forEach(btn => {
    btn.onclick = () => {
      const code = btn.dataset.code || '';
      navigator.clipboard.writeText(decodeAttr(code)).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ Copiado!';
        setTimeout(() => btn.innerHTML = orig, 1500);
      });
    };
  });
}

/*══════════════════════════════════════════════════════════════════
  COPIAR SEÇÃO
══════════════════════════════════════════════════════════════════*/
function copySection(headingId, asMarkdown) {
  const h = document.getElementById(headingId);
  if (!h) return;
  const level = parseInt(h.dataset.heading || '1');

  // Coleta todos os elementos da seção (até o próximo heading de nível <= )
  const elements = [h];
  let el = h.nextElementSibling;
  while (el) {
    if (/^H[1-6]$/.test(el.tagName)) {
      const lvl = parseInt(el.dataset.heading || el.tagName[1]);
      if (lvl <= level) break;
    }
    elements.push(el);
    el = el.nextElementSibling;
  }

  let text;
  if (asMarkdown) {
    text = extractMarkdownSection(headingId);
  } else {
    text = elements.map(e => extractText(e)).join('\n\n').trim();
  }

  navigator.clipboard.writeText(text).then(() => {
    toast('✓ Seção copiada ('+text.length+' caracteres)');
  }).catch(() => toast('Erro ao copiar','err'));
}

function copySectionMD(headingId) {
  copySection(headingId, true);
}

function extractText(el) {
  // Mantém quebras de bloco de código
  if (el.classList?.contains('code-wrap')) {
    const lang = el.querySelector('.code-lang')?.textContent || '';
    const code = decodeAttr(el.querySelector('.code-copy')?.dataset.code || '');
    return '```'+lang+'\n'+code+'\n```';
  }
  // Heading
  if (/^H[1-6]$/.test(el.tagName)) {
    const lvl = parseInt(el.tagName[1]);
    const raw = el.dataset.raw || el.textContent.replace(/📋.*$/,'').trim();
    return '#'.repeat(lvl)+' '+raw;
  }
  return el.innerText || el.textContent || '';
}

/* Extrai a seção do MD bruto (mais fiel) */
function extractMarkdownSection(headingId) {
  const lines = rawMarkdown.split('\n');
  const headings = [];
  lines.forEach((line, i) => {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (m) headings.push({ idx:i, level:m[1].length, text:m[2], slug:slugify(m[2]) });
  });
  const start = headings.find(h => h.slug === headingId);
  if (!start) return '';
  const next = headings.find(h => h.idx > start.idx &amp;&amp; h.level <= start.level);
  const endIdx = next ? next.idx : lines.length;
  return lines.slice(start.idx, endIdx).join('\n').trim();
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR HTML
══════════════════════════════════════════════════════════════════*/
function exportHTML() {
  if (!rawMarkdown) return;
  const md = document.getElementById('md');
  if (!md) return;

  // CSS embutido pra o HTML ficar standalone bonito
  const css = `
    body{font-family:Georgia,Cambria,'Times New Roman',serif;max-width:860px;margin:30px auto;padding:0 24px;color:#222;line-height:1.7;background:#fafafa}
    h1,h2,h3,h4{color:#2d4a1e;margin-top:28px;margin-bottom:12px}
    h1{border-bottom:2px solid #5aab56;padding-bottom:8px}
    h2{border-bottom:1px solid #ccc;padding-bottom:6px}
    a{color:#0066cc}
    code{background:#eee;padding:2px 5px;border-radius:3px;font-family:Consolas,monospace;font-size:90%}
    pre{background:#0d1309;color:#a8d5a2;padding:14px;border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.5}
    pre code{background:transparent;color:inherit;padding:0}
    blockquote{border-left:4px solid #5aab56;padding:6px 14px;margin:14px 0;background:#f0f7ed;color:#444}
    table{border-collapse:collapse;margin:14px 0;width:100%}
    th,td{border:1px solid #ccc;padding:8px 12px;text-align:left}
    th{background:#e8f5e9}
    .copy-btn{font-size:11px;padding:4px 10px;border:1px solid #5aab56;background:#fff;color:#2d4a1e;border-radius:5px;cursor:pointer;margin-left:8px}
    .copy-btn:hover{background:#5aab56;color:#fff}
    .code-wrap{position:relative;margin:14px 0}
    .code-wrap .copy-btn{position:absolute;top:8px;right:8px}
    @media print{.copy-btn{display:none}body{background:#fff}}
  `;

  // Clona conteúdo e adiciona botões de copiar funcionais (com JS embutido)
  const clone = md.cloneNode(true);
  // Remove botões antigos de seção
  clone.querySelectorAll('.section-copy').forEach(s => s.remove());
  // Substitui code-wrap pra simplificar
  clone.querySelectorAll('.code-wrap').forEach(w => {
    const code = decodeAttr(w.querySelector('.code-copy')?.dataset.code || '');
    const lang = w.querySelector('.code-lang')?.textContent || '';
    const newWrap = document.createElement('div');
    newWrap.className = 'code-wrap';
    newWrap.innerHTML =
      '<button class=&quot;copy-btn&quot; data-code=&quot;'+escapeAttr(code)+'&quot;>📋 Copiar</button>'+
      '<pre><code class=&quot;language-'+lang+'&quot;>'+escapeHTML(code)+'</code></pre>';
    w.replaceWith(newWrap);
  });
  // Adiciona botão em cada heading
  clone.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Seção';
    btn.dataset.section = h.id;
    h.appendChild(btn);
  });

  const script = `
    <script>
    document.querySelectorAll('.copy-btn[data-code]').forEach(b=>{
      b.onclick=()=>{navigator.clipboard.writeText(b.dataset.code);b.textContent='✓ Copiado!';setTimeout(()=>b.textContent='📋 Copiar',1500)};
    });
    document.querySelectorAll('.copy-btn[data-section]').forEach(b=>{
      b.onclick=()=>{
        const h=document.getElementById(b.dataset.section);
        const lvl=parseInt(h.tagName[1]);
        let txt=h.innerText.replace('📋 Seção','').trim()+'\\n\\n';
        let el=h.nextElementSibling;
        while(el){
          if(/^H[1-6]$/.test(el.tagName)&amp;&amp;parseInt(el.tagName[1])<=lvl)break;
          txt+=el.innerText+'\\n\\n';
          el=el.nextElementSibling;
        }
        navigator.clipboard.writeText(txt.trim());
        b.textContent='✓ Copiado!';setTimeout(()=>b.textContent='📋 Seção',1500);
      };
    });
    <\/script>
  `;

  const fullHTML =
    '<!DOCTYPE html><html lang=&quot;pt-BR&quot;><head><meta charset=&quot;UTF-8&quot;>'+
    '<meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;>'+
    '<title>'+escapeHTML(currentFileName||'Documento')+'</title>'+
    '<style>'+css+'</style></head><body>'+
    '<h1 style=&quot;border:none&quot;>'+escapeHTML(currentFileName||'Documento')+'</h1>'+
    clone.outerHTML+
    script+
    '</body></html>';

  const blob = new Blob([fullHTML], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentFileName.replace(/\.(md|markdown|mdx|txt)$/i,'') || 'documento') + '.html';
  a.click();
  toast('💾 HTML exportado!');
}

/*══════════════════════════════════════════════════════════════════
  BUSCA
══════════════════════════════════════════════════════════════════*/
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const show = !bar.classList.contains('show');
  bar.classList.toggle('show', show);
  if (show) {
    document.getElementById('searchInput').focus();
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.querySelectorAll('mark.search-hit').forEach(m => {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  searchHits = [];
  searchIdx = 0;
  document.getElementById('searchCount').textContent = '0/0';
}

function doSearch() {
  clearSearch();
  const q = document.getElementById('searchInput').value.trim();
  if (!q || q.length < 2) { document.getElementById('searchCount').textContent='0/0'; return; }

  const md = document.getElementById('md');
  if (!md) return;

  const re = new RegExp(escapeRegex(q), 'gi');
  walkAndHighlight(md, re);
  searchHits = [...document.querySelectorAll('mark.search-hit')];
  searchIdx = 0;
  if (searchHits.length) {
    searchHits[0].classList.add('current');
    searchHits[0].scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('searchCount').textContent = (searchHits.length ? 1 : 0) + '/' + searchHits.length;
}

function walkAndHighlight(node, re) {
  if (node.nodeType === 3) { // text
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  } else if (node.nodeType === 1 &amp;&amp; !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
    [...node.childNodes].forEach(c => walkAndHighlight(c, re));
  }
}

function searchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!searchHits.length) return;
    searchHits[searchIdx].classList.remove('current');
    searchIdx = e.shiftKey
      ? (searchIdx - 1 + searchHits.length) % searchHits.length
      : (searchIdx + 1) % searchHits.length;
    searchHits[searchIdx].classList.add('current');
    searchHits[searchIdx].scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('searchCount').textContent = (searchIdx+1)+'/'+searchHits.length;
  } else if (e.key === 'Escape') {
    toggleSearch();
  }
}

/*══════════════════════════════════════════════════════════════════
  TOC TOGGLE
══════════════════════════════════════════════════════════════════*/
function toggleTOC() {
  const toc = document.getElementById('toc');
  const bd  = document.getElementById('backdrop');
  if (window.innerWidth <= 768) {
    const show = !toc.classList.contains('show-mobile');
    toc.classList.toggle('show-mobile', show);
    bd.classList.toggle('show', show);
  } else {
    toc.classList.toggle('hidden');
  }
  document.getElementById('tocToggle').classList.toggle('active');
}

/*══════════════════════════════════════════════════════════════════
  DRAG &amp; DROP / PASTE
══════════════════════════════════════════════════════════════════*/
const dz = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    dz?.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    dz?.classList.remove('dragover');
  });
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) readFile(f);
});

document.addEventListener('paste', e => {
  if (document.activeElement?.tagName === 'INPUT') return;
  const txt = e.clipboardData?.getData('text');
  if (txt &amp;&amp; txt.length > 50) {
    rawMarkdown = txt;
    currentFileName = 'colado.md';
    render();
    toast('✓ Texto colado renderizado');
  }
});

/*══════════════════════════════════════════════════════════════════
  ATALHOS
══════════════════════════════════════════════════════════════════*/
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'f') {
    e.preventDefault();
    toggleSearch();
  }
});

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function escapeHTML(s) {
  return String(s)
    .replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;').replace(/'/g,'&amp;#39;');
}
function escapeAttr(s) { return escapeHTML(s); }
function decodeAttr(s) {
  return String(s)
    .replace(/&amp;#39;/g,&quot;'&quot;).replace(/&amp;quot;/g,'&quot;')
    .replace(/&amp;gt;/g,'>').replace(/&amp;lt;/g,'<').replace(/&amp;amp;/g,'&amp;');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;'); }
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>

  { texto: &quot;replit-dev.com&quot;,               label: &quot;dominio-replit-dev&quot;,      flags: &quot;gi&quot; },
  { texto: &quot;pid1.replit&quot;,                  label: &quot;processo-replit&quot;,         flags: &quot;gi&quot; },
];

// Padrões personalizados do usuário (carregados do localStorage)
let customPatterns = [];

const STORAGE_KEY_PATTERNS = &quot;scanner-custom-patterns:v1&quot;;

function loadPatterns() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_PATTERNS);
    if (raw) customPatterns = JSON.parse(raw);
  } catch(e) {}
  if (!Array.isArray(customPatterns)) customPatterns = [];
  renderPatternsList();
}

function savePatterns() {
  // Lê os campos atuais antes de salvar
  const rows = document.querySelectorAll('.custom-pattern-row');
  customPatterns = [];
  rows.forEach(row => {
    const txt = row.querySelector('.pat-texto').value.trim();
    const lbl = row.querySelector('.pat-label').value.trim() || 'personalizado';
    const flg = row.querySelector('.pat-flags').value.trim() || 'gi';
    if (txt) customPatterns.push({ texto: txt, label: lbl, flags: flg });
  });
  localStorage.setItem(STORAGE_KEY_PATTERNS, JSON.stringify(customPatterns));
  const msg = document.getElementById('patternSaveMsg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 2000);
  renderPatternsList();
}

function resetPatterns() {
  if (confirm('Remover todos os padrões personalizados?')) {
    customPatterns = [];
    localStorage.removeItem(STORAGE_KEY_PATTERNS);
    renderPatternsList();
  }
}

function addCustomPattern(texto = '', label = '', flags = 'gi') {
  customPatterns.push({ texto, label, flags });
  renderPatternsList();
}

function removeCustomPattern(idx) {
  customPatterns.splice(idx, 1);
  renderPatternsList();
}

function renderPatternsList() {
  // Padrões padrão (somente leitura)
  const defList = document.getElementById('defaultPatternsList');
  defList.innerHTML = DEFAULT_PATTERNS.map(p =>
    `<span class=&quot;tag&quot; style=&quot;display:inline-block;margin:2px;&quot;>${p.label}</span>`
  ).join('');

  // Padrões personalizados (editáveis)
  const custList = document.getElementById('customPatternsList');
  if (customPatterns.length === 0) {
    custList.innerHTML = '<p style=&quot;font-size:11px;color:var(--txt3);margin-bottom:8px;&quot;>Nenhum padrão personalizado ainda.</p>';
    return;
  }
  custList.innerHTML = customPatterns.map((p, i) => `
    <div class=&quot;pattern-row custom-pattern-row&quot;>
      <input class=&quot;inp pat-texto&quot; placeholder=&quot;Texto ou regex (ex: meusite.com)&quot; value=&quot;${escHtml(p.texto)}&quot;>
      <input class=&quot;inp pat-label&quot; placeholder=&quot;Nome (ex: meu-site)&quot; value=&quot;${escHtml(p.label)}&quot; style=&quot;max-width:140px;&quot;>
      <input class=&quot;inp pat-flags&quot; placeholder=&quot;gi&quot; value=&quot;${escHtml(p.flags)}&quot; style=&quot;max-width:60px;&quot;>
      <button class=&quot;btn btn-red&quot; style=&quot;padding:6px 10px;font-size:11px;&quot; onclick=&quot;removeCustomPattern(${i})&quot;>✕</button>
    </div>
  `).join('');
}

// Compila todos os padrões em RegExp
function getAllPatterns() {
  const all = [];
  DEFAULT_PATTERNS.forEach(p => {
    try {
      all.push({ re: new RegExp(escapeRegex(p.texto), p.flags), lb: p.label });
    } catch(e) {}
  });
  customPatterns.forEach(p => {
    if (!p.texto) return;
    try {
      // Tenta como regex literal primeiro; se falhar, escapa
      let re;
      try { re = new RegExp(p.texto, p.flags || 'gi'); }
      catch(e) { re = new RegExp(escapeRegex(p.texto), p.flags || 'gi'); }
      all.push({ re, lb: p.label || 'personalizado' });
    } catch(e) {}
  });
  return all;
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;');
}

function escHtml(s) {
  return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;');
}

// ════════════════════════════════════════════════════════════
//  EXTENSÕES BINÁRIAS (pular)
// ════════════════════════════════════════════════════════════
const SKIP_EXT = new Set([
  &quot;png&quot;,&quot;jpg&quot;,&quot;jpeg&quot;,&quot;gif&quot;,&quot;webp&quot;,&quot;ico&quot;,
  &quot;woff&quot;,&quot;woff2&quot;,&quot;ttf&quot;,&quot;eot&quot;,&quot;otf&quot;,
  &quot;mp3&quot;,&quot;mp4&quot;,&quot;webm&quot;,&quot;ogg&quot;,
  &quot;bin&quot;,&quot;class&quot;,&quot;dex&quot;,&quot;so&quot;,&quot;a&quot;,&quot;o&quot;,
  &quot;pdf&quot;,&quot;doc&quot;,&quot;docx&quot;,&quot;xls&quot;,&quot;xlsx&quot;,&quot;ppt&quot;,&quot;pptx&quot;,
  &quot;zip&quot;,&quot;tar&quot;,&quot;gz&quot;,&quot;7z&quot;,&quot;rar&quot;,
]);

// ════════════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ════════════════════════════════════════════════════════════
let resultados = [];
let filtroAtual = 'todos';
let fonte = '';

// ════════════════════════════════════════════════════════════
//  NAVEGAÇÃO DE ABAS
// ════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════
//  IMPORTAR ARQUIVO LOCAL
// ════════════════════════════════════════════════════════════
async function importarArquivo(file) {
  setLoading(true, `Lendo ${file.name}…`, 10);
  const nome = file.name.toLowerCase();
  const isZip = /\.(apk|zip|jar|aab|aar)$/.test(nome);

  try {
    const arquivos = [];

    if (isZip) {
      setLoadMsg('Extraindo arquivo…');
      const buf = await file.arrayBuffer();
      setProgress(30);

      const zip = await JSZip.loadAsync(buf);
      const nomes = Object.keys(zip.files).filter(n => !zip.files[n].dir);
      setLoadMsg(`${nomes.length} arquivos encontrados — escaneando…`);

      let i = 0;
      for (const n of nomes) {
        const dados = await zip.files[n].async('arraybuffer');
        arquivos.push({ nome: n, conteudo: dados });
        i++;
        setProgress(30 + Math.round((i / nomes.length) * 60));
      }
    } else {
      const texto = await file.text();
      arquivos.push({ nome: file.name, conteudo: texto });
    }

    await rodarScan(arquivos, file.name);
  } catch(e) {
    alert('Erro ao processar arquivo: ' + e.message);
    setLoading(false);
  }
}

// ════════════════════════════════════════════════════════════
//  IMPORTAR DO GITHUB
// ════════════════════════════════════════════════════════════
async function importarGitHub() {
  let url = document.getElementById('ghUrl').value.trim().replace(/\/$/, '').replace(/\.git$/, '');
  const branch = document.getElementById('ghBranch').value.trim() || 'main';
  const token  = document.getElementById('ghToken').value.trim();

  if (!url) { alert('Cole a URL do repositório GitHub.'); return; }

  const m = url.match(/github\.com\/([^/]+)\/([^/]+)/);
  if (!m) { alert('URL inválida. Use: https://github.com/usuario/repositorio'); return; }

  const [, owner, repo] = m;
  const zipUrl = `https://codeload.github.com/${owner}/${repo}/zip/refs/heads/${branch}`;

  setLoading(true, `Baixando ${owner}/${repo}@${branch}…`, 10);
  document.getElementById('btnGitHub').disabled = true;

  try {
    const hdrs = token ? { Authorization: `token ${token}` } : {};
    let resp;

    // Tenta direto primeiro
    try {
      resp = await fetchComTimeout(zipUrl, { headers: hdrs }, 60000);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    } catch(e1) {
      // Fallback: proxy gratuito
      setLoadMsg('Download direto falhou — tentando via proxy…');
      const px = `https://api.allorigins.win/raw?url=${encodeURIComponent(zipUrl)}`;
      try {
        resp = await fetchComTimeout(px, {}, 60000);
        if (!resp.ok) throw new Error(`Proxy retornou ${resp.status}`);
      } catch(e2) {
        // Segundo proxy de fallback
        setLoadMsg('Tentando segundo proxy…');
        const px2 = `https://corsproxy.io/?${encodeURIComponent(zipUrl)}`;
        resp = await fetchComTimeout(px2, {}, 60000);
        if (!resp.ok) throw new Error(`Todos os proxies falharam. Tente baixar o ZIP manualmente e use a aba Arquivo.`);
      }
    }

    setProgress(50);
    setLoadMsg('Extraindo arquivos…');

    const buf = await resp.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const nomes = Object.keys(zip.files).filter(n => !zip.files[n].dir);

    // Remove o prefixo automático que o GitHub coloca (repo-branch/)
    const prefix = (nomes[0]?.split('/')[0] ?? '') + '/';
    setLoadMsg(`${nomes.length} arquivos — escaneando…`);

    const arquivos = [];
    let i = 0;
    for (const n of nomes) {
      const rel = n.startsWith(prefix) ? n.slice(prefix.length) : n;
      if (!rel) continue;
      const dados = await zip.files[n].async('arraybuffer');
      arquivos.push({ nome: rel, conteudo: dados });
      i++;
      setProgress(50 + Math.round((i / nomes.length) * 40));
    }

    await rodarScan(arquivos, `${owner}/${repo}@${branch}`);
  } catch(e) {
    alert('Erro: ' + e.message);
    setLoading(false);
  } finally {
    document.getElementById('btnGitHub').disabled = false;
  }
}

// Fetch com timeout manual (compatível com todos os browsers)
function fetchComTimeout(url, opts, ms) {
  return new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => { ctrl.abort(); reject(new Error('Timeout')); }, ms);
    fetch(url, { ...opts, signal: ctrl.signal })
      .then(r => { clearTimeout(timer); resolve(r); })
      .catch(e => { clearTimeout(timer); reject(e); });
  });
}

// ════════════════════════════════════════════════════════════
//  MOTOR DE SCAN
// ════════════════════════════════════════════════════════════
function scanTexto(texto) {
  const pats = getAllPatterns();
  const hits = [];
  const linhas = texto.split('\n');
  linhas.forEach((linha, i) => {
    const found = [];
    pats.forEach(p => {
      p.re.lastIndex = 0;
      if (p.re.test(linha)) { found.push(p.lb); p.re.lastIndex = 0; }
    });
    if (found.length) hits.push({ ln: i + 1, txt: linha.trim().slice(0, 300), labels: found });
  });
  return hits;
}

async function processarArquivos(arquivos) {
  const result = [];
  for (const arq of arquivos) {
    const ext = (arq.nome.split('.').pop() || '').toLowerCase();

    if (SKIP_EXT.has(ext) || arq.nome.includes('META-INF/CERT')) {
      result.push({ nome: arq.nome, status: 'skip', hits: [] });
      continue;
    }

    try {
      let texto;
      if (arq.conteudo instanceof ArrayBuffer) {
        texto = new TextDecoder('utf-8', { fatal: false }).decode(arq.conteudo);
      } else {
        texto = arq.conteudo;
      }

      // Detecta binário por presença de null bytes em extensões não-texto
      const textoExts = new Set(['txt','json','xml','html','htm','js','ts','jsx','tsx','css','md','yaml','yml','toml','env','sh','bat','py','rb','php','java','kt','swift','go','rs','c','cpp','h','cs','sql']);
      if (texto.includes('\x00') &amp;&amp; !textoExts.has(ext)) {
        result.push({ nome: arq.nome, status: 'bin', hits: [] });
        continue;
      }

      const hits = scanTexto(texto);
      result.push({ nome: arq.nome, status: hits.length > 0 ? 'sujo' : 'limpo', hits });
    } catch(e) {
      result.push({ nome: arq.nome, status: 'err', hits: [] });
    }
  }
  return result;
}

async function rodarScan(arquivos, nomeFonte) {
  setLoading(true, 'Escaneando…', 5);
  fonte = nomeFonte;

  try {
    const res = await processarArquivos(arquivos);
    resultados = res;
    filtroAtual = 'todos';
    renderResultados();
  } finally {
    setLoading(false);
  }
}

// ════════════════════════════════════════════════════════════
//  RENDERIZAÇÃO DOS RESULTADOS
// ════════════════════════════════════════════════════════════
function renderResultados() {
  const sujos  = resultados.filter(r => r.status === 'sujo');
  const limpos = resultados.filter(r => r.status === 'limpo');

  document.getElementById('numSujos').textContent  = sujos.length;
  document.getElementById('numLimpos').textContent = limpos.length;
  document.getElementById('numTodos').textContent  = resultados.length;
  document.getElementById('fonteLabel').textContent = `📂 Fonte: ${fonte} — ${new Date().toLocaleString('pt-BR')}`;

  // Destaque do filtro ativo
  ['Sujos','Limpos','Todos'].forEach(n => {
    document.getElementById('stat' + n).className = 'stat-card';
  });
  const mapClass = { sujos: 'active-red', limpos: 'active-green', todos: 'active-blue' };
  const mapEl    = { sujos: 'statSujos', limpos: 'statLimpos', todos: 'statTodos' };
  document.getElementById(mapEl[filtroAtual]).classList.add(mapClass[filtroAtual]);

  // Filtra e ordena
  let itens = filtroAtual === 'sujos' ? sujos : filtroAtual === 'limpos' ? limpos : resultados;
  const sorted = [...itens].sort((a, b) => {
    if (a.status === 'sujo' &amp;&amp; b.status !== 'sujo') return -1;
    if (b.status === 'sujo' &amp;&amp; a.status !== 'sujo') return  1;
    return 0;
  });

  // Renderiza lista
  const list = document.getElementById('resultList');
  if (sorted.length === 0) {
    list.innerHTML = '<p style=&quot;text-align:center;color:var(--txt3);padding:20px;font-size:13px;&quot;>Nenhum arquivo neste filtro.</p>';
  } else {
    list.innerHTML = sorted.map((r, i) => {
      const badgeClass = r.status === 'sujo' ? 'badge-red' : r.status === 'limpo' ? 'badge-green' : 'badge-gray';
      const badgeTxt   = r.status === 'sujo' ? `🔴 ${r.hits.length} ref(s)` : r.status === 'limpo' ? '🟢 Limpo' : '⬜ Skip';
      const hasHits    = r.hits.length > 0;

      const hitsHtml = hasHits ? `
        <div class=&quot;result-hits&quot; id=&quot;hits-${i}&quot;>
          ${r.hits.slice(0, 30).map(h => `
            <div class=&quot;hit-line&quot;>
              <span class=&quot;ln&quot;>L${h.ln}: </span>${escHtml(h.txt)}
              ${h.labels.map(l => `<span class=&quot;tag&quot; style=&quot;margin-left:4px;&quot;>${l}</span>`).join('')}
            </div>
          `).join('')}
          ${r.hits.length > 30 ? `<div class=&quot;hit-more&quot;>…e mais ${r.hits.length - 30} ocorrências</div>` : ''}
        </div>
      ` : '';

      return `
        <div class=&quot;result-item ${r.status}&quot; id=&quot;item-${i}&quot;>
          <div class=&quot;result-header ${hasHits ? '' : 'no-hits'}&quot; onclick=&quot;${hasHits ? `toggleHits(${i})` : ''}&quot;>
            <span class=&quot;badge ${badgeClass}&quot;>${badgeTxt}</span>
            <span class=&quot;result-name&quot;>${escHtml(r.nome)}</span>
            ${hasHits ? `<span class=&quot;result-arrow&quot; id=&quot;arrow-${i}&quot;>▼</span>` : ''}
          </div>
          ${hitsHtml}
        </div>
      `;
    }).join('');
  }

  document.getElementById('resultsSection').style.display = 'flex';
  document.getElementById('resultsSection').style.flexDirection = 'column';
  document.getElementById('resultsSection').style.gap = '8px';
  document.getElementById('emptyState').style.display = 'none';
}

function toggleHits(i) {
  const el    = document.getElementById(`hits-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  const open  = el.classList.toggle('open');
  if (arrow) arrow.textContent = open ? '▲' : '▼';
}

function setFiltro(f) {
  filtroAtual = f;
  renderResultados();
}

// ════════════════════════════════════════════════════════════
//  RELATÓRIO
// ════════════════════════════════════════════════════════════
function gerarRelatorio() {
  const sujos  = resultados.filter(r => r.status === 'sujo');
  const limpos = resultados.filter(r => r.status === 'limpo');
  let txt = `=== SCANNER DE DEPENDÊNCIAS — SK Editor ===\n`;
  txt += `Data: ${new Date().toLocaleString('pt-BR')}\n`;
  txt += `Fonte: ${fonte}\n`;
  txt += `Maikon Caldeira OAB/MG 183712\n\n`;
  txt += `RESUMO:\n`;
  txt += `  Total de arquivos: ${resultados.length}\n`;
  txt += `  Com referências:   ${sujos.length}\n`;
  txt += `  Limpos:            ${limpos.length}\n\n`;

  if (sujos.length > 0) {
    txt += `${'='.repeat(50)}\nARQUIVOS COM REFERÊNCIAS:\n${'='.repeat(50)}\n`;
    sujos.forEach(r => {
      txt += `\n► ${r.nome}\n`;
      r.hits.forEach(h => {
        txt += `  L${h.ln} [${h.labels.join(', ')}]: ${h.txt}\n`;
      });
    });
  }

  txt += `\n${'='.repeat(50)}\nARQUIVOS LIMPOS:\n${'='.repeat(50)}\n`;
  limpos.forEach(r => { txt += `  ✓ ${r.nome}\n`; });

  return txt;
}

function copiarRelatorio() {
  navigator.clipboard?.writeText(gerarRelatorio())
    .then(() => alert('✅ Relatório copiado para a área de transferência!'))
    .catch(() => alert('Erro ao copiar. Tente o botão Baixar .txt'));
}

function baixarRelatorio() {
  const txt  = gerarRelatorio();
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `scanner-${fonte.replace(/[^a-z0-9]/gi, '-')}-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function limparResultados() {
  resultados = [];
  document.getElementById('resultsSection').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
}

// ════════════════════════════════════════════════════════════
//  CONTROLES DE UI
// ════════════════════════════════════════════════════════════
function setLoading(ativo, msg = 'Processando…', prog = 0) {
  const box = document.getElementById('loadingBox');

  if (ativo) {

    setProgress(prog);

}

function setLoadMsg(msg) {
  document.getElementById('loadMsg').textContent = msg;
}

function setProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

loadPatterns();
</script>

.badge.skip{background:#64748b;color:#e2e8f0}
.badge.warn{background:#f59e0b;color:#000}
.file-name{font-weight:700;font-size:1rem;word-break:break-all}
/* DETAIL EXPANDIDO */
.detail{margin-top:8px;font-size:.82rem;color:#94a3b8}
.detail-body{max-height:300px;overflow-y:auto;transition:max-height .3s ease}
.detail-body.expanded{max-height:9999px}
.expand-btn{background:none;border:1px solid #475569;color:#94a3b8;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:.75rem;margin-top:6px;transition:all .2s}
.expand-btn:hover{background:#334155;color:#e2e8f0}
.hit-block{background:#0f172a;border-radius:6px;padding:10px;margin:6px 0;border-left:3px solid #ef4444}
.hit-label{color:#fbbf24;font-weight:700;font-size:.8rem;margin-bottom:4px}
.hit-ctx{font-size:.75rem;color:#94a3b8;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;background:#0a0f1a;padding:6px;border-radius:4px;margin-top:4px}
.hit-ctx.expanded{max-height:9999px}
.ctx-expand{background:none;border:none;color:#38bdf8;cursor:pointer;font-size:.72rem;padding:2px 0;text-decoration:underline}
.file-section{margin-bottom:12px;padding:8px;background:#1a0a0a;border-radius:6px}
.file-section-name{color:#f97316;font-size:.8rem;font-weight:700;margin-bottom:6px;word-break:break-all}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#1e293b;border-radius:8px;padding:12px 20px;text-align:center;border:1px solid #334155;flex:1;min-width:100px}
.stat .n{font-size:2rem;font-weight:700}
.stat .l{font-size:.75rem;color:#64748b;margin-top:2px}
.stat.ok .n{color:#22c55e}
.stat.fail .n{color:#ef4444}
.stat.info .n{color:#38bdf8}
.log{font-size:.75rem;color:#64748b;margin:8px 0;min-height:18px}
.actions-bar{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:16px;gap:8px}
.category-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:700;margin-left:6px;vertical-align:middle}
.cat-url{background:#1e3a5f;color:#38bdf8}
.cat-env{background:#3b1f00;color:#fbbf24}
.cat-key{background:#2d0a4e;color:#c084fc}
.cat-config{background:#1a2e1a;color:#86efac}
.cat-id{background:#3b1a00;color:#fb923c}
.severity-high{border-left-color:#ef4444!important}
.severity-med{border-left-color:#f59e0b!important}
.severity-low{border-left-color:#3b82f6!important}
footer{margin-top:32px;text-align:center;font-size:.75rem;color:#334155}
.progress-wrap{background:#334155;border-radius:2px;height:4px;margin:8px 0;overflow:hidden;display:none}
.progress-inner{height:100%;background:#38bdf8;border-radius:2px;transition:width .2s}
</style>
</head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
h1{font-size:1.6rem;color:#38bdf8;margin-bottom:4px}
.sub{color:#64748b;font-size:.85rem;margin-bottom:24px}
.drop{border:2px dashed #334155;border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:#1e293b}
.drop:hover,.drop.over{border-color:#38bdf8;background:#0f2744}
.drop svg{width:48px;height:48px;color:#38bdf8;margin-bottom:12px}
.drop p{color:#94a3b8;font-size:.95rem}
.drop strong{color:#e2e8f0}
#fileInput{display:none}
.btn{display:inline-block;background:#38bdf8;color:#0f172a;font-weight:700;padding:10px 24px;border-radius:8px;cursor:pointer;border:none;font-size:.95rem;margin-top:16px;transition:background .2s}
.btn:hover{background:#7dd3fc}
.btn-sm{font-size:.8rem;padding:6px 14px;border-radius:6px;background:#334155;color:#e2e8f0;cursor:pointer;border:none;margin-left:8px}
.btn-sm:hover{background:#475569}
#results{margin-top:24px;display:none}
.card{background:#1e293b;border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid #334155}
.card.clean{border-color:#22c55e;background:#052e16}
.card.dirty{border-color:#ef4444;background:#2d0a0a}
.card.warn{border-color:#f59e0b;background:#2d1a00}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;margin-left:8px}
.badge.ok{background:#22c55e;color:#052e16}
.badge.fail{background:#ef4444;color:#fff}
.badge.skip{background:#64748b;color:#e2e8f0}
.file-name{font-weight:700;font-size:1rem;word-break:break-all}
.detail{margin-top:8px;font-size:.8rem;color:#94a3b8;max-height:200px;overflow-y:auto}
.detail pre{background:#0f172a;padding:8px;border-radius:6px;margin-top:4px;white-space:pre-wrap;word-break:break-all;font-size:.75rem;color:#fbbf24}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#1e293b;border-radius:8px;padding:12px 20px;text-align:center;border:1px solid #334155;flex:1;min-width:100px}
.stat .n{font-size:2rem;font-weight:700}
.stat .l{font-size:.75rem;color:#64748b;margin-top:2px}
.stat.ok .n{color:#22c55e}
.stat.fail .n{color:#ef4444}
.stat.info .n{color:#38bdf8}

.progress-inner{height:100%;background:#38bdf8;border-radius:2px;transition:width .3s}
.log{font-size:.75rem;color:#64748b;margin:8px 0}
.hit{color:#ef4444;font-weight:700}
footer{margin-top:32px;text-align:center;font-size:.75rem;color:#334155}
</style>

const PATTERNS = [
  {label:'replit.com',      re:/replit\.com/gi},
  {label:'repl.it',         re:/repl\.it/gi},
  {label:'.repl.co',        re:/\.repl\.co/gi},
  {label:'.replit.dev',     re:/\.replit\.dev/gi},
  {label:'.replit.app',     re:/\.replit\.app/gi},
  {label:'REPL_ID',         re:/REPL_ID/g},
  {label:'REPLIT_',         re:/REPLIT_[A-Z_]+/g},
  {label:'replit.nix',      re:/replit\.nix/gi},
  {label:'.replit config',  re:/^\.replit$/gm},
  {label:'pid.replit',      re:/pid\.replit/gi},
  {label:'import.meta.env (Vite REPLIT)', re:/import\.meta\.env\.REPLIT/g},
];

const TEXT_EXTS = new Set([
  'js','ts','jsx','tsx','html','htm','css','json','yaml','yml',
  'xml','txt','md','sh','py','java','kt','gradle','properties',
  'toml','ini','env','gitignore','Dockerfile','config','mjs','cjs'
]);

function isText(name) {
  const ext = name.split('.').pop().toLowerCase();
  return TEXT_EXTS.has(ext) || !name.includes('.');
}

function scanText(text, filename) {
  const hits = [];
  for (const p of PATTERNS) {
    const matches = [...text.matchAll(p.re)];
    if (matches.length) {
      const lines = text.split('\n');
      const ctxLines = [];
      for (let i=0;i<lines.length;i++){
        if (p.re.test(lines[i])){
          p.re.lastIndex=0;
          ctxLines.push(`Linha ${i+1}: ${lines[i].trim().slice(0,120)}`);
          if(ctxLines.length>=5){ctxLines.push('...');break;}
        }
        p.re.lastIndex=0;
      }
      hits.push({label:p.label, count:matches.length, ctx:ctxLines.join('\n')});
    }
    p.re.lastIndex=0;
  }
  return hits;
}

async function analyzeFile(file) {
  const log = s => document.getElementById('logLine').textContent = s;
  log('Lendo ' + file.name + '...');
  const buf = await file.arrayBuffer();
  const results = [];

  // Tenta como ZIP/APK
  let isZip = false;
  try {
    const zip = await JSZip.loadAsync(buf);
    isZip = true;
    const entries = Object.values(zip.files).filter(f=>!f.dir);
    log(`${file.name}: ZIP com ${entries.length} arquivos — escaneando...`);
    for (const entry of entries) {
      if (!isText(entry.name)) continue;
      try {
        const text = await entry.async('text');
        const hits = scanText(text, entry.name);
        if (hits.length) results.push({file: entry.name, hits});
      } catch {}
    }
    if (results.length === 0) {
      return {name: file.name, type:'ZIP/APK', clean:true, files:entries.length, results:[]};
    }
    return {name: file.name, type:'ZIP/APK', clean:false, files:entries.length, results};
  } catch {}

  // Tenta como texto direto
  try {
    const text = new TextDecoder('utf-8',{fatal:true}).decode(buf);
    const hits = scanText(text, file.name);
    log('');
    if (hits.length === 0) return {name:file.name, type:'Texto', clean:true, files:1, results:[]};
    return {name:file.name, type:'Texto', clean:false, files:1, results:[{file:file.name, hits}]};
  } catch {}

  log('');
  return {name:file.name, type:'Binário', clean:null, files:1, results:[], skip:true};
}

function renderResults(analyses) {
  const div = document.getElementById('results');
  div.style.display = 'block';

  const total = analyses.length;
  const clean = analyses.filter(a=>a.clean===true).length;
  const dirty = analyses.filter(a=>a.clean===false).length;
  const skip  = analyses.filter(a=>a.skip).length;

  let html = '<div class=&quot;summary&quot;>';
  html += `<div class=&quot;stat info&quot;><div class=&quot;n&quot;>${total}</div><div class=&quot;l&quot;>Arquivos</div></div>`;
  html += `<div class=&quot;stat ok&quot;><div class=&quot;n&quot;>${clean}</div><div class=&quot;l&quot;>Limpos ✅</div></div>`;
  html += `<div class=&quot;stat fail&quot;><div class=&quot;n&quot;>${dirty}</div><div class=&quot;l&quot;>Contaminados ❌</div></div>`;
  html += `<div class=&quot;stat&quot;><div class=&quot;n&quot;>${skip}</div><div class=&quot;l&quot;>Ignorados</div></div>`;
  html += '</div>';

  for (const a of analyses) {
    if (a.clean === true) {
      html += `<div class=&quot;card clean&quot;>
        <span class=&quot;file-name&quot;>✅ ${a.name}</span>
        <span class=&quot;badge ok&quot;>LIMPO</span>
        <div class=&quot;detail&quot;>Tipo: ${a.type} · ${a.files} arquivo(s) verificado(s)<br>Nenhuma referência indesejada encontrada.</div>
      </div>`;
    } else if (a.skip) {
      html += `<div class=&quot;card&quot;>
        <span class=&quot;file-name&quot;>⏭ ${a.name}</span>
        <span class=&quot;badge skip&quot;>IGNORADO</span>
        <div class=&quot;detail&quot;>Arquivo binário — não foi possível escanear o conteúdo.</div>
      </div>`;
    } else {
      const totalHits = a.results.reduce((s,r)=>s+r.hits.reduce((ss,h)=>ss+h.count,0),0);
      html += `<div class=&quot;card dirty&quot;>
        <span class=&quot;file-name&quot;>❌ ${a.name}</span>
        <span class=&quot;badge fail&quot;>${totalHits} OCORRÊNCIA(S)</span>
        <div class=&quot;detail&quot;>`;
      for (const r of a.results) {
        html += `<strong>${r.file}</strong><br>`;
        for (const h of r.hits) {
          html += `<span class=&quot;hit&quot;>⚠ ${h.label}: ${h.count}x</span><br>`;
          if(h.ctx) html += `<pre>${h.ctx}</pre>`;
        }
        html += '<br>';
      }
      html += '</div></div>';
    }
  }

  div.innerHTML = html;
}

async function processFiles(files) {
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  const analyses = [];
  for (const f of files) {
    const r = await analyzeFile(f);
    analyses.push(r);
  }
  document.getElementById('logLine').textContent = '';
  renderResults(analyses);
}

const drop = document.getElementById('dropZone');
drop.addEventListener('dragover', e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave', ()=>drop.classList.remove('over'));
drop.addEventListener('drop', e=>{
  e.preventDefault(); drop.classList.remove('over');
  if(e.dataTransfer.files.length) processFiles([...e.dataTransfer.files]);
});
document.getElementById('fileInput').addEventListener('change', e=>{
  if(e.target.files.length) processFiles([...e.target.files]);
});
</script>
