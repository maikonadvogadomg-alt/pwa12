    :root {

&lt;/head&gt;
&lt;body&gt;

  &lt;button class=&quot;theme-toggle&quot; onclick=&quot;toggleTheme()&quot;&gt;🌙 Tema&lt;/button&gt;

  &lt;div class=&quot;container&quot;&gt;
    &lt;h2&gt;📄 Extrator de Documentos Inteligente&lt;/h2&gt;
    
    &lt;!-- Área de Drag &amp; Drop --&gt;
    &lt;div class=&quot;upload-area&quot; id=&quot;dropZone&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;&gt;
      &lt;span class=&quot;upload-icon&quot;&gt;📂&lt;/span&gt;
      &lt;p id=&quot;fileNameDisplay&quot;&gt;Arraste seu arquivo aqui ou clique para selecionar&lt;br&gt;

      &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.pdf,.txt,.png,.jpg,.jpeg,.docx&quot;&gt;

    &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
      &lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
      &lt;p style=&quot;text-align: center; font-size: 12px; margin-top: 5px;&quot;&gt;Processando... (Isso pode levar alguns segundos)&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;btn-group&quot;&gt;
      &lt;button onclick=&quot;extractText()&quot; style=&quot;background-color: #28a745; font-weight: bold;&quot;&gt;🚀 Extrair Texto&lt;/button&gt;
      &lt;button onclick=&quot;copyText()&quot; class=&quot;secondary&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;button onclick=&quot;downloadText()&quot;&gt;💾 Baixar TXT&lt;/button&gt;
      &lt;button onclick=&quot;downloadPDF()&quot;&gt;📄 Baixar PDF&lt;/button&gt;
      &lt;button onclick=&quot;downloadDOCX()&quot;&gt;📝 Baixar DOCX&lt;/button&gt;
      &lt;button onclick=&quot;downloadMarkdown()&quot;&gt;⬇️ Baixar MD&lt;/button&gt;
    &lt;/div&gt;
    
    &lt;h3&gt;Texto extraído:&lt;/h3&gt;
    &lt;textarea id=&quot;output&quot; placeholder=&quot;O texto extraído aparecerá aqui...&quot;&gt;&lt;/textarea&gt;
  &lt;/div&gt;
  
  &lt;!-- Bibliotecas --&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.36.0/docxtemplater.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js&quot;&gt;&lt;/script&gt;
  
  &lt;script&gt;
    let extractedText = &quot;&quot;;

    // --- Configuração da Interface (Drag &amp; Drop) ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    // Efeitos visuais ao arrastar
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName =&gt; {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName =&gt; {
      dropZone.addEventListener(eventName, () =&gt; dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName =&gt; {
      dropZone.addEventListener(eventName, () =&gt; dropZone.classList.remove('dragover'), false);
    });

    // Ao soltar o arquivo
    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      fileInput.files = files;
      updateFileName();
    }

    // Ao selecionar pelo clique
    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
      if (fileInput.files.length &gt; 0) {
        fileNameDisplay.innerHTML = `&lt;strong&gt;Arquivo selecionado:&lt;/strong&gt; ${fileInput.files[0].name}`;
      }
    }

    // --- Lógica Original Mantida e Organizada ---

    function cleanFooter(text) {
      const patterns = [
        /Num\.\s*\d+\s*-\s*Pág\.\s*\d+[\s\S]*?Número do documento:\s*\d+[^\n]*\n?/gi,
        /Assinado digitalmente por:[\s\S]*?Número do documento:[^\n]*\n?/gi,
        /Documento eletrônico assinado[\s\S]*?Número do documento:[^\n]*\n?/gi
      ];
      let cleaned = text;
      patterns.forEach(p =&gt; {
        cleaned = cleaned.replace(p, &quot;&quot;);
      });
      return cleaned;
    }

    window.onload = function() {
      const saved = localStorage.getItem(&quot;autosaveText&quot;);
      if (saved) {
        extractedText = saved;
        document.getElementById(&quot;output&quot;).value = saved;
      }
    };

    // Função auxiliar para mostrar progresso
    function toggleLoading(show) {
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      
      if (show) {
        progressContainer.style.display = 'block';
        progressBar.style.width = '30%';
        // Simulação de progresso
        setTimeout(() =&gt; progressBar.style.width = '70%', 1000);
      } else {
        progressBar.style.width = '100%';
        setTimeout(() =&gt; {
          progressContainer.style.display = 'none';
          progressBar.style.width = '0%';
        }, 500);
      }
    }

    async function extractText() {
      const file = fileInput.files[0];
      if (!file) {
        alert(&quot;Selecione um arquivo primeiro!&quot;);
        return;
      }

      toggleLoading(true); // Inicia loading
      document.getElementById(&quot;output&quot;).value = &quot;Extraindo texto, por favor aguarde...&quot;;

      try {
        if (file.type === &quot;text/plain&quot;) {
          const text = await file.text();
          extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo TXT ---\n\n`;
          finalizeExtraction();

        } else if (file.type === &quot;application/pdf&quot;) {
          const reader = new FileReader();
          reader.onload = async function() {
            const typedArray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedArray).promise;
            let textContent = &quot;&quot;;

            for (let i = 1; i &lt;= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const text = await page.getTextContent();

              if (text.items.length &gt; 0) {
                text.items.forEach(item =&gt; textContent += item.str + &quot; &quot;);
              } else {
                // Fallback OCR para PDF escaneado
                const viewport = page.getViewport({ scale: 2 });
                const canvas = document.createElement(&quot;canvas&quot;);
                const context = canvas.getContext(&quot;2d&quot;);
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                const { data: { text: ocrText } } = await Tesseract.recognize(canvas, 'por');
                textContent += ocrText + &quot; &quot;;
              }
              textContent += `\n\n--- Página ${i} ---\n\n`;
            }
            extractedText = cleanFooter(textContent);
            finalizeExtraction();
          };
          reader.readAsArrayBuffer(file);

        } else if (file.type.startsWith(&quot;image/&quot;)) {
          const reader = new FileReader();
          reader.onload = async function() {
            const { data: { text } } = await Tesseract.recognize(reader.result, 'por');
            extractedText = cleanFooter(text) + `\n\n--- Fim da imagem ---\n\n`;
            finalizeExtraction();
          };
          reader.readAsDataURL(file);

        } else if (file.name.endsWith(&quot;.docx&quot;)) {
          const reader = new FileReader();
          reader.onload = async function() {
            const zip = new JSZip(reader.result);
            const doc = new window.Docxtemplater().loadZip(zip);
            const text = doc.getFullText();
            extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo DOCX ---\n\n`;
            finalizeExtraction();
          };
          reader.readAsBinaryString(file);

        } else {
          alert(&quot;Formato não suportado. Use PDF, TXT, DOCX ou imagem.&quot;);
          toggleLoading(false);
        }
      } catch (error) {
        console.error(error);
        alert(&quot;Erro ao processar arquivo. Verifique se o arquivo não está corrompido.&quot;);
        toggleLoading(false);
      }
    }

    function finalizeExtraction() {
      document.getElementById(&quot;output&quot;).value = extractedText;
      localStorage.setItem(&quot;autosaveText&quot;, extractedText);
      toggleLoading(false); // Para loading
    }

    // --- Funções de Download e Utilitários ---

    function downloadText() {
      if (!extractedText) return alert(&quot;Nenhum texto extraído ainda!&quot;);
      const blob = new Blob([extractedText], { type: &quot;text/plain&quot; });
      saveFile(blob, &quot;texto_extraido.txt&quot;);
    }

    function downloadPDF() {
      if (!extractedText) return alert(&quot;Nenhum texto extraído ainda!&quot;);
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(12);
      const lines = doc.splitTextToSize(extractedText, 180);
      doc.text(lines, 10, 10);
      doc.save(&quot;texto_extraido.pdf&quot;);
    }

    function downloadDOCX() {
      if (!extractedText) return alert(&quot;Nenhum texto extraído ainda!&quot;);
      const blob = new Blob(
        [`&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot; standalone=&quot;yes&quot;?&gt;
        &lt;w:document xmlns:w=&quot;http://schemas.openxmlformats.org/wordprocessingml/2006/main&quot;&gt;
          &lt;w:body&gt;
            &lt;w:p&gt;&lt;w:r&gt;&lt;w:t&gt;${extractedText.replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;).replace(/&gt;/g,&quot;&amp;gt;&quot;)}&lt;/w:t&gt;&lt;/w:r&gt;&lt;/w:p&gt;
          &lt;/w:body&gt;
        &lt;/w:document&gt;`],
        { type: &quot;application/vnd.openxmlformats-officedocument.wordprocessingml.document&quot; }
      );
      saveFile(blob, &quot;texto_extraido.docx&quot;);
    }

    function downloadMarkdown() {
      if (!extractedText) return alert(&quot;Nenhum texto extraído ainda!&quot;);
      const mdText = extractedText.replace(/--- Página (\d+) ---/g, &quot;### Página $1&quot;);
      const blob = new Blob([mdText], { type: &quot;text/markdown&quot; });
      saveFile(blob, &quot;texto_extraido.md&quot;);
    }

    function saveFile(blob, filename) {
      const link = document.createElement(&quot;a&quot;);
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function copyText() {
      if (!extractedText) return alert(&quot;Nenhum texto extraído ainda!&quot;);
      navigator.clipboard.writeText(extractedText).then(() =&gt; {
        // Feedback visual no botão
        const btn = document.querySelector('button[onclick=&quot;copyText()&quot;]');
        const originalText = btn.innerText;
        btn.innerText = &quot;Copiado! ✅&quot;;
        setTimeout(() =&gt; btn.innerText = originalText, 2000);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</div>

        .ovbox { background: white; border-radius: 12px; padding: 20px; min-width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center; }
        .spin { width: 24px; height: 24px; border: 4px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: sp 1s linear infinite; vertical-align: middle; margin-right: 10px; }
        .autosave-badge { font-size: 10px; color: var(--good); float: right; margin-top: -20px; display: none; }
        @keyframes sp { to { transform: rotate(360deg); } }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;ov&quot;&gt;
        &lt;div class=&quot;ovbox&quot;&gt;
            &lt;div style=&quot;color: black;&quot;&gt;&lt;span class=&quot;spin&quot;&gt;&lt;/span&gt;&lt;b id=&quot;ovMsg&quot;&gt;Processando…&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;small&quot; id=&quot;ovSub&quot; style=&quot;margin-top:10px;color:#475569&quot;&gt;Isso pode levar alguns segundos dependendo do tamanho do arquivo.&lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;wrap&quot;&gt;
        &lt;div class=&quot;left&quot;&gt;
            &lt;h1&gt;Filtrador Jurídico Avançado &lt;span id=&quot;autosaveBadge&quot; class=&quot;autosave-badge&quot;&gt;✓ Salvo&lt;/span&gt;&lt;/h1&gt;
            &lt;div class=&quot;hint&quot;&gt;
                &lt;b&gt;Versão de Corte Cirúrgico + Autosave:&lt;/b&gt; O texto será dividido por linhas. Se uma palavra for banida, apenas aquela linha específica será excluída. Tudo que você digita é salvo automaticamente no seu navegador.
            &lt;/div&gt;
            
            &lt;h2&gt;1) Importar Arquivos&lt;/h2&gt;
            &lt;input id=&quot;files&quot; type=&quot;file&quot; multiple accept=&quot;.txt,.pdf,.docx,.json&quot; style=&quot;background: white; color: black; padding: 5px; cursor: pointer;&quot; /&gt;
            
            &lt;h2&gt;2) Texto Bruto (Editável)&lt;/h2&gt;
            &lt;textarea id=&quot;raw&quot; placeholder=&quot;O texto importado aparecerá aqui. Você também pode colar diretamente...&quot;&gt;&lt;/textarea&gt;
            
            &lt;h2&gt;3) Configurações de Limpeza&lt;/h2&gt;
            &lt;div class=&quot;box&quot;&gt;
                &lt;div class=&quot;checks&quot;&gt;
                    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cleanSymbols&quot; checked&gt; Limpar formatação excessiva (markdown, etc)&lt;/label&gt;
                    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;removeOCRNoise&quot; checked&gt; Remover &quot;sopa de letrinhas&quot; (sujeira de OCR/Imagens)&lt;/label&gt;
                    &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;dedupeExact&quot;&gt; Remover parágrafos duplicados idênticos&lt;/label&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;h2&gt;4) Regras de Exclusão (O que jogar no Lixo)&lt;/h2&gt;
            &lt;div class=&quot;box&quot;&gt;
                &lt;label&gt;Excluir se contiver (1 palavra/frase por linha)&lt;/label&gt;
                &lt;textarea id=&quot;banWords&quot; placeholder=&quot;Ex.: Assinado digitalmente&amp;#10;Este documento é cópia&amp;#10;Tribunal de Justiça&quot;&gt;&lt;/textarea&gt;
                &lt;div class=&quot;row&quot; style=&quot;margin-top:10px&quot;&gt;
                    &lt;button class=&quot;b2&quot; id=&quot;btnClearRules&quot;&gt;Limpar Regras&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;btnrow&quot; style=&quot;margin-top: 20px;&quot;&gt;
                &lt;button class=&quot;b1&quot; id=&quot;btnRun&quot; style=&quot;padding: 15px; font-size: 14px;&quot;&gt;Filtrar Agora&lt;/button&gt;
                &lt;button class=&quot;b2&quot; id=&quot;btnClearAll&quot;&gt;Resetar Tudo&lt;/button&gt;
            &lt;/div&gt;

            &lt;h2&gt;Status do Processamento&lt;/h2&gt;
            &lt;div class=&quot;status&quot; id=&quot;status&quot;&gt;Aguardando arquivos...&lt;/div&gt;
            
            &lt;details&gt;
                &lt;summary&gt;Ver prévia dos Removidos&lt;/summary&gt;
                &lt;div id=&quot;removedBox&quot;&gt;&lt;/div&gt;
            &lt;/details&gt;
        &lt;/div&gt;

        &lt;div class=&quot;right&quot;&gt;
            &lt;div class=&quot;paper&quot;&gt;
                &lt;div style=&quot;display:flex; justify-content:space-between; align-items:center;&quot;&gt;
                    &lt;h3&gt;Resultado Filtrado&lt;/h3&gt;
                    &lt;button class=&quot;b-copy&quot; id=&quot;btnCopyText&quot; title=&quot;Copiar tudo&quot;&gt;📋 Copiar Texto&lt;/button&gt;
                &lt;/div&gt;
                
                &lt;div class=&quot;small&quot; style=&quot;margin-top: 5px;&quot;&gt;1. Baixe os arquivos para o seu computador:&lt;/div&gt;
                &lt;div class=&quot;btnrow-export&quot;&gt;
                    &lt;button class=&quot;b3&quot; id=&quot;btnExportWord&quot;&gt;⬇️ Baixar Word&lt;/button&gt;
                    &lt;button class=&quot;b3&quot; id=&quot;btnExportTxt&quot;&gt;⬇️ Baixar TXT&lt;/button&gt;
                    &lt;button class=&quot;b2&quot; id=&quot;btnExportLixo&quot;&gt;🗑️ Baixar Lixo (Excluídos)&lt;/button&gt;
                &lt;/div&gt;

                &lt;div class=&quot;small&quot; style=&quot;margin-top: 15px;&quot;&gt;2. Faça o backup seguro na nuvem (Arraste os arquivos baixados para lá):&lt;/div&gt;
                &lt;div class=&quot;btnrow-export&quot;&gt;
                    &lt;button class=&quot;b-gmail&quot; onclick=&quot;window.open('https://mail.google.com/mail/u/0/?view=cm&amp;fs=1', '_blank')&quot;&gt;✉️ Rascunho Gmail&lt;/button&gt;
                    &lt;button class=&quot;b-drive&quot; onclick=&quot;window.open('https://drive.google.com/', '_blank')&quot;&gt;☁️ Abrir Drive&lt;/button&gt;
                &lt;/div&gt;

                &lt;hr style=&quot;margin:15px 0; border:0; border-top:1px solid #ddd;&quot; /&gt;
                &lt;div id=&quot;out&quot; class=&quot;out&quot;&gt;[O texto filtrado aparecerá aqui, mantendo a numeração das páginas]&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // ========== AUTOSAVE SYSTEM ==========
        const STORAGE_KEY = &quot;mike_filtrador_data&quot;;
        window.dadosRemovidosGlobal = []; // Armazena o lixo globalmente

        function saveState() {
            const data = {
                raw: document.getElementById(&quot;raw&quot;).value,
                banWords: document.getElementById(&quot;banWords&quot;).value,
                cleanSymbols: document.getElementById(&quot;cleanSymbols&quot;).checked,
                removeOCRNoise: document.getElementById(&quot;removeOCRNoise&quot;).checked,
                dedupeExact: document.getElementById(&quot;dedupeExact&quot;).checked,
                outText: document.getElementById(&quot;out&quot;).textContent,
                statusMsg: document.getElementById(&quot;status&quot;).textContent,
                lixo: window.dadosRemovidosGlobal
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            
            // Pisca o &quot;Salvo&quot;
            const badge = document.getElementById(&quot;autosaveBadge&quot;);
            badge.style.display = &quot;inline&quot;;
            setTimeout(() =&gt; { badge.style.display = &quot;none&quot;; }, 1500);
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if(data.raw) document.getElementById(&quot;raw&quot;).value = data.raw;
                    if(data.banWords) document.getElementById(&quot;banWords&quot;).value = data.banWords;
                    if(data.outText) document.getElementById(&quot;out&quot;).textContent = data.outText;
                    if(data.statusMsg) document.getElementById(&quot;status&quot;).textContent = data.statusMsg;
                    
                    document.getElementById(&quot;cleanSymbols&quot;).checked = data.cleanSymbols !== false;
                    document.getElementById(&quot;removeOCRNoise&quot;).checked = data.removeOCRNoise !== false;
                    document.getElementById(&quot;dedupeExact&quot;).checked = data.dedupeExact === true;
                    
                    if(data.lixo) {
                        window.dadosRemovidosGlobal = data.lixo;
                        renderRemovedSample(data.lixo);
                    }
                }
            } catch (e) {
                console.error(&quot;Erro ao carregar Autosave&quot;, e);
            }
        }

        // Detecta digitação para salvar automaticamente
        ['raw', 'banWords'].forEach(id =&gt; {
            document.getElementById(id).addEventListener('input', saveState);
        });
        ['cleanSymbols', 'removeOCRNoise', 'dedupeExact'].forEach(id =&gt; {
            document.getElementById(id).addEventListener('change', saveState);
        });

        // ========== UI Helpers ==========
        function setStatus(s) { 
            document.getElementById(&quot;status&quot;).textContent = s; 
            saveState();
        }
        function ov(on, msg, sub) {
            const o = document.getElementById(&quot;ov&quot;);
            o.style.display = on ? &quot;flex&quot; : &quot;none&quot;;
            if (msg) document.getElementById(&quot;ovMsg&quot;).textContent = msg;
            if (sub) document.getElementById(&quot;ovSub&quot;).textContent = sub;
        }
        function download(filename, text, mime = &quot;text/plain&quot;) {
            const blob = new Blob([text], { type: mime });
            const a = document.createElement(&quot;a&quot;);
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            setTimeout(() =&gt; URL.revokeObjectURL(a.href), 2000);
        }

        function renderRemovedSample(removedArray) {
            const rb = document.getElementById(&quot;removedBox&quot;);
            rb.innerHTML = &quot;&quot;;
            if(!removedArray || removedArray.length === 0) return;
            
            const sample = removedArray.slice(0, 50);
            for (let i = 0; i &lt; sample.length; i++) {
                const r = sample[i];
                const div = document.createElement(&quot;div&quot;);
                div.className = &quot;removedItem&quot;;
                div.innerHTML = `&lt;b&gt;${i+1}. ${r.motivo}&lt;/b&gt;&lt;br&gt;${r.texto}`;
                rb.appendChild(div);
            }
            if (removedArray.length &gt; sample.length) {
                const more = document.createElement(&quot;div&quot;);
                more.className = &quot;small&quot;;
                more.style.marginTop = &quot;10px&quot;;
                more.textContent = `… (Total: ${removedArray.length} itens removidos. Baixe o Lixo para ver todos)`;
                rb.appendChild(more);
            }
        }

        // ========== Extratores de Texto ==========
        async function extractTextFromPDF(file) {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            let full = &quot;&quot;;
            for (let i = 1; i &lt;= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                full += `\n\n--- PÁGINA ${i} ---\n\n`;
                let lastY = -1;
                for (const item of content.items) {
                    if (lastY !== -1 &amp;&amp; Math.abs(item.transform[5] - lastY) &gt; 5) {
                        full += &quot;\n&quot;; 
                    }
                    full += item.str + &quot; &quot;;
                    lastY = item.transform[5];
                }
            }
            return full;
        }

        async function extractTextFromDOCX(file) {
            const buf = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: buf });
            return res.value || &quot;&quot;;
        }

        // ========== Lógica de Corte Cirúrgico ==========
        function splitParagraphs(t) {
            return (t || &quot;&quot;).split(/\n+/).map(p =&gt; p.trim()).filter(Boolean);
        }

        function isOcrNoise(text) {
            const cleaned = text.replace(/\s/g, '');
            if (cleaned.length &lt; 5) return false;
            const specialChars = (cleaned.match(/[^a-zA-Z0-9À-ÿ]/g) || []).length;
            if (specialChars / cleaned.length &gt; 0.4) return true;
            return false;
        }

        function filterText(rawText, cfg) {
            const removed = [];
            let text = rawText || &quot;&quot;;
            
            if (cfg.cleanSymbols) {
                text = text.replace(/[#~_]{2,}/g, &quot; &quot;).replace(/[“”]/g, '&quot;').replace(/[’]/g, &quot;'&quot;);
            }

            const pars = splitParagraphs(text);
            const exatos = new Set();
            const out = [];

            for (const p of pars) {
                if (p.startsWith(&quot;--- PÁGINA&quot;) &amp;&amp; p.endsWith(&quot;---&quot;)) {
                    out.push(`\n${p}\n`);
                    continue;
                }
                if (cfg.removeOCRNoise &amp;&amp; isOcrNoise(p)) {
                    removed.push({ motivo: &quot;Sujeira de OCR/Imagem&quot;, texto: p });
                    continue;
                }
                if (cfg.dedupeExact) {
                    const norm = p.toLowerCase().replace(/\s+/g, &quot;&quot;);
                    if (exatos.has(norm) &amp;&amp; norm.length &gt; 15) {
                        removed.push({ motivo: &quot;Duplicata Exata&quot;, texto: p });
                        continue;
                    }
                    exatos.add(norm);
                }
                let drop = false;
                let razaoDrop = &quot;&quot;;
                const lowP = p.toLowerCase();
                for (const w of cfg.banWords) {
                    if (w &amp;&amp; lowP.includes(w.toLowerCase())) {
                        drop = true;
                        razaoDrop = `Contém a palavra: &quot;${w}&quot;`;
                        break;
                    }
                }
                if (drop) {
                    removed.push({ motivo: razaoDrop, texto: p });
                    continue;
                }
                out.push(p);
            }

            window.dadosRemovidosGlobal = removed;

            return {
                outText: out.join(&quot;\n&quot;),
                removed: removed,
                stats: { total: pars.length, kept: out.length, removed: removed.length }
            };
        }

        // ========== Eventos de Botões ==========
        document.getElementById(&quot;btnRun&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            const raw = document.getElementById(&quot;raw&quot;).value;
            if (!raw.trim()) { alert(&quot;Cole o texto ou importe arquivos primeiro.&quot;); return; }
            
            const cfg = {
                cleanSymbols: document.getElementById(&quot;cleanSymbols&quot;).checked,
                removeOCRNoise: document.getElementById(&quot;removeOCRNoise&quot;).checked,
                dedupeExact: document.getElementById(&quot;dedupeExact&quot;).checked,
                banWords: (document.getElementById(&quot;banWords&quot;).value || &quot;&quot;).split(&quot;\n&quot;).map(s =&gt; s.trim()).filter(Boolean)
            };
            
            ov(true, &quot;Filtrando…&quot;, &quot;Analisando quebras de linha e regras.&quot;);
            setTimeout(() =&gt; {
                try {
                    const res = filterText(raw, cfg);
                    document.getElementById(&quot;out&quot;).textContent = res.outText || &quot;&quot;;
                    renderRemovedSample(res.removed);
                    setStatus(`Concluído. Linhas mantidas: ${res.stats.kept} | Linhas removidas: ${res.stats.removed}`);
                    saveState(); // Salva após o processamento
                } catch (e) {
                    console.error(e);
                    alert(&quot;Erro: &quot; + e.message);
                } finally {
                    ov(false);
                }
            }, 100);
        });

        // Exportação do Lixo
        document.getElementById(&quot;btnExportLixo&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            if (!window.dadosRemovidosGlobal || window.dadosRemovidosGlobal.length === 0) {
                alert(&quot;Nenhum lixo para exportar. Rode o filtro primeiro.&quot;);
                return;
            }
            let textoLixo = &quot;=== REGISTRO DE TEXTOS EXCLUÍDOS ===\n\n&quot;;
            window.dadosRemovidosGlobal.forEach(item =&gt; {
                textoLixo += `[Motivo do corte: ${item.motivo}]\nTEXTO: ${item.texto}\n\n`;
            });
            download(&quot;texto_excluido_lixo.txt&quot;, textoLixo, &quot;text/plain;charset=utf-8&quot;);
        });

        // Demais exportações
        document.getElementById(&quot;btnExportTxt&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            download(&quot;processo_limpo.txt&quot;, document.getElementById(&quot;out&quot;).textContent, &quot;text/plain;charset=utf-8&quot;);
        });
        document.getElementById(&quot;btnExportWord&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            const content = document.getElementById(&quot;out&quot;).textContent || &quot;&quot;;
            const paragraphs = content.split(/\n/);
            let htmlBody = &quot;&quot;;
            for (let p of paragraphs) {
                if (!p.trim()) continue;
                if (p.startsWith(&quot;--- PÁGINA&quot;)) {
                    htmlBody += `&lt;p style=&quot;margin-top:20pt; font-weight:bold; color:red; text-align:center;&quot;&gt;${p}&lt;/p&gt;`;
                } else {
                    htmlBody += `&lt;p style=&quot;margin-bottom:6pt; font-family:'Times New Roman', serif; font-size:12pt;&quot;&gt;${p}&lt;/p&gt;`;
                }
            }
            const htmlContent = `&lt;html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'&gt;&lt;head&gt;&lt;meta charset='utf-8'&gt;&lt;title&gt;Filtrado&lt;/title&gt;&lt;/head&gt;&lt;body&gt;${htmlBody}&lt;/body&gt;&lt;/html&gt;`;
            download(&quot;processo_limpo.doc&quot;, htmlContent, &quot;application/msword&quot;);
        });

        document.getElementById(&quot;btnCopyText&quot;).addEventListener(&quot;click&quot;, async () =&gt; {
            try {
                await navigator.clipboard.writeText(document.getElementById(&quot;out&quot;).textContent);
                const btn = document.getElementById(&quot;btnCopyText&quot;);
                btn.textContent = &quot;Copiado!&quot;;
                setTimeout(() =&gt; btn.textContent = &quot;📋 Copiar Texto&quot;, 2000);
            } catch (err) { alert(&quot;Erro ao copiar.&quot;); }
        });

        document.getElementById(&quot;btnClearRules&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            document.getElementById(&quot;banWords&quot;).value = &quot;&quot;;
            saveState();
        });

        document.getElementById(&quot;btnClearAll&quot;).addEventListener(&quot;click&quot;, () =&gt; {
            if (!confirm(&quot;Tem certeza que deseja apagar tudo?&quot;)) return;
            document.getElementById(&quot;raw&quot;).value = &quot;&quot;;
            document.getElementById(&quot;banWords&quot;).value = &quot;&quot;;
            document.getElementById(&quot;out&quot;).textContent = &quot;[O texto filtrado aparecerá aqui, mantendo a numeração das páginas]&quot;;
            document.getElementById(&quot;removedBox&quot;).innerHTML = &quot;&quot;;
            window.dadosRemovidosGlobal = [];
            setStatus(&quot;Aguardando arquivos...&quot;);
            localStorage.removeItem(STORAGE_KEY); // Limpa o autosave também
        });

        // Importação de Arquivos
        document.getElementById(&quot;files&quot;).addEventListener(&quot;change&quot;, async (e) =&gt; {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            ov(true, &quot;Lendo Arquivos…&quot;, &quot;Convertendo PDFs e documentos para texto.&quot;);
            try {
                let combined = document.getElementById(&quot;raw&quot;).value || &quot;&quot;;
                for (const f of files) {
                    const name = (f.name || &quot;&quot;).toLowerCase();
                    let text = &quot;&quot;;
                    if (name.endsWith(&quot;.txt&quot;)) text = await f.text();
                    else if (name.endsWith(&quot;.pdf&quot;)) text = await extractTextFromPDF(f);
                    else if (name.endsWith(&quot;.docx&quot;)) text = await extractTextFromDOCX(f);
                    else text = await f.text();
                    combined += (combined.trim() ? &quot;\n\n&quot; : &quot;&quot;) + `===============================\nARQUIVO: ${f.name}\n===============================\n\n` + text;
                }
                document.getElementById(&quot;raw&quot;).value = combined;
                setStatus(`Importação concluída: ${files.length} arquivo(s). Pronto para filtrar.`);
                saveState(); // Salva o texto novo importado
            } catch (err) {
                alert(&quot;Falha ao importar: &quot; + err.message);
            } finally {
                ov(false);
                e.target.value = &quot;&quot;;
            }
        });

        // Inicia o App carregando o que estava salvo
        window.onload = loadState;
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</div>

    }

    .upload-zone:hover, .upload-zone.dragover {
      background: #e8ebff;
      border-color: #764ba2;
      transform: scale(1.02);
    }

    body.dark .upload-zone:hover, body.dark .upload-zone.dragover {
      background: #1a2942;
      border-color: #7dd3c0;
    }

    .upload-icon {
      font-size: 4em;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .file-info {
      margin: 20px 0;
      padding: 15px;
      background: #e8ebff;
      border-radius: 10px;
      display: none;
    }

    body.dark .file-info {
      background: #1a2942;
    }

    .file-info.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .progress-container {
      margin: 20px 0;
      display: none;
    }

    .progress-container.show {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    body.dark .progress-bar {
      background: #1a2942;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 30px 0;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    body.dark .btn-secondary {
      background: #1a2942;
      color: #5eead4;
      border-color: #5eead4;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
      transform: translateY(-3px);
    }

    body.dark .btn-secondary:hover {
      background: #5eead4;
      color: #0f3460;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 400px;
      padding: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    body.dark textarea {
      background: #1a2942;
      color: #e8e8e8;
      border-color: #2d4a6f;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 10px;
    }

    body.dark .stats {
      background: #1a2942;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    body.dark .stat-value {
      color: #5eead4;
    }

    .stat-label {
      color: #666;
      font-size: 0.9em;
    }

    body.dark .stat-label {
      color: #a8a8a8;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 20px 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 1000;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .notification.show {
      display: block;
    }

    .notification.success {
      border-left: 5px solid #4caf50;
    }

    .notification.error {
      border-left: 5px solid #f44336;
    }

    input[type=&quot;file&quot;] {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 1.8em;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;button class=&quot;theme-toggle&quot; onclick=&quot;toggleTheme()&quot;&gt;🌙&lt;/button&gt;

  &lt;div class=&quot;container&quot;&gt;
    &lt;header&gt;
      &lt;h1&gt;📄 Extrator de Texto Pro&lt;/h1&gt;
      &lt;p class=&quot;subtitle&quot;&gt;Extraia texto de PDF, DOCX, imagens e TXT com facilidade&lt;/p&gt;
    &lt;/header&gt;

    &lt;div class=&quot;upload-zone&quot; id=&quot;uploadZone&quot;&gt;
      &lt;div class=&quot;upload-icon&quot;&gt;📁&lt;/div&gt;
      &lt;h3&gt;Arraste seu arquivo aqui&lt;/h3&gt;
      &lt;p&gt;ou clique para selecionar&lt;/p&gt;
      &lt;p style=&quot;margin-top: 10px; color: #999; font-size: 0.9em;&quot;&gt;
        Suporta: PDF, DOCX, TXT, PNG, JPG, JPEG
      &lt;/p&gt;
      &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.pdf,.txt,.png,.jpg,.jpeg,.docx&quot;&gt;
    &lt;/div&gt;

    &lt;div class=&quot;file-info&quot; id=&quot;fileInfo&quot;&gt;
      &lt;strong&gt;📎 Arquivo selecionado:&lt;/strong&gt; &lt;span id=&quot;fileName&quot;&gt;&lt;/span&gt;
      &lt;br&gt;
      &lt;strong&gt;📏 Tamanho:&lt;/strong&gt; &lt;span id=&quot;fileSize&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
      &lt;div class=&quot;progress-bar&quot;&gt;
        &lt;div class=&quot;progress-fill&quot; id=&quot;progressFill&quot;&gt;0%&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;buttons&quot;&gt;
      &lt;button class=&quot;btn-primary&quot; onclick=&quot;extractText()&quot;&gt;🔍 Extrair Texto&lt;/button&gt;
      &lt;button class=&quot;btn-secondary&quot; onclick=&quot;downloadText()&quot;&gt;💾 Baixar TXT&lt;/button&gt;
      &lt;button class=&quot;btn-secondary&quot; onclick=&quot;downloadPDF()&quot;&gt;📕 Baixar PDF&lt;/button&gt;
      &lt;button class=&quot;btn-secondary&quot; onclick=&quot;downloadDOCX()&quot;&gt;📘 Baixar DOCX&lt;/button&gt;
      &lt;button class=&quot;btn-secondary&quot; onclick=&quot;downloadMarkdown()&quot;&gt;📝 Baixar MD&lt;/button&gt;
      &lt;button class=&quot;btn-secondary&quot; onclick=&quot;copyText()&quot;&gt;📋 Copiar&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;stats&quot;&gt;
      &lt;div class=&quot;stat-item&quot;&gt;
        &lt;div class=&quot;stat-value&quot; id=&quot;charCount&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;stat-label&quot;&gt;Caracteres&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stat-item&quot;&gt;
        &lt;div class=&quot;stat-value&quot; id=&quot;wordCount&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;stat-label&quot;&gt;Palavras&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stat-item&quot;&gt;
        &lt;div class=&quot;stat-value&quot; id=&quot;lineCount&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;stat-label&quot;&gt;Linhas&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;📝 Texto Extraído:&lt;/h3&gt;
    &lt;textarea id=&quot;output&quot; placeholder=&quot;O texto extraído aparecerá aqui...&quot;&gt;&lt;/textarea&gt;
  &lt;/div&gt;

  &lt;div class=&quot;notification&quot; id=&quot;notification&quot;&gt;&lt;/div&gt;

  &lt;!-- Bibliotecas --&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.36.0/docxtemplater.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js&quot;&gt;&lt;/script&gt;

  &lt;script&gt;
    let extractedText = &quot;&quot;;
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    // Tema
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // Carregar tema salvo
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.querySelector('.theme-toggle').textContent = '☀️';
    }

    // Notificação
    function showNotification(message, type = 'success') {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.className = `notification ${type} show`;
      setTimeout(() =&gt; notif.classList.remove('show'), 3000);
    }

    // Atualizar estatísticas
    function updateStats(text) {
      document.getElementById('charCount').textContent = text.length.toLocaleString();
      document.getElementById('wordCount').textContent = text.trim().split(/\s+/).filter(w =&gt; w).length.toLocaleString();
      document.getElementById('lineCount').textContent = text.split('\n').length.toLocaleString();
    }

    // Drag &amp; Drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName =&gt; {
      uploadZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName =&gt; {
      uploadZone.addEventListener(eventName, () =&gt; uploadZone.classList.add('dragover'));
    });

    ['dragleave', 'drop'].forEach(eventName =&gt; {
      uploadZone.addEventListener(eventName, () =&gt; uploadZone.classList.remove('dragover'));
    });

    uploadZone.addEventListener('drop', (e) =&gt; {
      const files = e.dataTransfer.files;
      if (files.length) {
        fileInput.files = files;
        handleFileSelect(files[0]);
      }
    });

    uploadZone.addEventListener('click', () =&gt; fileInput.click());

    fileInput.addEventListener('change', (e) =&gt; {
      if (e.target.files.length) {
        handleFileSelect(e.target.files[0]);
      }
    });

    function handleFileSelect(file) {
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatFileSize(file.size);
      document.getElementById('fileInfo').classList.add('show');
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Barra de progresso
    function showProgress() {
      const container = document.getElementById('progressContainer');
      const fill = document.getElementById('progressFill');
      container.classList.add('show');
      fill.style.width = '0%';
      fill.textContent = '0%';
      
      let progress = 0;
      const interval = setInterval(() =&gt; {
        progress += Math.random() * 15;
        if (progress &gt; 90) progress = 90;
        fill.style.width = progress + '%';
        fill.textContent = Math.round(progress) + '%';
      }, 200);

      return () =&gt; {
        clearInterval(interval);
        fill.style.width = '100%';
        fill.textContent = '100%';
        setTimeout(() =&gt; container.classList.remove('show'), 1000);
      };
    }

    // Limpar rodapés
    function cleanFooter(text) {
      const patterns = [
        /Num\.\s*\d+\s*-\s*Pág\.\s*\d+[\s\S]*?Número do documento:\s*\d+[^\n]*\n?/gi,
        /Assinado digitalmente por:[\s\S]*?Número do documento:[^\n]*\n?/gi,
        /Documento eletrônico assinado[\s\S]*?Número do documento:[^\n]*\n?/gi
      ];
      let cleaned = text;
      patterns.forEach(p =&gt; cleaned = cleaned.replace(p, &quot;&quot;));
      return cleaned;
    }

    // Autosave
    window.onload = function() {
      const saved = localStorage.getItem(&quot;autosaveText&quot;);
      if (saved) {
        extractedText = saved;
        output.value = saved;
        updateStats(saved);
      }
    };

    output.addEventListener('input', () =&gt; {
      extractedText = output.value;
      localStorage.setItem(&quot;autosaveText&quot;, extractedText);
      updateStats(extractedText);
    });

    // Extração de texto
    async function extractText() {
      const file = fileInput.files[0];
      if (!file) {
        showNotification(&quot;Selecione um arquivo primeiro!&quot;, &quot;error&quot;);
        return;
      }

      const completeProgress = showProgress();
      output.value = &quot;⏳ Processando... Aguarde.&quot;;

      try {
        if (file.type === &quot;text/plain&quot;) {
          const text = await file.text();
          extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo TXT ---\n\n`;

        } else if (file.type === &quot;application/pdf&quot;) {
          extractedText = await extractFromPDF(file);

        } else if (file.type.startsWith(&quot;image/&quot;)) {
          extractedText = await extractFromImage(file);

        } else if (file.name.endsWith(&quot;.docx&quot;)) {
          extractedText = await extractFromDOCX(file);

        } else {
          throw new Error(&quot;Formato não suportado&quot;);
        }

        output.value = extractedText;
        localStorage.setItem(&quot;autosaveText&quot;, extractedText);
        updateStats(extractedText);
        completeProgress();
        showNotification(&quot;✅ Texto extraído com sucesso!&quot;);

      } catch (error) {
        completeProgress();
        output.value = &quot;❌ Erro ao extrair texto. Tente novamente.&quot;;
        showNotification(&quot;Erro: &quot; + error.message, &quot;error&quot;);
      }
    }

    async function extractFromPDF(file) {
      return new Promise((resolve) =&gt; {
        const reader = new FileReader();
        reader.onload = async function() {
          const typedArray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedArray).promise;
          let textContent = &quot;&quot;;

          for (let i = 1; i &lt;= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const text = await page.getTextContent();

            if (text.items.length &gt; 0) {
              text.items.forEach(item =&gt; textContent += item.str + &quot; &quot;);
            } else {
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement(&quot;canvas&quot;);
              const context = canvas.getContext(&quot;2d&quot;);
              canvas.height = viewport.height;
              canvas.width = viewport.width;

              await page.render({ canvasContext: context, viewport: viewport }).promise;
              const { data: { text: ocrText } } = await Tesseract.recognize(canvas, 'por');
              textContent += ocrText + &quot; &quot;;
            }

            textContent += `\n\n--- Página ${i} ---\n\n`;
          }

          resolve(cleanFooter(textContent));
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractFromImage(file) {
      return new Promise((resolve) =&gt; {
        const reader = new FileReader();
        reader.onload = async function() {
          const { data: { text } } = await Tesseract.recognize(reader.result, 'por');
          resolve(cleanFooter(text) + `\n\n--- Fim da imagem ---\n\n`);
        };
        reader.readAsDataURL(file);
      });
    }

    async function extractFromDOCX(file) {
      return new Promise((resolve) =&gt; {
        const reader = new FileReader();
        reader.onload = async function() {
          const zip = new JSZip(reader.result);
          const doc = new window.Docxtemplater().loadZip(zip);
          const text = doc.getFullText();
          resolve(cleanFooter(text) + `\n\n--- Fim do arquivo DOCX ---\n\n`);
        };
        reader.readAsBinaryString(file);
      });
    }

    function downloadText() {
      if (!extractedText) {
        showNotification(&quot;Nenhum texto extraído ainda!&quot;, &quot;error&quot;);
        return;
      }
      const blob = new Blob([extractedText], { type: &quot;text/plain&quot; });
      downloadFile(blob, &quot;texto_extraido.txt&quot;);
      showNotification(&quot;📥 Arquivo TXT baixado!&quot;);
    }

    function downloadPDF() {
      if (!extractedText) {
        showNotification(&quot;Nenhum texto extraído ainda!&quot;, &quot;error&quot;);
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(12);
      const lines = doc.splitTextToSize(extractedText, 180);
      doc.text(lines, 10, 10);
      doc.save(&quot;texto_extraido.pdf&quot;);
      showNotification(&quot;📥 Arquivo PDF baixado!&quot;);
    }

    function downloadDOCX() {
      if (!extractedText) {
        showNotification(&quot;Nenhum texto extraído ainda!&quot;, &quot;error&quot;);
        return;
      }
      const blob = new Blob(
        [`&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot; standalone=&quot;yes&quot;?&gt;
        &lt;w:document xmlns:w=&quot;http://schemas.openxmlformats.org/wordprocessingml/2006/main&quot;&gt;
          &lt;w:body&gt;
            &lt;w:p&gt;&lt;w:r&gt;&lt;w:t&gt;${extractedText.replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;).replace(/&gt;/g,&quot;&amp;gt;&quot;)}&lt;/w:t&gt;&lt;/w:r&gt;&lt;/w:p&gt;
          &lt;/w:body&gt;
        &lt;/w:document&gt;`],
        { type: &quot;application/vnd.openxmlformats-officedocument.wordprocessingml.document&quot; }
      );
      downloadFile(blob, &quot;texto_extraido.docx&quot;);
      showNotification(&quot;📥 Arquivo DOCX baixado!&quot;);
    }

    function downloadMarkdown() {
      if (!extractedText) {
        showNotification(&quot;Nenhum texto extraído ainda!&quot;, &quot;error&quot;);
        return;
      }
      const mdText = extractedText.replace(/--- Página (\d+) ---/g, &quot;### Página $1&quot;);
      const blob = new Blob([mdText], { type: &quot;text/markdown&quot; });
      downloadFile(blob, &quot;texto_extraido.md&quot;);
      showNotification(&quot;📥 Arquivo Markdown baixado!&quot;);
    }

    function downloadFile(blob, filename) {
      const link = document.createElement(&quot;a&quot;);
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function copyText() {
      if (!extractedText) {
        showNotification(&quot;Nenhum texto extraído ainda!&quot;, &quot;error&quot;);
        return;
      }
      navigator.clipboard.writeText(extractedText).then(() =&gt; {
        showNotification(&quot;📋 Texto copiado!&quot;);
      });
    }
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
</div>


<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
</body>
</html>
