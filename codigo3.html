//  CHAT DE REFINAMENTO
// ══════════════════════════════════════════════════════
function toggleChat() {
  const a = document.getElementById('chat-area');
  const ar = document.getElementById('chat-arrow');
  a.classList.toggle('hidden');
  ar.textContent = a.classList.contains('hidden') ? '▼' : '▲';
}
async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();
  const kr = getChaveResumo();
  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length &gt; resultado.length * 0.5 &amp;&amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}
document.getElementById('chat-input')?.addEventListener('keydown', e =&gt; {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
function renderChat() {
  const container = document.getElementById('chat-msgs');
  container.innerHTML = '';
  chatHistory.filter(m =&gt; m.role !== 'system').forEach(m =&gt; {
    const div = document.createElement('div');
    div.className = m.role === 'user' ? 'msg-user' : 'msg-ia';
    const role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = m.role === 'user' ? 'Você' : 'IA';
    div.appendChild(role);
    div.appendChild(document.createTextNode(m.content));
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function carregarEditor() {
  const conteudoSalvo = loadLS('aj_editor_content', '');
  if (conteudoSalvo) document.getElementById('editor-content').innerHTML = conteudoSalvo;
  
  const fmt = loadLS('aj_formatacao', formatacaoAtual);
  formatacaoAtual = { ...formatacaoAtual, ...fmt };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  aplicarFormatacao();
}

function salvarEditorAuto() {
  const conteudo = document.getElementById('editor-content').innerHTML;
  saveLS('aj_editor_content', conteudo);
}

function aplicarFormatacao() {
  formatacaoAtual.fonte = document.getElementById('ed-fonte').value;
  formatacaoAtual.tamanho = parseInt(document.getElementById('ed-tamanho').value);
  formatacaoAtual.recuo = parseFloat(document.getElementById('ed-recuo').value);
  formatacaoAtual.espacamento = parseFloat(document.getElementById('ed-espacamento').value);
  
  const editor = document.getElementById('editor-content');
  editor.style.fontFamily = formatacaoAtual.fonte;
  editor.style.fontSize = formatacaoAtual.tamanho + 'pt';
  editor.style.lineHeight = formatacaoAtual.espacamento;
  editor.style.textIndent = formatacaoAtual.recuo + 'cm';
  editor.style.textAlign = formatacaoAtual.alinhamento;
  
  saveLS('aj_formatacao', formatacaoAtual);
}

function toggleFormatacao(tipo) {
  formatacaoAtual[tipo] = !formatacaoAtual[tipo];
  document.getElementById(`fmt-${tipo}`).classList.toggle('ativo', formatacaoAtual[tipo]);
  
  const editor = document.getElementById('editor-content');
  if (tipo === 'bold') editor.style.fontWeight = formatacaoAtual.bold ? 'bold' : 'normal';
  if (tipo === 'italic') editor.style.fontStyle = formatacaoAtual.italic ? 'italic' : 'normal';
  if (tipo === 'underline') editor.style.textDecoration = formatacaoAtual.underline ? 'underline' : 'none';
  
  saveLS('aj_formatacao', formatacaoAtual);
}

function setAlinhamento(align) {
  formatacaoAtual.alinhamento = align;
  ['left','center','right','justify'].forEach(a =&gt; {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === align);
  });
  document.getElementById('editor-content').style.textAlign = align;
  saveLS('aj_formatacao', formatacaoAtual);
}

function limparEditor() {
  if (!confirm('Limpar todo o conteúdo do editor?')) return;
  document.getElementById('editor-content').innerHTML = '&lt;p&gt;Digite ou cole seu texto aqui para formatar...&lt;/p&gt;';
  salvarEditorAuto();
}

function enviarParaEditor() {
  if (!resultado) return;
  document.getElementById('editor-content').innerHTML = resultado.split('\n\n').map(p =&gt; `&lt;p&gt;${p}&lt;/p&gt;`).join('');
  salvarEditorAuto();
  mudarAba('editor', document.querySelectorAll('.tab-btn')[1]);
}

async function gerarPecaDoEditor() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  document.getElementById('txt-processo').value = conteudo;
  mudarAba('processar', document.querySelector('.tab-btn'));
  await executar('modo-redacao');
}

function baixarEditorWord() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo || !window.docx) { alert('Editor vazio ou biblioteca não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType } = docx;
  const paragrafos = conteudo.split(/\n{2,}/).map(t =&gt; {
    if (!t.trim()) return null;
    return new Paragraph({
      children: [new TextRun(t.trim())],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: formatacaoAtual.recuo * 567 },
      spacing: { line: formatacaoAtual.espacamento * 240 }
    });
  }).filter(Boolean);

  const doc = new Document({ sections: [{ properties: {}, children: paragrafos }] });
  docx.Packer.toBlob(doc).then(blob =&gt; saveAs(blob, `editor-${Date.now()}.docx`));
}

function baixarEditorMarkdown() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/markdown' }));
  a.download = `editor-${Date.now()}.md`;
  a.click();
}

function abrirFormTemplate(id) {
  editTemplateId = id || null;
  const modal = document.getElementById('modal-template');
  const titulo = document.getElementById('modal-template-titulo');
  
  if (id) {
    const tpl = templates.find(t =&gt; t.id === id);
    document.getElementById('tpl-nome').value = tpl.nome;
    document.getElementById('tpl-desc').value = tpl.descricao || '';
    titulo.textContent = 'Editar Template';
  } else {
    document.getElementById('tpl-nome').value = '';
    document.getElementById('tpl-desc').value = '';
    titulo.textContent = 'Novo Template';
  }
  
  modal.classList.add('aberto');
}

function fecharModalTemplate() {
  document.getElementById('modal-template').classList.remove('aberto');
  editTemplateId = null;
}

function confirmarSalvarTemplate() {
  const nome = document.getElementById('tpl-nome').value.trim();
  if (!nome) { alert('Digite um nome para o template.'); return; }
  
  const desc = document.getElementById('tpl-desc').value.trim();
  const config = { ...formatacaoAtual };
  
  if (editTemplateId) {
    templates = templates.map(t =&gt; t.id === editTemplateId ? { ...t, nome, descricao: desc, config } : t);
  } else {
    templates.push({
      id: Date.now().toString(),
      nome,
      descricao: desc,
      config,
      criadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  
  saveLS('aj_templates', templates);
  fecharModalTemplate();
  renderTemplates();
}

function deletarTemplate(id) {
  if (!confirm('Remover este template?')) return;
  templates = templates.filter(t =&gt; t.id !== id);
  if (templateAtivo === id) {
    templateAtivo = null;
    saveLS('aj_template_ativo', null);
  }
  saveLS('aj_templates', templates);
  renderTemplates();
}

function ativarTemplate(id) {
  templateAtivo = id;
  saveLS('aj_template_ativo', id);
  renderTemplates();
}

function aplicarTemplateAtivo() {
  if (!templateAtivo) { alert('Selecione um template primeiro.'); return; }
  const tpl = templates.find(t =&gt; t.id === templateAtivo);
  if (!tpl) return;
  
  formatacaoAtual = { ...tpl.config };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  ['bold','italic','underline'].forEach(t =&gt; {
    document.getElementById(`fmt-${t}`).classList.toggle('ativo', formatacaoAtual[t]);
  });
  
  ['left','center','right','justify'].forEach(a =&gt; {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === formatacaoAtual.alinhamento);
  });
  
  aplicarFormatacao();
  alert(`Template &quot;${tpl.nome}&quot; aplicado!`);
}

function renderTemplates() {
  const lista = document.getElementById('lista-templates');
  lista.innerHTML = '';
  
  document.getElementById('tab-templates-btn').textContent =

      &lt;/div&gt;
      &lt;button class=&quot;btn btn-purple&quot; style=&quot;margin-top:8px&quot; onclick=&quot;aplicarTemplate('${tpl.id}')&quot;&gt;▶ Aplicar&lt;/button&gt;`;

//  FUNÇÕES DE FILTROS

function carregarFiltros() {
  const filtrosSalvos = loadLS('aj_filtros', {});
  
  if (filtrosSalvos.regexManter) document.getElementById('regex-manter').value = filtrosSalvos.regexManter.join('\n');
  if (filtrosSalvos.regexExcluir) document.getElementById('regex-excluir').value = filtrosSalvos.regexExcluir.join('\n');
  if (filtrosSalvos.termosManter) document.getElementById('termos-manter').value = filtrosSalvos.termosManter.join(', ');
  if (filtrosSalvos.termosExcluir) document.getElementById('termos-excluir').value = filtrosSalvos.termosExcluir.join(', ');
  
  document.getElementById('filtro-ocr').checked = filtrosSalvos.limparOCR !== false;
  document.getElementById('filtro-markdown').checked = filtrosSalvos.limparMarkdown !== false;
  document.getElementById('filtro-certificados').checked = filtrosSalvos.limparCertificados !== false;
}

function salvarFiltros() {
  const regexManter = document.getElementById('regex-manter').value.split('\n').filter(Boolean);
  const regexExcluir = document.getElementById('regex-excluir').value.split('\n').filter(Boolean);
  const termosManter = document.getElementById('termos-manter').value.split(',').map(t =&gt; t.trim()).filter(Boolean);
  const termosExcluir = document.getElementById('termos-excluir').value.split(',').map(t =&gt; t.trim()).filter(Boolean);
  
  const filtros = {
    regexManter,
    regexExcluir,
    termosManter,
    termosExcluir,
    limparOCR: document.getElementById('filtro-ocr').checked,
    limparMarkdown: document.getElementById('filtro-markdown').checked,
    limparCertificados: document.getElementById('filtro-certificados').checked
  };
  
  saveLS('aj_filtros', filtros);
  filtrosAtivos = filtros;
}

function adicionarRegexPreset(tipo, preset) {
  const presets = {
    manter: {
      ementa: '^EMENTA.*|^Ementa.*',
      acordao: '^ACÓRDÃO.*|^Acórdão.*',
      sentenca: '^SENTENÇA.*|^Sentença.*|^DECISÃO.*'
    },
    excluir: {
      pagina: '^Página \\d+.*|^Pág\\. \\d+.*|^\\d+/\\d+$',
      certificado: '.*[Cc]ertificado [Dd]igital.*|.*[Aa]ssinado eletronicamente.*|.*[Aa]ssinatura [Ee]letrônica.*',
      cabecalho: '^PODER JUDICIÁRIO.*|^TRIBUNAL.*|^JUSTIÇA.*'
    }
  };
  
  const campo = tipo === 'manter' ? 'regex-manter' : 'regex-excluir';
  const textarea = document.getElementById(campo);
  const valor = textarea.value.trim();
  const novoValor = valor ? valor + '\n' + presets[tipo][preset] : presets[tipo][preset];
  textarea.value = novoValor;
  salvarFiltros();
}

function limparTexto(texto) {
  let resultado = texto;
  
  // Limpar OCR
  if (filtrosAtivos.limparOCR) {
    // Remover caracteres estranhos comuns em OCR
    resultado = resultado.replace(/[�]/g, '');
    resultado = resultado.replace(/\s{3,}/g, ' ');
    resultado = resultado.replace(/\n{4,}/g, '\n\n\n');
    resultado = resultado.replace(/[^\S\n]{2,}/g, ' ');
  }
  
  // Limpar Markdown
  if (filtrosAtivos.limparMarkdown) {
    resultado = resultado.replace(/^#{1,6}\s+/gm, '');
    resultado = resultado.replace(/\*\*(.+?)\*\*/g, '$1');
    resultado = resultado.replace(/__(.+?)__/g, '$1');
    resultado = resultado.replace(/\*(.+?)\*/g, '$1');
    resultado = resultado.replace(/_(.+?)_/g, '$1');
    resultado = resultado.replace(/~~(.+?)~~/g, '$1');
    resultado = resultado.replace(/`(.+?)`/g, '$1');
  }
  
  // Limpar certificados
  if (filtrosAtivos.limparCertificados) {
    const linhas = resultado.split('\n');
    resultado = linhas.filter(linha =&gt; {
      const l = linha.toLowerCase();
      return !l.includes('certificado digital') &amp;&amp;
             !l.includes('assinado eletronicamente') &amp;&amp;
             !l.includes('assinatura eletrônica') &amp;&amp;
             !l.includes('documento assinado digitalmente') &amp;&amp;
             !/^[A-F0-9]{32,}$/.test(linha.trim());
    }).join('\n');
  }
  
  return resultado;
}

function aplicarFiltros() {
  salvarFiltros();
  
  const textoProcesso = document.getElementById('txt-processo').value.trim();
  if (!textoProcesso) {
    alert('Cole um texto na aba Processar primeiro.');
    return;
  }
  
  textoOriginal = textoProcesso;
  let texto = limparTexto(textoOriginal);
  
  const linhas = texto.split('\n');
  let linhasMantidas = [...linhas];
  let linhasExcluidas = [];
  
  // Aplicar filtros de regex para manter
  if (filtrosAtivos.regexManter &amp;&amp; filtrosAtivos.regexManter.length &gt; 0) {
    const regexs = filtrosAtivos.regexManter.map(r =&gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&gt; {
        const mantida = regexs.some(regex =&gt; regex.test(linha));
        if (mantida) novasLinhasMantidas.push(linha);
        else linhasExcluidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros de regex para excluir
  if (filtrosAtivos.regexExcluir &amp;&amp; filtrosAtivos.regexExcluir.length &gt; 0) {
    const regexs = filtrosAtivos.regexExcluir.map(r =&gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&gt; {
        const excluida = regexs.some(regex =&gt; regex.test(linha));
        if (excluida) linhasExcluidas.push(linha);
        else novasLinhasMantidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros por termo para manter
  if (filtrosAtivos.termosManter &amp;&amp; filtrosAtivos.termosManter.length &gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&gt; {
      const mantido = filtrosAtivos.termosManter.some(termo =&gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (mantido) paragrafosMantidos.push(p);
      else paragrafosExcluidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  // Aplicar filtros por termo para excluir
  if (filtrosAtivos.termosExcluir &amp;&amp; filtrosAtivos.termosExcluir.length &gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&gt; {
      const excluido = filtrosAtivos.termosExcluir.some(termo =&gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (excluido) paragrafosExcluidos.push(p);
      else paragrafosMantidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  textoFiltrado = linhasMantidas.join('\n').trim();
  textoExcluido = linhasExcluidas.join('\n').trim();
  
  // Atualizar estatísticas
  atualizarEstatisticas();
  
  // Mostrar resultado
  verTextoMantido();
}

function atualizarEstatisticas() {
  const lenOriginal = textoOriginal.length;
  const lenMantido = textoFiltrado.length;
  const lenExcluido = textoExcluido.length;
  const reducao = lenOriginal &gt; 0 ? Math.round((lenExcluido / lenOriginal) * 100) : 0;
  
  document.getElementById('stat-original').textContent = lenOriginal.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-mantido').textContent = lenMantido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-excluido').textContent = lenExcluido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-reducao').textContent = reducao + '%';
}

function verTextoMantido() {
  const preview = document.getElementById('preview-filtros');
  if (!textoFiltrado) {
    preview.innerHTML = '&lt;div class=&quot;text-muted fs11&quot; style=&quot;text-align:center;padding:40px&quot;&gt;Nenhum texto filtrado ainda.&lt;/div&gt;';

  preview.innerHTML = '';
  const pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-family:monospace;font-size:11px;line-height:1.6;margin:0';
  pre.textContent = textoFiltrado;
  preview.appendChild(pre);
}

  const preview = document.getElementById('preview-filtros');
  if (!textoExcluido) {
    preview.innerHTML = '&lt;div class=&quot;text-muted fs11&quot; style=&quot;text-align:center;padding:40px&quot;&gt;Nenhum texto excluído.&lt;/div&gt;';
    return;
  }
  preview.innerHTML = '';
  const pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-family:monospace;font-size:11px;line-height:1.6;margin:0;color:var(--red);opacity:0.7';
  pre.textContent = textoExcluido;
  preview.appendChild(pre);
}

function exportarFiltrado() {
  if (!textoFiltrado) { alert('Aplique os filtros primeiro.'); return; }

async function extrairTrechosRelevantes(ementa, contexto) {
  const kr = getChaveResumo();

  try {

CONTEXTO:
${contexto.substring(0, 500)}

      { role: 'user', content: prompt }

//  MELHORIAS NO OCR
// ══════════════════════════════════════════════════════
const importarImagemOriginal = window.importarImagem;
window.importarImagem = async function(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  
  try {
    // Criar preview
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise(resolve =&gt; img.onload = resolve);
    
    // Pré-processar imagem para melhor OCR
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    
    // Aplicar filtros para melhorar OCR
    ctx.filter = 'contrast(1.2) brightness(1.1)';
    ctx.drawImage(img, 0, 0);
    
    // Converter para blob
    const blob = await new Promise(resolve =&gt; canvas.toBlob(resolve, 'image/png'));
    
    // OCR com configurações otimizadas
    const worker = await Tesseract.createWorker('por', 1, {
      logger: m =&gt; {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          atualizarResultado(`⏳ Processando OCR... ${pct}%`);
        }
      }
    });
    
    await worker.setParameters({
      tessedit_pageseg_mode: Tesseract.PSM.AUTO,
      preserve_interword_spaces: '1',
    });
    
    const { data: { text, confidence } } = await worker.recognize(blob);
    await worker.terminate();
    
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    
    // Limpar texto automaticamente
    let textoLimpo = text;
    textoLimpo = textoLimpo.replace(/[�]/g, '');
    textoLimpo = textoLimpo.replace(/\s{3,}/g, ' ');
    textoLimpo = textoLimpo.replace(/\n{4,}/g, '\n\n');
    
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + textoLimpo : textoLimpo;
    
    // Mostrar confiança
    const confPct = Math.round(confidence);
    atualizarResultado(`✅ OCR concluído! Confiança: ${confPct}%${confPct &lt; 80 ? ' (revise o texto)' : ''}`);
    
  } catch(e) { 
    alert('Erro no OCR: ' + e.message); 
    atualizarResultado('');
  } finally { 
    sp.classList.add('hidden'); 
  }
};

// ── INDEXEDDB SETUP ──
let db = null;
const DB_NAME = 'AssistenteJuridicoProDB';
const DB_VERSION = 1;

async function initDB() {
  return new Promise((resolve, reject) =&gt; {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () =&gt; reject(request.error);
    request.onsuccess = () =&gt; {
      db = request.result;
      resolve(db);
    };
    
    request.onupgradeneeded = (event) =&gt; {
      const db = event.target.result;
      
      // Store para documentos/peças
      if (!db.objectStoreNames.contains('documentos')) {
        const docStore = db.createObjectStore('documentos', { keyPath: 'id', autoIncrement: true });
        docStore.createIndex('tipo', 'tipo', { unique: false });
        docStore.createIndex('timestamp', 'timestamp', { unique: false });
        docStore.createIndex('tags', 'tags', { unique: false, multiEntry: true });
      }
      
      // Store para ementas
      if (!db.objectStoreNames.contains('ementas')) {
        const ementaStore = db.createObjectStore('ementas', { keyPath: 'id' });
        ementaStore.createIndex('categoria', 'categoria', { unique: false });
        ementaStore.createIndex('titulo', 'titulo', { unique: false });
      }
      
      // Store para templates
      if (!db.objectStoreNames.contains('templates')) {
        db.createObjectStore('templates', { keyPath: 'id' });
      }
      
      // Store para configurações
      if (!db.objectStoreNames.contains('config')) {
        db.createObjectStore('config', { keyPath: 'key' });
      }
      
      // Store para histórico
      if (!db.objectStoreNames.contains('historico')) {
        const histStore = db.createObjectStore('historico', { keyPath: 'id' });
        histStore.createIndex('timestamp', 'timestamp', { unique: false });
      }
    };
  });
}

// Funções auxiliares IndexedDB
async function salvarNoDB(storeName, data) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&gt; {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.put(data);
    request.onsuccess = () =&gt; resolve(request.result);
    request.onerror = () =&gt; reject(request.error);
  });
}

async function lerDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&gt; {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.get(key);
    request.onsuccess = () =&gt; resolve(request.result);
    request.onerror = () =&gt; reject(request.error);
  });
}

async function listarDoDB(storeName) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&gt; {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.getAll();
    request.onsuccess = () =&gt; resolve(request.result);
    request.onerror = () =&gt; reject(request.error);
  });
}

async function deletarDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&gt; {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.delete(key);
    request.onsuccess = () =&gt; resolve();
    request.onerror = () =&gt; reject(request.error);
  });
}

async function sincronizarComDB() {
  if (!db) await initDB();
  
  // Salvar ementas
  for (const ementa of ementas) {
    await salvarNoDB('ementas', ementa);
  }
  
  // Salvar templates
  for (const template of templates) {
    await salvarNoDB('templates', template);
  }
  
  // Salvar histórico
  for (const item of historico) {
    await salvarNoDB('historico', item);
  }
  
  // Salvar configurações
  await salvarNoDB('config', { key: 'filtros', value: filtrosAtivos });
  await salvarNoDB('config', { key: 'formatacao', value: formatacaoAtual });
  await salvarNoDB('config', { key: 'acoes_custom', value: acoesCustom });
}

async function carregarDoDB() {
  if (!db) await initDB();
  
  try {
    // Carregar ementas
    const ementasDB = await listarDoDB('ementas');
    if (ementasDB.length &gt; 0) {
      ementas = ementasDB;
      saveLS('aj_ementas', ementas);
    }
    
    // Carregar templates
    const templatesDB = await listarDoDB('templates');
    if (templatesDB.length &gt; 0) {
      templates = templatesDB;
      saveLS('aj_templates', templates);
    }
    
    // Carregar histórico
    const historicoDB = await listarDoDB('historico');
    if (historicoDB.length &gt; 0) {
      historico = historicoDB;
      saveLS('aj_historico', historico);
    }
    
    // Carregar configurações
    const configFiltros = await lerDoDB('config', 'filtros');
    if (configFiltros) {
      filtrosAtivos = configFiltros.value;
      saveLS('aj_filtros', filtrosAtivos);

    const configAcoes = await lerDoDB('config', 'acoes_custom');
    if (configAcoes) {
      acoesCustom = configAcoes.value;
      saveLS('aj_acoes_custom', acoesCustom);
    }
    
    console.log('✅ Dados carregados do IndexedDB');
  } catch(e) {
    console.error('Erro ao carregar do DB:', e);
  }
}

async function importarBackup(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  try {
    const texto = await file.text();
    const backup = JSON.parse(texto);
    
    if (!backup.versao || !backup.dados) {
      throw new Error('Arquivo de backup inválido');
    }
    
    if (!confirm('⚠️ Isso substituirá TODOS os dados atuais. Deseja continuar?')) {
      return;
    }
    
    // Restaurar dados
    ementas = backup.dados.ementas || [];
    templates = backup.dados.templates || [];
    historico = backup.dados.historico || [];
    acoesCustom = backup.dados.acoesCustom || [];
    filtrosAtivos = backup.dados.filtros || filtrosAtivos;
    formatacaoAtual = backup.dados.formatacao || formatacaoAtual;
    
    // Restaurar configurações
    if (backup.dados.config) {
      effortLevel = backup.dados.config.effort || 3;
      verbosity = backup.dados.config.verbosity || 'longa';
      templateAtivo = backup.dados.config.templateAtivo || null;

// ══════════════════════════════════════════════════════
//  CRIPTOGRAFIA SIMPLES (Base64 + XOR)
// ══════════════════════════════════════════════════════
function criptografar(texto, senha) {
  const key = senha.split('').map(c =&gt; c.charCodeAt(0));
  const encrypted = texto.split('').map((c, i) =&gt; {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
  return btoa(encrypted);
}

function descriptografar(textoCripto, senha) {
  const encrypted = atob(textoCripto);
  const key = senha.split('').map(c =&gt; c.charCodeAt(0));
  return encrypted.split('').map((c, i) =&gt; {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
}

async function exportarBackupCriptografado() {
  const senha = prompt('Digite uma senha para criptografar o backup:');
  if (!senha) return;
  
  const senhaConfirm = prompt('Confirme a senha:');
  if (senha !== senhaConfirm) {
    alert('❌ Senhas não coincidem!');
    return;
  }
  
  try {
    const backup = {
      versao: '2.0',
      timestamp: new Date().toISOString(),
      dados: {
        ementas, templates, historico, acoesCustom,
        filtros: filtrosAtivos,
        formatacao: formatacaoAtual
      }
    };
    
    const json = JSON.stringify(backup);
    const encrypted = criptografar(json, senha);
    
    const blob = new Blob([encrypted], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-criptografado-${Date.now()}.enc`;
    a.click();
    URL.revokeObjectURL(url);
    
    alert('✅ Backup criptografado exportado! Guarde a senha em local seguro.');
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

async function importarBackupCriptografado(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  const senha = prompt('Digite a senha do backup:');
  if (!senha) return;
  
  try {

    const backup = JSON.parse(json);

    ementas = backup.dados.ementas || [];

async function testarDrive() {

  if (!token) {
    alert('Configure o token primeiro.');
    return;
  }
  
  try {
    const resp = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (!resp.ok) throw new Error('Token inválido');
    
    const data = await resp.json();
    alert(`✅ Conectado como: ${data.user.emailAddress}`);
  } catch(e) {

}

async function enviarParaDrive(nomeArquivo, conteudo, mimeType) {
  const token = loadLS('aj_drive_token', '');
  const folderId = loadLS('aj_drive_folder', '');
  
  if (!token) {
    alert('Configure o Google Drive primeiro na aba Backup.');
    return;
  }
  
  try {
    const metadata = {
      name: nomeArquivo,
      mimeType: mimeType
    };
    
    if (folderId) metadata.parents = [folderId];
    
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([conteudo], { type: mimeType }));
    
    const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: form
    });
    
    if (!resp.ok) throw new Error('Erro ao enviar');
    
    alert('✅ Arquivo enviado para o Drive!');
  } catch(e) {
    alert('❌ Erro ao enviar: ' + e.message);
  }
}

async function limparTodosDados() {
  if (!confirm('⚠️ ATENÇÃO: Isso apagará TODOS os dados permanentemente!\n\nDeseja continuar?')) {
    return;
  }
  
  if (prompt('Digite &quot;CONFIRMAR&quot; para apagar tudo:') !== 'CONFIRMAR') {
    return;
  }
  
  try {
    // Limpar localStorage
    localStorage.clear();
    
    // Limpar IndexedDB
    if (db) {
      const stores = ['documentos', 'ementas', 'templates', 'config', 'historico'];
      for (const store of stores) {
        const transaction = db.transaction([store], 'readwrite');
        const objectStore = transaction.objectStore(store);
        objectStore.clear();
      }
    }
    
    // Resetar variáveis
    ementas = [];
    templates = [];
    historico = [];
    acoesCustom = [];
    emsSelected.clear();
    
    alert('✅ Todos os dados foram apagados. Recarregue a página.');
    location.reload();
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

function limparCache() {
  if ('caches' in window) {
    caches.keys().then(names =&gt; {
      names.forEach(name =&gt; caches.delete(name));
    });
  }
  alert('✅ Cache limpo!');
}

function carregarConfigInternet() {
  const provider = document.getElementById('internet-provider');
  const apiKey = document.getElementById('internet-api-key');
  const customUrl = document.getElementById('internet-custom-url');
  const toggle = document.getElementById('toggle-internet');
  const autoSearch = document.getElementById('internet-auto-search');
  const jurisprudencia = document.getElementById('internet-jurisprudencia');
  const numResults = document.getElementById('internet-num-results');
  
  if (provider) provider.value = apiInternetConfig.provider || 'serper';
  if (apiKey) apiKey.value = apiInternetConfig.apiKey || '';
  if (customUrl) customUrl.value = apiInternetConfig.customUrl || '';
  if (toggle) toggle.checked = internetAtivo;
  if (autoSearch) autoSearch.checked = apiInternetConfig.autoSearch !== false;
  if (jurisprudencia) jurisprudencia.checked = apiInternetConfig.jurisprudencia !== false;
  if (numResults) numResults.value = apiInternetConfig.numResults || 5;
  
  atualizarStatusInternet();
  
  // Mostrar/ocultar campo de URL personalizada
  if (provider) {
    provider.addEventListener('change', () =&gt; {
      const customField = document.getElementById('internet-custom-url-field');
      if (customField) {
        customField.classList.toggle('hidden', provider.value !== 'custom');
      }
    });
    provider.dispatchEvent(new Event('change'));
  }
}

async function buscarNaInternet(query) {
  if (!internetAtivo || !apiInternetConfig.apiKey) {
    throw new Error('Configure o acesso à internet primeiro');
  }
  
  const provider = apiInternetConfig.provider;
  const apiKey = apiInternetConfig.apiKey;
  const numResults = apiInternetConfig.numResults || 5;
  
  try {
    let resultados = [];
    
    if (provider === 'serper') {
      const resp = await fetch('https://google.serper.dev/search', {
        method: 'POST',
        headers: {
          'X-API-KEY': apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          q: query,
          num: numResults,
          gl: 'br',
          hl: 'pt'
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic || []).map(r =&gt; ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'serpapi') {
      const url = `https://serpapi.com/search?q=${encodeURIComponent(query)}&amp;api_key=${apiKey}&amp;num=${numResults}&amp;gl=br&amp;hl=pt`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic_results || []).map(r =&gt; ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'brave') {
      const resp = await fetch(`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&amp;count=${numResults}`, {
        headers: {
          'X-Subscription-Token': apiKey,
          'Accept': 'application/json'
        }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.web?.results || []).map(r =&gt; ({
        titulo: r.title,
        snippet: r.description,
        url: r.url
      }));
      
    } else if (provider === 'tavily') {
      const resp = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          api_key: apiKey,
          query: query,
          search_depth: 'advanced',
          max_results: numResults
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.results || []).map(r =&gt; ({
        titulo: r.title,
        snippet: r.content,
        url: r.url
      }));
      
    } else if (provider === 'custom') {
      const url = apiInternetConfig.customUrl.replace('{query}', encodeURIComponent(query));
      const resp = await fetch(url, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      // Assumir formato padrão ou adaptar conforme necessário
      resultados = data.results || data.items || [];
    }
    
    return resultados;
    
  } catch(e) {
    throw new Error('Erro ao buscar: ' + e.message);
  }
}

async function buscarManual() {
  const input = document.getElementById('busca-manual-input');
  const query = input.value.trim();
  
  if (!query) {
    alert('Digite algo para buscar.');
    return;
  }
  
  const container = document.getElementById('resultados-busca');
  container.classList.remove('hidden');
  container.innerHTML = '&lt;div class=&quot;text-muted fs11&quot;&gt;🔍 Buscando...&lt;/div&gt;';
  
  try {
    const resultados = await buscarNaInternet(query);
    
    if (resultados.length === 0) {
      container.innerHTML = '&lt;div class=&quot;text-muted fs11&quot;&gt;Nenhum resultado encontrado.&lt;/div&gt;';
      return;
    }
    
    container.innerHTML = '';
    resultados.forEach((r, i) =&gt; {
      const div = document.createElement('div');
      div.style.cssText = 'padding:10px;border-bottom:1px solid var(--border);';
      div.innerHTML = `

      container.appendChild(div);
    });
    
  } catch(e) {
    container.innerHTML = `&lt;div class=&quot;text-red fs11&quot;&gt;❌ ${e.message}&lt;/div&gt;`;
  }
}

function instalarPWA() {
  // Criar manifest.json dinamicamente
  const manifest = {
    name: 'Assistente Jurídico Pro',
    short_name: 'AJ Pro',
    description: 'Assistente jurídico avançado com IA, filtros inteligentes e backup completo',
    start_url: '.',
    display: 'standalone',
    background_color: '#141c0d',
    theme_color: '#d97706',
    orientation: 'any',
    icons: [
      {
        src: 'data:image/svg+xml,&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 100 100&quot;&gt;&lt;rect fill=&quot;%23d97706&quot; width=&quot;100&quot; height=&quot;100&quot;/&gt;&lt;text y=&quot;75&quot; font-size=&quot;70&quot; fill=&quot;white&quot; text-anchor=&quot;middle&quot; x=&quot;50&quot;&gt;⚖️&lt;/text&gt;&lt;/svg&gt;',
        sizes: '512x512',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }
    ]
  };
  
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
  
  // Service Worker inline
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'aj-pro-v2';
      const urlsToCache = ['/'];
      
      self.addEventListener('install', event =&gt; {
        event.waitUntil(
          caches.open(CACHE_NAME).then(cache =&gt; cache.addAll(urlsToCache))
        );
      });
      
      self.addEventListener('fetch', event =&gt; {
        event.respondWith(
          caches.match(event.request).then(response =&gt; response || fetch(event.request))
        );
      });
    `;
    
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swURL).then(() =&gt; {
      console.log('✅ PWA instalado');
    }).catch(err =&gt; {
      console.error('Erro ao registrar SW:', err);
    });
  }
}

// Instalar PWA ao carregar
window.addEventListener('DOMContentLoaded', () =&gt; {

// Debounce para inputs
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () =&gt; {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

// Aplicar debounce em campos de texto
window.addEventListener('DOMContentLoaded', () =&gt; {
  setTimeout(() =&gt; {
    const textareas = document.querySelectorAll('textarea');
    textareas.forEach(ta =&gt; {
      if (ta.oninput) {
        const originalHandler = ta.oninput;
        ta.oninput = debounce(originalHandler, 500);
      }
    });
  }, 3000);
});

  const container = document.getElementById('toast-container');

    success: 'var(--green)',
    warning: 'var(--amber)',

  const toast = document.createElement('div');
  toast.style.cssText = `

    border: 1px solid ${cores[tipo]};

    color: var(--text);

  `;
  toast.textContent = mensagem;
  
  container.appendChild(toast);
  
  setTimeout(() =&gt; {
    toast.style.animation = 'slideOut 0.3s ease';
    setTimeout(() =&gt; toast.remove(), 300);
  }, 3000);
}

.resultado-box .citacao     { padding-left: 4cm; font-size: 12px; text-indent: 0 !important; }
.resultado-box .paragrafo   { text-indent: 4cm; }

/* ── CHAT ── */
.chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding: 4px 0; }
.msg-user { background: #78350f33; border: 1px solid #92400e44; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-left: 20px; }
.msg-ia   { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-right: 20px; }
.msg-role { font-size: 10px; font-weight: 700; opacity: .5; margin-bottom: 3px; }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.card-title { font-size: 12px; font-weight: 700; color: var(--amber2); margin-bottom: 4px; }
.card-sub   { font-size: 11px; color: var(--muted); }
.card-selected { border-color: #22c55e55; background: #14532d22; }

/* ── MISC ── */
.section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; margin-top: 14px; }
.section-title:first-child { margin-top: 0; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spacer { height: 10px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.spinner { width: 14px; height: 14px; border: 2px solid #ffffff22; border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.text-green  { color: var(--green); }
.text-red    { color: var(--red); }
.text-amber  { color: var(--amber2); }
.text-muted  { color: var(--muted); }
.text-purple { color: var(--purple); }
.text-blue   { color: var(--blue); }
.fs10 { font-size: 10px; }
.fs11 { font-size: 11px; }
.fs12 { font-size: 12px; }

/* ── EMENTA CHECK ── */
.ementa-check { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.ementa-check.marcado { background: #22c55e; border-color: #22c55e; }

/* ── STOP BAR ── */
.stop-bar { padding: 8px 14px; flex-shrink: 0; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

//  LOCALSTORAGE
// ══════════════════════════════════════════════════════
function loadLS(k, def) {
  try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; }
}
function saveLS(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

// ══════════════════════════════════════════════════════
async function importarArquivo(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let texto = '';
    if (ext === 'pdf') {
      texto = await extrairPDF(file);
    } else if (ext === 'docx' || ext === 'doc') {
      texto = await extrairDOCX(file);
    } else {
      texto = await file.text();
    }
    if (!texto.trim()) throw new Error('Arquivo sem texto legível.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + texto : texto;
  } catch(e) { alert('Erro ao importar: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

async function extrairPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i &lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(it =&gt; it.str).join(' ') + '\n';
  }
  return texto;
}

async function extrairDOCX(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

// ══════════════════════════════════════════════════════
//  OCR (IMAGEM)
// ══════════════════════════════════════════════════════
async function importarImagem(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const worker = await Tesseract.createWorker('por');
    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + text : text;
  } catch(e) { alert('Erro no OCR: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

//  VOZ
// ══════════════════════════════════════════════════════
function toggleVoz() {
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome ou Edge para ditar por voz.'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = true; recognition.interimResults = true;
  let fullText = ''; let timer = null;
  const scheduleStop = () =&gt; {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() =&gt; { try { recognition.stop(); } catch {} }, 1800);
  };
  recognition.onresult = e =&gt; {
    let f = '', itr = '';
    for (let i = 0; i &lt; e.results.length; i++) {
      if (e.results[i].isFinal) f += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    fullText = f || itr;
    if (fullText) scheduleStop();
  };
  recognition.onend = () =&gt; {
    if (timer) clearTimeout(timer);
    isListening = false;
    document.getElementById('btn-voz').textContent = '🎤 Ditar';
    if (fullText.trim()) {
      const ta = document.getElementById('txt-processo');
      ta.value = ta.value ? ta.value.trimEnd() + '\n\n' + fullText.trim() : fullText.trim();
    }
  };
  recognition.onerror = () =&gt; { isListening = false; document.getElementById('btn-voz').textContent = '🎤 Ditar'; };
  recognition.start();
  isListening = true;
  document.getElementById('btn-voz').textContent = '🔴 Parar';
}

async function chamarGemini(chave, msgs, modelo) {
  modelo = modelo || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chave}`;
  const system = msgs.find(m =&gt; m.role === 'system');
  const contents = msgs.filter(m =&gt; m.role !== 'system').map(m =&gt; ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (system &amp;&amp; contents.length &gt; 0) contents[0].parts[0].text = system.content + '\n\n' + contents[0].parts[0].text;
  const resp = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&gt;({})); throw new Error(e.error?.message || `Gemini erro ${resp.status}`); }
  const d = await resp.json();
  return d.candidates[0].content.parts[0].text;
}

async function chamarOpenAI(chave, msgs, modelo, baseUrl) {
  modelo = modelo || 'gpt-4o';
  baseUrl = baseUrl || 'https://api.openai.com/v1';
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chave}` },
    body: JSON.stringify({ model: modelo, messages: msgs, temperature: 0.7, stream: false })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&gt;({})); throw new Error(e.error?.message || `OpenAI erro ${resp.status}`); }
  const d = await resp.json();
  return d.choices[0].message.content;
}

async function chamarClaude(chave, msgs, modelo) {
  modelo = modelo || 'claude-haiku-3-5';
  const system = msgs.find(m =&gt; m.role === 'system');
  const messages = msgs.filter(m =&gt; m.role !== 'system');
  const body = { model: modelo, max_tokens: 8192, messages, temperature: 0.7 };
  if (system) body.system = system.content;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&gt;({})); throw new Error(e.error?.message || `Claude erro ${resp.status}`); }
  const d = await resp.json();
  return d.content[0].text;
}

async function chamarGroq(chave, msgs, modelo) {
  modelo = modelo || 'llama-3.3-70b-versatile';
  return chamarOpenAI(chave, msgs, modelo, 'https://api.groq.com/openai/v1');
}

async function chamarIA(chave, msgs, modeloOverride) {
  const prov = detectProvider(chave);
  const modelo = modeloOverride || getModelo() || '';
  if (prov === 'Gemini')  return chamarGemini(chave, msgs, modelo || 'gemini-1.5-pro');
  if (prov === 'Claude')  return chamarClaude(chave, msgs, modelo || 'claude-haiku-3-5');
  if (prov === 'Groq')    return chamarGroq(chave, msgs, modelo);
  return chamarOpenAI(chave, msgs, modelo || 'gpt-4o');
}

// ══════════════════════════════════════════════════════
//  EXECUTAR AÇÃO PRINCIPAL
// ══════════════════════════════════════════════════════
async function executar(acao, customPrompt) {
  const texto = document.getElementById('txt-processo').value.trim();
  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();
  const kg = getChaveGeracao();

  // Ementas selecionadas
  const emsTexto = [...emsSelected].map(id =&gt; {
    const em = ementas.find(e =&gt; e.id === id);
    return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';
  }).filter(Boolean).join('\n\n');

  const jurisManual = document.getElementById('txt-juris').value.trim();
  const jurisFull = [jurisManual, emsTexto].filter(Boolean).join('\n\n');

  setLoading(true);
  document.getElementById('badge-demo').classList.add('hidden');

  try {
    let textoFinal = texto;

    // ── PASSO 1: Resumir/limpar com Gemini (se chave disponível e texto longo) ──
    if (kr &amp;&amp; texto.length &gt; 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');
      const resumoMsgs = [
        { role: 'system', content: 'Você é um assistente jurídico. Resuma o texto abaixo de forma objetiva, mantendo todos os fatos relevantes, partes, pedidos, decisões e fundamentos legais. Elimine cabeçalhos de página, rodapés, certificados digitais e repetições.' },
        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');
      textoResumido = textoFinal;
    }

    // ── PASSO 2: Gerar peça com chave principal ──
    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR:\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');
      resposta = await chamarIA(kg, msgs);
    } else {
      // Demo: usa Gemini Flash gratuito se tiver chave de resumo, senão avisa
      if (kr) {
        atualizarResultado('⏳ Gerando (modo demo com Gemini)...');
        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }
    }

    // Salvar resultado
    resultado = resposta;
    renderResultado(resposta);
    chatHistory = [
      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a =&gt; a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
}

//  RENDER RESULTADO
// ══════════════════════════════════════════════════════
function atualizarResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  box.textContent = txt;
}

function renderResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  const blocks = txt.split(/\n{2,}/);
  blocks.forEach(block =&gt; {
    const t = block.trim(); if (!t) return;
    const p = document.createElement('p');
    const lines = t.split('\n');
    const isSingle = lines.length === 1;
    const isTitulo = isSingle &amp;&amp; t === t.toUpperCase() &amp;&amp; t.length &gt; 2 &amp;&amp; /[A-ZÁÉÍÓÚÃÕ]/.test(t) &amp;&amp; !/^\d+\./.test(t);
    const isLista  = /^\d+[.)]\s/.test(t) || /^[a-z]\)/.test(t) || /^[-–]\s/.test(t);
    const isCitacao = (t.startsWith('&quot;') || t.startsWith('\u201c')) &amp;&amp; t.length &gt; 60;
    if (isTitulo)  p.className = 'titulo-peca';
    else if (isLista)   p.className = 'item-lista';
    else if (isCitacao) p.className = 'citacao';
    else p.className = 'paragrafo';
    lines.forEach((l, i) =&gt; { if (i &gt; 0) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    box.appendChild(p);
  });
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function baixarRtf() {
  if (!resultado) return;
  const rtf = `{\\rtf1\\ansi\\deff0\n{\\fonttbl{\\f0 Times New Roman;}}\n{\\f0\\fs26\n${
    resultado.split(/\n\n+/).map(block =&gt; {
      const t = block.trim(); if (!t) return '';
      if (t === t.toUpperCase() &amp;&amp; t.length &gt; 2 &amp;&amp; /[A-Z]/.test(t) &amp;&amp; !/^\d/.test(t))
        return `\\pard\\qj\\b ${t.replace(/[\\{}]/g,'\\$&amp;')}\\b0\\par\\par`;
      if (/^\d+[.)]\s/.test(t) || /^[-–]\s/.test(t))
        return `\\pard\\qj\\li720 ${t.replace(/[\\{}]/g,'\\$&amp;')}\\par\\par`;
      return `\\pard\\qj\\fi2268 ${t.replace(/[\\{}]/g,'\\$&amp;')}\\par\\par`;
    }).join('\n')
  }\n}}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rtf], { type: 'application/rtf' }));
  a.download = `juridico-${Date.now()}.rtf`; a.click();
}

// ══════════════════════════════════════════════════════
//  CHAT DE REFINAMENTO
// ══════════════════════════════════════════════════════
function toggleChat() {
  const a = document.getElementById('chat-area');
  const ar = document.getElementById('chat-arrow');
  a.classList.toggle('hidden');
  ar.textContent = a.classList.contains('hidden') ? '▼' : '▲';
}
async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();
  const kr = getChaveResumo();
  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length &gt; resultado.length * 0.5 &amp;&amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}
document.getElementById('chat-input')?.addEventListener('keydown', e =&gt; {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
function renderChat() {
  const container = document.getElementById('chat-msgs');
  container.innerHTML = '';
  chatHistory.filter(m =&gt; m.role !== 'system').forEach(m =&gt; {
    const div = document.createElement('div');
    div.className = m.role === 'user' ? 'msg-user' : 'msg-ia';
    const role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = m.role === 'user' ? 'Você' : 'IA';
    div.appendChild(role);
    div.appendChild(document.createTextNode(m.content));
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

// ══════════════════════════════════════════════════════
//  EMENTAS
// ══════════════════════════════════════════════════════
function abrirFormEmenta(id) {
  editEmentaId = id || null;
  const form = document.getElementById('form-ementa');
  const titulo = document.getElementById('form-ementa-titulo');
  if (id) {
    const em = ementas.find(e =&gt; e.id === id);
    document.getElementById('e-titulo').value    = em.titulo;
    document.getElementById('e-categoria').value = em.categoria;
    document.getElementById('e-texto').value     = em.texto;
    titulo.textContent = 'Editar Ementa';
  } else {
    document.getElementById('e-titulo').value    = '';
    document.getElementById('e-categoria').value = '';
    document.getElementById('e-texto').value     = '';
    titulo.textContent = 'Nova Ementa';
  }
  form.classList.remove('hidden');
}
function fecharFormEmenta() {
  document.getElementById('form-ementa').classList.add('hidden');
  editEmentaId = null;
}
function salvarEmenta() {
  const titulo    = document.getElementById('e-titulo').value.trim();
  const categoria = document.getElementById('e-categoria').value.trim();
  const texto     = document.getElementById('e-texto').value.trim();
  if (!titulo || !texto) { alert('Preencha título e texto.'); return; }
  if (editEmentaId) {
    ementas = ementas.map(e =&gt; e.id === editEmentaId ? { ...e, titulo, categoria, texto } : e);
  } else {
    ementas.push({ id: Date.now().toString(), titulo, categoria, texto, criadoEm: new Date().toLocaleString('pt-BR') });
  }
  saveLS('aj_ementas', ementas);
  fecharFormEmenta();
  renderEmentas();
  atualizarTabEmentas();
}
function deletarEmenta(id) {
  if (!confirm('Remover esta ementa?')) return;
  ementas = ementas.filter(e =&gt; e.id !== id);
  emsSelected.delete(id);
  saveLS('aj_ementas', ementas);
  renderEmentas();
  atualizarTabEmentas();
  atualizarInfoEmentas();
}
function toggleEmenta(id) {
  emsSelected.has(id) ? emsSelected.delete(id) : emsSelected.add(id);
  renderEmentas();
  atualizarInfoEmentas();
}
function atualizarInfoEmentas() {
  const info = document.getElementById('ementas-sel-info');
  if (emsSelected.size &gt; 0)
    info.textContent = `${emsSelected.size} ementa(s) selecionada(s) — serão incluídas na próxima geração`;
  else info.textContent = '';
}
function atualizarTabEmentas() {
  document.getElementById('tab-ementas-btn').textContent =
    `📚 Ementas${ementas.length ? ` (${ementas.length})` : ''}`;
}
function renderEmentas() {
  const busca = (document.getElementById('busca-ementa')?.value || '').toLowerCase();
  const lista = document.getElementById('lista-ementas');
  lista.innerHTML = '';
  const filtradas = ementas.filter(e =&gt;
    !busca || e.titulo.toLowerCase().includes(busca) ||
    e.texto.toLowerCase().includes(busca) ||
    e.categoria.toLowerCase().includes(busca)
  );
  if (!filtradas.length) {
    lista.innerHTML = '&lt;div class=&quot;text-muted fs12&quot; style=&quot;text-align:center;padding:20px&quot;&gt;' +
      (ementas.length ? 'Nenhum resultado.' : 'Nenhuma ementa salva. Clique em &quot;+ Nova&quot; para começar.') + '&lt;/div&gt;';
    return;
  }
  filtradas.forEach(em =&gt; {
    const sel = emsSelected.has(em.id);
    const div = document.createElement('div');
    div.className = 'card' + (sel ? ' card-selected' : '');
    div.innerHTML = `
      &lt;div class=&quot;row&quot; style=&quot;align-items:flex-start;gap:8px&quot;&gt;
        &lt;div class=&quot;ementa-check ${sel ? 'marcado' : ''}&quot; onclick=&quot;toggleEmenta('${em.id}')&quot;&gt;
          ${sel ? '✓' : ''}
        &lt;/div&gt;
        &lt;div style=&quot;flex:1;min-width:0&quot;&gt;
          &lt;div class=&quot;row&quot; style=&quot;gap:6px;flex-wrap:wrap&quot;&gt;
            &lt;span class=&quot;card-title&quot; style=&quot;margin:0&quot;&gt;${em.titulo}&lt;/span&gt;
            ${em.categoria ? `&lt;span class=&quot;badge&quot; style=&quot;background:#1e3a5f33;color:var(--blue);border-color:#3b82f633&quot;&gt;${em.categoria}&lt;/span&gt;` : ''}
          &lt;/div&gt;
          &lt;div class=&quot;card-sub&quot; style=&quot;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden&quot;&gt;${em.texto}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row&quot; style=&quot;gap:4px;flex-shrink:0&quot;&gt;
          &lt;button class=&quot;btn-icon&quot; onclick=&quot;abrirFormEmenta('${em.id}')&quot; title=&quot;Editar&quot;&gt;✏️&lt;/button&gt;
          &lt;button class=&quot;btn-icon&quot; onclick=&quot;deletarEmenta('${em.id}')&quot; title=&quot;Remover&quot;&gt;🗑&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;`;
    lista.appendChild(div);
  });
  atualizarTabEmentas();
}

// ══════════════════════════════════════════════════════
//  HISTÓRICO
// ══════════════════════════════════════════════════════
function limparHistorico() {
  if (!confirm('Limpar todo o histórico?')) return;
  historico = []; saveLS('aj_historico', historico);
  renderHistorico();
}
function renderHistorico() {
  const lista = document.getElementById('lista-historico');
  lista.innerHTML = '';
  document.getElementById('tab-hist-btn').textContent =
    `🕐 Histórico${historico.length ? ` (${historico.length})` : ''}`;
  if (!historico.length) {
    lista.innerHTML = '&lt;div class=&quot;text-muted fs12&quot; style=&quot;text-align:center;padding:20px&quot;&gt;Nenhum documento gerado ainda.&lt;/div&gt;';
    return;
  }
  historico.forEach(h =&gt; {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:4px&quot;&gt;
        &lt;span class=&quot;card-title&quot; style=&quot;margin:0&quot;&gt;${h.acao}&lt;/span&gt;
        &lt;span class=&quot;fs10 text-muted&quot;&gt;${h.timestamp}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card-sub&quot; style=&quot;margin-bottom:8px&quot;&gt;${h.inputSnippet}...&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;gap:6px&quot;&gt;
        &lt;button class=&quot;btn btn-amber&quot; onclick=&quot;restaurarHistorico('${h.id}')&quot;&gt;▶ Restaurar&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;copiarHistorico('${h.id}')&quot;&gt;📋 Copiar&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;deletarHistorico('${h.id}')&quot;&gt;🗑&lt;/button&gt;
      &lt;/div&gt;
      &lt;details style=&quot;margin-top:8px&quot;&gt;
        &lt;summary class=&quot;fs10 text-muted&quot; style=&quot;cursor:pointer&quot;&gt;Ver resultado...&lt;/summary&gt;
        &lt;div class=&quot;fs11 text-muted&quot; style=&quot;margin-top:6px;white-space:pre-wrap;max-height:120px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px&quot;&gt;${h.resultado.substring(0,600)}${h.resultado.length&gt;600?'...':''}&lt;/div&gt;
      &lt;/details&gt;`;
    lista.appendChild(div);
  });
}
function restaurarHistorico(id) {
  const h = historico.find(x =&gt; x.id === id); if (!h) return;
  resultado = h.resultado;
  renderResultado(h.resultado);
  mudarAba('processar', document.querySelector('.tab-btn'));
}
function copiarHistorico(id) {
  const h = historico.find(x =&gt; x.id === id); if (!h) return;
  navigator.clipboard.writeText(h.resultado);
}
function deletarHistorico(id) {
  historico = historico.filter(x =&gt; x.id !== id);
  saveLS('aj_historico', historico);
  renderHistorico();
}

// ══════════════════════════════════════════════════════
//  AÇÕES CUSTOMIZADAS
// ══════════════════════════════════════════════════════
function abrirFormAcao(id) {
  editAcaoId = id || null;
  const form = document.getElementById('form-acao');
  const titulo = document.getElementById('form-acao-titulo');
  if (id) {
    const a = acoesCustom.find(x =&gt; x.id === id);
    document.getElementById('ca-label').value  = a.label;
    document.getElementById('ca-desc').value   = a.descricao;
    document.getElementById('ca-prompt').value = a.prompt;
    titulo.textContent = 'Editar Ação';
  } else {
    document.getElementById('ca-label').value  = '';
    document.getElementById('ca-desc').value   = '';
    document.getElementById('ca-prompt').value = '';
    titulo.textContent = 'Nova Ação';
  }
  form.classList.remove('hidden');
}
function fecharFormAcao() {
  document.getElementById('form-acao').classList.add('hidden');
  editAcaoId = null;
}
function salvarAcao() {
  const label  = document.getElementById('ca-label').value.trim();
  const desc   = document.getElementById('ca-desc').value.trim();
  const prompt = document.getElementById('ca-prompt').value.trim();
  if (!label || !prompt) { alert('Preencha nome e prompt.'); return; }
  if (editAcaoId) {
    acoesCustom = acoesCustom.map(a =&gt; a.id === editAcaoId ? { ...a, label, descricao:desc, prompt } : a);
  } else {
    acoesCustom.push({ id: Date.now().toString(), label, descricao:desc, prompt });
  }
  saveLS('aj_acoes_custom', acoesCustom);
  fecharFormAcao();
  renderAcoes();
  renderAcoesCustomGrid();
}
function deletarAcao(id) {
  if (!confirm('Remover esta ação?')) return;
  acoesCustom = acoesCustom.filter(a =&gt; a.id !== id);
  saveLS('aj_acoes_custom', acoesCustom);
  renderAcoes();
  renderAcoesCustomGrid();
}
function renderAcoes() {
  const lista = document.getElementById('lista-acoes');
  lista.innerHTML = '';
  document.getElementById('tab-acoes-btn').textContent =
    `🪄 Ações${acoesCustom.length ? ` (${acoesCustom.length})` : ''}`;
  if (!acoesCustom.length) {
    lista.innerHTML = '&lt;div class=&quot;text-muted fs12&quot; style=&quot;text-align:center;padding:20px&quot;&gt;Nenhuma ação personalizada. Clique em &quot;+ Nova&quot; para criar.&lt;/div&gt;';
    return;
  }
  acoesCustom.forEach(a =&gt; {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      &lt;div class=&quot;row&quot; style=&quot;justify-content:space-between;margin-bottom:4px&quot;&gt;
        &lt;span class=&quot;card-title text-purple&quot; style=&quot;margin:0&quot;&gt;🪄 ${a.label}&lt;/span&gt;
        &lt;div class=&quot;row&quot; style=&quot;gap:4px&quot;&gt;
          &lt;button class=&quot;btn-icon&quot; onclick=&quot;abrirFormAcao('${a.id}')&quot;&gt;✏️&lt;/button&gt;
          &lt;button class=&quot;btn-icon&quot; onclick=&quot;deletarAcao('${a.id}')&quot;&gt;🗑&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      ${a.descricao ? `&lt;div class=&quot;card-sub&quot; style=&quot;margin-bottom:6px&quot;&gt;${a.descricao}&lt;/div&gt;` : ''}
      &lt;details&gt;
        &lt;summary class=&quot;fs10 text-muted&quot; style=&quot;cursor:pointer&quot;&gt;Ver prompt...&lt;/summary&gt;
        &lt;div class=&quot;fs11 text-muted&quot; style=&quot;margin-top:6px;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:6px&quot;&gt;${a.prompt}&lt;/div&gt;
      &lt;/details&gt;
      &lt;button class=&quot;btn btn-purple&quot; style=&quot;margin-top:8px&quot; onclick=&quot;executarAcaoCustom('${a.id}')&quot;&gt;▶ Executar&lt;/button&gt;`;
    lista.appendChild(div);
  });
}
function renderAcoesCustomGrid() {
  const grid = document.getElementById('grid-acoes-custom');
  const secao = document.getElementById('secao-acoes-custom');
  grid.innerHTML = '';
  if (!acoesCustom.length) { secao.classList.add('hidden'); return; }
  secao.classList.remove('hidden');
  acoesCustom.forEach(a =&gt; {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.cssText = 'border-color:#8b5cf633;color:var(--purple)';
    btn.textContent = '🪄 ' + a.label;
    btn.title = a.descricao || '';
    btn.onclick = () =&gt; executarAcaoCustom(a.id);
    grid.appendChild(btn);
  });
}
function executarAcaoCustom(id) {
  const a = acoesCustom.find(x =&gt; x.id === id); if (!a) return;
  executar(id, a.prompt);
}

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
